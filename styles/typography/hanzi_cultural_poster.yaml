summary: "以巨型汉字为核心的东方文化海报，汉字笔画嵌传统白描，红蓝黑三色套色"

prompt: |
  创作一张"东方汉字文化海报"。

  画面构成：
  - 核心汉字：{两个中文大字}作为画面主体，超大字号居中或偏上
  - 文化线描嵌笔画：{3-5个相关人物、建筑、器物或自然景观}以传统白描技法，
    嵌入汉字笔画结构之中，远看是字、近看发现其中隐藏的线描细节
  - 书法题名：{四字文化主题}以书法字体置于汉字下方
  - 英文副标题：{英文主题名称}小字英文辅助
  - 辅助题跋：3-5组中文短句作为落款，分布于画面边缘

  色彩：红蓝黑三色套色 — 红色为主色、蓝色为辅、黑色压底
  背景：留白或淡墨渲染背景，突出主体
  质感：书法笔触真实感、墨迹浓淡层次、白描线条精细
  构图：9:16 竖幅，汉字主体占40-60%画面，字与线描元素穿插

  比例 9:16，张力十足，东方文化气质。
  不要水印，不要真实Logo，不要乱码文字。

