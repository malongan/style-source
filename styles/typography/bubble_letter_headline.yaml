# Bubble Letter Headline（亮色泡泡字标题）

id: bubble_letter_headline
name: "泡泡字大标题"
name_cn: "蜜桃渐变泡泡字标题"
category: typography

tags:
  - bubble-letter
  - chunky
  - glossy
  - playful
  - gradient
  - peach
  - coral
  - cream
  - rounded

triggers:
  - 泡泡字标题
  - 圆鼓粗体标题
  - 蜜桃渐变泡泡字
  - 儿童潮玩标题字
  - 高光彩面大字

features:
  - "**圆鼓厚实泡泡字** — 厚重圆鼓的气球感笔画，手绘轻微变形，可爱有活力"
  - "**蜜桃粉→珊瑚渐变** — 从蜜桃粉到珊瑚橙的柔和渐变，柔和精致"
  - "**奶油白纯色底** — 暖奶油白纯色背景，配合渐变泡泡字"
  - "**高光彩面** — 亮泽高光表面，干净发光"
  - "**边缘清晰** — 边缘锐利干净，每个字可读性优先"
  - "**排版** — 主标题横排居中 LARGE，下方英文副行小字，留白充足"

scene: "3D 角色潮玩 KV、儿童/年轻向电商海报、需要明亮活泼但不刺眼的标题设计"
ratio: "16:9"
summary: "蜜桃渐变泡泡字标题——圆鼓厚实手绘泡泡笔画、高光彩面、蜜桃粉→珊瑚渐变填充、奶油白纯色底、横构图主副标题层级，柔和精致"

prompt: |
  干净的纯暖奶油白实色背景，无肌理、无渐变。画面中央是活泼的大号泡泡字：中文「{第一行}」写成厚重、圆鼓、气球感十足的笔画，表面带光亮高光，手绘式轻微变形，可爱有活力。字色使用蜜桃粉到珊瑚橙的柔和渐变，温婉精致。主标题下方是较小号的英文副行「{第二行}」，用简单的圆体无衬线，居中，柔和暖灰。每一笔都有干脆干净的边缘，完全可读。干净极简的版面，留白充足，高端潮玩品牌美学。没有其他元素，没有装饰，没有边框。不要添加任何其他字母、单词、数字、标签、Logo 或伪文字。所有文字都要完全可读，并保持在安全区域内。


variables:
  - kv_var: 第一行
    style_var: '{第一行}'
    desc: 如：COMING SOON
  - kv_var: 第二行
    style_var: '{第二行}'
    desc: 如：AUTUMN 2024
source: "painter"
source_author: "painter"
