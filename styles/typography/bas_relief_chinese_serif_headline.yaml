# Bas-relief Chinese Serif Headline（浮雕纸浆中文衬线标题）

id: bas_relief_chinese_serif_headline
name: "浮雕中文衬线大标题"
name_cn: "浮雕纸浆中文衬线标题"
category: typography

tags:
  - bas-relief
  - chinese-serif
  - paper-pulp
  - low-reflectance
  - cultural
  - warm-sand
  - relief

triggers:
  - 浮雕标题
  - 纸浆质感标题
  - 中文衬线标题
  - 文化感标题
  - 纪念碑浮雕字

features:
  - "**中文衬线浮雕** — 正面近似对称素色浅浮雕，中文衬线字型"
  - "**纸浆低反光质感** — 纸浆材质低反光，柔和侧光在凸起边缘留极浅亮线"
  - "**高明度低彩度暖沙色** — 纯色底 + 深棕/墨色浮雕字，低彩度暖沙色调"
  - "**排版层级** — 首行紧凑 + 次行放大拉开字距，宽阔留白、中央轴稳定展开"
  - "**文化感** — 适合有文化底蕴的活动主题（露营/茶/国风/节气）"

scene: "有文化感的 KV（露营/美食/茶饮/国风/节气/手作），中文标题为主，需要沉稳高级的标题设计"
ratio: "16:9"
summary: "浮雕纸浆中文衬线标题——素色浅浮雕、纸浆低反光、柔和侧光亮线、暖沙色低彩度、首行紧凑次行拉开字距，沉稳文化感"

prompt: |
  干净纯粹的暖沙米色纯色背景，无纹理、无渐变。画面中央，中文文字「{第一行}」与「{第二行}」以纪念碑式浅浮雕雕塑呈现：平缓的浅浮雕、低反光的纸浆质感、柔和漫射光在凸起轮廓上留下极浅的亮边线、低饱和暖沙色、优雅的中文衬线字体。标题分两行堆叠，均居中：第一行紧凑「{第一行}」，第二行放大并拉开字距「{第二行}」。下方一行更小的次级文字「{副行}」，同样采用浅浮雕衬线风格，尺度更小。干净极简的版式，留白充裕，高端文化品牌美学。每个字都必须清晰可读，边缘利落干净。没有其他元素，没有装饰，没有边框。不要添加任何其他字母、单词、数字、标签、Logo 或伪文字。所有文字必须完全清晰可辨，并保持在安全区内。
variables:
  - kv_var: 第一行
    style_var: '{第一行}'
    desc: 如：COMING SOON
  - kv_var: 第二行
    style_var: '{第二行}'
    desc: 如：AUTUMN 2024
  - kv_var: 副行
    style_var: '{副行}'
    desc: 如：LIMITED EDITION
