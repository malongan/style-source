features:
- title: 轻手绘核心小图形
  desc: 围绕核心意象设计一个轮廓简洁、线条轻松的小图形或小角色，允许轻微手绘不规则，表情或动作有记忆点，图形不大、不压过文字
- title: 松弛手写字标
  desc: 品牌名清晰可读，字标轻手写、有独立小店感，字距大小位置略有变化形成自然节奏，可混入少量英文小字、拼音与 slogan
- title: 大量留白与呼吸感
  desc: 图形放在字标上方、旁边或穿插字中，主体不过满、无复杂背景，只加极少量小点、短线、弧线、星星与手写标注
- title: 黑色线稿加小面积点缀色
  desc: 以黑色线稿为主体，只用 1～2 个小面积点缀色，点缀色要小而准，避免厚重渐变、复杂阴影与高饱和满版配色
- title: 松弛但有控制的手绘质感
  desc: 线条有手绘感、形状略带稚拙但可控、整体干净，允许少量不规则笔触，不要太精密，也不要做成商业模板

scene: "独立小店/生活方式品牌 Logo 设计、文创与手作品牌标志、品牌视觉提案、字标设计练习"
ratio: '1:1'
summary: "治愈系手绘趣味字标——轻手绘小图形 + 松弛手写字标 + 大量留白 + 少量点缀色的独立小店 Logo 模板。"

prompt: |
  《治愈系手绘趣味字标》Logo 提示词：

  请根据 {品牌名}、{副标题}、{行业类型}、{品牌定位}、{核心意象}、{角色图形}、{情绪气质}、{主色调}、{辅助色}，设计一个高完成度的「治愈系手绘趣味字标 Logo / Healing Hand-drawn Playful Wordmark Logo」。

  【用户输入】
  品牌名 / 项目名：{品牌名}
  副标题 / 产品名：{副标题}
  类型 / 行业：{行业类型}
  品牌定位：{品牌定位}
  核心意象：{核心意象}
  角色 / 图形设定：{角色图形}
  情绪气质：{情绪气质}
  主色调：{主色调}
  辅助色：{辅助色}
  画幅比例：1:1

  【核心目标】
  这次要设计的是一个「治愈系手绘趣味字标 Logo」。它不是商业感很重的品牌徽章，也不是高饱和潮玩 IP，不是复杂卡通插画，而是以一个轻巧、有记忆点的小手绘图形为核心，搭配松弛的品牌字标和少量英文 / 小标注，形成一个适合{行业类型}类小众品牌、主理人小店、生活方式品牌和文创品牌使用的轻量 Logo。

  最终效果应当轻松、干净、有呼吸感、有好感，整体气质吻合{品牌定位}，像一个真实独立小店或生活品牌可以直接使用的 Logo。

  【设计本质】
  这类 Logo 的重点不是做得复杂，而是做得有情绪、有巧思、有亲和力：
  1. 用一个小手绘意象建立第一记忆点；
  2. 用松弛自然的字标建立品牌识别；
  3. 用大量留白建立轻盈感；
  4. 用少量亮色点缀建立温度；
  5. 用不完美但有控制的线条建立手绘感；
  6. 整体传达{情绪气质}的品牌调性。

  【最重要的原则】
  1. 图形要简单，但必须有巧思；
  2. 文字要轻松自然，不能像普通系统字体直接打字；
  3. 整体要有 Logo 性质，不能只是插画；
  4. 留白要多，画面不要塞满；
  5. 配色要克制，通常以黑色线条为主，搭配 1～2 个点缀色；
  6. 风格要松弛，但不能粗糙；
  7. 不能低幼，不能像儿童涂鸦，也不能像普通表情包；
  8. 要有独立品牌、小店、主理人品牌的审美气质。

  【图形 / 角色要求】
  请围绕{核心意象}设计一个轻手绘的小图形或小角色，具体形象与设定为{角色图形}。

  图形要求：
  1. 轮廓简洁，线条轻松；
  2. 不追求精密矢量感，允许轻微手绘不规则；
  3. 表情或动作要有记忆点；
  4. 图形不要太大，不要压过文字；
  5. 可以带一点拟人化、幽默感或生活气息；
  6. 不要画成复杂插画，不要做成厚重吉祥物。

  【字标要求】
  1. 品牌名{品牌名}必须清晰可读；
  2. 字标应有轻手写感、松弛感、独立小店感；
  3. 可以是中文、英文或中英混排；
  4. 字距、大小、位置可以略有变化，形成自然节奏；
  5. 可以加入副标题{副标题}，以及少量英文小字、拼音、小 slogan、年份、符号；
  6. 文字不能太工业化、太严肃、太厚重；
  7. 文字要像和图形一起被设计出来，而不是后期随便打上去。

  【构图要求】
  整体构图应轻盈、有呼吸感：
  1. 图形可以在字标上方、旁边、穿插在字中，或与文字形成小互动；
  2. 保持大量留白；
  3. 主体不要过满，不要复杂背景；
  4. 可以加入极少量小点、短线、弧线、小星星、小手写标注；
  5. 整体应像一个独立 Logo，而不是海报或贴纸集合。

  【色彩要求】
  整体色彩应克制、清爽、有好感：
  1. 通常以黑色线稿为主体，整体色调为{主色调}；
  2. 搭配 1～2 个小面积点缀色（{辅助色}）；
  3. 点缀色可取浅黄、天蓝、草绿、番茄红、淡粉、橙色、薄荷绿等；
  4. 点缀色要小而准，不要大面积铺满；
  5. 避免厚重渐变、复杂阴影、高饱和满版配色；
  6. 颜色应像"轻轻点一下"，而不是强行制造冲击。

  【质感要求】
  1. 线条有手绘感；
  2. 形状略带稚拙但可控；
  3. 整体干净；
  4. 可以有少量不规则笔触；
  5. 不要太精密，不要太商业模板化；
  6. 不要过度粗糙或凌乱。

  【风格关键词】
  治愈系手绘趣味字标 Logo、Healing Hand-drawn Playful Wordmark Logo、松弛感手绘图文 Logo、独立小店 Logo、生活方式品牌 Logo、轻手绘、小意象、童趣但不低幼、治愈、可爱、松弛、留白、少量点缀色、手写字标。

  【验收标准】
  请确保最终结果满足：
  1. 图形简单但有巧思；
  2. 品牌名{品牌名}清晰可读；
  3. 整体有手绘松弛感；
  4. 留白充足；
  5. 配色克制但有记忆点；
  6. 不低幼、不杂乱、不商业模板化；
  7. 像真实小众品牌可以使用的 Logo；
  8. 具备治愈、趣味、生活方式气质。

  【输出要求】
  请最终输出一个高完成度的「治愈系手绘趣味字标 Logo」。它必须以轻手绘图形为核心识别，以松弛字标为辅助结构，以少量点缀色和大量留白形成清爽、可爱、治愈、有生活感的品牌标志。

