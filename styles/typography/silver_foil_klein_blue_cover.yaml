features:
  - "**银色锡纸背景** — 真实锡纸轻微揉皱后铺平，细密均匀的褶皱纹理，冷银色金属质感"
  - "**统一深蓝文字** — 所有文字线条图形使用同一种纯正深邃的蓝色，深浅不变"
  - "**中粗黑体排版** — 现代中粗黑体中文 + 粗体无衬线英文，字形简洁稳重"
  - "**极简线条隐喻** — 根据主题设计极简线条图形，面积控制在 15%-25%"
  - "**克制理性气质** — 不靠花哨配色，不堆复杂元素，整体更克制、理性、高级"

scene: "教程封面、商业封面、方法论封面、视频封面、文章封面"
ratio: "5:2"
summary: "银色锡纸纹理背景 + 统一深蓝文字 + 中粗黑体 + 极简线条隐喻，高级极简封面风格"

variables:
  - kv_var: 主标题
    style_var: "{主标题}"
    desc: 如：提示词工程 / 结构之美 / THE METHOD
  - kv_var: 英文辅助
    style_var: "{英文辅助}"
    desc: 如：A FIELD GUIDE / VOL.02 2026
  - kv_var: 线条隐喻
    style_var: "{线条隐喻}"
    desc: 如：一条折返的路径与三个节点 / 逐级上升的阶梯 / 输入到输出的两段回路
  - kv_var: 强调色
    style_var: "{强调色}"
    desc: 如：克莱因蓝 / 钴蓝 / 深靛

prompt: |
  Generate a premium minimalist cover with silver tin foil texture background and {强调色} text.

  【Background】
  Use real silver tin foil as the full background. The foil should appear lightly crumpled then flattened, showing fine, even, natural, restrained micro-wrinkles. Surface has cold silver metallic texture with subtle reflections, soft highlights, and slight light-dark variations. Tin foil texture must be clear but not too coarse, too bright, or too messy. The area where text sits should be relatively flat, avoiding highlights, dark patterns, or complex wrinkles crossing the text.

  【Colors】
  Use only two core colors: silver tin foil background plus one pure, deep, unified {强调色} for all text and lines. All text, lines, and graphics must use the same shade, no variation in depth, no grayish, purplish, or local gradients.

  【Typography】
  Chinese: modern medium-weight sans-serif, clean strokes, steady and modern, moderate letter-spacing and line-spacing. No calligraphy, rounded, cartoon, or decorative fonts. Main title: 「{主标题}」.
  English: bold sans-serif, auxiliary info, noticeably smaller than Chinese: 「{英文辅助}」.

  【Layout】
  Main title stays restrained, moderate size. Use left-aligned / right-aligned / centered / two or three lines. Generous whitespace, natural spacing, balanced line lengths. One layout style per image.

  【Visual Metaphor】
  One minimalist line metaphor for the theme: {线条隐喻}。Draw it in the same {强调色}, using paths, circuits, nodes, stairs, entrances, connections, or state transitions. Graphics occupy 15%-25% of the image, never more prominent than the title.

  【Composition】
  Only: silver fine-texture tin foil background + main title + optional subtitle or English auxiliary text + one minimalist line metaphor.

  【Mood】
  Minimalist, calm, rational, restrained, premium, modern, clear.

  【Strict Restrictions】
  No people, product photography, complex illustrations, oversized titles, ultra-bold fonts, crowded text, background highlights crossing text, inconsistent text color shades, large watermarks, diagonal text, mixed horizontal-vertical text, complex flowcharts, multiple stacked icons, dense small text, large color blocks, gradients, glowing effects, 3D text, 3D icons, cyberpunk.

  【Final Effect】
  A premium cover: silver fine-texture tin foil background, unified deep blue text, medium-weight sans-serif Chinese, bold sans-serif English, one clean thematic metaphor. Text clear, restrained, spacious, background and text blend naturally, colors unified, generous whitespace, resembling a premium independent magazine cover or contemporary design exhibition poster.

source_url: "https://x.com/AdrianPunk115/status/2071141624105877890"
source_author: "Adrian Punk"

