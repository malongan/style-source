# Screen-print Offset Headline（手工印刷套印版画标题）

id: screen_print_offset_headline
name: "丝网印刷套印偏移标题字体"
name_cn: "手工印刷套印版画标题"
category: typography

tags:
  - screen-print
  - offset
  - hand-printed
  - chunky
  - rough-edge
  - vintage
  - paper

triggers:
  - 手工印刷标题
  - 套印版画标题
  - 粗重标题
  - 复古印刷字
  - 错位叠色标题

features:
  - "**套印版画质感** — 轻微错位、透明叠色、粗糙边缘，像老式丝网印刷"
  - "**粗重中文标题** — 粗壮圆润笔画，结实有力"
  - "**高明度纸面底** — 纯色米白/奶油纸底，保留细密纤维颗粒感但不脏不灰"
  - "**配色** — 猕猴桃绿+奶油黄+暖橘（或深墨绿+暖橘叠色）"
  - "**文化手作感** — 适合有温度、手作、露营/市集/农场的标题"

scene: "有温度的手作/露营/市集/农场/文艺市集 KV，中文粗重标题，需要复古印刷感"
ratio: "16:9"
summary: "手工印刷套印版画标题——丝网印刷错位叠色、粗糙边缘、粗重中文标题、米白纸面底，复古手作温度感"

prompt: |
  干净的纯暖米白纸色实色背景，带细微的纸纤维纹理，但不脏、不泛灰、没有渐变。画面中央是中文「{第一行}」与「{第二行}」，做粗壮圆润的字形，带粗糙的丝网印刷边缘：墨层轻微错位套印、透明叠色、手印复古感。标题分上下两行堆叠，均居中：第一行「{第一行}」，第二行「{第二行}」。主字用深猕猴桃绿，配暖橘色叠印点缀、奶油黄高光。下方是较小号的副行「{副行}」，同样的丝网印刷风格，尺寸更小，暖橘色。干净极简的版面，留白充足，手作工艺品牌美学。每个字都清晰可读。没有其他元素，没有边框。不要添加任何其他字母、单词、数字、标签、Logo 或伪文字。所有文字都要完全可读，并保持在安全区域内。


variables:
  - kv_var: 第一行
    style_var: '{第一行}'
    desc: 如：COMING SOON
  - kv_var: 第二行
    style_var: '{第二行}'
    desc: 如：AUTUMN 2024
  - kv_var: 副行
    style_var: '{副行}'
    desc: 如：LIMITED EDITION
source: "painter"
source_author: "painter"
created_at: "2026-08-13"
derived_from: "ST0228 + E019（2026-08-12 猕猴仔露营认可）"

