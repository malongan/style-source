# 暖色黏土立体中文标题字

id: clay_3d_chinese_headline
name: "暖色黏土立体中文标题字"
category: typography

tags:
- 黏土3D字
- 手工搓条拼字
- 暖色红橙黄
- 儿童艺术感
- 悬浮投影
- 俏皮标题字

triggers:
- 黏土立体字
- 3D中文标题字
- 手工黏土字体设计
- 红橙黄暖色字
- 俏皮儿童艺术字
- 活动主标题字效

features:
- title: 黏土条拼搭出的笔画
  desc: 每个汉字的笔画都是一根根搓圆的黏土条首尾相接、交叉叠压摆出来的，条块末端收圆，接口处能看到捏塑的凹凸与挤压
- title: 粗糙哑光的软陶表面
  desc: 表面是带细微颗粒、裂纹与指纹压痕的哑光软陶质感，受光面只有柔和漫反射高光，不反光、不上釉
- title: 歪斜错落的儿童手摆感
  desc: 笔画不对齐、粗细不匀、部件高低歪斜，字形比例夸张变形，像小孩随手在桌上摆出来的字，俏皮而有手作温度
- title: 红橙黄三段分色
  desc: 按词的段落分组上色——前段红、中段橙、后段黄，柔和明亮的暖色调，同组内颜色统一
- title: 同材质小配件点缀
  desc: 字上方一枚蓝色黏土对话框（内压白色小字）、右侧斜插一块绿色黏土小长条，与主体同材质同工艺，只作动态点缀
- title: 悬浮构图与下方投影
  desc: 淡米色无缝背景、灯光均匀无方向，整组字像悬浮在画面中部，柔和投影单独落在画面下方并带一圈暖色光晕

scene: "活动与话题主标题字效、社媒封面与开屏字、玩法与招募海报主视觉、儿童与潮玩品牌标题、文创贴纸字"

ratio: '1:1'
summary: "暖色黏土立体中文标题字——用搓圆的黏土条拼搭出歪斜错落的汉字笔画，粗糙哑光软陶质感、红橙黄三段分色，配蓝色黏土对话框与绿色小长条点缀，淡米色背景、整组字悬浮、柔和投影落在画面下方。"

prompt: |
  制作一张 1:1 方版 3D 字体设计特写，俏皮、类似儿童艺术。

  主体文字：
  画面中央是{文字内容}，按{分行排布}排成上下两组，占满画面中部。
  每个字都用搓成条的黏土手工拼搭而成：笔画是一根根圆润的黏土条首尾相接、交叉叠压摆出来的，条块末端收圆，接口处有捏塑的凹凸与挤压痕；
  笔画之间不完全对齐，字形歪斜错落、粗细不匀、比例夸张，像小孩随手摆出来的字。

  材质与色彩：
  黏土表面是粗糙哑光的软陶质感，带细微颗粒、裂纹与指纹压痕，受光面只有柔和的漫反射高光，不反光、不上釉；
  颜色按{黏土配色}分组，整体是柔和明亮的暖色调。

  点缀：
  文字上方偏中放一枚{点缀元素}，上面压着白色小字「{对话框文字}」；
  右侧再斜插一小块对比色的黏土长条，与主体同材质同工艺，只作动态点缀，不抢文字。

  背景与光影：
  {背景色}的纯色无缝背景，灯光均匀、没有明确方向；
  整组字像悬浮在画面中，柔和投影单独落在画面下方，字与背景之间透出一圈暖色光晕。

  构图：
  特写、居中、大胆饱满，元素动态分布、有运动感，画面干净，除主体文字与点缀配件外不加其他信息。

  避免：金属与玻璃质感、写实摄影、渐变霓虹、平面描边字、乱码伪字、水印、真实品牌 Logo、多余文案。

variables:
- kv_var: 文字内容
  style_var: '{文字内容}'
  desc: 主体中文标题，建议 4～6 字，如：盲盒交友行动
- kv_var: 分行排布
  style_var: '{分行排布}'
  desc: 字的分行方式，如：上四字下两字、两行各三字
- kv_var: 黏土配色
  style_var: '{黏土配色}'
  desc: 分组上色方案，如：前段红 + 中段橙 + 后段黄
- kv_var: 点缀元素
  style_var: '{点缀元素}'
  desc: 同材质的点缀配件，如：蓝色黏土对话框 + 绿色小长条
- kv_var: 对话框文字
  style_var: '{对话框文字}'
  desc: 对话框里的白色小字，如：叮咚！、快来！
- kv_var: 背景色
  style_var: '{背景色}'
  desc: 无缝背景色，如：淡米色、暖白、浅杏色

