# 粗壮飘逸字体设计

id: bold_flow_typography_visual_experience
name: "粗壮飘逸字体设计"
category: typography

tags:
  - 字体设计
  - 中文排版
  - 飘逸笔划
  - 动感排列
  - 大师作品

triggers:
  - 粗壮字体
  - 飘逸文字
  - 字体挤压
  - 错位排列
  - 视觉体验

features:
  - "**粗壮宽阔笔划** — 飘逸文字笔划，粗壮有力，转折弧形柔和完美"
  - "**动感排列** — 文字排列极具动感，错位排列，视觉平衡之美"
  - "**文字挤压效果** — 文字间产生挤压感，增强视觉张力"
  - "**扁平大师风** — 扁平化处理，大师级作品质感"
  - "**纯色背景** — 纯色背景突出文字主体，画面简洁有力"

scene: "标题字体设计、品牌视觉、海报排版、创意文字"
ratio: "1:1"
summary: "粗壮宽阔的飘逸中文笔划，动感错位排列，文字挤压效果，纯色背景，扁平大师级字体设计"

prompt: |
  中文「{主题文字}」与英文「{英文文案}」的字体设计。

  粗壮、宽阔、飘逸的中文字形笔画，转折处以平滑弧线过渡。文字排列极具动感，带挤压效果与错位排布，形成视觉平衡之美。扁平风格，大师级作品质感。

  底部居中：小号无衬线文字「{副标题}」，其下是更小的文字「{署名}」。

  纯色实底背景，构图干净，高品质输出。文字应主导画面，具备强烈视觉冲击。中文字为主体，英文文字作为辅助元素。

  不要水印，不要复杂背景，不要 3D 效果，不要渐变。保持扁平、干净、有力。


variables:
- kv_var: 主题文字
  style_var: '{主题文字}'
  desc: 如：流动
- kv_var: 英文文案
  style_var: '{英文文案}'
  desc: 如：FLOWING
- kv_var: 副标题
  style_var: '{副标题}'
  desc: 次级标题，如：限定发售
- kv_var: 署名
  style_var: '{署名}'
  desc: 如：Photography by Lee
source_url: "https://jimeng.jianying.com/ai-tool/work-detail/7579463842925645065"
source_author: "平面设计老鬼"

