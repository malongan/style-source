# Expressive Handwritten Headline（创意手写风格字体）

id: expressive_handwritten_headline
name: "表现性手写标题"
name_cn: "创意手写风格字体"
category: typography

tags:
  - handwriting
  - expressive
  - casual
  - lively
  - green-background
  - white-text
  - slogan

triggers:
  - 创意手写字体
  - 手写风格标题
  - 随性手写
  - 夸张笔画标题
  - 绿底白字标题
  - 活动Slogan字体

features:
  - "**创意手写体** — 笔画形态夸张且富有变化，手写表达感强"
  - "**粗细对比强烈** — 笔画粗细之间形成强烈对比"
  - "**不规则连笔/断点/延展** — 连笔不规整、折笔断开，带弧形延伸与花饰"
  - "**随性自由活泼** — 气质随性、自由、鲜活，打破常规字体的规整性"
  - "**绿底白字** — 纯绿底 + 白色文字，干净利落"
  - "**扁平矢量** — 无阴影、无渐变，边缘清晰"

scene: "活动 Slogan（见面会/校园/青年活动）/ 品牌手写感标语 / 需要活泼自由氛围的标题设计"
ratio: "16:9"
summary: "创意手写风格字体——笔画夸张多变、粗细对比强烈、不规则连笔断点延展、随性自由活泼、绿底白字、扁平矢量"

prompt: |
  纯绿色纯色背景，无肌理、无渐变，扁平矢量插画风格，创意手写字体标志设计。中文口号「{中文Slogan}」以表现性的创意手写风格呈现：笔画形态夸张且变化丰富，粗细笔画之间形成强烈对比，连笔不规整，折笔断开，带弧形延伸与花饰，传达出随性、自由、鲜活的感觉，打破常规字体的规整性。主文字为白色，落在绿色背景上，边缘干净锐利，每个字都清晰可读。极简版式，口号是唯一的元素，呼吸空间充裕。没有其他元素，没有装饰，没有边框，没有阴影，没有渐变。不要添加任何其他字母、单词、数字、标签、logo 或伪文字。所有文字保持完全清晰可读，并位于安全区内。

variables:
  - kv_var: 中文Slogan
    style_var: '{中文Slogan}'
    desc: 如：好好吃饭
source: "painter"
source_author: "painter"
created_at: "2026-08-13"
verified_at: "2026-08-13"

# 配图: expressive_handwritten_*.webp（用户确认「可以」）
# 示范文字: 青春建面会 筑梦未来城
