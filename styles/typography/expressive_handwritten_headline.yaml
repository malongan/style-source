  - "**不规则连笔/断点/延展** — irregular connecting strokes, broken bends, curved extensions and flourishes"
  - "**随性自由活泼** — casual, free, lively feeling，打破常规字体规整性"
  - "**绿底白字** — 纯绿底 + 白色文字，干净利落"
  - "**扁平矢量** — 无阴影、无渐变，边缘清晰"

scene: "活动 Slogan（见面会/校园/青年活动）/ 品牌手写感标语 / 需要活泼自由氛围的标题设计"
ratio: "16:9"
summary: "创意手写风格字体——笔画夸张多变、粗细对比强烈、不规则连笔断点延展、随性自由活泼、绿底白字、扁平矢量"

prompt: |
  Pure green solid color background with no texture and no gradient, flat vector illustration style, creative handwritten typography logo design. The Chinese slogan "{中文Slogan}" rendered in an expressive creative handwriting style: stroke forms exaggerated and richly varied, strong contrast between thick and thin strokes, irregular connecting strokes, broken bends, curved extensions and flourishes, conveying a casual, free, lively feeling that breaks the regularity of conventional fonts. The main text is white on the green background, clean sharp edges, every character clearly readable. Minimal layout, the slogan is the only element, generous breathing space. No other elements, no decorations, no frames, no shadows, no gradient. Do not add any other letters, words, numbers, labels, logos, or pseudo-text. Keep all text fully legible and inside the safe area.

variables:
  - 中文Slogan

