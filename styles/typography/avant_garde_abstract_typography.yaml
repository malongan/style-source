# Avant-garde Abstract Typography（先锋抽象创意字体）

id: avant_garde_abstract_typography
name: "先锋抽象字体排版"
name_cn: "先锋抽象创意字体"
category: typography

tags:
  - avant-garde
  - abstract
  - black-background
  - flat-vector
  - monochrome
  - accent-color
  - logo
  - slogan

triggers:
  - 先锋抽象字体
  - 创意字体Logo
  - 黑底白字标题
  - 抽象变形标题
  - 大师字体设计
  - 品牌Slogan标题

features:
  - "**笔画大胆重组** — 局部笔画夸张变形、延伸和断开，结构被大胆重组"
  - "**线条流畅节奏感** — 流畅线条 + 强节奏动感，视觉冲击"
  - "**高对比笔画** — 笔画粗细对比鲜明，干净利落"
  - "**扁平矢量** — 扁平化设计，无 3D 阴影、无渐变，纯矢量感"
  - "**黑白主色 + 单点缀色** — 黑底白字为基调，单个亮色（如电光橙）落在关键笔画制造焦点"
  - "**中英层级** — 中文 Slogan 为主体，英文短语小字副行"

scene: "品牌 Logo / 发布会主视觉 / 战略Slogan KV（破局焕新类）/ 科技·咨询·高端品牌 / 黑白高级感设计"
ratio: "16:9"
summary: "先锋抽象创意字体——笔画大胆重组、局部夸张变形、流畅线条强节奏、扁平矢量、黑底白字+单亮色点缀，高级前卫大师感"

prompt: |
  纯黑背景，扁平矢量插画风格，创意字体 Logo 设计。主体是中文标语「{中文Slogan}」，以先锋抽象字体呈现：字形笔画被大胆重组，局部笔画夸张、延伸、断开，线条流畅并带强烈的节奏动势，笔画粗细高对比，边缘干净锐利，扁平设计，无 3D 阴影、无渐变。英文短语「{英文副行}」以较小字号置于中文之下，用精致的细几何无衬线体，字距微妙。以黑底白字为基调，只在单一关键笔画上使用一处克制的亮色（电光橙），制造视觉焦点。整体先锋、高级、视觉冲击强，大师级字体设计。每个字都必须清晰可读，所有文字保持在安全区域内。不要添加任何其他字母、单词、数字、标签、Logo 或伪文字。


variables:
  - kv_var: 中文Slogan
    style_var: '{中文Slogan}'
    desc: 如：好好吃饭
  - kv_var: 英文副行
    style_var: '{英文副行}'
    desc: 如：MADE WITH CARE
source: "painter"
source_author: "painter"
created_at: "2026-08-13"
verified_at: "2026-08-13"

