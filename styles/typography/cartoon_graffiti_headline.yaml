id: cartoon_graffiti_headline
name: "卡通涂鸦大标题"
name_cn: "创意卡通涂鸦标题字体"
category: typography

tags:
  - cartoon
  - graffiti
  - doodle
  - black-outline
  - fluorescent-green
  - speech-bubble
  - playful
  - streetwear

triggers:
  - 创意卡通涂鸦字体
  - 涂鸦标题
  - 黑字白边
  - 荧光绿装饰
  - 潮流活动字体
  - 年轻创意标题

features:
  - "**笔画夸张变形** — 笔画夸张扭曲，圆润灵动的有机形态"
  - "**粗细对比强烈** — 笔画粗细对比鲜明，厚重卡通字形"
  - "**黑字白边** — 黑色字 + 干净白色描边，高对比凸出效果"
  - "**荧光绿装饰** — 荧光绿对话框、数字与动态线条点缀，配对话框与波浪线"
  - "**扁平矢量** — 纯矢量画法，无 3D 阴影、无渐变，纯色涂鸦感"
  - "**中英层级** — 中文 Slogan 为主体，英文短语小字副行"

scene: "潮流活动主视觉 / 创意宣传海报 / 年轻向品牌 KV / 街头文化设计"
ratio: "4:3"
summary: "创意卡通涂鸦标题字体——笔画夸张变形圆润灵动、粗细对比强烈、黑字白边高对比、荧光绿对话框数字线条点缀，扁平矢量潮流活力年轻创意感"

prompt: |
  纯色奶油白背景，俏皮的创意卡通涂鸦字体设计。主元素是中文口号「{中文Slogan}」，以粗壮卡通涂鸦字体呈现：夸张扭曲的笔画、圆润灵动的有机形态、粗细笔画强烈对比、敦实俏皮且边缘圆润平滑的字形。黑色字配一圈干净的白色描边，形成高对比的凸出效果。亮荧光绿的装饰元素：小的对话气泡形状、几个散落的数字、字母周围动态的曲线与波浪线。英文短语「{英文副行}」以小一号的字号置于中文下方，用圆润的粗体无衬线字体。年轻、有活力、潮流的街头气息，创意企划海报字体，扁平矢量风格，干净的纯色，无 3D 阴影，无渐变。每个中文字都必须清晰可读、书写正确，所有文字保持在安全区内。只允许把装饰性数字作为额外元素；不要添加任何其他字母、单词、标签、logo 或伪文字。

variables:
  - kv_var: 中文Slogan
    style_var: '{中文Slogan}'
    desc: 如：好好吃饭
  - kv_var: 英文副行
    style_var: '{英文副行}'
    desc: 如：MADE WITH CARE
source: "painter"
source_author: "painter"
