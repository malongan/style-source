features:
  - "**绿色纯色底** — 明快的纯绿背景，高对比白字"
  - "**创意手绘潮流字体** — 抽象变形的字形，独特节奏与自然的曲线动感"
  - "**高对比白字** — 明亮白色字体，细微描边确保可读性"
