scene: "夏季露营活动主视觉 / 潮流品牌 KV / 户外生活方式宣传 / 帐篷音乐节海报"
ratio: "4:3"
summary: "夏日露营季创意手绘标题字体——绿色纯色底+高对比白字、抽象变形创意手绘潮流字、节奏动感、卡通露营元素点缀（帐篷/篝火/星星）、扁平矢量年轻活力"

prompt: |
  纯色清新的绿色背景，高级创意手绘潮流字体设计。主元素是中文口号「{中文Slogan}」，以创意手绘潮流字体呈现：抽象变形的字形，具备独特的节奏与动态的流动感，俏皮的扭曲笔画，艺术化的粗体手写字，配平滑的有机曲线与充沛的能量。英文短语「{英文副行}」以更小的字号作为辅助点缀行。标题周围散落可爱的卡通露营图案：小帐篷、篝火、星星、树叶、太阳、云朵，采用扁平涂鸦风格。高对比的明亮白色字，配细微描边确保清晰可读。高级艺术海报质感，扁平矢量风格，干净的纯色，无 3D 阴影，无渐变。每个中文字都必须清晰可读、书写正确，所有文字保持在安全区内。不要添加任何其他字母、单词、标签、logo 或伪文字。

variables:
  - kv_var: 中文Slogan
    style_var: '{中文Slogan}'
    desc: 如：好好吃饭
  - kv_var: 英文副行
    style_var: '{英文副行}'
    desc: 如：MADE WITH CARE
