# 稚拙粗黑汉字标题样张

id: childish_chunky_black_lettering
name: "稚拙粗黑汉字标题样张"
category: typography

tags:
- 稚拙变形
- 粗黑实心笔画
- 手绘擦痕漏白
- 2×2巨型字
- 噪点磨砂纸
- 字体样张排版

triggers:
- 稚拙粗黑字体
- 儿童感汉字标题
- 巨型黑字海报
- 字体设计样张
- 马克笔粗笔画字
- 噪点纸底标题字

features:
- title: 三岁儿童式的夸张结构
  desc: 部件大小悬殊、比例歪斜、转折圆钝，笔画被拆成一根根粗短条块重新拼装，稚拙但每个字仍可辨认
- title: 粗黑实心笔画带擦痕
  desc: 笔画是纯黑实心条块、末端收圆、边缘不规则，内部留着一顺方向的马克笔擦痕与细小漏白，局部一道更亮的内高光形成薄薄的立体阴影层次
- title: 2×2 田字格巨型排布
  desc: 四字排成上下两行、几乎占满画面，字间紧凑咬合但不粘连，笔画之间靠纸底留白透气
- title: 噪点磨砂纸与深色粗边框
  desc: 浅灰纸面铺满细密噪点与不规则小斑点，画面四周留一条均匀的深色粗边框，像一张被装裱起来的字卡
- title: 四角信息层级齐全
  desc: 左上品牌标识（小图标 + 品牌名 + 两行极小字）、左下字体名与三行说明、右上与右下角极小编号，全部小字号，只搭层级不抢主体
- title: 中部一点橙色点缀
  desc: 主体下方压一组橙色手写小字与一行橙色连笔拉丁，再叠一枚黑底白字的斜置小标签，全画面只有这一处彩色

scene: "字体设计样张与作品展示、食品与饮品活动主标题、社媒封面大字、文创与包装标题字、品牌主题字提案"

ratio: '1:1'
summary: "稚拙粗黑汉字标题样张——四字排成 2×2 田字格几乎占满画面，笔画是带马克笔擦痕与漏白的纯黑实心条块、结构像三岁儿童随手拼装，浅灰噪点磨砂纸配深色粗边框，四角排品牌标识/字体名/编号小字，中部只留一点橙色手写点缀。"

prompt: |
  创作一张 1:1 方版的极简创意字体海报。

  主体字：
  画面中央是{主标题文字}，按{排布方式}排布，字极大、几乎占满画面。
  笔画被夸张变形：部件大小悬殊、比例歪斜、转折圆钝，像三岁小孩写字时的随手结构，但每个字必须清晰可辨、笔画完整不缺。
  每一笔都是纯黑的实心条块，末端收圆、边缘不规则；
  笔画内部保留手绘纹理：顺着一个方向的马克笔擦痕与细小漏白，局部有一道更亮的内高光，形成薄薄的立体阴影层次；
  字与字紧凑咬合但不粘连，笔画之间留出清楚的纸底空隙。

  背景：
  {纸底色}的纸面，铺满细密的噪点与不规则小斑点，磨砂质感、无渐变；
  画面四周留一条均匀的深色粗边框，像一张被装裱起来的字卡。

  点缀文字（全部小字号，只搭层级、不抢主体）：
  左上角是{品牌标识}：一个黑色抽象字形小图标配少量橙色与绿色色块，右侧是短品牌名与注册商标符号，下面压两行极小字。
  画面中部偏下压一组{中部点缀文案}：一行橙色手写体中文小字、一行橙色连笔拉丁小字，以及一枚黑底白字的斜置小标签。
  左下角是{落款信息}：一行小字标题、一行稍大的字体名，再下面排三行极小说明。
  右上角与右下角各放{边角编号}，极小字号横排。

  所有文字必须真实可读、拼写正确，不要伪字、不要乱码。

  整体：纯黑大字加一点点橙色，构图饱满又有呼吸，俏皮、稚拙、有现代平面设计的张力。

  避免：彩色主体字、渐变、3D 立体挤出、写实摄影、真实品牌 Logo、水印、乱码伪字、多余装饰图形。

variables:
- kv_var: 主标题文字
  style_var: '{主标题文字}'
  desc: 画面主体的中文大字，建议 4 字，如：鲜果现切
- kv_var: 排布方式
  style_var: '{排布方式}'
  desc: 主体字的分行方式，如：2×2 田字格两行、横排一行四字
- kv_var: 纸底色
  style_var: '{纸底色}'
  desc: 纸面底色，如：浅灰噪点磨砂、米白细点纸
- kv_var: 品牌标识
  style_var: '{品牌标识}'
  desc: 左上角小图标 + 品牌名 + 两行极小字，用虚构品牌，如：极昼 + 抽象字形标
- kv_var: 中部点缀文案
  style_var: '{中部点缀文案}'
  desc: 主体下方的橙色小字与黑底标签内容，如：三岁岁、鲜果现切
- kv_var: 落款信息
  style_var: '{落款信息}'
  desc: 左下角字体名与说明，如：名称 / 稚拙粗黑体 / 三行极小说明
- kv_var: 边角编号
  style_var: '{边角编号}'
  desc: 右上与右下角的极小字，如：商品编号、NO.012

