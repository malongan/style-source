# 黑底白字引号大弧错位标题

id: black_quoted_arc_headline
name: "黑底白字引号大弧标题"
category: typography

tags:
  - 黑底白字
  - 粗圆无衬线
  - 引号装饰
  - 字号反差
  - 末笔大弧
  - 错位编排
  - 方形构图
  - 极简高级

triggers:
  - 引号大弧标题字
  - 黑底白字错位字体
  - 字形大小变化标题
  - 末笔拉弧字体设计
  - 季节企划主视觉标题

features:
  - title: 巨型引号夹住上行短句
    desc: 上行两字左右各一枚超大白色双引号，把字夹在中间形成第一视觉停顿，引号是画面里唯一的图形元素
  - title: 字号极端反差与错位叠压
    desc: 上行字号较小、下行显著放大并横向撑开，两行局部叠压错位，打破常规等宽排版
  - title: 末笔拉成巨大 U 形白弧
    desc: 下行最后一字的末笔向下向右延伸成一条超大 U 形白色弧线，包住下方留白，是整张图的记忆点
  - title: 纯黑底纯白实心字
    desc: 无肌理、无渐变的纯黑背景，白色实心字高对比，极简高级
  - title: 英文落款与中文副行收尾
    desc: 大弧内侧与下方依次放小号英文落款（带短斜杠）和中文副行，白色粗圆小字略微倾斜，轻盈有动感

scene: "季节活动主视觉、烘焙 / 市集 / 文旅企划标题、社媒方形封面字、字体设计练习"
ratio: "1:1"
summary: "黑底白字引号大弧标题——巨型引号夹住上行短句、下行字号放大且末笔拉成巨大 U 形白弧，配英文小落款与中文副行，纯黑白极简高级的方形字体海报。"

prompt: |
  方形字体设计海报，干净的纯黑色背景，无肌理、无渐变、无装饰。画面中心是白色粗圆无衬线变体的中文主标题，分上下两行做字号反差的错位编排：第一行「{主标题上行}」只有两字、字号较小，左右各有一枚超大的白色双引号把这两个字夹在中间；第二行「{主标题下行}」字号显著放大、横向撑开，与上行局部叠压错位。笔画圆润饱满、带有明显的粗细变化，字重极粗，但每个字仍清晰可读，极具现代感与动感。第二行最后一个字的末笔向下并向右延伸，拉成一条巨大的 U 形白色弧线，弧尾上扬包住下方留白，成为整张图最醒目的记忆点。在弧线内侧与下方依次排布小号英文落款「{英文落款}」（后跟一条短斜杠）与中文副行「{中文副行}」，两者均为白色粗圆小字、略微倾斜，形成轻盈动感的收尾。整体居中、留白充足、现代高级，大师级字体设计。除主标题文字、两枚引号、英文落款与中文副行外，不添加任何其他图形、图标、边框、水印、Logo 或伪文字。所有中文笔画必须正确、完全可读，并保持在安全区域内。

variables:
  - kv_var: 主标题上行
    style_var: "{主标题上行}"
    desc: "2 字短句，被一对巨型引号夹住，如：秋日"
  - kv_var: 主标题下行
    style_var: "{主标题下行}"
    desc: "3-5 字，字号更大且末字末笔拉成大弧，如：焙游计划"
  - kv_var: 英文落款
    style_var: "{英文落款}"
    desc: "大弧内侧的小号英文短词，如：HOT NOW"
  - kv_var: 中文副行
    style_var: "{中文副行}"
    desc: "落款下方的中文短句，如：火热进行中"

source_url: "https://jimeng.jianying.com/ai-tool/work-detail/7555816244406996234"
source_author: "•（即梦）"

