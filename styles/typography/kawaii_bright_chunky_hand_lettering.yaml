triggers:
  - 粗圆卡哇伊手写标题
  - 明亮手写标题字
  - 玫瑰金粗圆字体
  - kawaii粗圆风
  - 暖色渐变手写

features:
  - "**明亮粗圆可爱手写** — 厚实圆润的笔画、柔和的马克笔质感，自然放松、轻向右倾斜"
  - "**暖玫瑰金发光渐变** — 玫瑰金 + 奶油白渐变、发光高光，鲜活明亮"
  - "**俏皮变形+连笔延伸** — 俏皮的变形笔画、小弯尾、柔和花饰、连字式衔接，以及笔刷式延伸"
  - "**边缘锐利清晰** — 锐利清晰的轮廓、干净高对比的边缘，不模糊、不发虚"
  - "**排版** — 两行居中堆叠 LARGE，标题下细分割线 + 奶油白信息行"

scene: "电商 KV 主标题、IP 海报/活动主视觉标题字、需要可爱治愈明亮活泼带手写温度的氛围"
ratio: "9:16"
summary: "明亮粗圆卡哇伊手写标题——粗胖圆润笔触、暖玫瑰金发光渐变、放松斜体、俏皮变形+笔刷连笔延伸、边缘锐利清晰"

prompt: |
  主标题水平居中于画面上方区域，以大号呈现，占满大部分预留的字体空间。标题分为上下两行堆叠：第一行「{第一行}」，其下为第二行「{第二行}」，两行均居中。字母以明亮、粗圆的粗体手写卡哇伊风格绘制：厚实圆润的手写笔触，带柔软马克笔质感，可爱讨喜，并自然放松地微微向右倾斜。字色明亮通透：玫瑰金与奶油白的放射状暖渐变，配发光高光，让标题显得鲜活、充满光感。部分笔画做了俏皮的变形与延伸，并带装饰性连笔：小小的弯尾、柔和的花饰、相邻笔画之间温婉的连字式衔接，以及可爱的笔刷式笔画延伸，增添手写魅力，同时每个字仍清晰可读。最重要的要求是边缘清晰：每一笔都必须有干脆、锐利、轮廓分明的外形，边缘干净高对比，不模糊、不柔和羽化、不笔画互叠、不缺笔画；整个标题必须一眼看清。除了笔画层面的花饰，标题周围不要任何装饰性丝带、边框、花朵或纹样。在标题两行之下，放一条纤细优雅的分割线，再下面是较小号的副行「{活动时间}」，用精致的细线圆体，居中，暖奶油色。不要添加任何其他字母、单词、数字、标签、Logo 或伪文字。所有文字都要完全可读，并保持在安全区域内。

variables:
- kv_var: 第一行
  style_var: '{第一行}'
  desc: 如：COMING SOON
- kv_var: 第二行
  style_var: '{第二行}'
  desc: 如：AUTUMN 2024
- kv_var: 活动时间
  style_var: '{活动时间}'
  desc: 活动时间或副行文案，如 5.1–5.7
source: "painter"
source_author: "painter"
created_at: "2026-08-08"

