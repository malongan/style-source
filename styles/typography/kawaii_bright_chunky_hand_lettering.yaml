# Kawaii Bright Chunky Hand-lettering（明亮粗圆卡哇伊手写标题）

id: kawaii_bright_chunky_hand_lettering
name: "可爱明亮粗圆手写字体"
name_cn: "明亮粗圆卡哇伊手写标题"
category: typography

tags:
