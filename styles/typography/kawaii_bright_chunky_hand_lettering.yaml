prompt: |
  The headline is centered horizontally in the upper area and rendered LARGE, filling most of the reserved typography space. It is split into two stacked lines: the first line "{第一行}" and below it the second line "{第二行}", both centered. The letters are drawn in a bright chunky bold hand-lettering kawaii style: thick plump rounded handwritten strokes with a soft marker feel, cute and adorable, with a natural relaxed italic slant leaning gently to the right. The letters are luminous and bright: a radiant warm rose-gold and cream-white gradient with glowing highlights, so the headline feels vivid and full of light. Some strokes are playfully deformed and extended with decorative connecting flourishes: small curved tails, soft swashes, gentle ligature-like links between nearby strokes, and cute brush-like stroke extensions that add hand-written charm, while every character remains clearly readable. The most important requirement is edge clarity: every character stroke must have a crisp, sharp, well-defined outline with clean high-contrast edges, no blur, no soft feathering, no overlapping strokes, and no missing parts; the whole headline must read clearly at a glance. No decorative ribbons, frames, flowers or ornaments around the headline beyond the stroke-level flourishes. Below the two headline lines, a thin elegant divider line, then the smaller secondary line "{活动时间/副行}" in a delicate fine-line rounded typeface, centered, in warm cream. Do not add any other letters, words, numbers, labels, logos, or pseudo-text. Keep all text fully legible and inside the safe area.

variables:
  - 第一行
  - 第二行
  - 活动时间/副行

