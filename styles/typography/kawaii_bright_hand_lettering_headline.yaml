# Kawaii Bright Hand-lettering Headline（明亮卡哇伊手写标题）

id: kawaii_bright_hand_lettering_headline
name: "可爱明亮手写标题字体"
name_cn: "明亮卡哇伊手写标题"
category: typography

tags:
  - hand-lettering
  - kawaii
  - headline
  - rose-gold
  - bright
  - bold
  - rounded
