summary: "明亮粗胖卡哇伊手写标题——圆润笔触、暖玫瑰金渐变、自然斜体、笔画变形+连笔装饰、边缘锐利清晰"

prompt: |
  The headline is centered horizontally in the upper area and rendered LARGE, filling most of the reserved typography space. It is split into two stacked lines: the first line "{第一行}" and below it the second line "{第二行}", both centered. The letters are drawn in a bright bold plump hand-lettering kawaii style: thick rounded handwritten strokes with a soft cushioned marker feel, adorable and sweet, with a natural easy italic lean to the right. The letters are luminous and bright: a radiant warm rose-gold, peach and cream-white gradient with soft glowing highlights, giving the whole headline a fresh vivid brightness. Some strokes are whimsically deformed with decorative hand-written connections: cute little tails and loops, soft linking curves between adjacent characters, gentle brush-like swash extensions at stroke ends, adding a playful connected-handwriting charm, while every character remains clearly readable. The most important requirement is edge clarity: every character stroke must have a crisp, sharp, well-defined outline with clean high-contrast edges, no blur, no soft feathering, no overlapping strokes, and no missing parts; the whole headline must read clearly at a glance. No decorative ribbons, frames, flowers or ornaments around the headline beyond the stroke-level flourishes. Below the two headline lines, a thin elegant divider line, then the smaller secondary line "{活动时间/副行}" in a delicate fine-line rounded typeface, centered, in warm cream. Do not add any other letters, words, numbers, labels, logos, or pseudo-text. Keep all text fully legible and inside the safe area.

variables:
  - 第一行
  - 第二行
  - 活动时间/副行

