name: 静奢家具铭牌海报风格
category: print
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 高端家具编辑海报体系：暖米白影棚底、超大号深森林绿展示字体位于一件写实主角家具之后、稀疏的目录小字、细线、描边目录标签，以及深绿色圆角底部信息条。
tags:
- VigoCookbook
- Luxury
- furniture
- catalog
- product
- photography
- restrained
- graphic
triggers:
- Quiet Luxury Furniture Nameplate Poster Style
features:
- title: 暖米白背景，带轻微纸张柔感与淡淡的影棚地面渐变。
  desc: ''
- title: 超大号深森林绿展示字体位于家具之后，并被部分遮挡。
  desc: ''
- title: 一件主角家具占据画面中下部，具有写实产品摄影的纵深。
  desc: ''
- title: 家具与后方的展示字体相互叠压，形成干净分层的海报层级。
  desc: ''
- title: 顶部附近有细的深绿色水平分隔线与小号、字距拉开的导航文字。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{主体}'
  desc: 主角家具，如：一把单人扶手椅
- kv_var: 主体动作
  style_var: '{位置关系}'
  desc: 位置与空间关系，如：略偏右、占据中景
- kv_var: 产品/道具
  style_var: '{道具}'
  desc: 配合陈列的物件，如：落地灯 / 矮几
- kv_var: 场景地点
  style_var: '{场景}'
  desc: 拍摄环境，如：暖米白影棚
- kv_var: 背景元素
  style_var: '{背景元素}'
  desc: 补充画面层次，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{主文案}'
  desc: 超大号深森林绿展示字体，如：FORMA
- kv_var: 副文案
  style_var: '{副文案}'
  desc: 稀疏目录小字，如：collection 04 / oak
- kv_var: 点缀符号
  style_var: '{点缀符号}'
  desc: 如：细线 / 描边目录标签
- kv_var: 服装造型
  style_var: '{材质}'
  desc: 家具材质与表面，如：浅色橡木 + 亚麻
prompt: |
  创作一张 16:9 的奢华家具编辑海报，采用「静奢家具铭牌海报」风格。主体：{主体}。位置与空间关系：{位置关系}。产品/道具：{道具}。地点：{场景}。背景元素：{背景元素}。后方大号展示字：{主文案}。次级目录文案：{副文案}。点缀符号或标签片：{点缀符号}。家具材质与表面：{材质}。需保留的风格保真锚点：本风格的核心视觉锚点。需避免的源内容：水印、真实 logo 与商业广告。搭建一片暖米白的影棚海报场：带轻微的纸张柔感，产品背后一个超大的深森林绿几何无衬线展示词，顶部一条细横线配字距拉开的小号目录导航词，左下角紧凑的微型文案，右下附近两个小的描边目录标签片，底部横贯一条深绿色圆角的产品信息条。家具必须写实、高级、材质细节丰富、带柔和阴影，且尺度足够大以叠压后方的字体。画面保持稀疏、精致、画廊感、无品牌。不要使用真实 logo、水印、二维码、App UI、价签，或与源完全相同的文字。

id: luxury_poster_style
