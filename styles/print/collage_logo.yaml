name: 拼贴标识（马赛克风格）
category: print
ratio: '1:1'
source_author: 内部模板
source_url: ''
summary: 用马赛克镜面砖拼出高级感品牌图标。
tags:
- logo
- 品牌
- 图标
- 3D
- 马赛克
triggers:
- 拼贴logo
- 马赛克图标
- 马赛克logo
features:
- title: 圆角方砖造型
  desc: 几十块砖咬合，缝隙深而均匀，每块独立可辨
- title: 光泽玻璃 + 镀铬材质
  desc: 砖有玻璃厚度，镜面反射环境光与模糊高光块
- title: 迪斯科球镜面砖效果
  desc: 反光被切碎成小块，边缘因厚度轻微折射
- title: 柔和工作室灯光
  desc: 上方与侧方同时来光，反射里能看出环境
variables:
- kv_var: 图形主体
  style_var: '{图形主体}'
  desc: 如：一颗五角星 / 字母 M / 一只猫头轮廓
- kv_var: 砖块颜色
  style_var: '{砖块颜色}'
  desc: 如：银色镀铬 / 香槟金 / 深蓝与银混拼
- kv_var: 砖块排列
  style_var: '{砖块排列}'
  desc: 如：整齐网格排列 / 沿轮廓弧线错落 / 疏密渐变的散点
- kv_var: 底色
  style_var: '{底色}'
  desc: 如：浅灰工作室背景 / 纯黑 / 米白
prompt: |
  1:1 方图（2048×2048），画面中心是一个用马赛克镜面砖拼成的{图形主体}图标，造型由几十块圆角方砖咬合而成，砖与砖之间留出均匀的细缝，缝隙是深的，让每一块砖都独立可辨。

  砖块：{砖块颜色}。每块砖都有玻璃般的厚度，表面是镀铬镜面，反射出柔和的环境光和模糊的高光块，像迪斯科球被切碎后的反光；圆角处有细窄的亮边，边缘因厚度产生轻微折射。

  排列：{砖块排列}。砖块大小基本一致但略有误差，整体轮廓因此带一点手工拼贴的不齐，不追求机械精确。

  布光：柔和的工作室灯光从上方和侧方同时来，在镜面砖上留下大片柔和的高光与暗面，反射里能看到工作室环境的模糊色块，而不是纯色。

  底色：{底色}，纯色无纹理，与图标拉开明度差。

  整体是高级感品牌图标，质感真实、克制、有重量，不是平面矢量 logo。
id: collage_logo
code: ''
