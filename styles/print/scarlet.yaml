features:
- title: 白色纸张底场
  desc: ''
- title: 超大红色衬线字母
  desc: ''
- title: 写实抠图主体
  desc: ''
- title: 粗糙黑色马克笔轮廓描边
  desc: ''
- title: 强对比非对称负空间
  desc: ''
variables:
- kv_var: 主标题
  style_var: '{主标题}'
  desc: 红色衬线字母
- kv_var: 标语
  style_var: '{标语}'
  desc: 作者、期号等
- kv_var: 画面-主体
  style_var: '{主体}'
  desc: 写实抠图对象
- kv_var: 画面-动作
  style_var: '{画面动作}'
  desc: 与红色字形的关系
- kv_var: 画面-场景
  style_var: '{场景}'
  desc: 简洁编辑封面场
- kv_var: 产品/道具
  style_var: '{道具}'
  desc: 画面里的辅助物件
- kv_var: 背景元素
  style_var: '{背景元素}'
  desc: 补充画面层次，如：反光玻璃、贴纸、路牌
- kv_var: 点缀符号
  style_var: '{点缀符号}'
  desc: 单个符号或小图案，如：✦ / ★ / 涂鸦箭头
- kv_var: 服装造型
  style_var: '{造型}'
  desc: 人物穿搭
prompt: |
  创作一张 9:16 全出血的动作广告海报，采用 Scarlet Court Photo Type Poster 风格。主体：{主体}。动作：{画面动作}。道具或产品：{道具}。场景：{场景}。背景：{背景元素}。主标题文字：{主标题}。两侧与底部的次级小字：{标语}。通用点缀符号：{点缀符号}。服装与造型：{造型}。必须保持可见的风格保真锚点：该风格的核心视觉锚点。需要避免的源内容：水印、真实 Logo 与商业广告。构图：把海报切成硬边结构——靠近顶部或上侧是一块电光蓝矩形摄影面板，下方或旁侧是占主导的平涂猩红红色场；放置一个超大的写实动作主体，让身体或道具从蓝色面板跨入红色场；版面保持稀疏有力，接缝分明，采用高角度或俯拍的运动/编辑摄影机位，动作被果断定格，红色场上落一道清晰的投影。字体：{主标题}排在下三分之一，使用暖奶油色的超粗压缩几何无衬线展示字；在主体下方加一枚大的暖奶油色通用{点缀符号}徽记；用{标语}排一组极小的全大写竖排侧边小字，以及一行居中的底部注释。色彩与质感：高饱和猩红、电光球场蓝、暖奶油色文字、干净的白色面板分隔线、黑色硬阴影、服装或道具上仅一处点缀色、粗颗粒印刷海报质感、轻微翻印纹理、强烈直射阳光。重要内容规则：保留红蓝面板海报系统、奶油色字体、侧边栏、硬阴影与印刷颗粒，但要更换源主体、运动、道具、文字与故事前提。避免真实 Logo、品牌标识、可辨识的运动员、照抄的标语、联系方式、水印、网球发球、网球拍、网球网，以及类 Logo 的 swoosh 弧线。以 4K 超高分辨率栅格图生成。

id: scarlet
