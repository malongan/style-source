name: 字体设计
category: print
ratio: 9:16 / 16:9
source_author: '@AdrianPunk115'
source_url: 'https://x.com/AdrianPunk115'
summary: 字体类型 + 笔画结构 + 材质光效 = 高级字体设计。
tags:
- 字体
- 标题
- 排版
- 中文
- 书法
triggers:
- 字体设计
- 字体标题
- 排版
- 中文字体
features:
- title: 多种字体风格
  desc: 时尚、书法、复古、未来等，选定一种并贯彻到底
- title: 详细的笔画/结构/重心描述
  desc: 粗细对比、重心高低、收笔形态走同一套逻辑
- title: 材质效果
  desc: 金属、玻璃、旧印刷，材质沿笔画转折分布
- title: 光影效果
  desc: 霓虹、投影、高光，投影与字形严格对应
variables:
- kv_var: 主文字
  style_var: '{主文字}'
  desc: 如：万象 / 潮生 / 山海之间
- kv_var: 字体风格
  style_var: '{字体风格}'
  desc: 如：高对比时尚衬线 / 狂草书法 / 复古印刷黑体 / 未来几何无衬线
- kv_var: 笔画特征
  style_var: '{笔画特征}'
  desc: 如：横细竖粗、重心偏高、收笔尖利 / 笔画连带、飞白明显
- kv_var: 材质
  style_var: '{材质}'
  desc: 如：拉丝金属 / 磨砂玻璃 / 旧铅字印刷
- kv_var: 光影
  style_var: '{光影}'
  desc: 如：侧向硬光投影 / 霓虹边缘光 / 顶部柔光高光
- kv_var: 底色
  style_var: '{底色}'
  desc: 如：纯黑 / 米白宣纸 / 深墨绿
prompt: |
  一张以字体为主体的设计作品。画面中心是{主文字}，字体风格为{字体风格}，字占满画面主要区域，四周只留必要的呼吸空间，不添加任何插画或装饰元素——字本身必须撑住整个画面。

  笔画：{笔画特征}。横竖笔画的粗细对比、重心高低、收笔的形态统一在同一套逻辑里，每个字的笔画比例一致，不出现字体拼凑感。

  材质：{材质}。材质是长在字上的，沿笔画的转折和厚度分布，高光落在笔画的受光面，暗部顺着结构走，边缘有细微磨损或颗粒，不是整块贴图。

  光影：{光影}。光从明确的方向来，字产生真实的立体厚度和投影，投影与字形严格对应。

  底色：{底色}。背景干净，没有纹理干扰，与字的明度拉开足够对比。

  整体是高级、克制的字体设计作品，字距与重心经过反复推敲，无 AI 变形字，无多余装饰。
id: typography
code: ''
