features:
  - "**超大文字作为结构框架** — 字母如同窗户，透过字母可看到背景环境，超大裁切排版是主要结构框架，文字位置自由分布但不遮挡主体面部/躯干等重要部位"
  - "**主体在文字前方保持完整** — 面部、躯干、手臂等关键部位不被文字切割，让一个关键动作元素延伸出文字之外，制造强烈的纵深感和视觉冲击力"
  - "**4种构图变体可选** — Wave Cut（冲浪板划破波浪）、Rim Rise（篮球手从篮框上方视角扣篮）、Impact Frame（拳击手直拳冲击镜头）、Soft Swirl（优雅少女装饰蛋糕），可根据主题自由选择"
  - "**写实摄影质感** — 真实可信的解剖结构、自然皮肤纹理、强烈前景透视、克制色调风格，让主体像从现实中被定格"
  - "**暖白底色 + 编辑感间距** — 暖白底色配细微纸张颗粒纹理，克制冷色调，干净编辑间距，文字排版极简克制"

scene: "电影海报、赛事视觉、品牌KV、杂志封面、运动品牌广告"
ratio: "9:16"
summary: "以超大裁切文字为结构框架、字母如窗户般揭示背景的编辑海报视觉系统，主体在文字前方保持完整，关键动作元素延伸出文字外制造纵深"

prompt: |
  创作一张 9:16 的编辑海报，属于 HUMAN FRAGMENTS 视觉系统。

  主题：{主题}
  主体：{主体描述}
  动作：{动作描述}
  场景：{场景描述}
  标题：{标题}
  辅助文案：{副标题}
  年份：2026

  以超大、被裁切的字体作为主要结构框架。字母应像窗户一样揭示周围的环境，同时主体在字体前方保持视觉完整。

  不要让字母切断面部、躯干、手臂、大腿或身体其他重要部位。相反，让一个关键动作元素延伸到字体之外，制造强烈的纵深与视觉冲击。

  从以下构图中选择一种：

  1. WAVE CUT —— 冲浪者切过一道升起的浪，冲浪板前端、前手、水花与卷起的浪头延伸到字体之外。

  2. RIM RISE —— 从篮框上方的机位拍摄，篮球运动员伸手够向篮框，篮球、手与篮框完全延伸到字母遮罩之外，同时保持自然的对齐。

  3. IMPACT FRAME —— 拳击手朝镜头打出一记直拳，被放大的前景手套冲出字体之外，健身房环境仍在字母内部可见。

  4. SOFT SWIRL —— 一位优雅的年轻女性在装饰蛋糕，裱花袋、双手、蛋糕与流动的奶油细节延伸到字体之外，面包店内景出现在字形内部。

  使用写实摄影、可信的解剖结构、自然的皮肤质感、强烈的前景透视、细微纸张颗粒、暖白背景、克制的调色，以及干净的编辑间距。

  字体保持极简、位置自由：
  {标题}
  HUMAN FRAGMENTS
  {副标题}
  2026

  不要水印，不要真实Logo，不要插画化，不要卡通质感，不要厚重滤镜。

