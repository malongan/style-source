prompt: |
  概念性未来感编辑海报设计：以{人物}为主角，大面积侧脸肖像，着{服装}，当代利落时装造型，干净棚拍布光；白色背景上叠加粗犷的{主色}几何形状、精细的{辅色}电路式线条图案，以及少量{点缀色}界面细节。顶部醒目位置放置大写标题「{标题}」，另配一小段小号编辑文字「{文字}」；现代实验性排版，不对称杂志版式，锐利高对比构图，高级平面设计审美，画幅 4:5。
  不要水印，不要真实Logo，不要电商广告感，不要卡通风，不要拼贴感，不要复杂背景，不要乱码。

