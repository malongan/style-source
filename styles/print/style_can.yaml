name: 蓝色中式透视字体峡谷风格
category: print
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: '中式字体海报体系：以极限单点透视走廊为核心——高饱和蓝色中央梯形平面承载堆叠的超大号白色中文展示字体，两侧黑色墙面包裹着扭曲的白色与浅灰中文辅助文案。'
tags:
- VigoCookbook
- Other
triggers:
- Blue Chinese Perspective Type Canyon Style
features:
- title: 极限单点透视走廊，仿佛观者站在一条狭窄的竖向广告巷道中
  desc: ''
- title: 中央高饱和蓝色梯形平面从前景延伸至灭点，占据最强的视觉层级
  desc: ''
- title: 左右黑色墙面向内汇聚，承载密集的倾斜白色或浅灰中文字体
  desc: ''
- title: 巨大的白色中文展示字形或数字主导前景，被画面边缘裁切
  desc: ''
- title: 字体被拉伸、压缩、加粗、商业化，并因透视产生空间扭曲，而非平铺陈列
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{主体}'
  desc: 中央展示文字，如：山海
- kv_var: 主体动作
  style_var: '{动作}'
  desc: 文字的排布方式，如：垂直堆叠
- kv_var: 产品/道具
  style_var: '{道具}'
  desc: 如：印章 / 小字标签
- kv_var: 场景地点
  style_var: '{场景}'
  desc: 透视空间，如：单点透视走廊
- kv_var: 背景元素
  style_var: '{背景元素}'
  desc: 补充画面层次，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{主文案}'
  desc: 超大号白色中文展示字体，如：山海
- kv_var: 副文案
  style_var: '{副文案}'
  desc: 如：展览 2024
- kv_var: 点缀符号
  style_var: '{点缀符号}'
  desc: 如：细线框 / 编号
- kv_var: 服装造型
  style_var: '{造型}'
  desc: 场景主色，如：高饱和蓝
prompt: |
  创作一张栅格图，采用 Blue Chinese Perspective Type Canyon 风格。主体：{主体}。动作或事件：{动作}。产品/道具参考：{道具}。地点或场景：{场景}。背景元素：{背景元素}。要暗示的主中文图形文字：{主文案}。要暗示的次级重复中文文字碎片：{副文案}。点缀符号：{点缀符号}。服装或造型方向：{造型}。画幅：16:9。保留这些风格保真锚点：该风格的核心视觉锚点。避免这些源内容：水印、真实 Logo 与商业广告。把构图建成一条极限单点透视的中文排版走廊：一块高饱和电光蓝的中央梯形平面向画面中上方的灭点退去，左右黑色墙面覆满倾斜的白色与浅灰中文文字碎片。前景使用被裁切的超大白色中文块状字形或数字，蓝色平面上堆叠中央中文标题字，侧墙是密集扭曲的辅助文案。配色严格限定为蓝、黑、白、灰。使用干净的平涂 3D 海报渲染、硬边矢量式平面、白色中文字上的轻微灰调阴影、极高对比，不要真实人物，不要摄影产品，不要额外颜色，不要 Logo，不要水印。画面应像一条完全由中文排版与透视构成的、响亮压缩的广告隧道。

