prompt: |
  Create a charming Japanese-style bakery poster combining photorealistic food photography, playful hand-drawn illustrations, and nostalgic editorial typography.

  CUSTOMIZE
  - Brand: {品牌名}
  - Food: {主食物}
  - Concept: {概念}（如 Miniature World / Floating Food / Flavor Guide / Cozy Scene）
  - Headline: {标题}（日文或英文）
  - Tagline: {标语}
  - Details: {详情文案}（口味 / 产品信息 / 活动信息）
  - Color Palette: {主色板}
  - Year: {年份}
  - Aspect Ratio: 9:16

  VISUAL STYLE
  Japanese indie bakery aesthetics with a warm, playful, slightly nostalgic editorial feel. Combine realistic food photography with delicate, imperfect pen-and-ink illustrations. Use {背景纸色} paper backgrounds, {字体主色} lettering, soft natural colors, and subtle print textures.

  FOOD & STORYTELLING
  Make the food the visual centerpiece, with appetizing textures, golden crusts, natural imperfections, soft daylight, and realistic shadows. Add a few tiny 2D hand-drawn characters interacting with the food—walking across pastries, exploring oversized treats, or enjoying a cozy café moment. Create a charming miniature story through simple, meaningful interactions.

  COMPOSITION & TYPOGRAPHY
  Choose a distinctive layout based on the concept: oversized food, floating arrangements, asymmetrical product displays, or cozy still-life scenes. Maintain a strong focal point, balanced visual hierarchy, and approximately 35–40% clean negative space. Use expressive Japanese-style handwritten headlines, elegant retro serif fonts, and small playful annotations. Keep all text accurate, readable, and naturally integrated into the design.

  FINAL ART DIRECTION
  The finished poster should feel like a professionally designed Japanese bakery advertisement—warm, whimsical, visually engaging, and commercially polished. Keep illustrations minimal and purposeful. Let the food, typography, and storytelling create the visual impact.
  Avoid excessive doodles, cluttered layouts, CGI-looking food, 3D cartoon characters, random text, heavy distressing, decorative sparkles, numbering, and watermarks. Generate one complete, standalone vertical poster, not a collage or mockup.
  不要水印，不要真实Logo，不要电商广告感。

