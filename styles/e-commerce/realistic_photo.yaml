name: 写实摄影
category: e-commerce
ratio: 16:9 / 4:3
source_author: 内部模板
source_url: ''
summary: 真实光学摄影质感 + 自然光或专业灯光 + 高清晰细节。
tags:
- 摄影
- 写实
- 产品
- 商业
- 人物
triggers:
- 写实
- 真实
- 摄影
- 商业摄影
features:
- title: 真实光学摄影质感
  desc: 材质纹理与反光如实还原，不美化不做风格化
- title: 自然光或专业影棚灯光
  desc: 光源有明确方向和大小，投影软硬与光源一致
- title: 高清晰度细节表现
  desc: 关键部位合焦，细节结构可数
- title: 无AI虚假感
  desc: 保留镜头呼吸、传感器噪点和不完美边角
variables:
- kv_var: 拍摄主体
  style_var: '{拍摄主体}'
  desc: 如：一杯加冰的美式 / 一双皮质乐福鞋 / 一位侧坐的女性
- kv_var: 光线条件
  style_var: '{光线条件}'
  desc: 如：午后靠窗的侧光 / 阴天散射光 / 影棚柔光箱加反光板
- kv_var: 镜头与景深
  style_var: '{镜头与景深}'
  desc: 如：85mm f/1.8 浅景深 / 35mm f/5.6 深景深
- kv_var: 构图位置
  style_var: '{构图位置}'
  desc: 如：画面偏左三分线 / 正中央 / 右下角压边
- kv_var: 色调
  style_var: '{色调}'
  desc: 如：暖调低饱和 / 冷调偏青 / 中性自然还原
prompt: |
  一张写实商业摄影。{拍摄主体}占据画面的{构图位置}，材质、纹理、表面反光都被如实还原，能看清单个细节的真实结构，不美化、不修饰、不做风格化处理。

  光线：{光线条件}。光线有明确的方向和质感，{拍摄主体}因此出现合理的明暗过渡和投影，投影的软硬与光源大小一致，不与环境矛盾。

  器材感：{镜头与景深}。焦点落在{拍摄主体}的关键部位，其余部分按光学规律平滑虚化，过渡连续，不出现边缘发硬的抠图感。

  色调：{色调}。白平衡准确，高光不溢出，暗部保留细节，整体像一张没有经过重度调色的原片。

  真实摄影的物理真实感——有镜头呼吸，有传感器的细微噪点，有不够完美的边角。不要出现 AI 绘画感的皮肤、过度光滑的材质或塑料般的反光。
id: realistic_photo
code: ''
