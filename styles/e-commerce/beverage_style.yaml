name: 多色饮料飞溅广告系统风格
category: e-commerce
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 可复用的饮料上市广告系统，含四套变色模板：由巨大的白色 3D 字体、斜向摆放的主视觉饮料包装、凝固的液体动势、密集的上市广告文案，以及精致的商业产品布光构成。
tags:
- VigoCookbook
- Other
triggers:
- Multi-Color Beverage Splash Ad System Style
features:
- title: 每个案例使用一套鲜明的饮料品类配色，而非通用的彩虹色板。
  desc: ''
- title: 巨大的白色立体块状字母构成主要背景架构。
  desc: ''
- title: 饮料包装是唯一的近景主视觉物体，斜向摆放并大胆裁切。
  desc: ''
- title: 飞溅、泡沫、冰块、气泡或水珠以高速产品广告布光凝固定格。
  desc: ''
- title: 字体粗体、窄体、斜体，以白色为主，层叠成紧凑的广告文案块。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{SUBJECT}'
  desc: 如 a chilled peach soda can
- kv_var: 主体动作
  style_var: '{SUBJECT_ACTION}'
  desc: 如 bursting through a frozen splash
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
  desc: 如 peach slices, ice cubes
- kv_var: 场景地点
  style_var: '{LOCATION}'
  desc: 如 a studio splash set
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
  desc: 如 giant white block letters, foam
- kv_var: 主文案
  style_var: '{MAIN_TEXT}'
  desc: 如 TASTE THE FIZZ
- kv_var: 产品品类
  style_var: '{PRODUCT_CATEGORY}'
  desc: 如 气泡水 / 果汁 / 能量饮料
- kv_var: 产品形态
  style_var: '{DELIVERY_FORMAT}'
  desc: 如 易拉罐 / 玻璃瓶 / 利乐包
- kv_var: 配色
  style_var: '{COLOR_SYSTEM}'
  desc: 主色 + 辅色，如 coral + cream shadow / mint + deep teal
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
  desc: 如 new flavor, limited drop
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
  desc: 如 a small splash glyph / circular badge
- kv_var: 服装造型
  style_var: '{WARDROBE_STYLE}'
  desc: 如 model in white tee, casual street styling
prompt: |
  Create a 16:9 beverage launch advertisement in the Multi-Color Beverage Splash Ad System style for {PRODUCT_CATEGORY} and {DELIVERY_FORMAT}. Preserve these style anchors: one strong drink-category color system; giant white extruded block-letter architecture behind the product; one large diagonal fictional beverage pack cropped close near center; frozen splash, foam, ice, bubbles, condensation, or liquid sheets across the foreground; bold condensed italic white stacked headline typography; polished studio beverage lighting with crisp highlights; dense retail-ad layout with strong product hierarchy; delivery-context cues that stay secondary to the hero drink. Color system: {COLOR_SYSTEM} — one dominant field plus shadow, side-plane, liquid-tint and packaging accent variations drawn from it. Replace all source content. Do not use Sprite, Coca-Cola, copied Korean text, copied Z/E/R/O layout, original green can, existing beverage logo, real brand name, watermark, QR code, legal microcopy, or exact source slogan. New content: {SUBJECT} is {SUBJECT_ACTION} with {PRODUCT_OR_PROP} in {LOCATION}. Background details: {BACKGROUND_ELEMENTS}. Main headline text: {MAIN_TEXT}. Secondary supporting text: {SECONDARY_TEXT}. Accent symbol: {ACCENT_SYMBOL}. Styling direction: {WARDROBE_STYLE}. Adapt the composition to 16:9: 9:16 should feel usable as a vertical store poster, fridge sticker, or Xiaohongshu cover; 16:9 should feel usable as a subway lightbox, brand launch KV, or supermarket display backdrop. Use photoreal commercial beverage retouching, transparent frozen liquid motion, glossy cold surfaces, crisp contrast, and a fresh kinetic launch-ad mood.
id: beverage_style
code: ''
