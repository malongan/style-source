name: 多色饮料飞溅广告系统风格
category: e-commerce
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 可复用的饮料上市广告系统，含四套变色模板：由巨大的白色 3D 字体、斜向摆放的主视觉饮料包装、凝固的液体动势、密集的上市广告文案，以及精致的商业产品布光构成。
tags:
- VigoCookbook
- Other
triggers:
- Multi-Color Beverage Splash Ad System Style
features:
- title: 每个案例使用一套鲜明的饮料品类配色，而非通用的彩虹色板。
  desc: ''
- title: 巨大的白色立体块状字母构成主要背景架构。
  desc: ''
- title: 饮料包装是唯一的近景主视觉物体，斜向摆放并大胆裁切。
  desc: ''
- title: 飞溅、泡沫、冰块、气泡或水珠以高速产品广告布光凝固定格。
  desc: ''
- title: 字体粗体、窄体、斜体，以白色为主，层叠成紧凑的广告文案块。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{主体}'
  desc: 如 a chilled peach soda can
- kv_var: 主体动作
  style_var: '{主体动作}'
  desc: 如 bursting through a frozen splash
- kv_var: 产品/道具
  style_var: '{道具}'
  desc: 如 peach slices, ice cubes
- kv_var: 场景地点
  style_var: '{场景}'
  desc: 如 a studio splash set
- kv_var: 背景元素
  style_var: '{背景元素}'
  desc: 如 giant white block letters, foam
- kv_var: 主文案
  style_var: '{主文案}'
  desc: 如 TASTE THE FIZZ
- kv_var: 产品品类
  style_var: '{品类}'
  desc: 如 气泡水 / 果汁 / 能量饮料
- kv_var: 产品形态
  style_var: '{形态}'
  desc: 如 易拉罐 / 玻璃瓶 / 利乐包
- kv_var: 配色
  style_var: '{配色}'
  desc: 主色 + 辅色，如 coral + cream shadow / mint + deep teal
- kv_var: 副文案
  style_var: '{副文案}'
  desc: 如 new flavor, limited drop
- kv_var: 点缀符号
  style_var: '{点缀符号}'
  desc: 如 a small splash glyph / circular badge
- kv_var: 服装造型
  style_var: '{造型}'
  desc: 如 model in white tee, casual street styling
prompt: |
  创作一张 16:9 的多色饮料飞溅广告系统风格的饮料上市广告，品类为{品类}，形态为{形态}。保留这些风格锚点：一套强烈的饮料品类配色系统；产品背后巨大的白色挤出式块状字母建筑；一个大的斜向虚构饮料包装在画面中央附近贴近裁切；前景横贯冻结的飞溅、泡沫、冰块、气泡、冷凝水或液片；粗体窄体斜体的白色层叠主标题排版；精致的影棚饮料布光与干脆的高光；密集的零售广告版式与强烈的产品层级；配送场景线索保持次要于主角饮料。配色系统：{配色}——一个主导场色，加上由它派生的阴影、侧平面、液体染色与包装点缀变化。替换所有源内容。不要使用 Sprite、Coca-Cola、照抄的韩文、照抄的 Z/E/R/O 版式、原版绿罐、现有饮料 logo、真实品牌名、水印、二维码、法律小字，或与源完全相同的标语。新内容：{主体}正在{主体动作}，带{道具}，位于{场景}。背景细节：{背景元素}。主标题文字：{主文案}。次级辅助文案：{副文案}。点缀符号：{点缀符号}。造型方向：{造型}。把构图适配到 16:9：9:16 应能用作竖版门店海报、冰箱贴或小红书封面；16:9 应能用作地铁灯箱、品牌上市 KV 或超市陈列背景板。使用照片级商业饮料修图、透明冻结的液体动势、油亮冰冷的表面、干脆的对比，以及清新动感的上市广告情绪。

