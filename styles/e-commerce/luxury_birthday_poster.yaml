prompt: |
  专业奢华生日海报，3:4 竖版构图，超高端影棚摄影美学。高级米白纹理纸墙背景，带细腻颗粒与纵深。

  一个巨大的数字{年龄}被精确地雕刻进墙面，厚度真实、边缘做斜切，深处的内阴影营造出强烈的 3D 纵深。数字内部：柔和的粉彩粉气球、优雅的白花，以及极简高级造型的奢牌花束。

  一个开心的{年龄}岁孩子，保留面部身份特征，身穿米白 T 恤与粉彩粉背带裤，自然地大笑。

  脸、肩、一只手与一只脚从雕刻的数字中伸出，形成真实的 3D 凸出效果。

  来自一侧的温暖电影感金色阳光，柔和轮廓光，超写实的皮肤纹理，影棚级布光，干净自然的阴影，照片级写实渲染。

  墙面文字：{名称} CHAPTER {年龄} {年龄} 365 MORE DAYS OF WONDER。

  极简奢华编辑版式，高端杂志封面风格，构图完美，对比柔和，色彩自然，不要畸变，不要 AI 瑕疵。
