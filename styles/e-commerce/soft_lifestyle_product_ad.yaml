# 清爽生活产品广告视觉

id: soft_lifestyle_product_ad
name: "清爽生活产品广告视觉"
category: e-commerce

tags:
  - 产品摄影
  - 日系生活
  - 柔光拍摄
  - 商品海报
  - 清新广告

triggers:
  - 清爽广告
  - 日系产品
  - 柔光美图
  - 生活感产品

features:
  - "**柔和近景主物** — 产品靠近镜头，占据画面主要视觉重量，表面保留材质细节（微绒、细孔、色斑或真实触感）"
  - "**明亮居家日光** — 侧后方漫入的高键柔光，阴影极浅、反差低、空气透明，背景退成柔和光斑"
  - "**纯白文字排版** — 大面积白色文字压在上半部和左侧空域，日系明朝感字形（圆润端点、略带手写温度），字距宽松"
  - "**轻巧手绘装饰** — 细白线手绘括号/气泡线，底部角落低饱和粉雾色圆形贴纸（手画白描圈+松散手写字）"
  - "**温暖自然色系** — 乳白/浅灰背景，主物承担鲜明但不刺眼的季节色，承托面温暖天然浅色，绿植少量清新点缀"

scene: "社交媒体产品海报、手作烘焙食帖、生活方式品牌主图"
ratio: "3:4"
summary: "把产品放在浅色自然承托面上，搭配素净居家日光的柔和背景、纯白文字排版与手绘小装饰，呈现清爽高质感的生活方式广告视觉"

prompt: |
  清爽生活方式广告视觉，围绕{产品}展开。主物近景，置于浅色天然肌理的手作承托面上，柔软饱满、边缘细腻，表面可感知材质细节（细绒毛、细孔、轻微色斑，或与主体相符的真实触感）。背景退入明亮干净的居家日光空间，浅景深把远处物体、布料纹样、绿植与窗光化为柔和光斑，只留下温和的季节氛围。信息层使用大面积纯白文字，压在上半部与左侧空域。主标题采用高对比、圆润端点、略带手写温度的明朝体字形，字距宽松，行高充裕；标题横向铺开，与主物形成偏心平衡。次级文字缩减为轻巧的手写体，在左侧留白处断成两行。顶部加入细白手绘括号或气泡线。底部角落放一枚低饱和粉彩或取自主题的柔和圆形贴纸，内为手绘白描圈与松散手写字。色彩跟随主题：背景高键、低饱和，干净的暖米白与浅灰；主物承担最鲜明但不刺眼的季节色{产品色}；承托面用温暖天然的浅色作为中间层；绿植或主题点缀只作极少量的清新亮点。整体光线：从侧后方漫入的高键柔光，阴影极浅，反差低，空气透明。避免生硬的商业影棚光、厚重的暗调、复杂的装饰。
  不要水印，不要真实Logo，不要电商广告感。
variables:
- kv_var: 产品
  style_var: '{产品}'
  desc: 主角产品是什么
- kv_var: 产品颜色
  style_var: '{产品色}'
  desc: 产品主色，如：蜜橘色
source_url: "https://x.com/xiaoxiaodong01/status/2078657941876703724?s=20"
source_author: "小小东"

