name: 青玉字形杂货拼贴海报风格
category: e-commerce
ratio: 9:16 或 16:9
source_author: '@VigoCreativeAI'
source_url: 'https://x.com/VigoCreativeAI'
summary: 稀疏的东亚杂货海报系统，由暖米白纸张 + 翡翠绿手写大字 + 浅色蔬菜剪影云 + 微编辑标题 + 一张光泽生鲜产品照组成。
tags:
- 生鲜
- 东方
- 杂货
- 拼贴
- 海报
- 翡翠绿
triggers:
- 翡翠图文
- 杂货拼贴
- 生鲜海报
- 东方风格
features:
- title: 暖米白纸张基底
  desc: 有细微纤维纹理和极轻折痕，像摊开的印刷品
- title: 超大翡翠绿手写文字
  desc: 笔画粗壮，转折带刻字硬边，边缘有剪纸的不规则
- title: 浅绿色蔬菜剪影作为水印
  desc: 低透明度铺在中层，像隔一层薄纸看到的轮廓
- title: 顶部栏目导航栏
  desc: 左侧期号、右侧品类标签，字号极小
- title: 收据/吊牌元素
  desc: 纸质发白，上面有细密的打印小字
- title: 拼音标注
  desc: 附着在手写大字附近，字号远小于主字
- title: 一张光泽生鲜产品照作为画面中心
  desc: 水汽、绒毛、叶脉清晰，切边不羽化
- title: 文字与产品照片叠加的层次感
  desc: 字压在照片上，照片压在剪影上
variables:
- kv_var: 产品
  style_var: '{产品}'
  desc: 如：一把青提 / 三颗水蜜桃 / 一束带露水的小葱
- kv_var: 主标题
  style_var: '{主标题}'
  desc: 如：青玉 / 当季鲜 / 晨露市集
- kv_var: 拼音
  style_var: '{拼音}'
  desc: 如：QING YU / DANG JI XIAN
- kv_var: 品类标签
  style_var: '{品类标签}'
  desc: 如：时令水果 / 叶菜类 / 清晨直采
- kv_var: 期号
  style_var: '{期号}'
  desc: 如：VOL.07 / 第 12 期 / NO.03
- kv_var: 点缀元素
  style_var: '{点缀元素}'
  desc: 如：一张小票 / 一枚价签吊牌 / 一段胶带
prompt: |
  9:16 竖版东亚杂货海报。底是一整张暖米白的纸张，带细微纤维纹理和极轻的折痕，四周留窄边，像拍一张摊开的印刷品。

  画面最大的元素是一组{主标题}，用超大的翡翠绿手写汉字排出，笔画粗壮、转折带刻字般的硬边，边缘有剪纸的轻微不规则，字与字挤在一起，允许被左右边缘裁掉一点。

  字的后面压着一层浅绿色的蔬菜剪影作为水印：{产品}的轮廓以低透明度铺在中层，像隔着一层薄纸看到的东西，不抢主标题。剪影旁边附一行极小的{拼音}，字号远小于主字。

  画面中心是{产品}的一张光泽生鲜产品照，水汽、绒毛、叶脉都清晰，照片边缘直接切边不做羽化，与手写大字叠在一起形成前后层次——字压在照片上，照片压在剪影上。

  版面上方是一条很细的栏目导航：左侧「{期号}」，右侧「{品类标签}」，字极小。底部或斜角贴一张{点缀元素}，纸质发白，上面有细密的打印小字。

  整体稀疏、克制、有编辑感，大量米白留白，无渐变，无光效。
id: jade_glyph_grocer_collage
code: ''
