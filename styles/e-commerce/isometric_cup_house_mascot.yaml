features:
  - title: 产品杯体直接长成建筑
    desc: 一只巨大的咖啡杯占据画面主体，白色杯盖当屋顶（带同心圆压纹与斜插吸管），深蓝圆柱杯身当楼体，开圆舷窗与拱形小门，杯身上印超大白色品牌图形与无衬线字标，产品比例被放大成可进入的空间
  - title: 等距轴测微缩地台
    desc: 约 30 度俯视的正等距视角，杯屋立在白色方形地台与绿色草地小岛上，所有结构按轴测平行线绘制，尺寸感靠小人、盆栽与楼梯建立，不用透视消失点
  - title: 红白条纹瞭望台与蓝色滑梯
    desc: 杯身右侧接一座红白条纹遮阳篷 + 白色栏杆的小瞭望台，下方蓝色阶梯落到地面；左侧另有一道蓝色滑梯从圆形窗口伸到地面，把建筑变成可游玩的乐园
  - title: 吉祥物在内外各处活动
    desc: 多个圆脸小熊吉祥物分散在屋顶、圆窗探头、滑梯口、阶梯、门口与地台边，动作各不相同，是画面里的尺度参照与叙事主角
  - title: 藤蔓盆栽与薄荷绿背景
    desc: 杯屋四周爬满四叶草状藤蔓、摆着小盆栽与绿草，配白色云朵、小花和柔和薄荷绿渐变背景，夏日清新
  - title: 明快平涂加均匀黑线稿
    desc: 2D 矢量扁平平涂，色块干净、所有轮廓用粗细均匀的清晰黑色线稿勾边，白/蓝/红/黄/绿高饱和明快配色，可爱治愈，不是 3D 渲染也不是写实摄影

scene: "饮品/零食品牌夏日 KV、吉祥物主题插画、门店活动主视觉、社媒治愈系插画、IP 联名游乐园概念图"
ratio: "3:4"
summary: "等距杯屋吉祥物乐园插画——2D 矢量平涂 + 均匀黑线稿，巨大咖啡杯变建筑（白杯盖屋顶、蓝杯身开圆窗小门），接红白条纹瞭望台与蓝色滑梯，圆脸小熊吉祥物在内外活动，四周藤蔓盆栽、薄荷绿背景，可爱治愈的夏日童趣。"

prompt: |
  创作一张 3:4 竖版的 2D 矢量扁平插画，等距轴测视角（约 30 度俯视，所有结构沿轴测平行线绘制，不出现透视消失点），平涂色块、粗细均匀的清晰黑色线稿勾边，可爱治愈的卡通风格，色彩明快，不要 3D 渲染、不要写实摄影、不要渐变立体光影。

  画面主体是一只被放大成建筑的巨大咖啡杯：白色杯盖当作屋顶，盖面有同心圆压纹与一道斜插出来的深蓝吸管；深蓝色圆柱杯身当作楼体，正面印一枚超大的白色抽象品牌图形（如舒展的分叉鹿角形）与一行白色无衬线字标「{杯身品牌文字}」；杯身开一个圆形舷窗、一扇拱形红边小门，门内可见浅色地面。整只杯子立在一块白色方形地台上，地台外是绿色草地小岛。

  建筑要有可游玩的游乐设施：杯身右侧接一座红白条纹遮阳篷的小瞭望台，配白色栏杆，下方一段蓝色阶梯斜落到地台；杯身左侧另有一道蓝色滑梯从圆形窗口一路伸到地面。左侧杯壁上用短杆挂一块木质小招牌，牌面是「{招牌图形}」的极简剪影。

  在建筑内外安排五到七个「{吉祥物}」：有的坐在白色屋顶边缘、有的从圆形舷窗探出头、有的刚从滑梯下来、有的在蓝色阶梯上、有的站在拱门门口、有的待在地台边或瞭望台栏边。它们体量远小于杯子，动作各不相同，是画面的尺度参照与叙事主角，表情简单可爱。

  环境：杯屋四周爬满四叶草状的绿色藤蔓，地台上摆几盆小盆栽、方形木箱绿植，草地上散落小花与短草笔触；背景是柔和的薄荷绿到浅绿渐变，上方飘两朵白色简笔云与几处小星光。配色以白、深蓝、红白条纹、明黄、草绿为主，干净通透、夏日童趣。

  除杯身字标、木牌图形与必要的极小装饰符号外，不加大标题、 slogan、版权行、水印或其他海报排版文字。所有元素保持在地台与画面安全区域内。

variables:
  - kv_var: 杯身品牌文字
    style_var: "{杯身品牌文字}"
    desc: "印在蓝色杯身正面的白色无衬线品牌字标，如：luckin coffee"
  - kv_var: 吉祥物
    style_var: "{吉祥物}"
    desc: "在杯屋里外活动的圆脸卡通角色，如：黄色圆形小熊"
  - kv_var: 招牌图形
    style_var: "{招牌图形}"
    desc: "左侧木质小招牌上的极简品牌剪影，如：鹿头与鹿角"

