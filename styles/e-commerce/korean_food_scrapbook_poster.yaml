features:
  - "**韩式手账拼贴风** — 复古手账、撕纸、胶带、便签、卡通涂鸦、箭头星星心形等装饰元素叠加"
  - "**暖咖啡厅色调** — 棕色、奶油色、橙色、绿色为主，细微彩色马克笔点缀"
  - "**中央大图占主体** — 食物居中放大，酥脆表皮、多汁肉质、闪光酱汁、新鲜配料等诱人细节丰富"
  - '**韩文标语装饰** — 4-6句韩式感叹标语（如"太绝了！""超好吃！"），菜单名和价格均以韩文呈现'
  - "**产品模板化处理** — {菜单名} {价格} 占位，可替换为任意韩式菜单和价格"

scene: "韩式餐饮品牌社媒海报、韩国外卖菜单、美食博主推荐帖"
ratio: "3:4"
summary: "可爱手账拼贴风韩式美食广告，暖棕色调搭配便签胶带装饰，韩文标语营造地道韩国美食氛围"

prompt: |
  创作一张可爱、时髦的手账风韩式美食广告海报，以{菜单名}为主角，价格{价格}以贴纸或撕纸标签的形式醒目地展示在旁边。若提供了参考照片，准确保留食物的形状、配料、颜色、摆盘与整体身份，同时强化光线、质感与真实感，让它看起来更诱人。若未提供照片，依据菜单名生成写实版本，不要添加不确定的配料。把食物大图放在中央，细节丰富诱人：酥脆的表皮、多汁的肉质、泛光的酱汁、新鲜的配料。采用温暖的咖啡厅美学与复古手账拼贴风格，包括撕纸、美纹胶带、便利贴、手绘涂鸦、箭头、星星、心形、闪光、棋盘格纹与可爱的食物贴纸。添加 4–6 句与菜品相配的韩式感叹标语。所有可见文字——包括菜单名、价格与装饰短语——必须只用韩文书写。使用暖棕、奶油、橙色与绿色调，配细微的彩色马克笔点缀，最终海报为 3:4 竖版画幅并保留安全边距，任何内容都不被裁切。
  不要水印，不要真实品牌Logo，不要电商广告感。
variables:
- kv_var: 菜单名
  style_var: '{菜单名}'
  desc: 如：泡菜炒饭 / 部队锅
- kv_var: 价格
  style_var: '{价格}'
  desc: 价格或优惠信息
