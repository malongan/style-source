prompt: |
  Create an ultra-premium 4-panel product poster for the {brand_name} {product_series} series, merging extreme product realism with stronger flavor-based visual differentiation, while reducing all supporting elements to an even purer minimum. Fully preserve the exact visual logic and elegant minimal layout of a luxury editorial campaign: a strict 2x2 grid, each panel featuring one real product presented in a clean, isolated, highly refined still-life composition. The final artwork must feel like a world-class premium campaign: hyper-realistic, pure, elegant, visually quiet, and extremely polished, with the products remaining the absolute heroes.

  Core structure:
  Use a strict 2x2 four-panel layout with equal panel proportions and perfect spacing. Each panel must function like its own luxury still-life poster while remaining part of one unified series. The overall composition must feel balanced, airy, minimal, and premium, with strong visual consistency across all four quadrants.

  Product system:
  Feature four products from the series, each one clearly different in flavor identity, color, styling mood, and visual personality while still belonging to the same elegant family. Suggested lineup:
  1. {flavor_1}
  2. {flavor_2}
  3. {flavor_3}
  4. {flavor_4}

  Each panel must show the real product in a beautifully styled presentation. The products must feel real, premium, and instantly desirable.

  Composition within each panel:
  In each quadrant, place one product centered or slightly off-center on a small elevated stone, plaster, or matte pedestal block. Reduce supporting elements to the bare minimum. Use at most one tiny accent per panel, such as a single garnish, one minimal herb accent, or one tiny ingredient trace. Some panels may have no extra accent at all if the composition feels stronger without it. The supporting elements must remain secondary and almost invisible in hierarchy. Each panel must feel pure, controlled, and editorial.

  4-panel color variation:
  Keep the overall system luxurious and unified, but introduce stronger panel-to-panel color variation so each product feels like its own quiet world. The background in each panel should remain soft and premium, but shift subtly in hue according to the product identity:
  - {flavor_1} panel: {bg_color_1}
  - {flavor_2} panel: {bg_color_2}
  - {flavor_3} panel: {bg_color_3}
  - {flavor_4} panel: {bg_color_4}

  The color shifts must stay sophisticated and restrained, not loud. The four panels should feel harmonized but clearly differentiated.

  Background:
  Use warm soft neutral backgrounds with gentle tonal variation across the four panels. The surfaces should feel smooth, clean, luminous, and premium, with no heavy texture or visual noise. Each panel's background should subtly echo its flavor family while preserving the overall calm luxury mood.

  Product styling:
  Each product must be styled with exceptional realism and refined individuality. The presentation must feel premium, sculptural, and beautifully proportioned. Products must show real physical believability, density, and subtle material detail.

  Typography and branding:
  Use minimal premium typography only. Include:
  {brand_name} {product_series}

  You may add one small refined line of supporting copy such as:
  "{tagline}"

  Typography must feel highly restrained, modern, and editorial. Do not overcrowd the layout. The text must remain secondary to the product.

  Lighting:
  Use extremely delicate, soft, high-end studio lighting. Let each product catch elegant highlights along edges and surface details. Shadows must be soft, short, and clean. The lighting must feel natural, quiet, and luxurious, with fine tonal falloff and no harsh glare.

  Material realism:
  Push realism to the highest level. Products must feel crisp, smooth, and premium. Add only a minimal amount of fine detail where appropriate. The image must feel pristine, not cluttered.

  Visual mood:
  The poster must communicate purity, refinement, stillness, and product confidence. It should feel like a luxury editorial shoot with strong series discipline, elegant restraint, and quiet visual impact. The four panels should feel more differentiated in mood while remaining unmistakably one family.

  Color direction:
  Use a controlled premium palette of ivory, cream, warm beige, pale stone, oat, caramel-beige, blush sand, soft peach, amber, and muted shadow taupe. The overall image must feel harmonious, elegant, soft, and quietly varied across the four panels.

  Rendering style:
  ultra-premium photorealistic product still-life poster, 4-panel luxury editorial layout, clean pedestal compositions, reduced supporting elements, subtle background color variation across panels, elegant typography, soft cinematic studio light, hyper-detailed product realism, minimalist premium brand aesthetics, 8k, masterpiece quality

  Negative prompt:
  cheap cafe poster, cluttered props, cartoon elements, low-detail product, messy garnish, oversaturated colors, noisy background, generic packaging ad, flat lighting, low-resolution textures, too much text, supermarket styling, watermark, logo clutter.

