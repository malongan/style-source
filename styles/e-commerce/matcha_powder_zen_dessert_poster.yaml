# 抹茶粉禅意甜品海报

id: matcha_powder_zen_dessert_poster
name: "抹茶粉禅意甜品海报"
category: e-commerce

tags:
  - 日式禅意
  - 抹茶绿
  - 粉末质地
  - 枯山水同心圆
  - 商业美食摄影
  - 竖排书法标题
  - 方形小印
  - 高脚圆盘

triggers:
  - 抹茶甜品海报
  - 禅意美食海报
  - 粉末背景产品图
  - 枯山水耙纹海报
  - 日式芝士蛋糕广告
  - 竖排书法甜品KV

features:
  - title: 满铺抹茶粉末与多处同心圆枯山水耙纹
    desc: 整个背景不是纯色或布面，而是厚厚铺满一层细腻的抹茶绿粉末，可见细密颗粒、轻微堆粉起伏与柔光下的微阴影；粉面上用耙子划出五到六组大小不一、错落分布的同心圆水波纹，沟槽有真实的深浅明暗，像枯山水沙庭，是全画面最独特的识别点
  - title: 俯视斜角下黑色高脚圆盘托起整只圆形蛋糕
    desc: 相机是约 45 度俯视斜角，能同时看见蛋糕顶面、侧面与盘面的椭圆透视；画面正中一只完整的圆形轻乳酪蛋糕放在黑色高脚圆盘（带明显底座的蛋糕托台）上，顶面有金黄烤色边缘、侧面是抹茶绿绒面质感，不切开、不叠放、不多品陈列
  - title: 顶面焦褐烙印与顶部白色品牌字上下呼应
    desc: 蛋糕顶面居中压着三行焦褐色烙印字，是像烘烤焦痕一样的深棕无衬线字；画幅最上方另有两行白色无衬线字，第一行较大、第二行更小且字距拉宽。两处使用同一个虚构品牌词，形成「顶部字标 → 产品烙印」的呼应关系
  - title: 竖排白色书法主标题与一枚方形小印
    desc: 顶部品牌字下方、蛋糕上方的绿底上，竖排一行四字白色中文书法，笔画带飞白与收笔、字距松而不散，是全画面唯一的中文大字；紧挨竖排字右侧贴一枚极小的方形线框印章，框内四个绿色小字排成二乘二，清晰可读
  - title: 底部中英文产品名与右下极小备注收口
    desc: 画幅底部左侧一行白色小字，中文品名加顿号再接全大写英文品名；右下角另有一行极小、存在感很低的备注小字，两端都不加框线、不加色块，直接落在抹茶粉上；右下角还斜放着一件竹制茶道具，局部出画并带柔和投影
  - title: 柔和自然光与高级清新的单色绿调
    desc: 全画面由不同明度的抹茶绿构成，只有白色文字、黑色高脚盘、蛋糕顶面的金黄烤色与焦褐烙印、竹道具的暖黄作点缀；柔和自然漫射光、浅景深但粉面颗粒与耙纹仍清楚，投影轻软，干净精致的日式商业广告质感

scene: "甜品与茶饮品牌新品主视觉、抹茶季限定海报、咖啡馆菜单与电商主图、日式伴手礼包装视觉、社媒美食图文封面"
ratio: "2:3"
summary: "厚铺抹茶绿粉末上划出五到六组同心圆枯山水耙纹，约 45 度俯视斜角下黑色高脚圆盘托起一整只圆形抹茶芝士蛋糕，顶面带三行焦褐品牌烙印；上方两行白色品牌字、中央竖排白色书法四字与方形小印、底部中英文品名和右下极小备注构成日式禅意信息层，右下斜放竹茶筅，高级清新的商业美食摄影。"

prompt: |
  创作一张 2:3 竖版的高级日式禅意甜品商业海报，柔和自然光、4K 超清、干净精致、高级清新的抹茶绿色调。不要纯色平涂背景、不要木桌或布面、不要多品陈列、不要手绘涂鸦小人、不要深色暗调、不要强烈硬阴影、不要水印与真实品牌 Logo。

  背景是厚厚铺满整个画幅的一层细腻抹茶绿粉末：可见细密粉质颗粒、轻微堆粉起伏与柔光下的微阴影，绝不能画成一块平滑的绿色色块。粉面上用耙子划出五到六组大小不一、错落分布的同心圆水波纹（枯山水沙庭的耙痕），沟槽有真实的深浅明暗；组与组之间留出足够的空粉面，不要铺满整幅，也不要排成规整网格。相机取约 45 度俯视斜角，能同时看到粉面纹理、器皿的椭圆透视和产品的顶面与侧面；浅景深只柔化最远处，粉面颗粒与耙纹仍要清楚。

  画面正中放【{甜品主体}】：一只完整、不切开的圆形蛋糕，顶面边缘带自然金黄烤色、侧面呈抹茶绿绒面与细腻气孔，整体质感真实诱人。它被放在一只黑色高脚圆盘（带明显底座的蛋糕托台）上，盘的黑色与绿底形成干净的强对比，盘下有一层轻软的接触阴影；不要出现第二个产品、切面、盘托以外的餐具或堆叠道具。蛋糕顶面居中压着三行焦褐色的烙印文字，像烘烤焦痕一样嵌在表面，写【{品牌字标}】的短词形式（第一行较小、后两行较大，居中堆叠），要和画幅最上方的白色品牌字是同一个词。

  文字层按上中下三段组织，全部使用白色，直接落在抹茶粉上，不加框、不加底色、不加引线。最上方居中排两行白色无衬线大写拉丁字【{品牌字标}】：第一行字号较大、字重中等，第二行明显更小且字距拉宽，行距紧凑。其下方的绿底上，竖排一行四字白色中文书法【{竖排主标题}】，笔画带飞白、粗细变化与自然收笔，字距松而不散，是全画面唯一的中文大字；紧挨竖排字右侧贴一枚极小的方形细线框印章，框内四字【{印章文字}】排成二乘二，绿色小字、清晰可读。画幅底部左侧放一行白色小字【{底部产品名}】，中文品名加顿号再接全大写英文品名，字号远小于竖排标题；右下角另放一行极小、存在感很低的备注【{右下角备注}】。

  右下角斜放一件【{搭配道具}】，竹丝或竹节的纹理清楚，局部可以出画，带一道柔和的自然投影；它只作主题线索与画面平衡，不抢主体。

  配色以不同明度的抹茶绿为绝对主导，白色文字、黑色高脚盘、蛋糕顶面金黄烤色与焦褐烙印、竹道具暖黄只作少量点缀。所有文字必须是合法、清晰、工整可读的中英文词句，禁止错拼、伪词、乱码、重影和随机汉字；不要真实品牌名、真实 Logo、日期、价格、编号、额外大标题或 slogan，也不要把粉面的留白填满。

variables:
  - kv_var: 甜品主体
    style_var: "{甜品主体}"
    desc: "居中单只完整圆形甜品，如：一整只抹茶轻乳酪蛋糕（顶面金黄烤边、侧面抹茶绿绒面）/ 一只抹茶戚风 / 一只圆形的焙茶芝士蛋糕，不要切开或多品"
  - kv_var: 品牌字标
    style_var: "{品牌字标}"
    desc: "虚构的拉丁字母品牌短词，同时用于顶部两行白字与蛋糕顶面三行焦褐烙印，如：MATCHA HILLS / AOYAMA CHEESE / MIDORI LAB；禁止使用真实品牌名"
  - kv_var: 竖排主标题
    style_var: "{竖排主标题}"
    desc: "画面中央竖排的白色中文书法四字，如：春日初摘 / 一抹新绿 / 茶烟初起"
  - kv_var: 印章文字
    style_var: "{印章文字}"
    desc: "方形小印里的四字短语，二乘二排布，如：三倍绿意 / 新茶上市 / 手作茶点；需合法可读"
  - kv_var: 底部产品名
    style_var: "{底部产品名}"
    desc: "底部左侧中英对照品名，中文加顿号接全大写英文，如：三倍抹茶芝士蛋糕、TRIPLE MATCHA CHEESECAKE；需合法可读"
  - kv_var: 右下角备注
    style_var: "{右下角备注}"
    desc: "右下角一行极小的辅助备注，短句合法可读，如：图片仅供参考 / 季节限定供应；禁止沿用源图里的乱码伪字"
  - kv_var: 搭配道具
    style_var: "{搭配道具}"
    desc: "右下角斜放的一件竹制或木质茶道具，如：一把竹制茶筅 / 一支竹茶勺 / 一把细竹刷，需局部出画"

