features:
- title: 等距俯视微缩场景
  desc: 约 30 度俯视的等距轴测视角，所有结构沿轴测平行线绘制、不出现透视消失点，栈道与摊位像可把玩的模型，尺寸感靠人物、桌凳与海鸥建立
- title: 罐头改造的店铺摊位
  desc: 两个巨大的蓝色罐头被改造成店铺——圆形罐头作圆形厨房摊位，方形罐头作方形市场，罐身印着招牌，剖面里塞进锅具、货架与满堆的海鲜
- title: 萌宠即市井主角
  desc: 橘猫白猫分布在每个摊位：戴厨师帽在锅里翻勺的厨师猫、柜台前挑选鱼获的顾客猫、木桶里抱着货箱的猫、桌上喝饮料聊天的猫
- title: 蓝白条纹遮阳篷与市集细节
  desc: 蓝白条纹篷布下的木柜台摆满鱼虾切片，配 A 字形黑板菜单、木桶、盆栽、遮阳路灯等市集道具，密度高但排布有序
- title: 海天与暖木的双色对撞
  desc: 奶油白网格地砖与浅蓝海水在画面上方对切，栈道是暖木色，橘猫的橙、海水的青蓝互为补色，色彩明快干净、线条清晰
- title: 治愈系生活叙事
  desc: 栈道外的海面上有猫坐绿色皮划艇钓鱼，海鸥掠过水面，食物与海藻漂浮，整体是轻松治愈的市井烟火气

scene: "食品品牌主视觉、门店活动海报、节日营销插画、社媒治愈系配图、IP 周边包装插画"

ratio: '2:3'
summary: "等距猫咪市井微缩插画——2D 扁平矢量平涂配均匀黑线稿，等距俯视的海边栈道市集，两个蓝色罐头改造成店铺摊位，橘猫白猫烹饪叫卖钓鱼，奶油白网格底与浅蓝海水、暖木栈道对撞，治愈系市井烟火气。"

prompt: |
  创作一张 2:3 竖版的等距轴测商业插画，约 30 度俯视，所有结构沿轴测平行线绘制，不出现透视消失点。日系可爱卡通、扁平矢量平涂，色块干净，轮廓用粗细均匀的清晰黑色线稿勾边，明快高饱和配色。不要 3D 渲染、不要写实摄影、不要渐变立体光影。

  画面主题是{场景主题}，主角是{主角动物}。

  画面结构：
  一条{环境元素}的木栈道从画面右上斜切到左下，木板纹理清晰，边缘立白色尖桩木栅栏。
  栈道上方并排两个巨大的蓝色罐头，被改造成店铺：
  左侧是圆形罐头，剖面做成圆形厨房摊位，罐身印一行白色招牌字「{招牌文字}」，里面{摊位造型}，一只戴白色厨师帽、系领结的猫在锅里翻勺，锅边摆着调料瓶、盘子和切好的蔬菜。
  右侧是方形罐头，剖面做成方形市场，罐身同样印「{招牌文字}」，里面满满当当摆着巨大的鱼获，一只猫在柜台前挑选、另一只猫在后面招呼客人。
  右侧另有一个露天摊位：蓝白条纹遮阳篷下是木质柜台，摆满鱼虾切片与水产，两只猫一买一卖，摊位旁立一块 A 字形木质黑板菜单。
  顶角挂一块橙色描边的木质招牌，写着「{招牌文字}」，旁边一丛棕榈叶。

  猫咪是画面的主角与尺度参照：除了摊位里的猫，还有猫坐在栈道木桌旁喝带吸管的饮料聊天、有猫从木桶里探出头抱着货箱、有猫在栏杆边张望。

  水域：
  栈道外是清澈的浅蓝海水，水面有白色浪线与鱼群，{主角动物}坐在绿色皮划艇里拿着钓竿钓鱼，桨搭在船沿；白色海鸥在水面上飞过；水里与岸边散落贝壳、番茄、蔬菜与海藻。

  背景与配色：
  画面上方是奶油白斜向网格地砖，与浅蓝海水在一条斜线上衔接。{背景底色}
  {主色调}，整体色彩明快、干净、治愈。

  文字只保留「{招牌文字}」这类极短招牌字，其余位置不要加标题、slogan、版权行、水印，也不要出现乱码伪字。

  避免：真实品牌 Logo、水印、乱码文字、写实毛发、复杂写实阴影、三维渲染感。
  
variables:
- kv_var: 场景主题
  style_var: '{场景主题}'
  desc: 市集主题，如：海边海鲜市场、猫咪面包房、码头杂货铺
- kv_var: 主角动物
  style_var: '{主角动物}'
  desc: 主角萌宠，如：橘猫与白猫、柴犬、垂耳兔
- kv_var: 摊位造型
  style_var: '{摊位造型}'
  desc: 罐头摊位内部陈设，如：铁锅灶台、调料瓶与切好的蔬菜
- kv_var: 环境元素
  style_var: '{环境元素}'
  desc: 承载场景的结构，如：海边的木栈道与白色尖桩栅栏
- kv_var: 背景底色
  style_var: '{背景底色}'
  desc: 背景底色，如：奶油白网格地砖配浅蓝海水、淡黄木纹地板
- kv_var: 主色调
  style_var: '{主色调}'
  desc: 整体配色，如：海蓝与暖木色对比、青绿与奶白
- kv_var: 招牌文字
  style_var: '{招牌文字}'
  desc: 摊位与招牌上的极短文字，如：海鲜、渔市、猫市

