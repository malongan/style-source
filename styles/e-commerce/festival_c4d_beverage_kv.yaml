# 节日C4D卡通饮品电商KV

id: festival_c4d_beverage_kv
name: "节日C4D卡通饮品电商KV"
category: e-commerce

tags:
- 电商活动KV
- C4D卡通3D
- 节日营销
- IP吉祥物主角
- 立体大标题
- 卖点图标栏

triggers:
- 节日电商KV
- C4D卡通饮品海报
- 吉祥物主视觉海报
- 立体字大标题KV
- 卖点图标电商海报
- 节日营销主视觉

features:
- title: 立体白字大标题压顶
  desc: 顶部两行超大 3D 立体标题，白色圆润粗体字带蓝色厚挤出与投影，像充气字块压在天空上，是全画面的第一视觉
- title: 飘带标签承接副信息
  desc: 标题正下方一条绿色 3D 卷曲飘带，飘带上排一行白色小字（品类 + 酒精度一类的产品副标），飘带两端自然翻卷
- title: 卡通IP吉祥物当主角
  desc: 画面中央是一只圆润哑光的卡通吉祥物，一手把易拉罐高举过肩、一手握拳欢呼，身体半没入水面，表情自信俏皮
- title: 写实产品罐与水果主图
  desc: 被举起的细长易拉罐是粉到绿的渐变罐身，罐面印品牌名、品名与一颗写实水果，表面布满冷凝水珠，与哑光吉祥物形成材质反差
- title: 节日符号环绕铺满
  desc: 两侧是竞渡的龙舟（龙头鳞片分明、舟上小人划桨、舟里放大粽子）、悬挂的金色吊牌与锯齿边古风旗帜，空中飘冰块、水花与叶片
- title: 底部卖点图标栏加搜索框
  desc: 下方一排四个白色描边圆形图标，每个图标下两行白色小字卖点，图标之间用细竖线分隔；最底部一枚白色圆角长条搜索框，左端方形平台标识、右端放大镜

scene: "节日营销电商主视觉、饮品与零食活动 KV、外卖平台合作海报、社媒开屏与详情页头图"

ratio: '2:3'
summary: "节日C4D卡通饮品电商KV——顶部两行白色立体大标题与绿色飘带标签，中央哑光卡通IP吉祥物高举渐变易拉罐、半没入飞溅水面，两侧龙舟吊牌旗帜环绕，底部四枚卖点图标栏加平台搜索框，明亮蓝调节日氛围。"

prompt: |
  创作一张 2:3 竖版电商活动 KV，C4D 卡通 3D 渲染，{节日主题}主题，整体明亮鲜活、节日氛围感强。

  顶部版式：
  画面顶部是两行超大 3D 立体主标题「{主标题}」：白色圆润粗体字，带与主色同系的厚挤出边和柔和投影，像充气字块压在天空上，字面有细腻高光。
  标题正下方一条{飘带颜色}的 3D 卷曲飘带，飘带上排一行白色小字「{飘带标签}」，飘带两端自然翻卷并有厚度。

  中央主角：
  画面正中是{吉祥物IP}，圆润哑光的软胶质感，表面柔和高光，表情自信俏皮；
  它一只手把产品高举过肩，另一只手握拳上举作欢呼状，身体下半部没入水面。
  被举起的是{产品名}：细长易拉罐，罐身做上浅下深的双色渐变，罐面依次排布{品牌名}的品牌字标、品名与一颗写实水果主图，罐体表面布满冷凝水珠，与哑光吉祥物形成材质反差。

  背景与环绕元素：
  天空是明亮的清新蓝调，大片蓬松白云；
  主体两侧安排{背景场景}：竞渡的龙舟（龙头鳞片分明、舟上小人划桨、船里放着放大粽子）、悬挂的金色节日吊牌与锯齿边古风旗帜；
  空中与水面飘散冰块、水花与叶片，主体四周水花飞溅，水面有波纹与倒影。

  底部版式：
  下方一排四个白色描边圆形图标，图标内是极简的白色线面符号；
  每个图标正下方排两行白色小字，四组卖点依次为：{卖点清单}；
  相邻图标组之间用一条极细的白色竖线分隔。
  最底部居中一枚白色圆角长条搜索框：左端是方形平台标识「{平台搜索条}」，框内是深灰提示文字，右端一个放大镜图标。

  整体：
  色彩明亮饱和、蓝白为主加点缀色，C4D 卡通渲染、材质干净、光影柔和，构图上重下轻但视觉平衡，节日氛围浓厚。

  避免：真实品牌 Logo、真实平台标识、乱码伪字、水印、暗色调、写实摄影、多余人物肢体、模糊边缘。

variables:
- kv_var: 节日主题
  style_var: '{节日主题}'
  desc: 活动主题，如：端午节、中秋节、夏日冰饮季
- kv_var: 主标题
  style_var: '{主标题}'
  desc: 顶部两行立体大字，如：端午喝气泡酒，清爽更对味
- kv_var: 飘带标签
  style_var: '{飘带标签}'
  desc: 飘带上的品类副标，如：清爽气泡鸡尾酒 5%vol
- kv_var: 飘带颜色
  style_var: '{飘带颜色}'
  desc: 飘带主色，如：草绿、橙红、湖蓝
- kv_var: 吉祥物IP
  style_var: '{吉祥物IP}'
  desc: 中央主角形象，如：蓝色河马卡通、圆胖橘猫、小白鹿
- kv_var: 品牌名
  style_var: '{品牌名}'
  desc: 罐面与标识里的虚构品牌名，如：清野、气泡山
- kv_var: 产品名
  style_var: '{产品名}'
  desc: 被举起的产品，如：清爽白桃味易拉罐、青柠气泡罐
- kv_var: 背景场景
  style_var: '{背景场景}'
  desc: 环绕的节日场景元素，如：龙舟竞渡、粽子、古风旗帜、粽叶与水花
- kv_var: 卖点清单
  style_var: '{卖点清单}'
  desc: 底部四组卖点，用顿号分隔，如：真果汁微醺清爽、5%vol轻松微醺、气泡加持畅爽带感、多种口味随心选择
- kv_var: 平台搜索条
  style_var: '{平台搜索条}'
  desc: 底部搜索框左端的方形标识文字，用虚构平台名，如：闪送外卖、同城快送

