prompt: |
  Create a premium beverage (wine/liqueur/spirits) product poster with a systematic series design approach. The key principle: lock the entire visual framework — keep camera distance, bottle scale, centered placement, packaging architecture, typography rhythm, and shadow logic completely consistent — while only changing flavor identity elements.

  Core composition requirements:
  - Bottle centered in frame, consistent scale across series
  - Thin controlled liquid arc gracefully enhancng the bottle silhouette
  - Minimal garnish composition unique to each flavor (fruit, herb, or spice element)
  - Shared packaging structure with distinct flavor atmosphere via liquid color and background

  For [FLAVOR_NAME] variant:
  - Background: [COLOR1] with [MOOD/ATMOSPHERE] atmosphere
  - Liquid color: [LIQUID_COLOR] (wine red / amber gold / pale green / deep purple)
  - Garnish: [GARNISH_ELEMENT] (citrus slice / herb sprig / berry / spice)
  - Accent elements: [ACCENT_DESCRIPTION]

  Typography: elegant serif or modern sans for brand name, refined layout with generous negative space.
  Lighting: soft product lighting with subtle rim highlights on bottle, rich dimensional separation.
  Style: premium beverage advertising, consistent series design system, minimalist composition.

  Series consistency rules (apply to ALL variants):
  - Same camera height and angle
  - Same bottle size relative to frame
  - Same typography scale and placement
  - Same shadow direction and intensity
  - Same background texture/finish style
  - Only liquid color, background hue, and garnish change between variants
  不要水印，不要真实Logo，不要电商广告感。

