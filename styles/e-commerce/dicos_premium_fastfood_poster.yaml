prompt: |
  Create an ultra-premium 2x2 four-panel fast-food campaign poster for Dicos, transforming playful fast-food poster energy into a highly refined, product-dominant, design-annual-level commercial visual system. The final artwork must feel bold, youthful, appetizing, modern, and sharply art-directed, while keeping the food as the absolute hero. Use four square panels arranged in a strict grid, each panel featuring one different classic Dicos fast-food item, one much larger expressive Chinese main title, one smaller English subtitle, restrained supporting English copy, minimal official Dicos branding, and only a very small number of clean playful hand-drawn doodles.

  Core composition:
  Use a strict 2x2 grid. Each panel must preserve the same campaign rhythm:
  1. one hero fast-food item dominating the right or center-right area,
  2. one very large artistic Chinese hand-lettered title occupying the left or upper-left area,
  3. one smaller English subtitle beneath or near the Chinese title,
  4. one short supporting English copy block,
  5. one refined Dicos logo or clean brand mark,
  6. only a few minimal doodle accents integrated around the typography,
  7. a clean foreground surface with a tiny number of crumbs, sauce accents, or ingredient echoes.

  Creative direction:
  Combine Milk Cloud Orbit and Cream Halo Transit. Keep the exact four-panel skeleton, but intensify the strongest product-light details: cleaner fried-surface highlights, purer sauce reflections, brighter salt-crystal sparkle, more precise gloss on buns and wraps, and richer appetizing realism. At the same time, reduce the doodles so they become tighter, cleaner, and more intentional, and enlarge the Chinese titles so the graphic impact becomes stronger without stealing attention from the food.

  Panel color worlds:
  Panel 1: warm cream and toasted orange (crispy chicken burger — "大口满足")
  Panel 2: deep charcoal-black and golden yellow (golden seasoned fries — "金黄上瘾")
  Panel 3: rich chili red and amber brown (spicy fried chicken — "热辣开炸")
  Panel 4: fresh olive green and soft beige (grilled chicken wrap — "卷进美味")

  Food realism:
  Render every item with extreme realism: crispy fried coating, golden crumb texture, juicy chicken fibers, glossy burger bun, fresh lettuce moisture, melted sauce sheen, realistic potato texture, salt crystals, pepper specks, tortilla surface detail, char marks, subtle steam, and appetizing oil highlights.

  Typography:
  Bold expressive Chinese hand-lettered main titles paired with smaller clean English subtitles. Chinese titles noticeably larger with stronger visual authority.

  不要水印，不要真实Logo（品牌名用 Dicos 示意），不要电商广告感。

