features:
  - "**2x2 四格海报系统** — 四格严格网格排列，每个面板节奏统一：食品为主 + 大字中文标题 + 英文副标题"
  - "**超写实食品摄影** — 酥脆表皮、盐晶闪光、酱汁光泽、面包柔光、土豆质感、辣椒碎、蒸气细节"
  - "**高端商业布光** — 柔和高调商业食品打光，炸物高光纯净、酱汁反射细润、色泽诱人"
  - "**克制涂鸦点缀** — 少量精致手绘涂鸦（星星、酱汁漩涡、动感弧线）围绕排版，不抢食品主角"
  - "**四组色彩世界** — 每格一套独立色彩身份，四格并置形成节奏"

scene: "快餐品牌 KV、食品海报设计、菜单视觉、广告campaign、商业摄影"
ratio: "1:1"
summary: "2x2 四格高端快餐海报，超写实食品摄影 + 设计年鉴级商业视觉，每格节奏统一、色彩各异。"

variables:
  - kv_var: 品牌名
    style_var: "{品牌名}"
    desc: 如：Dicos / 华莱士 / BURGER LAB
  - kv_var: 菜品组合
    style_var: "{菜品组合}"
    desc: 如：香辣鸡腿堡 / 金黄薯条 / 炸鸡桶 / 鸡肉卷（四款，按格顺序）
  - kv_var: 标题组合
    style_var: "{标题组合}"
    desc: 如：大口满足 / 金黄上瘾 / 热辣开炸 / 卷进美味（四条，与菜品一一对应）
  - kv_var: 配色组
    style_var: "{配色组}"
    desc: 如：暖奶油橙 / 炭黑金 / 辣椒红琥珀 / 橄榄绿米色（四组，按格顺序）

prompt: |
  1:1 高端快餐 campaign 海报，2x2 四格。把快餐海报的活泼能量提升到设计年鉴级的商业视觉系统：大胆、年轻、诱人、现代、美术指导精确，食物永远是绝对主角。

  品牌：{品牌名}只以极小的标志或干净的品牌标记出现，绝不抢食物。

  四格骨架：严格 2x2 网格，四格节奏完全统一——
  1. 一款主推食品占据右侧或中右区域；
  2. 左侧或左上是一组超大的艺术化中文手写标题；
  3. 中文标题下方或附近一行较小的英文副标题；
  4. 一小块克制的英文辅助文案；
  5. 一枚精致的品牌标记；
  6. 只有少量极简涂鸦点缀在排版周围；
  7. 干净的前景台面上散落几粒碎屑、酱汁点或食材呼应。

  四格内容：按格顺序依次是{菜品组合}，主标题对应{标题组合}，每格一套配色，依次为{配色组}。

  食品真实感：每一款都要极致真实——酥脆的裹粉、金黄的颗粒质感、多汁的肉质纤维、油润的面包、生菜的湿润、融化酱汁的光泽、真实的土豆纹理、盐晶与胡椒碎、饼皮表面细节、焦痕、细微蒸气、诱人的油光。

  排版：粗壮有表现力的中文手写主标题，配较小克制的英文副标题。中文标题字号明显更大，视觉权重更强，但不压过食物。

  不要水印，不要真实Logo（品牌名仅作示意），不要电商广告感。

