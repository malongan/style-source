name: 品牌微缩建筑海报风格
category: e-commerce
ratio: 2:3 竖版
source_author: '@PixuryAI'
source_url: 'https://x.com/PixuryAI'
summary: 把品牌产品包装放大成可运作的建筑空间，结合真实城市环境 + 微缩人物 = 超写实品牌微缩建筑摄影海报。
tags:
- 品牌
- 微缩建筑
- 海报
- 超写实
- 产品摄影
triggers:
- 品牌微缩建筑
- 微缩海报
- 产品建筑化
- 建筑摄影
features:
- title: '**概念**：品牌包装 = 建筑主体，产品成为可运作的空间'
  desc: ''
- title: '**比例**：2:3 竖版超写实微缩建筑摄影'
  desc: ''
- title: '**建筑逻辑**：入口、玻璃橱窗、室内功能区、露台、屋顶结构'
  desc: ''
- title: '**环境融合**：真实城市空间（街道、路灯、人行道、绿化等）'
  desc: ''
- title: '**人物叙事**：真实比例微缩人物，自然动作（排队、工作、取餐等）'
  desc: ''
- title: '**构图**：四分之三视角 + 轻微高角度，顶部留白给标题'
  desc: ''
- title: '**光影**：根据品牌色调设定，成熟精致写实'
  desc: ''
- title: '**排版**：左上区域白色简洁文字，无衬线字体'
  desc: ''
variables:
- kv_var: 主标题
  style_var: '{主标题}'
  desc: 品牌名称/主标题
- kv_var: 英文副标题
  style_var: '{英文副标题}'
  desc: 如：BREWED SLOWLY
- kv_var: 产品包装
  style_var: '{产品包装}'
  desc: 如：一只咖啡袋 / 一盒茶罐
- kv_var: 建筑场景
  style_var: '{建筑场景}'
  desc: 如：街角咖啡馆 / 车站亭
- kv_var: 风格关键词
  style_var: '{风格关键词}'
  desc: 英文风格词，如：minimal, premium, warm
prompt: |
  请生成一张 2:3 竖版超写实微缩建筑摄影海报。

  【信息】
  品牌名称（主标题）：{主标题}
  建筑场景（建筑功能）：{建筑场景}
  英文副标题：{英文副标题}

  画面主体是一个被放大的「{产品包装}」，它被设计成一座功能完整的「{建筑场景}」，与真实城市环境无缝融合。保持微缩模型的精确比例与超写实摄影质感。

  包装必须保留品牌识别特征：主色调、包装轮廓、Logo 位置、材质细节、真实结构。包装逻辑转换为建筑空间：入口、玻璃橱窗、室内功能区、露台、地板、屋顶结构。

  融入真实城市环境，包含街道拐角、人行道、斑马线、路灯、交通流、路边绿化等丰富细节。

  融入真实比例微缩人物，自然动作，包含顾客排队、店员工作、骑手取餐等场景。细节真实，避免玩偶感。

  2:3 竖版构图，主建筑置于画面中下，顶部留白，四分之三视角 + 轻微高角度，背景浅景深柔焦。

  【光影、阴影与材质】
  根据品牌色调设定光影，整体风格成熟精致写实。

  左上区域添加现代简洁的白色文字，无衬线字体，排版考究。

  {风格关键词}

  超写实微缩建筑摄影：真实的品牌空间，2:3 商业海报，建筑即巨型产品包装，与真实城市环境融合，微距摄影，建筑模型摄影。

  不要水印，不要电商广告感，不要乱码。
id: brand_miniature_architecture
code: ''
