prompt: |
  创作一张精品咖啡馆广告海报，以{产品名}为主角。构图应遵循干净、极简的编辑风格，配温暖的自然日光、柔和的植物投影、优雅的字体与精致的高级美学。

  把一杯造型精美的饮品放在画面中央，装在透明玻璃杯中，具备真实的材质、反射、冷凝水珠，以及与饮品相配的装饰细节。

  场景应包含木质桌面、细微的装饰元素、虚化的绿植与柔和的米色背景，营造温暖而诱人的氛围。

  文字按以下结构排布：

  上部：
  • 「NEW MENU」主标题
  • {副标题}

  中部：
  • {产品名}
  • {描述}

  下部：
  • {价格}

  风格要求：
  • 编辑式美食摄影
  • 柔和自然光
  • 电影感构图
  • 奢华咖啡馆品牌感
  • 优雅衬线字体
  • 真实的阴影与高光
  • 极简版式
  • 高细节产品摄影

  画幅：4:5。

  不要水印，不要真实Logo，不要电商广告感。
