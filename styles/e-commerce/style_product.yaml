name: 电光蓝剪影产品上市风格
category: e-commerce
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 疏朗的高端消费科技上市海报风格：由黑色负空间、居中的产品剪影、电光蓝轮廓光、发光水平平台、柔和倒影、巨大的裁切蓝色背景字体，以及干净的白色发布文案构成。
tags:
- VigoCookbook
