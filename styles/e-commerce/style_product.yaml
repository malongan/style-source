name: 电光蓝剪影产品上市风格
category: e-commerce
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 疏朗的高端消费科技上市海报风格：由黑色负空间、居中的产品剪影、电光蓝轮廓光、发光水平平台、柔和倒影、巨大的裁切蓝色背景字体，以及干净的白色发布文案构成。
tags:
- VigoCookbook
- minimal
- dark
- consumer-electronics
- launch
- silhouette
- product
- teaser
- premium
- announcement
triggers:
- Electric Blue Silhouette Product Launch Style
features:
- title: 近乎纯黑的上部区域，留出大片空白。
  desc: ''
- title: 单个主视觉产品居中于垂直轴，或略低于中心。
  desc: ''
- title: 产品主体保持大面积黑色，通过电光蓝轮廓光与一处细小的白色状态高光得以辨识。
  desc: ''
- title: 鲜明的水平电光蓝平台或地平线，分隔主体台面与前景。
  desc: ''
- title: 蓝色辉光铺延在地面，产品正下方带柔和倒影或阴影。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{SUBJECT}'
  desc: 主推产品，如：一副无线耳机
- kv_var: 主体动作
  style_var: '{SUBJECT_ACTION}'
  desc: 产品的呈现姿态，如：悬浮 / 斜置 45 度
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
  desc: 配件或第二件产品，如：充电盒
- kv_var: 场景地点
  style_var: '{LOCATION}'
  desc: 陈列空间，如：发光平台 / 纯黑空间
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
  desc: 补充画面层次，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{MAIN_TEXT}'
  desc: 巨大的裁切蓝色背景字，如：SONIC
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
  desc: 白色发布文案，如：AVAILABLE 11.02
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
  desc: 如：轮廓光线 / 细线框
- kv_var: 服装造型
  style_var: '{WARDROBE_STYLE}'
  desc: 产品表面质感，如：磨砂金属 / 亮面塑料
prompt: 'Create a 16:9 premium dark consumer-tech launch poster in an electric-blue silhouette style. Feature {SUBJECT} {SUBJECT_ACTION}, with {PRODUCT_OR_PROP} staged in {LOCATION}. Add {BACKGROUND_ELEMENTS}.
  Preserve these style anchors: the core visual anchors of this style. Avoid this source content: watermarks, real logos, and commercial advertising. Composition: one centered brandless product silhouette, large black negative space, a glowing
  electric-blue horizontal platform, blue floor reflection beneath the object, giant cropped blue geometric sans-serif background typography reading "{MAIN_TEXT}" behind the product, clean white lower launch
  copy using "{SECONDARY_TEXT}", and a tiny minimal accent mark or status light "{ACCENT_SYMBOL}". Lighting: low-key black stage, cyan-blue rim light, glossy edge highlights, soft bloom, haze, deep shadows,
  no warm accents. Typography: sparse, premium, clean geometric sans-serif, no real logos. Wardrobe or human styling if present: {WARDROBE_STYLE}. Keep the layout minimal, symmetrical, cinematic, and teaser-like
  rather than dense or feature-heavy.'
id: style_product
code: ''
