name: 电光蓝剪影产品上市风格
category: e-commerce
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 疏朗的高端消费科技上市海报风格：由黑色负空间、居中的产品剪影、电光蓝轮廓光、发光水平平台、柔和倒影、巨大的裁切蓝色背景字体，以及干净的白色发布文案构成。
tags:
- VigoCookbook
- minimal
- dark
- consumer-electronics
- launch
- silhouette
- product
- teaser
- premium
- announcement
triggers:
- Electric Blue Silhouette Product Launch Style
features:
- title: 近乎纯黑的上部区域，留出大片空白。
  desc: ''
- title: 单个主视觉产品居中于垂直轴，或略低于中心。
  desc: ''
- title: 产品主体保持大面积黑色，通过电光蓝轮廓光与一处细小的白色状态高光得以辨识。
  desc: ''
- title: 鲜明的水平电光蓝平台或地平线，分隔主体台面与前景。
  desc: ''
- title: 蓝色辉光铺延在地面，产品正下方带柔和倒影或阴影。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{主体}'
  desc: 主推产品，如：一副无线耳机
- kv_var: 主体动作
  style_var: '{动作}'
  desc: 产品的呈现姿态，如：悬浮 / 斜置 45 度
- kv_var: 产品/道具
  style_var: '{道具}'
  desc: 配件或第二件产品，如：充电盒
- kv_var: 场景地点
  style_var: '{场景}'
  desc: 陈列空间，如：发光平台 / 纯黑空间
- kv_var: 背景元素
  style_var: '{背景元素}'
  desc: 补充画面层次，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{主文案}'
  desc: 巨大的裁切蓝色背景字，如：SONIC
- kv_var: 副文案
  style_var: '{副文案}'
  desc: 白色发布文案，如：AVAILABLE 11.02
- kv_var: 点缀符号
  style_var: '{点缀符号}'
  desc: 如：轮廓光线 / 细线框
- kv_var: 服装造型
  style_var: '{造型}'
  desc: 产品表面质感，如：磨砂金属 / 亮面塑料
prompt: |
  创作一张 16:9 的高级深色消费科技上市海报，采用电光蓝剪影风格。以{主体}{动作}为主角，把{道具}布置在{场景}中。加入{背景元素}。保留这些风格锚点：该风格的核心视觉锚点。避免这些源内容：水印、真实 Logo 与商业广告。构图：单个居中的无品牌产品剪影，大面积黑色负空间，一道发光的电光蓝水平平台，物件下方有蓝色地面倒影，产品身后是读作「{主文案}」的巨大裁切蓝色几何无衬线背景字体，下部是使用「{副文案}」的干净白色发布文案，以及一枚极小的极简点缀标记或状态灯「{点缀符号}」。布光：低调黑色舞台、青蓝轮廓光、光亮边缘高光、柔和泛光、薄雾、深阴影，不要暖色点缀。字体：稀疏、高级、干净的几何无衬线，不要真实 Logo。若出现人物或其造型：{造型}。版面保持极简、对称、电影感、预告片气质，而不是密集堆砌功能。

id: style_product
code: ''
