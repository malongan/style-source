# 绿手写标题烘焙新品海报

id: green_handletter_bakery_poster
name: "绿手写标题烘焙新品海报"
category: e-commerce

tags:
  - 烘焙新品
  - 季节草本
  - 绿色手写标题
  - 浅米色纯底
  - 写实美食摄影
  - 中英文品名标签
  - ins简约清新

triggers:
  - 艾草面包海报
  - 季节烘焙上新
  - 绿色手写大标题
  - 三品三角陈列
  - 春日面包新品KV
  - 草本烘焙海报

features:
  - title: 浅米／奶油绿纯色底与极简留白
    desc: 整张是干净的低饱和浅米色偏奶油绿纯色背景，无纸纹、无渐变、无木桌或台面、无环境道具，柔和自然漫射光配极浅的接触阴影；四周留出大量呼吸空间，是 ins 简约清新的商业烘焙底子
  - title: 超大绿色手写中文四字标题压住上三分之一
    desc: 标题在上方水平居中，四个超大号草绿／橄榄绿手写汉字横排几乎贯穿全幅，笔画粗细变化明显、带连笔、飞白与随性的收笔延展，像马克笔或软头笔书写，清晰可读但绝不是印刷黑体或毛笔书法；它是全画面第一视觉，字号远大于其余所有文字
  - title: 三款产品三角错位陈列并露出切面
    desc: 中下部摆三款同系列的浅绿色烘焙产品，呈上、右、左下的三角错位关系，彼此略有遮挡但各自轮廓完整可辨；其中至少一款被切开，露出绿色馅料、芝士或红豆麻薯的层次，表皮气孔、撒料与酥皮碎屑等真实面包肌理清晰，是高清写实美食摄影而非 3D 或插画
  - title: 两枝新鲜草本从产品间隙斜向伸出
    desc: 一两枝与主题同源的新鲜叶材（如艾草、迷迭香）分别从产品组的中上部与中下部斜向探出，叶缘锯齿与叶脉清楚，颜色比标题略灰、略低饱和，只作季节线索与呼吸感，不铺满、不做花环或背景纹样
  - title: 每款旁一组极小号中英文品名，直接印在留白上
    desc: 三款产品各自紧邻一组深色极小字：一行中文品名配一到两行英文品名，字号远小于标题、位置随产品错落；是直接落在留白上的编辑式标注，不是贴纸、标签框、价格牌或涂鸦箭头，不加引线、不加图标
  - title: 底部居中一行绿色品牌字标收口
    desc: 底部居中放一枚绿色的虚构品牌字标，细圆体或细衬线的拉丁字母，字号是全场第二层级，四周留大留白；它承担品牌落款与画面平衡，但不用真实 Logo、不做印章、不叠色块

scene: "季节限定烘焙新品主视觉、面包店上新海报、咖啡与轻食品牌KV、商超季节商品广宣、社媒美食图文封面"
ratio: "2:3"
summary: "浅米／奶油绿纯色底上，一枚超大绿色手写中文四字标题横贯上方，中下部三款同系列浅绿烘焙产品三角错位陈列、其中一款切开露出馅料，两枝新鲜草本从间隙斜出，每款旁配极小的中英文品名标注，底部居中一行绿色虚构品牌字标收口；柔和自然光、高清写实面包肌理、ins 简约清新的季节上新气质。"

prompt: |
  创作一张 2:3 竖版的季节烘焙新品商业海报，ins 简约清新、干净柔和、明亮通透，浅绿暖调；不要插画、不要 3D 渲染、不要手绘涂鸦小人、不要木桌或影棚台面、不要 2×2 网格、不要强烈阴影与暗沉色调。

  背景是低饱和的浅米色偏奶油绿纯色，无纸纹、无渐变、无环境道具。使用柔和自然漫射光，产品只留极浅的接触阴影，画面四周保留大面积呼吸留白。

  顶部左、中、右三栏排一行极细的绿色无衬线小字「{顶部信息}」，字距宽松、只作季节与上新提示。其下方水平居中放超大号手写中文标题「{主标题}」：四个草绿／橄榄绿汉字横排几乎贯穿全幅，笔画粗细变化明显、带连笔、飞白与随性的收笔延展，像软头笔一气写成，清晰可读；它是全场第一视觉，字号远大于其他所有文字。不要印刷黑体、不要毛笔书法、不要竖排。

  画面中下部摆「{产品组合}」：三款同一系列的浅绿色烘焙产品呈上、右、左下三角错位陈列，彼此略有遮挡但各自轮廓完整可辨，其中至少一款切开露出内馅层次。用高清写实美食摄影表现表皮气孔、酥皮碎屑、撒料与馅料断面，细节清晰、色泽自然诱人；不要盘子、不要悬浮、不要整齐网格。

  从产品间隙斜向伸出一两枝「{点缀枝叶}」，一上一下呼应，叶缘与叶脉清楚，颜色比标题略灰、略低饱和，只作季节线索，不铺满画面。

  每款产品旁紧邻一组极小号深色文字「{品名标签}」：一行中文品名配一到两行英文品名，直接印在留白上，位置随产品错落，字号远小于标题；不加贴纸、标签框、引线、图标、价格牌或涂鸦箭头。底部居中放一行绿色品牌字标「{品牌标识}」，细圆体或细衬线拉丁字母，字号是全场第二层级，四周留大留白。

  所有文字必须清晰可读、使用合法中文与合法英文短词；不得出现错拼伪字、随机中文、乱码英文、真实品牌标识、水印或二维码。整体保持「纯色底、顶部三栏、绿手写大标题、三品三角、两枝草本、三组品名、底部字标」的秩序，色彩只围绕浅米、浅绿、草绿与少量深色文字展开，4K 级细节，保留真实面包肌理。

  不要水印，不要真实Logo，不要电商促销价签，不要多于三款产品。

variables:
  - kv_var: 主标题
    style_var: "{主标题}"
    desc: "上方超大绿色手写体的四字中文标题，如：山野都会 / 春野食光，必须四字且清晰可读"
  - kv_var: 顶部信息
    style_var: "{顶部信息}"
    desc: "顶部左中右三栏极细绿色小字，用 / 分隔，如：春季上新 / New Arrival / In Spring"
  - kv_var: 产品组合
    style_var: "{产品组合}"
    desc: "三款同系列浅绿烘焙产品的具体描述，用 / 分隔，如：切开的艾草辣笋芝士恰巴塔 / 艾草麻薯红豆大鼓 / 撒松子的艾草年糕吐司方块；其中一款需切开露馅"
  - kv_var: 品名标签
    style_var: "{品名标签}"
    desc: "三组中英文品名，组内用中英对照、组间用 / 分隔，如：艾草恰巴塔 Mugwort Ciabatta / 红豆麻薯大鼓 Red Bean Mochi Bun / 松子年糕吐司 Pine Nut Rice Cake Toast；必须合法可读"
  - kv_var: 点缀枝叶
    style_var: "{点缀枝叶}"
    desc: "与主题同源的一两枝新鲜叶材，如：新鲜艾草枝叶 / 迷迭香短枝，需低饱和、不铺满"
  - kv_var: 品牌标识
    style_var: "{品牌标识}"
    desc: "底部居中的虚构绿色拉丁字母品牌字标，如：Field&Field / Green Hearth，不要写真实品牌名"

