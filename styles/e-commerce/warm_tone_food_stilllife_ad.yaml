features:
- title: 单色渐变背景与哑光台面
  desc: 背景是一整片上深下浅的柔和同色渐变，没有任何道具与纹理；台面是哑光平面，产品与食材在上面投下边缘清晰的柔和阴影
- title: 产品垂直居中占中部三分之一
  desc: 主体包装垂直立于画面正中，占画面中部约三分之一高度，正面自上而下是椭圆品牌标、小字、大号白色产品名、副名、口味写实插画与底部一排分栏小字
- title: 同色系食材对称环绕
  desc: 左侧一摞三层马卡龙配散落巧克力块与刨花，右侧一摞两层马卡龙与巧克力块，正前方零星撒几颗豆子，全部收在同一暖棕调里、不出现跳色
- title: 细颈花器把右侧抬高
  desc: 主体右后方约两个包装宽度处放一只哑光细颈瓶，插带小白花的细茎与两三根细长巧克力棒，瓶身略高于主体，用来平衡构图并抬高画面右侧
- title: 材质对比撑起醇厚感
  desc: 纸盒哑光印刷纹、马卡龙酥脆裙边与挤出内馅、巧克力细腻光泽与模具压花、小花半透柔美，靠材质差异而不是色彩对比做层次
- title: 平视中景中心构图
  desc: 机位平视、中景距离，不俯拍不仰拍，主体居中、左右配重均衡，画面干净无排版文字层

scene: "饮品与零食产品主图、食品电商详情页头图、节日礼盒视觉、品牌口味海报、餐饮菜单配图"

ratio: '9:16'
summary: "暖棕同色系食品静物广告——上深下浅的同色渐变背景与哑光台面上，产品包装垂直居中占中部三分之一，左右用同色系马卡龙与巧克力块对称环绕、前方撒几颗豆子，右后方一只细颈花瓶插小白花与巧克力棒把右侧抬高，平视中景、浓郁醇厚、靠材质差异做层次。"

prompt: |
  创作一张 9:16 竖版的浓郁奢华食品商业广告静物图，平视中景镜头、中心构图，醇厚诱人、富有质感。

  场景基调：
  背景是{背景渐变}的柔和渐变，上方更深、往下转亮，无纹理、无道具；
  台面是{桌面色}的哑光平面，产品与食材在上面投下边缘清晰的柔和阴影。

  主体：
  {主体产品}垂直立于画面中心，是绝对视觉焦点，占画面中部约三分之一高。
  包装为哑光纸质、带印刷纹理，正面自上而下依次排：一枚椭圆品牌标、一行小字、一行大号白色产品名、一行副名，下方是口味的写实插画与流动液体色块，底部一排分栏小字。
  包装上的文字统一为{包装文字}，必须真实可读、拼写正确，不要伪字。

  左右环绕（同色系食材）：
  左侧是{左侧配饰}：一摞三层马卡龙叠立，前方散落巧克力块与巧克力刨花。
  右侧是{右侧配饰}：一摞两层马卡龙与几块巧克力。
  正前方台面上零星撒{点缀食材}。
  所有配饰的颜色都收在同一种暖调里，与主体同色系，不出现跳色。

  花器（右后方，抬高画面）：
  主体右后方约两个包装宽度处放{花器}：一只哑光细颈瓶，插几枝带小白花与花苞的细茎，以及两三根细长巧克力棒；
  瓶身高度略高于主体，用来把画面右侧抬高、平衡构图。

  质感要求：
  纸盒哑光带印刷纹理；马卡龙外壳酥脆、裙边粗糙、内馅绵密挤出；巧克力块光泽细腻、断面平整、模具压花清晰；小花柔美半透；整体真实可触。

  色彩：
  {主色调}，醇厚温暖的单色调，靠明度与材质差异拉开层次，不使用高饱和对比色。

  避免：真实品牌 Logo、乱码伪字、水印、冷色调、扁平插画、卡通、杂乱背景、多余排版文字。

variables:
- kv_var: 主体产品
  style_var: '{主体产品}'
  desc: 居中垂直站立的产品包装，如：巧克力牛奶纸盒、抹茶拿铁利乐包
- kv_var: 包装文字
  style_var: '{包装文字}'
  desc: 包装正面整套文字，如：椭圆品牌标 + CHOCOLATE + 副名 + 底部三栏小字
- kv_var: 左侧配饰
  style_var: '{左侧配饰}'
  desc: 左侧同色系食材，如：三层叠放的巧克力马卡龙与巧克力块
- kv_var: 右侧配饰
  style_var: '{右侧配饰}'
  desc: 右侧同色系食材，如：两层马卡龙与两块巧克力
- kv_var: 点缀食材
  style_var: '{点缀食材}'
  desc: 前方台面零星撒的小颗粒，如：咖啡豆、巧克力豆、可可碎
- kv_var: 花器
  style_var: '{花器}'
  desc: 右后方的瓶器与插花，如：芥末黄哑光细颈瓶插白色小花与巧克力棒
- kv_var: 背景渐变
  style_var: '{背景渐变}'
  desc: 背景渐变，如：棕黄渐变上深下浅、抹茶绿渐变、暖陶土渐变
- kv_var: 桌面色
  style_var: '{桌面色}'
  desc: 台面颜色，如：浅米哑光、暖灰哑光、浅沙色
- kv_var: 主色调
  style_var: '{主色调}'
  desc: 整体配色，如：巧克力棕 + 马卡龙棕 + 芥末黄，同色系暖调

