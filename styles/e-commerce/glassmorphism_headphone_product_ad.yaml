# 黑底毛玻璃耳机产品广告

id: glassmorphism_headphone_product_ad
name: "黑底毛玻璃耳机产品广告"
category: e-commerce

tags:
  - 3C产品广告
  - 苹果式极简
  - 毛玻璃拟态
  - 黑白高对比
  - 发光空心字
  - 悬浮产品
  - 播放器UI
  - 16:9横版

triggers:
  - 黑底耳机产品海报
  - 毛玻璃播放器UI广告
  - 苹果式极简3C上市图
  - 发光空心型号字
  - 悬浮白色产品KV
  - 功能卖点图标行

features:
  - title: 纯黑深炭灰底 + 单件白色产品悬浮
    desc: 16:9 横版，纯黑到深炭灰的低明度背景几乎没有环境细节，画面中央偏右只放一件纯白产品，微微倾斜的 3/4 侧面角度悬浮展示、无台面无倒影，白色与暗底形成唯一的强明暗对比
  - title: 产品背后一层柔和银白辉光
    desc: 光晕从产品轮廓向外缓慢扩散，把产品从纯黑背景里托起来形成悬浮感与聚焦效果；光效克制，只用于勾轮廓，不做彩色光、不做体积光束、不做舞台式射灯
  - title: 三层超大字叠出景深
    desc: 最底层是一行超大号半透明深灰立体装饰字，玻璃拟态带轻微模糊，被产品与卡片大面积遮挡只露出局部字母；中层是超大号白色发光**空心描边**型号字，字内透明、只勾一圈柔光边；顶层是顶部居中的细体品牌小字 + 粗体系列大字，三级字号与透明度拉开层次
  - title: 左侧毛玻璃音乐播放器 UI 卡片
    desc: 深色半透明圆角矩形浮层，高斯模糊透出后面的巨字；卡内左侧一张方形专辑封面缩略图，右侧歌名与艺术家名两行，下方一条白色细进度条带圆形指示器与两端时间码，最下一排后退／播放暂停／前进三枚线性图标，全部浅灰白
  - title: 底部三组功能图标 + 说明文字
    desc: 画面下方横向等距排列三组「线性图标 + 两行大写无衬线小字」，如电池、降噪波形、音频波形，组间用极细竖线分隔；最底部居中一行更小号的实验室落款字与一枚圆形小标记
  - title: 苹果式极简科技美学
    desc: 全部文字用细体／粗体无衬线，字距宽松、对齐精准、层级克制；产品是写实级 CGI（编织网面头梁、哑光陶瓷白耳罩、浅灰透气网布耳垫、细腻珠光反射与边缘轮廓光），不是扁平插画、不是 HUD 科幻界面、不是彩色渐变电商图

scene: "无线耳机／智能音频等 3C 新品上市主视觉、品牌官网与电商首屏横幅、发布会 KV、音乐 App 联名硬广、极简科技产品系列图"
ratio: "16:9"
summary: "黑底毛玻璃耳机产品广告——16:9 纯黑深炭灰底，单件纯白头戴耳机 3/4 角悬浮、背后一层柔和银白辉光；三层超大字叠出景深（半透明深灰立体装饰字 + 白色发光空心型号字 + 顶部品牌／系列），左侧一张深色毛玻璃音乐播放器卡片（封面、歌名、进度条、播放键），底部三组功能图标与说明，最底一行极小落款，苹果式极简高奢科技感。"

prompt: |
  创作一张 16:9 横构图的高端 3C 产品广告主视觉，苹果式极简科技美学，纯黑色到深炭灰的低明度背景，整体黑灰色系，静谧、高奢、克制，不要彩色渐变、不要 HUD 科幻面板、不要影棚台面与倒影、不要扁平插画。

  画面中央偏右只放一件「{产品}」：纯白色，头梁为白色编织网面材质，耳罩为哑光陶瓷白／珍珠白金属质感外壳，耳垫为浅灰白色透气网布；以微微倾斜的 3/4 侧面角度悬浮展示，头梁朝上呈佩戴姿态。正面偏上的柔和冷调环境光照出细腻珠光反射，边缘一圈微妙轮廓光勾出产品线条；产品背后一层柔和银白色辉光向外缓慢扩散，只用来托起主体、增强悬浮感，不要体积光束或彩色光效。

  用三层超大文字叠出景深：最底层是一行超大号半透明深灰色立体装饰字（粗黑无衬线、带轻微玻璃拟态与模糊），被产品与卡片大面积遮挡，只露出局部字母轮廓；中层压在产品后方的是超大号「{型号名}」，白色发光**空心描边字**——字内保持透明、只勾一圈柔光边，横跨画面大半；顶层是顶部居中「{品牌与系列}」，第一行为白色细体无衬线品牌小字，第二行为白色粗体无衬线系列大字。三级字号、透明度与前后关系要清楚，文字不与产品抢焦点，也不要出现中文大字。

  产品左侧叠一张深色半透明毛玻璃圆角矩形音乐播放器 UI 卡片，高斯模糊透出背后的巨字：卡内左侧一张方形专辑封面缩略图，右侧两行浅灰白小字写「{播放器曲目}」（歌名一行较亮、艺术家名一行较暗），下方一条白色细进度条带圆形指示器与两端时间码，最下一排后退／播放暂停／前进三枚白色线性图标。卡片边缘有极细的亮线，整体通透不压主体。

  画面下方横向等距排三组「{功能卖点}」：每组一枚白色线性图标配两行大写无衬线小字说明，组间用极细竖线分隔，字号远小于型号字；最底部居中一行更小号的实验室落款字与一枚圆形小标记，只作装饰不要求辨读。所有 UI 文案用合法英文短词，不要错拼伪文字、不要水印、不要二维码。

  整体是高对比黑白、大面积负空间、对齐精准的极简科技广告：光效克制、字距宽松、层级分明，产品是画面唯一的高光主体。

variables:
  - kv_var: 产品
    style_var: "{产品}"
    desc: "悬浮展示的单件纯白 3C 产品，如：白色头戴式无线耳机；可换智能音箱、入耳式耳机盒等白色音频硬件，保持 3/4 侧角与材质细节"
  - kv_var: 品牌与系列
    style_var: "{品牌与系列}"
    desc: "顶部居中的两层品牌命名，如：Dreamina（细体小字）/ ARC（粗体大字）；用虚构名，不要写真实品牌"
  - kv_var: 型号名
    style_var: "{型号名}"
    desc: "压在产品后方的超大号白色发光空心描边字，如：ZENITH，字内透明只勾光边"
  - kv_var: 播放器曲目
    style_var: "{播放器曲目}"
    desc: "毛玻璃卡片里的两行曲目信息，如：Velvet Horizon / LYRA（歌名 / 艺术家），用虚构名"
  - kv_var: 功能卖点
    style_var: "{功能卖点}"
    desc: "底部三组图标配两行大写英文短词，如：60H ENDURANCE / ADAPTIVE SILENCE / IMMERSIVE DEPTH，分别对应电池、降噪波形、音频波形"

source_url: "https://jimeng.jianying.com/ai-tool/work-detail/7681561564192738585"
source_author: "即梦AI（即梦官方）"

