prompt: |
  Generate a vertical menu-art image (2:3 ratio) of [$SIGNATURE_DISH] titled "[$DISH_NAME]" with the subtitle "[$CHEF_RESTAURANT]".

  Composition: The dish's components—sauces, solids, garnishes—float in perfect suspension as a modernist cuisine ingredient separation, arranged in a clean, asymmetric editorial layout. The background is matte fine-art paper with minimal, elegant Swiss-menu typography.

  Material & Detail: Macro food texture photography reveals every element at multiple scales:
  - Vegetable fibers, crystallized sugar structures, breadcrumb architecture, sauce viscosity, and crumb structure are visible in microscopic detail.
  - Each ingredient carries a "semantic mutation": a tiny, ghosted diorama inside or behind it that reveals its origin (e.g., wheat fields inside a grain of bread, olive groves behind a drop of oil, cacao pod inside chocolate shavings).
  - Calorie callouts, sourcing map pins, flavor-profile radar charts, and freshness indicators are subtly overlaid in a clean infographic style, never obscuring the food.

  Lighting & Atmosphere: Soft studio lighting with a hint of steam rising from the warm elements. The overall palette is warm, appetizing tones—creamy whites, rich browns, vibrant greens, and touches of amber—against the paper background.

  Style DNA:
  - 40% Modernist cuisine ingredient separation
  - 30% Macro food texture photography
  - 15% Minimalist Swiss menu design
  - 10% Soft studio lighting with steam
  - 5% Fine art paper texture

  Constraints: The image must be appetizing, clean, highly detailed, and suitable for a premium restaurant menu. No clutter, no messy plating, no hard shadows. All information overlays must be subtle and integrated.

  Negative: No photorealistic whole dish on a plate, no messy backgrounds, no aggressive colors, no unreadable text, no generic food stock.

  Aspect ratio: 16:9 or 2:3.

  不要水印，不要真实Logo，不要凌乱背景。

