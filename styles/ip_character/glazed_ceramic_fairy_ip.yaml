ratio: '1:1'
summary: "釉面陶瓷童话IP雕塑——上釉陶瓷雕塑质感的 Q 版童话角色，大花头饰、花瓣领与叶片裙把植物长在身上，赤脚立于花草蘑菇环绕的泥土底座，暖橙橄榄绿缤纷釉色，影棚灰底全身构图。"

prompt: |
  以 Clairy Laurence 式的上釉陶瓷雕塑语言，设计一个 IP 角色的全身像，1:1 正方形构图，居中、不裁切。

  角色：
  {角色设定}，Q 版童话比例——大头小身、圆脸、短短的手脚。
  {发型发色}，发梢向外翘起，呈陶瓷捏塑的整块形体。
  {表情神态}，眼睛大而圆、瞳孔透亮，神情生动，带一点怪诞的稚气。
  额头与脸颊点有浅色的斑记。

  服饰：
  把植物直接长在身上——{服饰元素}：大朵花开在头顶作头饰，花瓣围成一圈领口，一朵雏菊钉在胸前，叶片层叠拼成裙摆，藤蔓缠绕小腿，双脚赤足。

  底座：
  角色站在{底座场景}上：一块泥土色的圆形陶瓷底座，四周长出高矮不一的花朵、蘑菇、浆果与叶片，几株细茎顶着圆球状花苞伸到角色肩高，底座与角色一体成型、同为上釉陶瓷。

  材质与工艺（最重要）：
  通体是手工上釉陶瓷雕塑，釉面亮润，有明确的高光与反光，厚薄不匀处积釉更深、边缘更亮；
  形体是雕塑的整块体面，不是插画描边，也不是布料与皮肤；
  能看到手作的捏塑、堆叠与笔触痕迹，边缘略带不规则。

  配色：
  釉色为{釉色方案}，色彩缤纷但饱和度克制，带复古童话绘本的温润色调。

  背景：
  {背景氛围}，中性灰到浅灰的影棚渐变，没有场景与道具，柔光把釉面反光交代清楚，地面有极淡的接触阴影。

  整体：欧洲女孩童话风，奇趣、怪诞、幻想、灵动，隐喻自然与植物，艺术感强、极繁装饰、高级审美。

  避免：真实品牌 Logo、水印、文字、塑料玩具感、毛绒材质、写实人像、3D 卡通渲染、插画描边。

