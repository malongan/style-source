prompt: |
  一张完整的单幅 3D 插画，夸张的艺术编辑插画风格，不是分镜，不是拼贴版式。

  主体是一个夸张的卡通角色：小脑袋、圆胖身体、极度拉长的四肢、超大的手与超大的鞋，重心失衡，冻结在半空中的戏剧性跳跃姿态，充满张力与喜剧能量。整体形态像软雕塑玩具：圆润、敦实、有弹性、夸张，不符合解剖学。

  材质是哑光软橡胶、毛绒面料、针织肌理、橡皮泥质感，带细致的纤维细节、轻微颗粒感与手工雕塑的触感；避免油亮的塑料玩具感，避免半透明玻璃感，避免高反光。

  高饱和的多巴胺配色，大胆的色彩冲撞，大面积的平涂色块，明亮但不过曝。

  干净的白色背景，极简空间，地面只有一层柔和的椭圆阴影，没有复杂场景。

  角色周围漂浮着抽象图形元素：星星、波浪线、球体、立方体、图标、符号，全部渲染成软橡胶或纸质道具，以增强动感与设计感。

  柔和的工作室灯光、全局照明、软阴影、低对比，干净的商业渲染。

  C4D / Blender 3D 插画、风格化软雕塑、哑光黏土材质、毛绒面料质感、针织表面细节、俏皮的编辑风 3D 插画、高品质。

  主题：{主体}与{道具}一同漂浮，周围环绕{元素}，为{用途}制作的主视觉插画。

