prompt: |
  请生成一张高品质、真实拍摄质感的人物角色设定图（character sheet / character reference sheet）。

  角色：{角色名称}
  角色身份：{角色基础身份}
  角色描述：{角色描述}
  服装设定：{服装描述}
  配饰设定：{配饰描述}
  鞋靴设定：{鞋靴描述}
  髮型设定：{髮型描述}

  如有参考图：
  - 仅使用参考图作为该角色脸部、骨骼结构、肤质与髮型的主要依据
  - 保持年龄、种族、性别特征一致
  - 脸部特征高度匹配参考图

  输出要求：
  - 纯白背景
  - 16:9 横版
  - 4K 解析度
  - 布局清晰规范
  - 各模块无重叠、无裁切
  - 高精度细节，专业影视级角色卡风格

  必须包含以下模块：
  1. 头部细节组：
  - 无配饰正视图
  - 无配饰正侧视图
  - 完整造型正视图
  - 完整造型正侧视图

  2. 全身正交转面组：
  - 正面
  - 左45度
  - 正侧面
  - 右45度
  - 背面

  3. 补充视角组：
  - 半侧身视图
  - 俯视顶视图
  - 仰视底视图

  4. 材质细节特写组：
  - 服装面料特写
  - 袖口 / 领口 / 腰部细节
  - 鞋靴细节
  - 配饰细节

  一致性要求：所有模块中的角色必须为同一人物，五官、髮型、肤色、身材、服装、鞋靴、配饰、光影、材质完全一致，不得出现角色漂移或视图差异。

  不要水印，不要真实Logo，不要低精度。

