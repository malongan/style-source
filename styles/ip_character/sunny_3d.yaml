  - "**饱和蓝天户外光照** — 明亮的正午阳光，清晰高光和阴影"
  - "**夸张广角透视** — 低角度近距离广角拍摄，前景物体触手可及"
  - "**超大斜体标题排版** — 巨大白色粗体斜体几何字体，占据画面上半部分"
  - "**霓虹手绘动感标记** — 霓虹绿/青色手绘圈、下划线、运动线条环绕标题"

scene: "社媒营销海报、活动推广、产品发布、 campaign 海报"
ratio: "9:16 或 16:9"
summary: "光泽玩具风3D头像 + 饱和蓝天户外光照 + 夸张广角透视 + 超大斜体白色标题 + 霓虹手绘动感标记，明亮商业营销海报风格"

prompt: |
  创作一张 9:16 高能量社交营销海报，采用「阳光 3D 头像营销风」。

  保留这些风格锚点：
  - 光泽风格化的 3D 头像：圆润光滑的娃娃脸、圆润的手、柔和的塑料肌肤、简化的表情眼睛
  - 极致的阳光户外广告光：清晰高光、干净的阴影、度假日氛围
  - 上方为深饱和天蓝场，下方由鲜绿或清新的户外色平衡
  - 广角近镜头透视，主头像或道具在前景被大幅裁切
  - 超大粗体白色标题字体，略作倾斜，叠压在天空区域
  - 霓虹绿或青色的手绘弧线、环线、下划线与动势笔触环绕标题
  - 俏皮的商业密度，前景、中景与标题区层次分明

  场景：{主体}正在{地点}以{动作}搭配{道具}。包含{背景元素}。

  字体：主标题「{主文案}」用大号粗体白色倾斜几何展示字体，辅助文字「{副文案}」用圆润无衬线体。

  图形点缀：在标题周围加入霓虹青柠与青色的手绘环线、弧线、下划线，以及点缀符号「{点缀符号}」。

  渲染：光泽风格化 3D 头像、光滑玩具般的脸、可触的布料与道具肌理、清亮的阳光户外光、鲜明的蓝绿商业色盘、抛光的高分辨率栅格成品。

  不要平台 Logo，不要水印，不要用户名，不要二维码，不要照片级真人，不要扁平矢量，不要动画赛璐珞上色，不要粗粝颗粒肌理。
