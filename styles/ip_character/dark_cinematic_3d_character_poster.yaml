scene: "角色 IP 宣传海报、个人品牌与作品集封面、展览与杂志式封面、潮玩与影视概念海报"
ratio: "9:16"
summary: "暗调电影感超写实 3D 角色海报——一侧是照片级写实的拟人角色半身像（皮肤毛孔划痕与湿润质感、愠怒表情、暖色逆光勾边、伦勃朗暗调、胶片颗粒浅景深），另一侧纯黑大留白排粗犷手写笔刷的中英混排大标题与副标题、顶底四角点缀极细无衬线信息字，杂志／展览海报式的高级冷峻排版。（源以版权角色「章鱼哥」和作者署名「JOANNA Design」为示例，已通用化为变量、示例改用原创中性描述，并把真实 IP／品牌 Logo／署名水印列入负向；角色只露半身、避开可识别 IP。）"

prompt: |
  创作一张 9:16 竖版的超写实 3D 角色肖像海报，电影级暗调、高级冷峻、戏剧张力，杂志封面或艺术展览海报式排版。

  角色：
  画面右侧是{角色对象}的半身像、只占右半幅（可半侧或半脸出镜），材质照片级写实——皮肤布满细密毛孔、凹凸颗粒与细微划痕、带湿润光泽，表情愠怒严肃；穿着{角色服装}，布料有真实褶皱与厚度。

  光线与质感：
  强烈的暖{轮廓光色}逆光勾出头、颈、肩的发光轮廓线，正面主光柔和、整体暗调伦勃朗式明暗过渡，带浅景深与明显的胶片颗粒，焦点落在面部五官。

  背景与留白：
  纯黑背景、无渐变，画面另一侧整片留黑，作为文字排版的负空间。

  文字层级（排在留白侧、层级清晰）：
  中部是粗犷手写笔刷体的大号{主标题}，中英混排、与角色主色同色系；其下一行稍小的同色系{副标题}。画面顶部与底部四角各排一行极细极小的无衬线{信息字}。

  不要：真实 IP 或版权角色、真实品牌 Logo、作者署名水印、伪字乱码、明亮高调背景、扁平卡通插画、电商广告感。

variables:
- kv_var: 角色对象
  style_var: '{角色对象}'
  desc: 半身出镜的主体（避免真实版权角色），如：一只青绿色拟人章鱼 / 一位白发机械师
- kv_var: 角色服装
  style_var: '{角色服装}'
  desc: 角色穿着，如：棕色 Polo 短袖 / 深色工装外套
- kv_var: 轮廓光色
  style_var: '{轮廓光色}'
  desc: 逆光勾边的暖色，如：暖金色 / 琥珀色
- kv_var: 主标题
  style_var: '{主标题}'
  desc: 手写笔刷大标题（可中英混排），如：MONSTER PORTRAIT / 深渊回声
- kv_var: 副标题
  style_var: '{副标题}'
  desc: 主标题下方一行中文，如：超写实渲染
- kv_var: 信息字
  style_var: '{信息字}'
  desc: 顶部与底部四角极小无衬线信息字（用中性词、勿放真实品牌），如：Art / 2026 Sep / RENDER

