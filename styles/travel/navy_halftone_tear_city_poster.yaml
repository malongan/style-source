features:
  - title: 藏蓝半色调网点铺满整张底纸
    desc: 深藏蓝纸面上是规则可辨的圆形半调网点，像旧画报四色印刷放大后的网纹，从顶部一直铺到底边，带轻微纸纹与印刷不均，不做渐变、不做纯色平涂，是整张海报最稳定的色彩与肌理基底
  - title: 中部一道横向撕纸裂口撕出鎏金暖橙
    desc: 画面中上部沿一条略带斜势的不规则撕口把藏蓝纸面撕开，裂口带清晰白色纸纤维毛边、尖角与轻微外翻感，内部露出鎏金暖橙的做旧颗粒色块；底边另有一道同款白色撕纸毛边收口，形成上下两道撕口的夹心结构
  - title: 老照片地标去背硬边拼贴
    desc: 裂口下方把 4-6 张该城市地标照片去背后相互叠压拼贴，塔楼、弧形转角老楼、摩天楼群高低错落占满中下部；照片带老胶片褪色、轻微偏色与颗粒，剪贴边缘是干净硬边，不做羽化融合也不描边
  - title: 超大橙金中文主标题 + 连写英文副题
    desc: 顶部三栏极小信息字之下是一行几乎横贯全幅的超大加粗中文主标题，鎏金暖橙实心填充；紧贴其下一行同色英文副题，字距紧凑、单词连写不加空格，两级字重共同压住画面上三分之一
  - title: 底部关键词条与装饰性小字
    desc: 底边撕口之上横排 5-6 个白色中文短词，用小圆点分隔，每词正下方一行极小号拉丁装饰字；小字只作排版纹理，不要求逐字辨读，不得出现清晰可读的错拼词或随机中文伪字
  - title: 90 年代海派复古印刷品气质
    desc: 藏蓝与鎏金暖橙双主色、网点与做旧颗粒、老月份牌式的饱和暖调，传递自由随性的城市漫步情绪；不是矢量插画、不是 3D 渲染、不是现代极简 UI 海报

scene: "城市文旅主视觉、Citywalk 活动海报、目的地宣传招贴、城市纪念印刷品、杂志旅行专题封面"
ratio: "2:3"
summary: "藏蓝半色调网点打底，中部一道白色毛边撕纸裂口撕出鎏金暖橙做旧色块，裂口下方老照片质感的城市地标去背硬边拼贴；顶部三栏极小信息字压着超大鎏金中文主标题与连写英文副题，底部一排白色关键词与装饰小字收口，整体是 90 年代海派复古印刷品的城市漫游气质。"

prompt: |
  创作一张 2:3 竖版的「{城市名称}」城市漫游主题复古拼贴海报，90 年代海派复古印刷品与老月份牌气质，藏蓝与鎏金暖橙双主色，自由、随性、带着旧时光的烟火气；不要矢量插画、不要 3D 渲染、不要现代极简 UI 感。

  整张底纸用「{底色}」铺满，表面是规则可辨的圆形半色调网点纹理，像旧画报四色印刷放大后的网纹，从顶部一直延伸到底边，带轻微纸纹、扫描颗粒与印刷不均，不要渐变、不要纯色平涂。

  画面中上部沿一道略带斜势的不规则横向撕口把底纸撕开：裂口带清晰的白色纸纤维毛边、尖角与轻微外翻感，撕开处露出「{撕纸色}」的大面积做旧颗粒色块，色块内有浓淡不均的擦痕与褪色感。底边另有一道同款白色撕纸毛边横向收口，与上方撕口形成上下夹心结构。

  撕口下方是「{城市名称}」的地标建筑照片拼贴：把「{地标建筑}」等 4-6 座标志性建筑分别去背，保持各自完整可辨的轮廓，高低错落、相互叠压地排满画面中下部；塔楼、转角老楼、摩天楼群的尺度差要明显。所有照片带老胶片质感——轻微褪色、暖色偏色、可见颗粒与细微划痕，剪贴边缘是干净的硬边，不做羽化融合，也不要抠成描边贴纸。

  排版严格分三层：最上方左、中、右各一组极小号白色无衬线大写信息字「{顶部信息}」，字距宽松、只作装饰；其下是一行几乎横贯全幅、顶到两侧安全边的超大加粗中文主标题「{主标题}」，用「{撕纸色}」实心填充，笔画厚重、略带旧印刷的轻微毛边；紧贴主标题下方是一行同色英文副题「{英文副题}」，字距紧凑、单词连写不加空格，字号约为主标题的一半。底边撕口之上横排「{底部关键词}」，5-6 个白色中文短词用小圆点分隔，每个词正下方配一行极小号拉丁装饰字。

  所有极小号文字只作为排版纹理，不要求逐字可辨读；不得出现清晰可读的错拼单词、随机中文伪字、真实品牌标识、水印或二维码。整体保持网点底、撕纸裂口、老照片拼贴、超大标题、底部关键词条这五层秩序，色彩只围绕「{底色}」与「{撕纸色}」展开，高分辨率，保留网点、纸纤维与胶片颗粒细节。

  不要水印，不要真实Logo，不要电商广告感，不要卡通插画，不要现代极简留白排版。

variables:
  - kv_var: 城市名称
    style_var: "{城市名称}"
    desc: "漫游的目的地城市，如：上海 / 重庆 / 布达佩斯；画面里的地标与文案都要随它切换"
  - kv_var: 地标建筑
    style_var: "{地标建筑}"
    desc: "该城市 4-6 座可辨地标，用 / 分隔，如：东方明珠 / 武康大楼 / 上海中心大厦 / 外滩和平饭店"
  - kv_var: 底色
    style_var: "{底色}"
    desc: "铺满半色调网点的深色底纸，如：藏蓝 / 墨绿 / 深绛红，需足够深以托住橙金标题"
  - kv_var: 撕纸色
    style_var: "{撕纸色}"
    desc: "撕口内露出的做旧主色，同时用于超大标题，如：鎏金暖橙 / 砖红 / 芥末黄"
  - kv_var: 主标题
    style_var: "{主标题}"
    desc: "4-8 字超大中文主标题，如：上海城市漫游 / 山城漫走"
  - kv_var: 英文副题
    style_var: "{英文副题}"
    desc: "与主标题对应的一行连写英文，单词间不加空格，如：ShanghaiCityWander / ChongqingWander"
  - kv_var: 顶部信息
    style_var: "{顶部信息}"
    desc: "顶部左中右三组极小号英文短词，用 / 分隔，如：Citywalk / Lujiazui / The Bund"
  - kv_var: 底部关键词
    style_var: "{底部关键词}"
    desc: "底部 5-6 个 2-4 字中文短词，用 / 分隔，如：随心 / 热爱 / 漫无目的 / 外滩 / 陆家嘴 / 摩登"

