features:
- title: 真实摄影叠扁平波普
  desc: 底层是明亮清晰的真实城市街景摄影（老建筑、玻璃幕墙、骑行与人群），正中叠一个巨型扁平高饱和、粗黑描边带亮色外发光的波普卡通角色坐在屋顶，打破次元壁的强对比
- title: 建筑轮廓霓虹重描边
  desc: 把前景老建筑的屋顶、山墙、门窗轮廓用高饱和霓虹线重新描边，与真实建筑撞色，形成潮流混合媒体感
- title: 超大城市名与手绘涂鸦
  desc: 顶部叠超大白色粗体大写城市名压在天空与远景上，画面各处散布黄色圆点、绿色三角、红色小花等粗糙描边的彩色涂鸦小元素
- title: 高饱和荧光撞真实街景
  desc: 叠加层大量用荧光黄、亮绿、正红、纯白等高饱和色，与日光下的真实街景强烈对比，活力都市、潮流文旅海报气质

scene: "城市文旅与商圈宣传、潮流活动海报、生活方式品牌主视觉、社媒城市封面"
ratio: "3:4"
summary: "波普摄影混合城市海报——明亮真实的城市街景摄影作底（老建筑＋玻璃幕墙＋骑行人群），正中叠一个巨型扁平高饱和、粗黑描边带亮色外发光的波普卡通角色坐屋顶拿咖啡，前景建筑轮廓用霓虹线重新描边与真实撞色，顶部超大白色粗体城市名、四周散布粗糙彩色涂鸦小元素，活力潮流的文旅海报感。（源与成图均无作者水印；城市名／角色／地标做成变量以便复用于任意城市。）"

prompt: |
  创作一张 3:4 竖版的街头波普潮流混合媒体海报：真实摄影底图叠加夸张扁平波普插画，活力都市、潮玩破次元壁感。

  底图：
  {底图场景}，用明亮清晰的真实摄影质感呈现、日光色调自然。

  中心角色：
  画面正中一个巨型{波普角色}坐在建筑屋顶，扁平高饱和插画、粗黑描边、外缘带一圈亮色发光，造型随性活力，双腿垂在建筑立面前方。

  霓虹描边：
  把前景建筑的轮廓用{描边霓虹色}的发光霓虹线重新描边，勾出屋顶、山墙与门窗，与真实建筑撞色对比。

  标题：
  画面顶部叠超大白色粗体无衬线大写{城市名}，略带透视、压在天空与远景之上。

  点缀：
  画面各处散布{涂鸦点缀}等彩色手绘涂鸦小元素，边缘粗糙带描边。

  整体高饱和荧光色与真实街景形成强烈对比。不要：水印、真实品牌 Logo、灰暗低饱和、写实人物、电商广告感、伪字乱码。

variables:
- kv_var: 城市名
  style_var: '{城市名}'
  desc: 顶部超大白色粗体大写城市名，如：SHANGHAI / TOKYO / CHENGDU
- kv_var: 底图场景
  style_var: '{底图场景}'
  desc: 真实摄影底图，如：老城石库门与玻璃幕墙商圈、骑行共享单车的街道
- kv_var: 波普角色
  style_var: '{波普角色}'
  desc: 居中巨型的扁平波普角色，如：戴棒球帽拿咖啡的卡通男孩
- kv_var: 描边霓虹色
  style_var: '{描边霓虹色}'
  desc: 建筑轮廓重新描边的霓虹色，如：亮黄色 / 荧光粉
- kv_var: 涂鸦点缀
  style_var: '{涂鸦点缀}'
  desc: 散布的彩色涂鸦小元素，如：黄色圆点 / 绿色三角 / 红色小花

