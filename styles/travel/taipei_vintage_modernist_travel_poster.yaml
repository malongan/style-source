prompt: |
  创作一张精致的编辑式{城市}旅行海报插画，灵感来自复古现代主义旅行艺术。让{地标}作为主导地标，升起在层叠的城市天际线之上，前景是{前景}，并包含传统建筑、繁茂树木、远山、优雅的桥与平静的蓝色河流或水岸。使用讲究的几何拼贴构图，交叠的拱门、矩形、圆形、阶梯状建筑形体，以及微妙的纸质叠加。粉蓝、奶油白、暖陶土、尘珊瑚、鼠尾草绿与深海军蓝的低饱和粉彩色盘。极简手绘插画，略带颗粒的复古印刷质感，柔和自然日光，干净的建筑线条，平衡的负空间，讲究的欧洲旅行海报美学，怀旧而当代，高度细腻却不杂乱。把标题「{城市}」以纤细、字距宽大的全大写字体排在顶部居中。竖版 4:5 构图，高级艺术版画品质，优雅、整体统一，不要照片写实，不要渐变，不要过多文字。
  不要水印，不要真实Logo。


