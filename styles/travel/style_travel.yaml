prompt: |
  创作一张 16:9 图像，采用「Clean Triptych Travel Vlog Thumbnail（干净三联旅行 Vlog 缩略图）」风格。

  主体：{主体}。

  主体动作：{动作}。

  产品/道具：{道具}。

  地点：{场景}。

  背景元素：{背景元素}。

  主标题文字：「{主文案}」。

  次级文字：「{副文案}」。

  点缀符号：{点缀符号}。

  服装造型：{造型}。

  使用干净的三联旅行 Vlog 缩略图构图。把画面分成三块等宽的竖向摄影分栏，硬边分割、不出现可见边框。左栏是特写式的生活片段或咖啡馆瞬间，中栏是旅行者的城市漫步场景，右栏是地标、观景点、天际线、花园、城门、港口或能证明目的地的画面。

  把超大的小写目的地主标题以纯白色横贯整张画面的中心，穿过全部三个分栏。使用超粗圆润的几何无衬线体，平滑友好，无描边、阴影极少。在靠近顶部处放小号斜体白色分栏标签，主标题上方放一行小号的天数信息，下方放一个括号式的 Vlog 副题，底部角落放一条极小的日记注释。

  只添加稀疏的白色手绘点缀符号：一颗小心心、短横、下划线、角部笔触、闪光或一个松散的括角。照片处理保持温暖、随性、柔和、轻微颗粒、手机摄影般的真实感。氛围应现代、干净、像旅行日记，并且适合直接当视频缩略图。

  避免水印、用户名、创作者 ID、平台 Logo、二维码、应用 UI、可读的真实品牌 Logo、品牌名、名人肖像、杂乱的贴纸拼贴、过度手帐感、霓虹海报、脏旧肌理、奢华旅行广告、企业宣传册、彩色主标题、厚重投影、描边文字、看不清的目的地文字、单调的单张照片背景与暗沉浑浊的画面。

