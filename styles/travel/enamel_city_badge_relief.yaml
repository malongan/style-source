# 珐琅彩地标徽章冰箱贴

id: enamel_city_badge_relief
name: "珐琅彩地标徽章冰箱贴"
category: travel

tags:
- 珐琅彩
- 掐丝徽章
- 琉璃釉面
- 城市文创
- 地标冰箱贴
- 浮雕描金

triggers:
- 珐琅彩徽章
- 掐丝琉璃冰箱贴
- 城市地标文创徽章
- 景泰蓝风格徽章
- 旅游景点纪念徽章
- 描金浮雕徽章

features:
- title: 金色掐丝分隔色块
  desc: 画面里每一条轮廓都是凸起的抛光暖金金属线，把不同釉色分成一块块独立的小格子，像景泰蓝的掐丝骨架
- title: 半透明流釉的琉璃面
  desc: 金属线内填半透明珐琅釉，同一块釉里由深到浅自然过渡、局部积釉更浓、边缘泛高光，亮润流动而非平涂色块
- title: 异形金色包边轮廓
  desc: 徽章外缘不是圆角矩形，而是随内部画面起伏收放的海棠云头形轮廓，一圈饱满金边包裹，边缘圆润反光
- title: 远中近三层微缩场景
  desc: 上方主地标与远山，中部台阶步道与开阔草甸，两侧建筑与植被，下方人物与营地小景，元素按比例缩小并全部收在轮廓内
- title: 底部奶白浮雕铭牌
  desc: 下方一块奶白瓷面铭牌区，深色浮雕中文地名在上、较小衬线英文地名在下，两侧金线向外延展收尾
- title: 产品级正面渲染
  desc: 正面平视、居中，纯色背景配柔和落影与边缘高光，像一枚真实金属徽章被拍下来

scene: "城市与景区文创纪念品、旅行冰箱贴设计、目的地IP周边、博物馆商店主图、旅游内容封面"

ratio: '3:4'
summary: "珐琅彩地标徽章冰箱贴——海棠云头形金边异形徽章内用金色掐丝分隔半透明流釉，排布牌坊远山、草甸步道与营地小景的三层微缩场景，底部奶白铭牌压中英文浮雕地名，正面产品级渲染。"

prompt: |
  制作一枚珐琅彩琉璃质感的城市文创徽章（冰箱贴），正面平视展示，居中放在{背景色}的纯净背景上，带柔和落影与边缘高光。

  外形：
  徽章整体是{徽章外形}的异形轮廓，一圈饱满的暖金色金属包边，边线圆润反光，轮廓随内部画面起伏收放。

  掐丝与釉彩（最重要）：
  画面用金色掐丝分隔色块，每条轮廓都是凸起的金属线；
  线内填半透明珐琅釉，釉面亮润流动，同一块釉里由深到浅自然过渡、局部积釉更浓、边缘泛高光，像琉璃而非平涂色块；
  金属件做抛光暖金，白釉件做奶白瓷面。

  画面内容：
  徽章内排布{地标元素}：上方是主地标与远山，中部是台阶步道与开阔草甸，两侧分布建筑与植被，下方是人物与营地小景，层次由远到近。
  人物、帐篷、树木等小元素按比例缩小，全部收在金属轮廓以内，不得超出基底范围。

  文字：
  底部一块奶白铭牌区，上面是深色浮雕中文地名「{地名中文}」，其下是较小的衬线英文地名「{地名英文}」。
  画面内另有{内嵌小字}，字号小但笔画清晰。所有文字必须真实可读、拼写正确，不要伪字。

  配色：
  {釉色方案}，色彩明快但克制，金属金线统一收边。

  布局：
  美观协调、主次分明，视觉重心落在中部地标，四周留出不均匀的呼吸空间。

  避免：伪字乱码、超出轮廓的元素、平涂无光泽的塑料感、写实风景照片、复杂背景、水印、真实品牌 Logo。

variables:
- kv_var: 地名中文
  style_var: '{地名中文}'
  desc: 铭牌上的中文地名，如：江西·武功山、浙江·雁荡山
- kv_var: 地名英文
  style_var: '{地名英文}'
  desc: 铭牌上的英文地名，如：Wugong Mountain
- kv_var: 地标元素
  style_var: '{地标元素}'
  desc: 徽章内的风景元素清单，如：山门牌坊、金顶石碑、高山草甸、登山客栈、帐篷与登山者
- kv_var: 徽章外形
  style_var: '{徽章外形}'
  desc: 外轮廓形状，如：海棠云头形、圆角盾形、扇贝形
- kv_var: 釉色方案
  style_var: '{釉色方案}'
  desc: 珐琅釉配色，如：青绿松石釉 + 奶白 + 赭红 + 暖金
- kv_var: 内嵌小字
  style_var: '{内嵌小字}'
  desc: 画面里的小字标识，如：牌坊匾额三字、石碑竖排山名
- kv_var: 背景色
  style_var: '{背景色}'
  desc: 徽章之外的背景色，如：纯浅米色、暖灰、淡沙色

