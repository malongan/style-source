features:
- title: 电子蓝色铺满整个画布，并带有淡淡的方格网格，如同印刷的坐标纸。
  desc: ''
- title: 一块巨大的霓虹青柠对话框或横幅面板占据中心，并带锐利的三角尾巴或镂空切口。
  desc: ''
- title: 一块扁平黄色几何背板从青柠面板后方露出，营造高对比的海报纵深感。
  desc: ''
- title: 超大号黑色方块字体是主要视觉体块，被紧密裁切并塞进青柠色形状内。
  desc: ''
- title: 字形钝重、厚重、略微不规则，偏漫画感，而非精致或企业化的气质。
  desc: ''
