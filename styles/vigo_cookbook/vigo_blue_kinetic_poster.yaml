summary: 张扬的扁平漫画海报体系：电光蓝方格纸底、超大号霓虹青柠对话框几何块、厚重黑色方块字体、锐利黄色背板、放射状动势符号与粗粝印刷质感。整体像一张动态街头传单，大标题本身就是主体。
