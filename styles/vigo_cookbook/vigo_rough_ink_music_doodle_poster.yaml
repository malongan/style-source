name: 粗墨音乐涂鸦海报风格
category: vigo_cookbook
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 粗放手绘墨线海报风格：超大号墨绿黑毛笔字、浅胭脂纸底、亮粉色次级字体、稚拙吉祥物图形、蓝绿与粉色扁平填色、锐利黄色爆裂符号、散落的音符涂鸦，以及扫描般的孔版印刷质感。
tags:
- VigoCookbook
- Other
triggers:
- Rough Ink Music Doodle Poster Style
features:
- title: 淡粉色纸张背景，带轻微扫描感的暖米白质感。
  desc: ''
- title: 超大号粗犷笔刷标题，深墨绿色，边缘破碎、笔压不均。
  desc: ''
- title: 品红副标题字，以小号堆叠文字块、标签或日期式图形注释的形式排布。
  desc: ''
- title: 扁平稚拙的吉祥物或人物图形，粗粝轮廓线，简化解剖结构。
  desc: ''
- title: '克制的点缀配色：深墨绿线稿、品红填色、青绿填色，以及酸性黄爆发色块。'
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{SUBJECT}'
  desc: 摄影主体，如：一位穿短袖的年轻男生 / 一对牵手的情侣
- kv_var: 主体动作
  style_var: '{SUBJECT_ACTION}'
  desc: 主体在做什么，如：仰头大笑 / 单手举起饮料
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
  desc: 手持或陈列的物件，如：一罐气泡水 / 复古随身听
- kv_var: 场景地点
  style_var: '{LOCATION}'
  desc: 拍摄地点，如：东京街头便利店门口
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
  desc: 补充画面层次的元素，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{MAIN_TEXT}'
  desc: 画面最大的标题字，如：SUMMER DROP
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
  desc: 小字装饰信息，如：LIMITED 2024 / NEW ARRIVAL
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
  desc: 单个符号或小图案，如：✦ / ★ / 涂鸦箭头
- kv_var: 服装造型
  style_var: '{WARDROBE_STYLE}'
  desc: 如：oversize 卫衣 + 工装短裤 + 厚底鞋
prompt: 'Create a 16:9 finished raster poster image in the Rough Ink Music Doodle Poster Style. Preserve these style fidelity anchors first: the core visual anchors of this style. Avoid these source-specific
  elements completely: watermarks, real logos, and commercial advertising. The poster should show {SUBJECT} {SUBJECT_ACTION}, with {PRODUCT_OR_PROP} as an oversized graphic prop, set in {LOCATION}. Add {BACKGROUND_ELEMENTS} as
  floating doodle clusters. Use the main headline text "{MAIN_TEXT}" as huge rough deep green-black brush lettering, plus "{SECONDARY_TEXT}" as small hot pink stacked or bracketed supporting text. Include
  {ACCENT_SYMBOL} as a sharp graphic accent. Style the subject with {WARDROBE_STYLE}. Use pale blush paper, deep green-black scratchy outlines, hot pink and teal flat fills, one acidic yellow burst, scattered
  music-note marks, loose scribbles, dry marker texture, scuffed risograph grain, imperfect registration, flat poster perspective, airy asymmetric composition, and handmade zine-event energy. Do not use
  polished digital typography, realistic lighting, 3D depth, brand marks, watermarks, QR codes, copied source text, or copied source characters.'
id: vigo_rough_ink_music_doodle_poster
code: ''
