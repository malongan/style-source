prompt: 'Create a {ASPECT_RATIO} finished raster poster image in the Rough Ink Music Doodle Poster Style. Preserve these style fidelity anchors first: {STYLE_FIDELITY_ANCHORS}. Avoid these source-specific elements completely: {SOURCE_CONTENT_TO_AVOID}. The poster should show {SUBJECT} {SUBJECT_ACTION}, with {PRODUCT_OR_PROP} as an oversized graphic prop, set in {LOCATION}. Add {BACKGROUND_ELEMENTS} as floating doodle clusters. Use the main headline text "{MAIN_TEXT}" as huge rough deep green-black brush lettering, plus "{SECONDARY_TEXT}" as small hot pink stacked or bracketed supporting text. Include {ACCENT_SYMBOL} as a sharp graphic accent. Style the subject with {WARDROBE_STYLE}. Use pale blush paper, deep green-black scratchy outlines, hot pink and teal flat fills, one acidic yellow burst, scattered music-note marks, loose scribbles, dry marker texture, scuffed risograph grain, imperfect registration, flat poster perspective, airy asymmetric composition, and handmade zine-event energy.
  Do not use polished digital typography, realistic lighting, 3D depth, brand marks, watermarks, QR codes, copied source text, or copied source characters.'
