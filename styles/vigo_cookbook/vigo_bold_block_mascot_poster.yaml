features:
- title: 海报优先构图：超大号黑色大标题占据顶部条带、侧边条带或主导标题块。
  desc: ''
- title: 版式密度高、留白极少，同时所有形状都保持简单、扁平、易读。
  desc: ''
- title: 一到两个圆润的白色吉祥物式形象或简化图形主体，用极粗黑色描边与极简面部标记绘制。
  desc: ''
- title: 一块大型倾斜的青色、蓝绿、薄荷绿或柠檬黄面板横穿画面中部，作为主要图形体块。
  desc: ''
- title: 次级绿色、红色、黑色或浅色色块位于主体之后，并以厚重黑色笔触勾边。
  desc: ''
