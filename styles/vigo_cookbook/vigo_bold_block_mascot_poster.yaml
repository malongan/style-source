features:
- '* *海报优先作品，搭配 超大 黑 标题占据顶部乐侧面队、乐队或主导标题块。* *'
- '* *布局密度高，布局很小空 空间，但所有形状布局都很清晰主要 简单 扁平、易读。* *'
- '* *一个或两个ed-like 圆形 人物s白 吉祥物或简化图形主体s绘有非常厚 黑轮廓和极简面部标记。* *'
- '* *一个大 倾斜 青色， 青绿 薄荷，或柠檬颜色面板交叉中间，的 画面 作为 主要图形质量。* *'
- '* *次要绿 红、黑、或苍白色块在 主体依重 黑笔边缘画排列。* *'
