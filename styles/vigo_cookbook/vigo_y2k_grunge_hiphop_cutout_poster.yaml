features:
- title: '保留核心视觉识别：Y2K 粗粝嘻哈杂志拼贴海报风格，超大号照片剪贴、酸黄复古字体、粗粝的黑白墙面肌理、密集的编辑式页脚面板，以及影印般的印刷噪点。'
  desc: ''
- title: 把主体作为大型中央照片剪贴，带不规则的白色贴纸式描边。
  desc: ''
- title: 使用脏感的黑白粗粝墙面背景，并把 BACKGROUND_ELEMENTS 融入肌理之中。
  desc: ''
- title: 底部加一条明亮的酸性黄信息条，内含读取 SECONDARY_TEXT 的小号编辑文字、小型内嵌相框、条码式图形元素，以及 ACCENT_SYMBOL。
  desc: ''
- title: 整张图应具备 2000 年代初地下音乐杂志封面、混音带海报、街头服饰传单的气质：粗糙扫描印刷、高对比、浓重颗粒、影印质感、青与品红的印刷噪点，以及充满能量的拼贴版式。
  desc: ''
