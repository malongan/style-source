features:
- '**Preserve the 核心 visual identity: Y2K 脏污 hip-hop 杂志拼贴 海报 风格，由 超大 照片 剪影s, 酸性黄 复古 字体排版, 粗糙 黑-and-白 wall 质感s, dense 编辑 footer 面板s, and 照片copied 印刷 噪点.**'
- '**Place the 主体 as a 大 中心 照片 剪影 ，搭配 irregular 白 贴纸感 outline.**'
- '**Use a 脏 黑-and-白 脏污 wall 背景 with 背景元素 worked into the 质感.**'
- '**Add a 明亮 酸性黄 in格式ion strip 在 底部 with 小 编辑 文字 reading SECONDARY_TEXT, 小 inset 照片 画面s, barcode-like graphic 元素s, and 强调符号.**'
- '**The 图像 should 触感 like an early-2000s underg圆形 music 杂志 cover, mixtape 海报, 街头wear flyer, 粗糙 scanned 印刷, 高对比, 重 纹理, 照片复制 质感, 青色 and 品红 印刷 噪点, energetic 拼贴布局.**'
