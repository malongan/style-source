  style_var: main oversized creature or object-character
  desc: ''
- kv_var: '`SUBJECT_ACTION`'
  style_var: simple goofy action or expression
  desc: ''
- kv_var: '`PRODUCT_OR_PROP`'
  style_var: secondary object, prop, snack, tool, or small visual anchor
  desc: ''
