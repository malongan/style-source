summary: 稚拙 儿童海报 系统，由 厚 黑标记轮廓， 粗糙 蜡笔-粉彩颜色填充奶油色 纸张纹理， ，超大高形态飞生物和粗块 手写 黑 文字。
tags:
- VigoCookbook
- Other
triggers:
- Rough Marker Monster Poster Style
features:
- '* *奶油纸背景 暖色调 斑点，细腻无比真实环境。* *'
- '* *粗黑标记或油画棒键线有划边缘痕、摇晃和不均匀的压力。* *'
- '* *一个巨大 简化 字符或物体-字符 占据画面大部分并且是大胆裁切。* *'
- '* *扁平的儿童式结构，没有写实透视，没有3D建模，也没有抛光矢边缘量。* *'
- '* *饱和标记填充显示可见 纹理、小 白间隙和粗糙手工着色质感。* *'
