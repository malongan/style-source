name: 粗犷马克笔怪物海报风格
category: vigo_cookbook
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 稚拙儿童画风海报体系：由粗重的黑色马克笔轮廓、粗糙蜡笔/粉彩填色、米色纸张颗粒、超大号憨态生物造型，以及厚重的黑色手写文字构成。
tags:
- VigoCookbook
- Other
triggers:
- Rough Marker Monster Poster Style
features:
- title: 暖调米色纸张背景，带细微斑点，无写实环境。
  desc: ''
- title: 粗重的黑色马克笔或油画棒主线，边缘粗粝、线条抖动、笔压不均。
  desc: ''
- title: 一个巨大的简化角色或器物拟人角色占据大部分画面，并被大胆裁切。
  desc: ''
- title: 扁平童趣的造型语言，无写实透视、无 3D 建模、无精致矢量边缘。
  desc: ''
- title: 高饱和马克笔填色呈现可见颗粒、细小留白缝隙，以及粗糙的手工上色质感。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{SUBJECT}'
  desc: 摄影主体，如：一位穿短袖的年轻男生 / 一对牵手的情侣
- kv_var: 主体动作
  style_var: '{SUBJECT_ACTION}'
  desc: 主体在做什么，如：仰头大笑 / 单手举起饮料
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
  desc: 手持或陈列的物件，如：一罐气泡水 / 复古随身听
- kv_var: 场景地点
  style_var: '{LOCATION}'
  desc: 拍摄地点，如：东京街头便利店门口
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
  desc: 补充画面层次的元素，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{MAIN_TEXT}'
  desc: 画面最大的标题字，如：SUMMER DROP
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
  desc: 小字装饰信息，如：LIMITED 2024 / NEW ARRIVAL
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
  desc: 单个符号或小图案，如：✦ / ★ / 涂鸦箭头
- kv_var: 服装造型
  style_var: '{WARDROBE_STYLE}'
  desc: 如：oversize 卫衣 + 工装短裤 + 厚底鞋
prompt: 'Create a 16:9 raster poster in the Rough Marker Monster Poster Style. Subject: {SUBJECT}. Subject action: {SUBJECT_ACTION}. Product or prop: {PRODUCT_OR_PROP}. Location: {LOCATION}. Background
  elements: {BACKGROUND_ELEMENTS}. Main text treatment: {MAIN_TEXT}. Secondary text treatment: {SECONDARY_TEXT}. Accent symbol: {ACCENT_SYMBOL}. Wardrobe or object styling: {WARDROBE_STYLE}. Style fidelity
  anchors that must remain visible: the core visual anchors of this style. Source content to avoid: watermarks, real logos, and commercial advertising. Apply these style rules: warm cream paper background with subtle speckle; one huge flat
  childlike creature or object-character dominating the poster; thick scratchy black marker outlines; rough saturated marker fills with visible grain and small white paper gaps; chunky irregular black hand-lettered
  text integrated into empty corners; tiny dots, hatch marks, cheek spots, rectangles, and scribble accents; limited palette with one dominant bright body color, warm yellow-orange accents, white eye or
  mouth shapes, and black text; flat handmade construction with no realistic perspective, no 3D, no clean vector polish, no photographic environment. Important content rule: preserve the visual style first,
  then change the content with a new subject, new action, new prop, new fictional text, and new story premise.'
id: vigo_rough_marker_monster_poster
code: ''
