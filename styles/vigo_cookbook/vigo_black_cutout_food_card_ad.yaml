name: 黑色异形卡片食品广告
category: vigo_cookbook
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 黑底食品促销风格：以一张不规则米色纸质卡片为核心，超大号手写毛笔中文字、剪贴式食品摄影、小型价格徽章、暖红与暖黄点缀，以及手工市井小吃的印刷质感。
tags:
- VigoCookbook
- handmade
- Chinese
- street-food
- ad
- card
- photo-collage
- food
- centerpiece
triggers:
- Black Cutout Food Card Ad
features:
- title: 纯黑画布，图形卡片悬浮其上，是画面中唯一的亮色主体。
  desc: ''
- title: 一张大号米色或做旧纸张的异形剪纸卡片，边缘圆润手工感，每款轮廓各不相同。
  desc: ''
- title: '从左到右的密集海报层级：超大竖排中文毛笔字与食品照片、价格徽章形成视觉竞争。'
  desc: ''
- title: 食品以亮面剪贴照片拼贴元素处理，而非扁平插画。
  desc: ''
- title: 卡片内部使用暖米色、褪色赭石、深红、橙、棕与黑墨，配色克制。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{SUBJECT}'
  desc: 摄影主体，如：一位穿短袖的年轻男生 / 一对牵手的情侣
- kv_var: 主体动作
  style_var: '{SUBJECT_ACTION}'
  desc: 主体在做什么，如：仰头大笑 / 单手举起饮料
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
  desc: 手持或陈列的物件，如：一罐气泡水 / 复古随身听
- kv_var: 场景地点
  style_var: '{LOCATION}'
  desc: 拍摄地点，如：东京街头便利店门口
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
  desc: 补充画面层次的元素，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{MAIN_TEXT}'
  desc: 画面最大的标题字，如：SUMMER DROP
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
  desc: 小字装饰信息，如：LIMITED 2024 / NEW ARRIVAL
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
  desc: 单个符号或小图案，如：✦ / ★ / 涂鸦箭头
- kv_var: 服装造型
  style_var: '{WARDROBE_STYLE}'
  desc: 如：oversize 卫衣 + 工装短裤 + 厚底鞋
prompt: 'Create a 16:9 promotional food poster in the "Black Cutout Food Card Ad" visual style. Subject: {SUBJECT}. Action: {SUBJECT_ACTION}. Product or prop: {PRODUCT_OR_PROP}. Location context:
  {LOCATION}. Background and card details: {BACKGROUND_ELEMENTS}. Main text: {MAIN_TEXT}. Secondary text: {SECONDARY_TEXT}. Accent symbol: {ACCENT_SYMBOL}. Food styling: {WARDROBE_STYLE}. Style fidelity
  anchors: the core visual anchors of this style. Source content to avoid: watermarks, real logos, and commercial advertising. Apply these rules: pure black outer background; a single warm cream irregular cutout card with handmade rounded or
  torn edges; each card silhouette must be visibly different from other cases; dense Chinese street-food ad hierarchy; oversized rough hand-brushed Chinese lettering; realistic clipped food photo collage
  placed on the flat card; bold yuan price medallion with a value that is not 8; tiny vertical side seals and craft labels; deep red bottom ribbon with short white lettering; ochre, mustard, seal red, dark
  brown ink, warm cream paper, paper grain, slight scan softness, subtle card shadow. Match the reference style first, then change the dish, text, prop, card outline, price, and layout details.'
id: vigo_black_cutout_food_card_ad
code: ''
