features:
- '**Full 黑 canvas ，搭配 graphic 卡片 floating 作为 only 明亮 物体.**'
- '**One 大 奶油色 or 老化-paper irregular 剪影 卡片, with 圆形ed handmade 边缘s and a different 轮廓 per case.**'
- '**Dense 左侧-to-右侧 海报 hierarchy: 大 垂直 Chinese brush 字体 competes ，搭配 美食 照片 and a price medallion.**'
- '**Food is treated as a 光泽 clipped 照片 拼贴 元素, not a 扁平插画.**'
- '**Card 室内 uses warm 奶油色, faded 赭石, 深 红, 橙, 棕, and 黑 墨水 with limited palette discipline.**'
