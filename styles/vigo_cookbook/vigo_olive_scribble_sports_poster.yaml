name: 橄榄绿涂鸦运动海报风格
category: vigo_cookbook
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 动态扁平编辑插画风格：由米白纸张、大面积橄榄绿海报色块、超大号动作人物、粗糙黑墨轮廓、红色马克笔动势弧线、黄绿干笔刷笔触、稀疏碎屑，以及手工丝网印刷质感构成。
tags:
- VigoCookbook
- Other
triggers:
- Olive Scribble Sports Poster Style
features:
- title: 米白纸张底色，一块大面积不规则橄榄绿或黄绿色块覆盖大部分背景。
  desc: ''
- title: 一个超大号动作主体沿对角线横贯构图。
  desc: ''
- title: 扁平丝网印刷色区，极少明暗，无平滑渐变。
  desc: ''
- title: 厚重的黑墨剪影、棱角分明的笔刷轮廓，以及混乱的刮擦线条。
  desc: ''
- title: 红色马克笔弧线、箭头，以及横穿主体的动势回环。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{SUBJECT}'
  desc: 摄影主体，如：一位穿短袖的年轻男生 / 一对牵手的情侣
- kv_var: 主体动作
  style_var: '{SUBJECT_ACTION}'
  desc: 主体在做什么，如：仰头大笑 / 单手举起饮料
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
  desc: 手持或陈列的物件，如：一罐气泡水 / 复古随身听
- kv_var: 场景地点
  style_var: '{LOCATION}'
  desc: 拍摄地点，如：东京街头便利店门口
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
  desc: 补充画面层次的元素，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{MAIN_TEXT}'
  desc: 画面最大的标题字，如：SUMMER DROP
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
  desc: 小字装饰信息，如：LIMITED 2024 / NEW ARRIVAL
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
  desc: 单个符号或小图案，如：✦ / ★ / 涂鸦箭头
- kv_var: 服装造型
  style_var: '{WARDROBE_STYLE}'
  desc: 如：oversize 卫衣 + 工装短裤 + 厚底鞋
prompt: 'Create a 16:9 image in the "Olive Scribble Sports Poster Style" visual style.


  Subject: {SUBJECT}

  Action: {SUBJECT_ACTION}

  Prop/Product: {PRODUCT_OR_PROP}

  Location: {LOCATION}

  Background: {BACKGROUND_ELEMENTS}

  Main text: {MAIN_TEXT}

  Secondary text: {SECONDARY_TEXT}

  Accent symbol: {ACCENT_SYMBOL}

  Wardrobe/styling: {WARDROBE_STYLE}

  Style fidelity anchors: the core visual anchors of this style

  Source content to avoid: watermarks, real logos, and commercial advertising


  Apply these style rules:

  - Build the poster from one dominant diagonal action subject, one prop, and one abstract olive or yellow-green block.

  - Use off-white paper ground, flat screenprint color slabs, heavy black ink silhouettes, chaotic scratch contours, red marker motion arcs, yellow-green dry-brush loops, and sparse diamonds or clipped
  debris.

  - Keep the setting shallow, abstract, and editorial rather than realistic or scene-heavy.

  - Use small rough hand-cut text only as a secondary poster accent, never as polished brand typography.

  - Preserve imperfect elongated anatomy, cropped limbs, raw brush texture, and handmade print misregistration.


  Avoid:

  - watermarks, real logos, low quality, distorted text


  Important content rule: match the extracted style first, then change the source content. Use new subjects, new scene details, new props, and new text, while avoiding the original soccer/overhead-kick
  source content.'
id: vigo_olive_scribble_sports_poster
code: ''
