- Olive Scribble Sports Poster Style
features:
- '* *白纸外g圆形 ，搭配 大不规则橄榄绿或黄色-绿块覆盖最多，的 背景. * *'
- '* * One 超大 action 主体 placed 对角线ly 横穿 composition. * *'
- '* *带极简阴影的平板屏幕印刷颜色区域平滑 渐变，没有。* *'
- '* *粗黑 墨水 轮廓体、有角画笔轮廓和混乱划痕。* *'
- '* *穿过红的标记弧线、箭头和运动环路主体。* *'
variables:
- kv_var: 变量
  style_var: 说明
  desc: ''
- kv_var: '`SUBJECT`'
  style_var: main action subject
  desc: ''
- kv_var: '`SUBJECT_ACTION`'
  style_var: dynamic action performed by the subject
  desc: ''
- kv_var: '`PRODUCT_OR_PROP`'
  style_var: simplified object, tool, sport prop, or product carried by the subject
  desc: ''
- kv_var: '`LOCATION`'
  style_var: abstracted environment or setting
  desc: ''
- kv_var: '`BACKGROUND_ELEMENTS`'
