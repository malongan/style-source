summary: 动态白纸扁平 编辑 插画风格 构建， 大 橄榄绿-绿 海报块，超大动作，粗糙 黑 墨水轮廓，红标记moti ， rcs ， 黄色-在绿干刷人物条带，稀疏碎屑和手工制作的屏幕印刷 质感。
