name: 霓虹毛绒数码配件 3D 流行风格
category: vigo_cookbook
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 亮面玩具广告 3D 风格：由酸性青柠影棚背景、超大号毛绒吉祥物、厚重科技道具、柔软织物表面、半透明塑料配件、棋盘格卡片、贴纸式图标、品红爆发图形，以及明亮商业布光构成。
tags:
- VigoCookbook
- Other
triggers:
- Neon Plush Gadget Pop 3D Style
features:
- title: 酸性青柠或霓虹黄绿影棚背景主导画面，带柔和渐变辉光，而非写实场景。
  desc: ''
- title: 单个超大号毛绒吉祥物或毛绒玩具占据下方中央，裁切得足够近，有可触摸的收藏品质感。
  desc: ''
- title: 表面混合毛茸茸的针织面料、柔软抓绒、亮面模压塑料、半透明果冻材质、铬质点缀，以及橡胶质感的玩具部件。
  desc: ''
- title: 主道具是一个厚重的玩具式小装置或产品物件，坐在毛绒主体上或抱住它。
  desc: ''
- title: 配色以电光青柠为基底，搭配青色、天蓝、品红、薰衣草紫、黄色、白色、铬灰，以及少量黑色细节。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{SUBJECT}'
  desc: 摄影主体，如：一位穿短袖的年轻男生 / 一对牵手的情侣
- kv_var: 主体动作
  style_var: '{SUBJECT_ACTION}'
  desc: 主体在做什么，如：仰头大笑 / 单手举起饮料
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
  desc: 手持或陈列的物件，如：一罐气泡水 / 复古随身听
- kv_var: 场景地点
  style_var: '{LOCATION}'
  desc: 拍摄地点，如：东京街头便利店门口
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
  desc: 补充画面层次的元素，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{MAIN_TEXT}'
  desc: 画面最大的标题字，如：SUMMER DROP
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
  desc: 小字装饰信息，如：LIMITED 2024 / NEW ARRIVAL
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
  desc: 单个符号或小图案，如：✦ / ★ / 涂鸦箭头
- kv_var: 服装造型
  style_var: '{WARDROBE_STYLE}'
  desc: 如：oversize 卫衣 + 工装短裤 + 厚底鞋
prompt: 'Create a 16:9 finished raster image in the "Neon Plush Gadget Pop 3D Style". Subject: {SUBJECT}. Action: {SUBJECT_ACTION}. Prop/Product: {PRODUCT_OR_PROP}. Location: {LOCATION}. Background
  elements: {BACKGROUND_ELEMENTS}. Main text: {MAIN_TEXT}. Secondary text: {SECONDARY_TEXT}. Accent symbol: {ACCENT_SYMBOL}. Wardrobe/styling: {WARDROBE_STYLE}. Style fidelity anchors: the core visual anchors of this style.
  Source content to avoid: watermarks, real logos, and commercial advertising. Apply these style rules: acid lime or neon yellow-green studio background, oversized fuzzy plush main subject, rounded inflated toy shapes, visible
  knit or fleece texture, chunky gadget or product prop, glossy molded plastic, translucent jelly details, chrome highlights, hot-pink burst graphics, checkerboard cards, sticker labels, tiny tags, playful
  Y2K icon grammar, foreground shelf edge when useful, high-key commercial studio lighting, soft bloom, polished 3D product-render finish, close front three-quarter product perspective, tactile collectible
  mood. Important content rule: preserve the style anchors first, then change the original content completely with new subject, prop, display text, colors within the palette, and story premise. Avoid: watermark,
  username, creator ID, platform logo, QR code, signature, brand mark, app mark, copied source text, VIP, membership card, camera-on-head, green dragon, dinosaur, monster head, blue snout, FILLTER tag,
  barcode spray can, copied flower button, copied pink basketball, exact checkerboard card, flat vector art, dark cinematic realism, natural landscape, detailed real room, long readable paragraphs, corporate
  interface.'
