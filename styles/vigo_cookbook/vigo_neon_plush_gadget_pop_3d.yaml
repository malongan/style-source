features:
- title: 酸性青柠或霓虹黄绿影棚背景主导画面，带柔和渐变辉光，而非写实场景。
  desc: ''
- title: 单个超大号毛绒吉祥物或毛绒玩具占据下方中央，裁切得足够近，有可触摸的收藏品质感。
  desc: ''
- title: 表面混合毛茸茸的针织面料、柔软抓绒、亮面模压塑料、半透明果冻材质、铬质点缀，以及橡胶质感的玩具部件。
  desc: ''
- title: 主道具是一个厚重的玩具式小装置或产品物件，坐在毛绒主体上或抱住它。
  desc: ''
- title: 配色以电光青柠为基底，搭配青色、天蓝、品红、薰衣草紫、黄色、白色、铬灰，以及少量黑色细节。
  desc: ''
