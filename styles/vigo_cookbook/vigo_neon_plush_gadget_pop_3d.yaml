summary: 光泽 玩具广告3D 风格，由 酸性青柠 影棚 背景幕s ，超大 模糊毛绒吉祥物s ，粗糙的科技道具，柔软纹理色块 表面s ，半透明塑料配件，棋盘卡片 贴纸感 图标s ， s ，热粉爆图形，和 明亮 商业 光线。
