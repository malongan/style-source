name: 黄黑漫画食品小志广告风格
category: vigo_cookbook
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 密集的日式漫画风食品与产品小志广告风格：黑墨线稿、黄色广告色块、米色纸张底色、戏剧化裁切的角色分格、亮面插画主产品、巨大扭曲的展示字体、小号中文编辑文案，以及粗糙印刷质感。
tags:
- VigoCookbook
- Other
triggers:
- Yellow Black Manga Food Zine Ad Style
features:
- title: 以黑、暖黄、米白为主，少量红绿点缀的配色，黄色占据大面积广告色块。
  desc: ''
- title: 密集的漫画页拼贴版式：对角线切分、矩形内嵌分格，几乎没有闲置空间。
  desc: ''
- title: 巨大的扭曲展示字体，沿透视弯折或竖向堆叠，像印刷出来的响亮拟声效果。
  desc: ''
- title: 粗重的黑色主线、速度线排线、汗滴符号、闪光符号，以及粗糙的手绘墨线漫画轮廓。
  desc: ''
- title: 一个超大号亮面插画产品或食品物件位于下方前景，带绘画感高光。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{SUBJECT}'
  desc: 摄影主体，如：一位穿短袖的年轻男生 / 一对牵手的情侣
- kv_var: 主体动作
  style_var: '{SUBJECT_ACTION}'
  desc: 主体在做什么，如：仰头大笑 / 单手举起饮料
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
  desc: 手持或陈列的物件，如：一罐气泡水 / 复古随身听
- kv_var: 场景地点
  style_var: '{LOCATION}'
  desc: 拍摄地点，如：东京街头便利店门口
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
  desc: 补充画面层次的元素，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{MAIN_TEXT}'
  desc: 画面最大的标题字，如：SUMMER DROP
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
  desc: 小字装饰信息，如：LIMITED 2024 / NEW ARRIVAL
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
  desc: 单个符号或小图案，如：✦ / ★ / 涂鸦箭头
- kv_var: 服装造型
  style_var: '{WARDROBE_STYLE}'
  desc: 如：oversize 卫衣 + 工装短裤 + 厚底鞋
prompt: 'Create a 16:9 raster image in the Yellow Black Manga Food Zine Ad Style. Subject: {SUBJECT}. Subject action: {SUBJECT_ACTION}. Hero product or prop: {PRODUCT_OR_PROP}. Location: {LOCATION}.
  Background and secondary elements: {BACKGROUND_ELEMENTS}. Main headline text in Chinese: {MAIN_TEXT}. Secondary Chinese copy or microcopy: {SECONDARY_TEXT}. Accent symbol: {ACCENT_SYMBOL}. Wardrobe or
  styling: {WARDROBE_STYLE}. Preserve these style fidelity anchors: the core visual anchors of this style. Avoid these source-content elements: watermarks, real logos, and commercial advertising. Build a dense black, warm yellow, and cream
  manga advertorial page with diagonal panel cuts, thick hand-inked keylines, speed hatching, sweat-drop marks, sparkle symbols, one dramatic cropped manga reaction panel, an oversized glossy illustrated
  hero object in the foreground, boxed Chinese editorial copy, a vertical tag label, a strip of mini comic panels, halftone speckle, scanned paper grain, and imperfect print registration. Keep the style
  loud, humorous, appetizing or product-focused, high-contrast, and hand-drawn. Change all content from the reference image while keeping the visual language.'
