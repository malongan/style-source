- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
- kv_var: 场景地点
  style_var: '{LOCATION}'
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
- kv_var: 主文案
  style_var: '{MAIN_TEXT}'
