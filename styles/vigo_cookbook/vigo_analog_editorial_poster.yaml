features:
- '**Preserve the 核心 visual identity: A quiet 模拟-future 编辑海报 风格 using warm 奶油色 paper, 超大 黑 neo-grotesk 字体排版, strict 网格 rules, 复古 technology still life, pale-蓝 半透明 interface 面板s, 植物 前景 accents, and 微小 bilingual in格式ion design.**'
- '**Place 产品或道具 in LOCATION 作为 restrained 主角物体.**'
- '**Typography: set 主文字 as very 大 黑 neo-grotesk 类型.**'
- '**Use 强调符号 as a sparse graphic mark.**'
