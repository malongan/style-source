features:
- '**Warm 象牙白 or pale 奶油色 paper 背景 with very 大 un杂乱 negative 空间.**'
- '**One 超大 照片real produce 主角 裁切 近 an 边缘, plus one much 小er echo produce item.**'
- '**Produce 表面 is 光泽, 圆形ed, 明亮, 柔软ly airbrushed, and s亮ly 海报化 rather than documentary.**'
- '**Hard scale contrast 之间 produce and 字体排版: 主体 dominates the lower or 侧面 field while 类型 crowds the upper or 对面 侧面.**'
- '**Large 黑 标题 构建 撕裂, 印章ed, 粗糙-brush CJK-灵感 blocks with uneven 边缘s and dry 墨水 质感.**'
