triggers:
- Market Brush Produce Poster Style
features:
- title: 暖象牙或浅米色纸张背景，留出非常大的清爽负空间。
  desc: ''
- title: 一个超大号照片级农产品主角被贴近边缘裁切，另有一个小得多的呼应农产品。
  desc: ''
- title: 农产品表面亮泽、圆润、明亮，带轻柔喷绘感与轻微色阶化，而不是纪实质感。
  desc: ''
- title: '农产品与字体之间形成强烈的比例对比：主体主导下半部或侧边区域，字体则挤在上方或另一侧。'
  desc: ''
- title: 大型黑色大标题由撕裂、压印、粗毛笔感的 CJK 启发式字块构成，边缘不均，带干墨质感。
  desc: ''
