summary: 疏朗的生鲜市集海报体系：暖象牙纸底、一个超大号亮泽农产品主角、一个更小的呼应产品、暴烈的黑色手剪毛笔字体、纤细的编辑式页眉文字，以及底部极小的印章式注记。
tags:
- VigoCookbook
