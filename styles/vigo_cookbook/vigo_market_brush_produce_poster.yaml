name: 市集毛笔农产品海报风格
category: vigo_cookbook
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 疏朗的生鲜市集海报体系：暖象牙纸底、一个超大号亮泽农产品主角、一个更小的呼应产品、暴烈的黑色手剪毛笔字体、纤细的编辑式页眉文字，以及底部极小的印章式注记。
tags:
- VigoCookbook
- Other
triggers:
- Market Brush Produce Poster Style
features:
- title: 暖象牙或浅米色纸张背景，留出非常大的清爽负空间。
  desc: ''
- title: 一个超大号照片级农产品主角被贴近边缘裁切，另有一个小得多的呼应农产品。
  desc: ''
- title: 农产品表面亮泽、圆润、明亮，带轻柔喷绘感与轻微色阶化，而不是纪实质感。
  desc: ''
- title: '农产品与字体之间形成强烈的比例对比：主体主导下半部或侧边区域，字体则挤在上方或另一侧。'
  desc: ''
- title: 大型黑色大标题由撕裂、压印、粗毛笔感的 CJK 启发式字块构成，边缘不均，带干墨质感。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{SUBJECT}'
  desc: 摄影主体，如：一位穿短袖的年轻男生 / 一对牵手的情侣
- kv_var: 主体动作
  style_var: '{SUBJECT_ACTION}'
  desc: 主体在做什么，如：仰头大笑 / 单手举起饮料
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
  desc: 手持或陈列的物件，如：一罐气泡水 / 复古随身听
- kv_var: 场景地点
  style_var: '{LOCATION}'
  desc: 拍摄地点，如：东京街头便利店门口
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
  desc: 补充画面层次的元素，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{MAIN_TEXT}'
  desc: 画面最大的标题字，如：SUMMER DROP
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
  desc: 小字装饰信息，如：LIMITED 2024 / NEW ARRIVAL
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
  desc: 单个符号或小图案，如：✦ / ★ / 涂鸦箭头
- kv_var: 服装造型
  style_var: '{WARDROBE_STYLE}'
  desc: 如：oversize 卫衣 + 工装短裤 + 厚底鞋
prompt: 'Create a 16:9 image in the Market Brush Produce Poster Style. Subject: {SUBJECT}. Action: {SUBJECT_ACTION}. Prop/Product: {PRODUCT_OR_PROP}. Location: {LOCATION}. Background elements:
  {BACKGROUND_ELEMENTS}. Main text treatment: {MAIN_TEXT}. Secondary text treatment: {SECONDARY_TEXT}. Accent symbol: {ACCENT_SYMBOL}. Wardrobe/styling: {WARDROBE_STYLE}. Style fidelity anchors that must
  remain visible: the core visual anchors of this style. Source content to avoid: watermarks, real logos, and commercial advertising. Apply these style rules: warm ivory uncoated paper background with large clean negative space; one oversized
  glossy photoreal fruit or vegetable hero cropped near the edge; one smaller echo produce item or small market prop; large rough black torn-brush CJK-inspired headline blocks with dry ink texture; tiny
  top editorial header line; bottom row of small serif captions, stamps, stars, numbers, and parenthesis marks; palette limited to ivory, black, one saturated produce color, and small natural green accents;
  shallow product-still-life depth with minimal shadow; slight paper grain, ink breakup, soft highlight bloom, and analog poster softness. Important content rule: match the visual style first, then change
  the source content with new produce, new text, new props, and a new story premise.'
id: vigo_market_brush_produce_poster
code: ''
