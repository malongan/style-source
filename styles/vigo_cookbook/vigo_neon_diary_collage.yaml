- '**Documentary 户外 照片-拼贴 主体 剪影s with 粗糙 白 keyline 边缘s and 混合 scale.**'
- '**Acid 绿 and 白 超大 窄体 标题 字体排版 on 倾斜 黑 标签 strips.**'
