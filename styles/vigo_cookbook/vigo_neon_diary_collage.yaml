name: 霓虹户外日记长图拼贴风格
category: vigo_cookbook
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 竖长移动端优先的户外日记海报体系：炭黑画布、纪实动感照片剪贴、酸性绿动态标题、撕裂纸面板、手绘箭头、贴纸标签、编号分节，以及密集的社交笔记节奏。
tags:
- VigoCookbook
- Other
triggers:
- Neon Outdoor Diary Longform Collage Style
features:
- title: 炭黑背景，带细窄的竖向导览框，以及高密度堆叠的分节。
  desc: ''
- title: 纪实户外照片拼贴的主体剪贴，带粗糙的白色描边轮廓与大小混合的尺度。
  desc: ''
- title: 酸性绿与白色的超大号窄体标题，置于倾斜的黑色标签条上。
  desc: ''
- title: 橙色手绘箭头、回环、闪电符号、路线，以及内容块周围的小型涂鸦爆发图形。
  desc: ''
- title: 撕裂的笔记本纸或胶带面板，用作日程、规则或清单分节。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{SUBJECT}'
  desc: 摄影主体，如：一位穿短袖的年轻男生 / 一对牵手的情侣
- kv_var: 主体动作
  style_var: '{SUBJECT_ACTION}'
  desc: 主体在做什么，如：仰头大笑 / 单手举起饮料
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
  desc: 手持或陈列的物件，如：一罐气泡水 / 复古随身听
- kv_var: 场景地点
  style_var: '{LOCATION}'
  desc: 拍摄地点，如：东京街头便利店门口
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
  desc: 补充画面层次的元素，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{MAIN_TEXT}'
  desc: 画面最大的标题字，如：SUMMER DROP
- kv_var: 服装造型
  style_var: '{WARDROBE_STYLE}'
  desc: 如：oversize 卫衣 + 工装短裤 + 厚底鞋
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
  desc: 小字装饰信息，如：LIMITED 2024 / NEW ARRIVAL
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
  desc: 单个符号或小图案，如：✦ / ★ / 涂鸦箭头
prompt: 'Create an 16:9 raster poster in the Neon Outdoor Diary Longform Collage Style. Subject: {SUBJECT}. Action: {SUBJECT_ACTION}. Prop or product: {PRODUCT_OR_PROP}. Location: {LOCATION}.
  Background details: {BACKGROUND_ELEMENTS}. Wardrobe or styling: {WARDROBE_STYLE}. Main graphic text: {MAIN_TEXT}. Secondary microcopy texture: {SECONDARY_TEXT}. Accent symbol: {ACCENT_SYMBOL}. Preserve
  these style anchors: the core visual anchors of this style. Avoid this source content: watermarks, real logos, and commercial advertising. Use a charcoal black mobile poster canvas, acid green and white slanted headline strips, orange hand-drawn
  arrows and route-line doodles, rough white cutout borders, torn notebook-paper panels, numbered diary sections, dense social-note annotations, sticker-like labels, gritty outdoor documentary photo collage,
  paper grain, scuffed texture, and energetic irregular alignment. If vertical, make it feel like an extra-tall continuous scrolling long poster close to the reference image length, with five or more stacked
  information chapters. If horizontal, compress the same layered diary system into a wide editorial collage without losing density.'
id: vigo_neon_diary_collage
code: ''
