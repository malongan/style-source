features:
- title: 米色海报纸边框，画面缩进于纸张之内，而不是出血到边缘。
  desc: ''
- title: 松散童趣的马克笔涂鸦背景色块，以明亮天空青与酸柠檬绿为主，留有不规则白色空隙。
  desc: ''
- title: 扁平插画，没有写实纵深、没有投影、没有渐变，也没有精修过的矢量平滑。
  desc: ''
- title: 厚重、不完美的黑或深棕描边，笔压有变化，笔端圆润，边缘可见手绘抖动的痕迹。
  desc: ''
- title: 一个超大号简单主体占据海报中下部，配以极小的辅助道具或角色形成体量对比。
  desc: ''
