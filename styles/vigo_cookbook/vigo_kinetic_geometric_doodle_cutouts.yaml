name: 动态几何涂鸦剪纸
category: vigo_cookbook
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 疏朗、童趣的插画体系：角色或物件由超大号扁平几何色块、松散的黑色涂鸦线条、纸张颗粒，以及暖米色背景上轻盈的偏心动势组合而成。
tags:
- VigoCookbook
- Other
triggers:
- Kinetic Geometric Doodle Cutouts
features:
- title: 暖米色纸底，主体四周留出充裕的空白。
  desc: ''
- title: 一个居中的形象、物件或小场景，由若干超大号几何块拼成。
  desc: ''
- title: 扁平矢量化形状，带轻微印刷颗粒、干笔斑点与柔和喷涂渐变。
  desc: ''
- title: 不对称的动态姿势，四肢或部件呈斜向角度，仿佛正处于运动中。
  desc: ''
- title: 仅在手脚、鞋、头发、轮子、把手或动势符号等小细节上使用粗黑手绘轮廓笔触。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{SUBJECT}'
  desc: 摄影主体，如：一位穿短袖的年轻男生 / 一对牵手的情侣
- kv_var: 主体动作
  style_var: '{SUBJECT_ACTION}'
  desc: 主体在做什么，如：仰头大笑 / 单手举起饮料
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
  desc: 手持或陈列的物件，如：一罐气泡水 / 复古随身听
- kv_var: 场景地点
  style_var: '{LOCATION}'
  desc: 拍摄地点，如：东京街头便利店门口
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
  desc: 补充画面层次的元素，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{MAIN_TEXT}'
  desc: 画面最大的标题字，如：SUMMER DROP
- kv_var: 服装造型
  style_var: '{WARDROBE_STYLE}'
  desc: 如：oversize 卫衣 + 工装短裤 + 厚底鞋
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
  desc: 小字装饰信息，如：LIMITED 2024 / NEW ARRIVAL
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
  desc: 单个符号或小图案，如：✦ / ★ / 涂鸦箭头
prompt: 'Create a 16:9 illustration in the Kinetic Geometric Doodle Cutouts style. Subject: {SUBJECT}. Action: {SUBJECT_ACTION}. Prop or object: {PRODUCT_OR_PROP}. Setting: {LOCATION}. Background
  details: {BACKGROUND_ELEMENTS}. Wardrobe or styling: {WARDROBE_STYLE}. Optional text treatment: {MAIN_TEXT}; secondary micro marks: {SECONDARY_TEXT}; accent symbol: {ACCENT_SYMBOL}. Style fidelity lock:
  the core visual anchors of this style. Content to avoid: watermarks, real logos, and commercial advertising. Use a warm cream paper background with generous negative space. Construct the subject from five to nine oversized flat geometric
  color blocks: tomato orange, cobalt blue, magenta pink, lilac violet, mint green, golden yellow, black, and small white accents. Include subtle risograph grain, dry-brush speckle, and one or two soft
  sprayed gradients inside selected shapes. Add sparse loose black hand-drawn contour lines only for small expressive details and motion marks. Keep the image flat, airy, asymmetrical, buoyant, handmade,
  and print-like. Do not use realistic anatomy, 3D rendering, dense scenery, logos, signatures, watermarks, QR codes, or polished fonts.'
id: vigo_kinetic_geometric_doodle_cutouts
code: ''
