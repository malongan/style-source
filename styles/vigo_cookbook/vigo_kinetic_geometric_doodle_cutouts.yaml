- Kinetic Geometric Doodle Cutouts
features:
- '* *温暖奶油色 纸面与空 空间 周围慷慨的主体。* *'
- '* *一个中心 人物 物体、或小几个构建 超大几何块。* *'
- '* *扁平的矢形状量状，带有微妙的印刷ed 纹理 斑点，干柔软 渐变刷和喷雾。* *'
- '* *四肢或部分成角度的对称动作姿势，仿佛对角线是中等动作。* *'
- '* *粗黑 手绘轮廓笔画仅适用于手、鞋、头发、轮子、手柄或运动标记等小细节。* *'
