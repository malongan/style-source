features:
- '**Preserve the 核心 visual identity: 极繁主义 Japanese 城市-旅行拼贴 风格 with 粗体 destination 字体排版, cute 贴纸 元素s, 漫画 气泡s, 剪影 时尚摄影, 半调 城市 背景s, and 剪贴簿 编辑 layout.**'
- '**Use 背景元素 for 城市 背景, 植物 details, signage, 质感, and 旅行-拼贴 con文字.**'
- '**Use a 极繁ist Japanese 旅行 剪贴簿 拼贴布局.**'
- '**Place the 剪裁主体 大 in the 中心 ，搭配 贴纸感 白 边缘.**'
