summary: 粗粝 Y2K 照片montage 风格 that combines 广角 闪光摄影, floating desktop-like interface 碎片s, 厚 electric-蓝 marker outlines, 手绘 graffiti 字体, and dense 模拟 噪点 成 混乱 personal-screen 拼贴.
tags:
- VigoCookbook
- Other
triggers:
- Y2K Mirror UI Scribble Collage Style
features:
- '**广角 闪光-照片 base 层 with exaggerated 近 前景 scale and 压缩 room depth.**'
- '**Very 高 可见 纹理, 数字 噪点, 锐利ened 边缘s, and s亮ly 脏 scan 质感 横穿 whole 图像.**'
- '**高密度 拼贴布局 where 照片 碎片s, 半透明 UI 窗口s, pop-up 卡片s, and 小 面板s float 覆盖 scene.**'
- '**One 厚 electric-蓝 手绘 outline or route line wraps 周围 the 主要 主体 or cuts 穿过 the composition.**'
- '**Large 白 graffiti-like 手写 标题 字体 sits 近 an upper 角落, irregular and brushy rather than typographic.**'
variables:
- kv_var: 变量
  style_var: 说明
  desc: ''
- kv_var: '`SUBJECT`'
  style_var: new central person, object, or activity anchor
  desc: ''
- kv_var: '`SUBJECT_ACTION`'
  style_var: changed action or pose for the central subject
  desc: ''
- kv_var: '`PRODUCT_OR_PROP`'
  style_var: new prop or product-like object that drives the story
  desc: ''
- kv_var: '`LOCATION`'
  style_var: changed interior or urban environment
  desc: ''
- kv_var: '`BACKGROUND_ELEMENTS`'
  style_var: supporting collage objects, panels, UI fragments, and texture details
  desc: ''
- kv_var: '`MAIN_TEXT`'
  style_var: large expressive handwritten headline text
  desc: ''
prompt: 'Create a {ASPECT_RATIO} gritty Y2K flash-photo UI collage in the Y2K Mirror UI Scribble Collage Style. New content: {SUBJECT} is {SUBJECT_ACTION} with {PRODUCT_OR_PROP} in {LOCATION}. Supporting scene and collage details: {BACKGROUND_ELEMENTS}. Wardrobe and styling: {WARDROBE_STYLE}. Use a real photographic wide-angle phone-camera base with hard flash, blown highlights, reflective surfaces, heavy grain, sharpened digital noise, rough scan texture, and casual off-axis cropping. Layer fictional, unbranded desktop/mobile-like UI fragments over the photo: translucent rounded panels, tiny image thumbnails, simplified alert cards, small blue action buttons, and generic microcopy reading {SECONDARY_TEXT}. Add a large irregular white hand-drawn graffiti headline reading {MAIN_TEXT}, plus a thick electric-blue marker outline or path wrapping the subject, and include the accent symbol {ACCENT_SYMBOL} as a small drawn/sticker mark. Preserve these style anchors: {STYLE_FIDELITY_ANCHORS}. Change
  the content and avoid these source details: {SOURCE_CONTENT_TO_AVOID}. No real logos, no real app icons, no watermark, no QR code, no copied names, no recognizable celebrity, no exact source layout.'
