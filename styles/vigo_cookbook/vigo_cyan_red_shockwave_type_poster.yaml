triggers:
- Cyan Red Shockwave Type Poster Style
features:
- title: 高饱和青色背景主导整张海报，红色与黄色是仅有的主要点缀色。
  desc: ''
- title: 巨大的红色几何展示字被页边裁切，同时充当文字与建筑结构。
  desc: ''
- title: 一道白色锯齿闪电爆裂形状斜切画面中心，承载主要动势。
  desc: ''
- title: 主体是简化的扁平矢量形，几乎没有明暗塑造，以粗红主线勾边。
  desc: ''
- title: 人物或手部点缀使用实心柠檬黄填充，使其成为图形色块而非写实解剖。
  desc: ''
variables:
