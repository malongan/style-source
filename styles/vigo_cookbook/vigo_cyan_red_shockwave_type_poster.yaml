name: 青红冲击波字体海报风格
category: vigo_cookbook
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: https://x.com/VigoCreativeAI
summary: 扁平插画海报体系：高饱和青色底、超大号红色方块字体、柠檬黄人物点缀、白色锯齿冲击波、粗红主线，以及紧凑的旋转小字。像一张大声量的地域旅行海报，混入漫画冲击力图形与丝网印刷街头招牌。
tags:
- VigoCookbook
- flat
