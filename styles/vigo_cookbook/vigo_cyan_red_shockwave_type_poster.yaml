  style_var: '{PRODUCT_OR_PROP}'
- kv_var: 场景地点
  style_var: '{LOCATION}'
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
- kv_var: 主文案
  style_var: '{MAIN_TEXT}'
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
- kv_var: 点缀符号
