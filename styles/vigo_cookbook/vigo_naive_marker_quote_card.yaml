features:
- title: 纤细的海报卡片构图：一大块浅粉彩内矩形，配粗糙不均的黑色边框。
  desc: ''
- title: 顶部有小号偏心标签或铭牌，下方有极小的字幕牌，都画得像用胶带贴上的纸质标签。
  desc: ''
- title: 单个荒诞的中央物件角色占据中部大部分区域，简化为扁平的堆叠形状。
  desc: ''
- title: 稚拙的手绘黑色马克笔轮廓，线条抖动、粗细不均，可见人的不完美。
  desc: ''
- title: 块状大写蓝色手写字体，排成短促断续的行，字距不规则、基线不齐。
  desc: ''
