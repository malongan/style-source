summary: 竖长的手绘荒诞语录卡片海报体系：粗糙的黑色马克笔轮廓、浅粉彩色块、方块感蓝色字体、歪斜的标签页，以及一个简化成扁平堆叠形状的中央物件角色笑点。
tags:
- VigoCookbook
- naive
