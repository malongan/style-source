triggers:
- Photo Illustration Overlay Poster
features:
- title: '保留核心视觉识别：写实城市照片上叠加一个超大号、高饱和的扁平 2D 卡通形象，另有手绘星星、火花、箭头与漫画符号。'
  desc: ''
- title: 以 LOCATION 作为照片背景或真实场景基底。
  desc: ''
- title: 用 BACKGROUND_ELEMENTS 作为纪实感背景细节与次要语境。
  desc: ''
- title: 用 ACCENT_SYMBOL 做涂鸦、图形符号、火花、箭头等叠加效果。
  desc: ''
- title: 以写实城市街景照片为底层，再在其上合成一个超大号扁平 2D 卡通形象。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{SUBJECT}'
  desc: 摄影主体，如：一位穿短袖的年轻男生 / 一对牵手的情侣
- kv_var: 主体动作
  style_var: '{SUBJECT_ACTION}'
  desc: 主体在做什么，如：仰头大笑 / 单手举起饮料
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
  desc: 手持或陈列的物件，如：一罐气泡水 / 复古随身听
- kv_var: 场景地点
  style_var: '{LOCATION}'
  desc: 拍摄地点，如：东京街头便利店门口
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
  desc: 补充画面层次的元素，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{MAIN_TEXT}'
  desc: 画面最大的标题字，如：SUMMER DROP
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
  desc: 小字装饰信息，如：LIMITED 2024 / NEW ARRIVAL
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
  desc: 单个符号或小图案，如：✦ / ★ / 涂鸦箭头
- kv_var: 服装造型
  style_var: '{WARDROBE_STYLE}'
  desc: 如：oversize 卫衣 + 工装短裤 + 厚底鞋
prompt: 'Create a 16:9 image in the "Photo Illustration Overlay Poster" style.


  Subject: {SUBJECT}.

  Action: {SUBJECT_ACTION}.

  Prop/Product or interaction object: {PRODUCT_OR_PROP}.

  Location/photo background: {LOCATION}.

  Background details: {BACKGROUND_ELEMENTS}.

  Main text: "{MAIN_TEXT}".

  Secondary text/category: "{SECONDARY_TEXT}".

  Accent doodles and graphic effects: {ACCENT_SYMBOL}.

  Character treatment: {WARDROBE_STYLE}.


  Use a realistic city street photo as the base layer, then composite one oversized flat 2D cartoon character on top. The character should use high-saturation color blocking, rough hand-drawn linework,
  exaggerated scale, simple expressive eyes, playful body proportions, and graphic edges. Add small hand-drawn stars, sparks, arrows, motion lines, comic bursts, and doodle marks around the interaction
  point.


  Keep the background photographic and recognizable. Keep the illustrated character deliberately flat, graphic, and poster-like. Avoid copying any watermark, logo, or exact character from the reference
  image. Avoid plush 3D mascots, full-vector backgrounds, dark gritty mood, cyberpunk, and cluttered small text.'
id: vigo_photo_illustration_overlay_poster
code: ''
