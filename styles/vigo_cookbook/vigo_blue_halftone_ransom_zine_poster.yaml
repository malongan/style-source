- title: 高饱和钴蓝主导海报版面，带一圈窄的米白纸边或可见的纸张边缘。
  desc: ''
- title: 大块不规则的撕裂白纸岛屿，每块带锯齿状剪切口，以及轻微阴影或折痕起伏。
  desc: ''
- title: 黑白影印半色调主体剪贴，粗网点、高对比、边缘略微破碎。
  desc: ''
- title: 两三个超大号剪贴主体以扁平拼贴方式排布，而非场景内的写实物件。
  desc: ''
- title: 撕纸条上的马克笔手写字体，基线不齐、字距随意、黑墨不均匀。
  desc: ''
