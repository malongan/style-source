features:
- title: '保留核心视觉识别：极繁主义韩流时尚小志拼贴风格，由居中的人像剪贴、揉皱的单色纸张肌理、倾斜的勒索信字体、张扬的贴纸色块、高饱和青柠/蓝/红点缀，以及底部粗重的报头色带构成。'
  desc: ''
- title: 使用深色揉皱黑纸背景，把 BACKGROUND_ELEMENTS 融入拼贴肌理。
  desc: ''
- title: 主体作大号居中肖像剪贴，带一圈厚重不规则的撕裂白纸边框。
  desc: ''
- title: 添加超大号扭曲展示字体，内容为 MAIN_TEXT，作为倾斜的拼贴层；再加较小的贴纸色块与读取 SECONDARY_TEXT 的侧边编辑注释。
  desc: ''
- title: 使用酸性青柠、电光蓝、警示红、纸白与墨黑。
  desc: ''
variables:
- kv_var: 变量
  style_var: 说明
  desc: ''
- kv_var: '`SUBJECT`'
  style_var: main subject, performer, model, musician, dancer, stylist, or youth-culture character
  desc: ''
- kv_var: '`SUBJECT_ACTION`'
  style_var: looking off-frame, posing with attitude, holding a prop, leaning into the camera, or standing in a cutout portrait pose
  desc: ''
- kv_var: '`PRODUCT_OR_PROP`'
  style_var: compact camera, wired earbuds, lip gloss, denim jacket, cassette, charm bag, safety pin accessory, or styling prop
  desc: ''
- kv_var: '`LOCATION`'
  style_var: studio wall, backstage corner, bedroom mirror, subway entrance, alley poster wall, roof landing, or DIY magazine set
  desc: ''
- kv_var: '`BACKGROUND_ELEMENTS`'
  style_var: crumpled black paper, distressed denim texture, torn white paper edges, photocopy grain, halftone noise, tape marks, and rough scanned shadows
  desc: ''
- kv_var: '`MAIN_TEXT`'
  style_var: oversized warped headline or sticker headline
  desc: ''
prompt: Create a {ASPECT_RATIO} K-pop apocalypse ransom zine poster featuring {SUBJECT} {SUBJECT_ACTION}, styled in {WARDROBE_STYLE}, with {PRODUCT_OR_PROP}. Use a dark crumpled black paper background with
  {BACKGROUND_ELEMENTS}. Place the subject as a large central portrait cutout with a thick irregular torn white paper border. Add oversized warped display typography reading "{MAIN_TEXT}" as a tilted collage
  layer, plus smaller sticker blocks and side editorial captions reading "{SECONDARY_TEXT}". Use acid lime, electric blue, alert red, paper white, and ink black. Add {ACCENT_SYMBOL} near the portrait. Finish
  with a saturated bottom masthead strip, rough photocopy grain, halftone speckles, scan noise, uneven paper shadows, and DIY magazine collage energy. Do not include watermarks, usernames, creator IDs,
  QR codes, platform logos, app marks, copied publication logos, or exact source text.
