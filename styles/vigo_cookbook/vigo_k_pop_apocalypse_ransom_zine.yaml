features:
- '**Preserve the 核心 visual identity: 极繁主义 K-pop 时尚 杂志 拼贴 风格，由 a 中心 肖像 剪影, 揉皱 单色 paper 质感, skewed ransom-note 字体排版, loud 贴纸 blocks, 高饱和 青柠/蓝/红 accents, and a 粗体 底部 masthead band.**'
- '**Use a 暗 揉皱 黑 paper 背景 with 背景元素 worked into the 拼贴 质感.**'
- '**Place the 主体 as a 大 中心 肖像 剪影 ，搭配 厚 irregular 撕裂 白 paper border.**'
- '**Add 超大 扭曲 展示 字体排版 reading 主文字 as a 倾斜 拼贴 层, plus 小er 贴纸 blocks and 侧面 编辑 说明s reading SECONDARY_TEXT.**'
- '**Use 酸性青柠, electric 蓝, alert 红, paper 白, and 墨水 黑.**'
variables:
- kv_var: 变量
  style_var: 说明
  desc: ''
- kv_var: '`SUBJECT`'
  style_var: main subject, performer, model, musician, dancer, stylist, or youth-culture character
  desc: ''
- kv_var: '`SUBJECT_ACTION`'
  style_var: looking off-frame, posing with attitude, holding a prop, leaning into the camera, or standing in a cutout portrait pose
  desc: ''
- kv_var: '`PRODUCT_OR_PROP`'
  style_var: compact camera, wired earbuds, lip gloss, denim jacket, cassette, charm bag, safety pin accessory, or styling prop
  desc: ''
- kv_var: '`LOCATION`'
  style_var: studio wall, backstage corner, bedroom mirror, subway entrance, alley poster wall, roof landing, or DIY magazine set
  desc: ''
- kv_var: '`BACKGROUND_ELEMENTS`'
  style_var: crumpled black paper, distressed denim texture, torn white paper edges, photocopy grain, halftone noise, tape marks, and rough scanned shadows
  desc: ''
- kv_var: '`MAIN_TEXT`'
  style_var: oversized warped headline or sticker headline
  desc: ''
prompt: Create a {ASPECT_RATIO} K-pop apocalypse ransom zine poster featuring {SUBJECT} {SUBJECT_ACTION}, styled in {WARDROBE_STYLE}, with {PRODUCT_OR_PROP}. Use a dark crumpled black paper background with {BACKGROUND_ELEMENTS}. Place the subject as a large central portrait cutout with a thick irregular torn white paper border. Add oversized warped display typography reading "{MAIN_TEXT}" as a tilted collage layer, plus smaller sticker blocks and side editorial captions reading "{SECONDARY_TEXT}". Use acid lime, electric blue, alert red, paper white, and ink black. Add {ACCENT_SYMBOL} near the portrait. Finish with a saturated bottom masthead strip, rough photocopy grain, halftone speckles, scan noise, uneven paper shadows, and DIY magazine collage energy. Do not include watermarks, usernames, creator IDs, QR codes, platform logos, app marks, copied publication logos, or exact source text.
