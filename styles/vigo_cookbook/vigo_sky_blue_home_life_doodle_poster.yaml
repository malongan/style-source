name: 天蓝家居生活涂鸦海报风格
category: vigo_cookbook
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 稚拙扁平海报体系：整幅天蓝色底色、一个粗糙的房子形白色内嵌区、巨大的不规整黑色手写字、小型徽章标签，以及用马克笔涂鸦笔法绘制的、粗轮廓的简约家居生活卡通场景。
tags:
- VigoCookbook
- Other
triggers:
- Sky Blue Home Life Doodle Poster Style
features:
- title: 满版粉彩天蓝背景构成海报的外层底色。
  desc: ''
- title: 一个带粗糙黑色轮廓的大号米白房子形内嵌区容纳整个场景。
  desc: ''
- title: 超大号黑色手写标题位于顶部，笔画粗细不均、俏皮失衡。
  desc: ''
- title: 一个小型红色圆角胶囊徽章与倾斜副标题文字，增添活动海报的活力。
  desc: ''
- title: 角色与道具使用粗重抖动的黑色马克笔轮廓，扁平填色，几乎没有明暗。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{SUBJECT}'
  desc: 摄影主体，如：一位穿短袖的年轻男生 / 一对牵手的情侣
- kv_var: 主体动作
  style_var: '{SUBJECT_ACTION}'
  desc: 主体在做什么，如：仰头大笑 / 单手举起饮料
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
  desc: 手持或陈列的物件，如：一罐气泡水 / 复古随身听
- kv_var: 场景地点
  style_var: '{LOCATION}'
  desc: 拍摄地点，如：东京街头便利店门口
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
  desc: 补充画面层次的元素，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{MAIN_TEXT}'
  desc: 画面最大的标题字，如：SUMMER DROP
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
  desc: 小字装饰信息，如：LIMITED 2024 / NEW ARRIVAL
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
  desc: 单个符号或小图案，如：✦ / ★ / 涂鸦箭头
- kv_var: 服装造型
  style_var: '{WARDROBE_STYLE}'
  desc: 如：oversize 卫衣 + 工装短裤 + 厚底鞋
prompt: 'Create an original 16:9 poster illustration in the Sky Blue Home Life Doodle Poster style. Preserve these style anchors: the core visual anchors of this style. Avoid this source content: watermarks, real logos, and commercial advertising.
  Use a full pastel sky-blue outer field and a large rough off-white house-shaped inset with thick wobbly black marker outlines. Put a huge uneven black hand-lettered headline reading {MAIN_TEXT} across
  the top, plus {SECONDARY_TEXT} as a small slanted support label and {ACCENT_SYMBOL} as a small graphic accent. Inside the house inset, show {SUBJECT} {SUBJECT_ACTION} with {PRODUCT_OR_PROP} in {LOCATION}.
  Add {BACKGROUND_ELEMENTS} as simple flat home icons. Dress or style the subject with {WARDROBE_STYLE}. Use chunky rounded cartoon anatomy, oversized hands or props when useful, flat poster colors, no
  gradients, naive flattened perspective, casual marker wobble, and a youthful handmade home-event mood. All text, characters, props, and scene details must be original and must not copy the reference.'
id: vigo_sky_blue_home_life_doodle_poster
code: ''
