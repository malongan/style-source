name: 蓝色 HUD 微距创作者科技海报
category: vigo_cookbook
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 高密度蓝色创作者科技广告风格：以微距 3D 硬件主角、超大号罗纹手套、电光蓝 HUD 面板、超大字号窄体排版、亮面玻璃卡片，以及一枚暖金色性能徽章构成。
tags:
- VigoCookbook
- premium
- 3D
- creator-tech
- macro
- product
- ad
- HUD-heavy
triggers:
- Blue HUD Macro Creator Tech Poster
features:
- title: 微距产品主角构图，物体巨大、倾斜，居中或略偏中心，充满画面。
  desc: ''
- title: 超大号罗纹手套或可弯曲的条纹手指从画框边缘切入，实体化地框住产品。
  desc: ''
- title: 深度亮面 3D 渲染，圆润的塑料、橡胶、金属与玻璃表面，而非扁平海报或手绘插画。
  desc: ''
- title: 冷调电光蓝背景，深藏青渐变、对角线光束、淡网格线，以及雾状体积辉光。
  desc: ''
- title: 超大号窄体块状主标题，白色或冰灰色，部分被产品遮挡或被画框裁切。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{SUBJECT}'
  desc: 摄影主体，如：一位穿短袖的年轻男生 / 一对牵手的情侣
- kv_var: 主体动作
  style_var: '{SUBJECT_ACTION}'
  desc: 主体在做什么，如：仰头大笑 / 单手举起饮料
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
  desc: 手持或陈列的物件，如：一罐气泡水 / 复古随身听
- kv_var: 场景地点
  style_var: '{LOCATION}'
  desc: 拍摄地点，如：东京街头便利店门口
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
  desc: 补充画面层次的元素，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{MAIN_TEXT}'
  desc: 画面最大的标题字，如：SUMMER DROP
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
  desc: 小字装饰信息，如：LIMITED 2024 / NEW ARRIVAL
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
  desc: 单个符号或小图案，如：✦ / ★ / 涂鸦箭头
- kv_var: 服装造型
  style_var: '{WARDROBE_STYLE}'
  desc: 如：oversize 卫衣 + 工装短裤 + 厚底鞋
prompt: 'Create a 16:9 image in the "Blue HUD Macro Creator Tech Poster" visual style.


  Subject: {SUBJECT}

  Action: {SUBJECT_ACTION}

  Prop/Product: {PRODUCT_OR_PROP}

  Location: {LOCATION}

  Background: {BACKGROUND_ELEMENTS}

  Main text: {MAIN_TEXT}

  Secondary text: {SECONDARY_TEXT}

  Accent symbol: {ACCENT_SYMBOL}

  Wardrobe/styling: {WARDROBE_STYLE}

  Style fidelity anchors: the core visual anchors of this style

  Source content to avoid: watermarks, real logos, and commercial advertising


  Apply these style rules:

  - Macro 3D creator-tech product hero, large and tilted, physically framed by oversized ribbed gloves or striped synthetic fingers cropped by the frame.

  - Cold electric-blue and deep navy technology background with diagonal light streaks, faint grid lines, mist, bloom, and glass HUD panels.

  - Large extra-bold condensed all-caps headline in white or icy gray, cropped or partly occluded behind the product.

  - Translucent rounded feature cards with radial meters, pill bars, small icons, and compact technical labels.

  - One warm gold or amber performance badge, used as the only major warm contrast accent.

  - Glossy plastic, rubber, glass, brushed metal, beveled product edges, cyan rim light, and dramatic black shadows.

  - Dense commercial product poster hierarchy with overlapping product, gloves, type, badges, and interface graphics.

  - Use real-market creator hardware categories as inspiration only; do not render real brand marks or exact product replicas.


  Avoid:

  - watermarks, real logos, low quality, distorted text


  Important content rule: match the extracted style first, then change the exact source content. Product categories may be camera-adjacent when requested, but all outputs must stay brandless, non-identical,
  and newly worded.'
id: vigo_blue_hud_macro_product_poster
code: ''
