triggers:
- Urban Transit Doodle Diary Style
features:
- '**Preserve the 核心 visual identity: A RAW格式 城市 快照 treated like a personal visual 日记, combining real 公开-空间 照片y with 粗体 手绘 漫画 overlays, 手写 旅行 notes, 高饱和 cartoon faces, and a 大 前景 gesture.**'
- '**Keep the base 图像 感觉 like an imperfect phone 快照 ，从 real 公开 城市 空间, not a polished 海报 shoot.**'
- '**Layer 手绘 notes, arrows, 贴纸感 marks, and cartoon facial edits 覆盖 照片 while keeping the underlying 街头 scene readable.**'
- '**Use 高饱和 accent colors only for 涂鸦s, gestures, 标签s, and emphasis marks; let the 照片ic 背景 stay RAW格式 and 压缩.**'
- '**Make 主文字 and SECONDARY_TEXT 触感 手写, diaristic, and locally placed rather than 类型set as 干净 branding.**'
variables:
- kv_var: 变量
  style_var: 说明
  desc: ''
- kv_var: '`SUBJECT`'
  style_var: main person, group, object, or scene focus
  desc: ''
- kv_var: '`SUBJECT_ACTION`'
  style_var: what the subject is doing
  desc: ''
- kv_var: '`PRODUCT_OR_PROP`'
  style_var: object, product, ticket, bag, food, device, or symbolic hand prop
  desc: ''
- kv_var: '`LOCATION`'
  style_var: dense public urban location such as metro, bus, market, hallway, escalator, diner, or station platform
  desc: ''
- kv_var: '`BACKGROUND_ELEMENTS`'
  style_var: realistic crowd, signage, rails, doors, lights, posters, floor markings, reflections, and compressed phone-photo details
  desc: ''
- kv_var: '`MAIN_TEXT`'
  style_var: large handwritten diary title or location note
  desc: ''
prompt: Create a {ASPECT_RATIO} image in urban-transit-doodle-diary-style featuring {SUBJECT} {SUBJECT_ACTION}, with {PRODUCT_OR_PROP}, set in {LOCATION}. Include {BACKGROUND_ELEMENTS}, main text "{MAIN_TEXT}", secondary text "{SECONDARY_TEXT}", {ACCENT_SYMBOL}, and {WARDROBE_STYLE}.
