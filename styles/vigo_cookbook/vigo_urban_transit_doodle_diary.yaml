triggers:
- Urban Transit Doodle Diary Style
features:
- title: '保留核心视觉识别：把粗粝的都市抓拍当作私人视觉日记，真实公共空间摄影，结合粗放的手绘漫画叠加、手写旅行笔记、高饱和卡通脸，以及一个大型前景手势。'
  desc: ''
- title: 底层图像要像真实城市公共空间里不完美的手机抓拍，而不是精修的海报拍摄。
  desc: ''
- title: 在照片上叠加手绘笔记、箭头、贴纸式符号与卡通面部改写，同时保持底层街景可读。
  desc: ''
- title: 高饱和点缀色只用于涂鸦、手势、标签与强调符号；摄影背景保持粗粝与压缩感。
  desc: ''
- title: 让 MAIN_TEXT 与 SECONDARY_TEXT 像手写、日记式的随手标注，而不是排成干净品牌的字体。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{SUBJECT}'
- kv_var: 主体动作
  style_var: '{SUBJECT_ACTION}'
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
- kv_var: 场景地点
  style_var: '{LOCATION}'
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
- kv_var: 主文案
  style_var: '{MAIN_TEXT}'
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
- kv_var: 服装造型
  style_var: '{WARDROBE_STYLE}'
prompt: Create a 16:9 image in urban-transit-doodle-diary-style featuring {SUBJECT} {SUBJECT_ACTION}, with {PRODUCT_OR_PROP}, set in {LOCATION}. Include {BACKGROUND_ELEMENTS}, main text "{MAIN_TEXT}",
  secondary text "{SECONDARY_TEXT}", {ACCENT_SYMBOL}, and {WARDROBE_STYLE}.
id: vigo_urban_transit_doodle_diary
code: ''
