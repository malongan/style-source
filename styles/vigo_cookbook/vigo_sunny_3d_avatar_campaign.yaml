name: 阳光 3D 虚拟形象营销企划风格
category: vigo_cookbook
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 明亮的社媒营销企划海报风格：由亮面玩具质感 3D 虚拟形象、高饱和蓝天户外布光、夸张广角透视、超大号倾斜标题字体，以及霓虹手绘动势符号构成。
tags:
- VigoCookbook
- Other
triggers:
- Sunny 3D Avatar Campaign Style
features:
- title: 亮面风格化 3D 虚拟形象渲染：光滑的玩偶感面部、圆润的手、柔软的塑料质感皮肤，以及简化而传神的眼睛。
  desc: ''
- title: 极限阳光户外广告布光：清晰高光、干净阴影，以及明朗的度假日氛围。
  desc: ''
- title: 上部为浓重高饱和天蓝，下部以鲜活绿色或清爽户外色取得平衡。
  desc: ''
- title: 广角近机位透视：主角虚拟形象或道具在前景大幅裁切，次要元素向后递退。
  desc: ''
- title: 超大号粗体白色标题，略微倾斜，层叠在天空区域上方，具立体海报感。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{SUBJECT}'
  desc: 摄影主体，如：一位穿短袖的年轻男生 / 一对牵手的情侣
- kv_var: 主体动作
  style_var: '{SUBJECT_ACTION}'
  desc: 主体在做什么，如：仰头大笑 / 单手举起饮料
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
  desc: 手持或陈列的物件，如：一罐气泡水 / 复古随身听
- kv_var: 场景地点
  style_var: '{LOCATION}'
  desc: 拍摄地点，如：东京街头便利店门口
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
  desc: 补充画面层次的元素，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{MAIN_TEXT}'
  desc: 画面最大的标题字，如：SUMMER DROP
- kv_var: 服装造型
  style_var: '{WARDROBE_STYLE}'
  desc: 如：oversize 卫衣 + 工装短裤 + 厚底鞋
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
  desc: 小字装饰信息，如：LIMITED 2024 / NEW ARRIVAL
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
  desc: 单个符号或小图案，如：✦ / ★ / 涂鸦箭头
prompt: 'Create an 16:9 high-energy social campaign poster in Sunny 3D Avatar Campaign Style. Preserve these style anchors: the core visual anchors of this style. Avoid this source content: watermarks, real logos, and commercial advertising.
  Scene content: {SUBJECT} is {SUBJECT_ACTION} with {PRODUCT_OR_PROP} in {LOCATION}. Include {BACKGROUND_ELEMENTS}. Wardrobe and character styling: {WARDROBE_STYLE}. Composition: bright saturated sky-blue
  upper field reserved for huge angled bold white headline typography; wide-angle low camera perspective; oversized foreground subject or prop cropped close to camera; supporting details recede into the
  midground; lower campaign callout label. Typography: set the main replacement headline as "{MAIN_TEXT}" in large bold white slanted geometric display letters, with smaller supporting text "{SECONDARY_TEXT}"
  in rounded sans-serif. Graphic accents: add neon lime and cyan hand-drawn loops, swoops, underlines, and the accent symbol "{ACCENT_SYMBOL}" around the headline without using any real platform logo. Rendering:
  glossy stylized 3D avatars, smooth toy-like faces and rounded hands, tactile fabric and prop textures, crisp sunny outdoor lighting, vivid blue-green commercial palette, polished high-resolution raster
  finish.'
id: vigo_sunny_3d_avatar_campaign
