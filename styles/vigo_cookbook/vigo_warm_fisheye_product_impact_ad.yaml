features:
- title: 从产品堆、碗或隧道内部取景的极致鱼眼或超广角微距透视。
  desc: ''
- title: 前景挤满大量暖棕或金色的质感碎片，在画面四周形成厚重的边框。
  desc: ''
- title: 主角紧贴镜头，被裁切的面部、手、物件、包装或产品细节压向观者。
  desc: ''
- title: 密集的商业横幅层级，留白极少，主体、产品包装、大标题与小字注记层层叠加。
  desc: ''
- title: 巨大的倾斜白色中文展示大标题，带厚重黑色阴影或立体 3D 块面纵深。
  desc: ''
