  style_var: specific adult character identity, including distinct hair, face, styling, and body language when generating a set
  desc: ''
- kv_var: '`SUBJECT`'
  style_var: main person, traveler, skater, swimmer, musician, road-trip friend, product ambassador, or fashion model
  desc: ''
- kv_var: '`SUBJECT_ACTION`'
  style_var: leaning into the fisheye lens, looking above camera, adjusting sunglasses, holding a prop, riding forward, stepping into sun, or turning in wind
  desc: ''
- kv_var: '`PRODUCT_OR_PROP`'
