# 建筑场地分析图版式

id: architectural_site_analysis
name: "建筑场地分析图版式"
category: science

tags:
- 建筑分析图
- 场地分析
- 轴测分析
- 信息设计
- 竞赛版式
- 流线分析

triggers:
- 建筑分析图
- 场地分析图
- 轴测分析图
- 建筑竞赛版式
- 流线分析图

features:
- title: 中央卫星主体 + 两侧分析模块
  desc: 场地卫星俯视影像作为画面中心主体，两侧排列区位、场地高差、交通、周边功能、环境资源等分析模块，每个模块配图示与中英标注
- title: 极细索引线连接模块
  desc: 用极细线条与箭头系统把主图和模块连成一张整体，索引线细如发丝，不抢主体
- title: 单一强调色高亮场地
  desc: 黑白灰为主色，只用一个强调色高亮待建场地，并用极细线条标出道路系统、周边建筑、景观要素、交通流线与重要节点
- title: 国际建筑竞赛版式
  desc: 信息设计排版，模块化分区，标题与标注层级清晰，信息丰富但保持秩序感
- title: 中英双语极简标注
  desc: 每个分析模块配简洁中英文标注，字体统一，细线小字号，不堆砌无意义文字

scene: "建筑竞赛作品集、场地分析汇报、方案前期分析图、咨询与设计机构提案"
ratio: '3:4'
summary: "建筑场地分析图版式——卫星影像中心主体 + 两侧分析模块 + 极细索引线 + 单一强调色高亮场地的国际竞赛级信息设计。"

prompt: |
  以{场地概况}的卫星俯视影像为底图，生成一张建筑场地分析图。

  整体风格：
  国际建筑竞赛风格、专业建筑分析图、信息设计排版。

  画面中心：
  场地卫星俯视影像作为主体。
  {场地标注}区域使用{强调色}高亮标注。

  添加：
  道路系统
  周边建筑
  景观要素
  交通流线
  重要节点
  采用极细线条与箭头系统表达。

  画面结构：
  中央主体分析图
  两侧布置分析模块：
  {分析重点}
  每个模块配分析图示与简洁中英文标注。

  整体采用：
  黑白灰为主色
  {强调色}作为强调色
  极细索引线连接模块
  国际建筑竞赛风格排版。
  信息丰富但保持秩序感。
  建筑分析图专业质感。

  画幅比例 3:4。

  避免：画面漂亮但没有逻辑、分析元素堆满画面、配色过多、字体不统一。

variables:
- kv_var: 场地概况
  style_var: '{场地概况}'
  desc: 场地与项目描述，如：城郊一块 12000 ㎡ 的坡地，北临主干道，西侧临河
- kv_var: 场地标注
  style_var: '{场地标注}'
  desc: 高亮地块的标注文字，如：SITE / 用地 A / 核心地块
- kv_var: 分析重点
  style_var: '{分析重点}'
  desc: 两侧分析模块清单，如：区位分析、场地高差、交通分析、周边功能、环境资源
- kv_var: 强调色
  style_var: '{强调色}'
  desc: 高亮与索引线用的单一强调色，如：浅橙色 / 砖红 / 湖蓝

source_url: "https://x.com/derek_wall90176/status/2068898295045660810"
source_author: "德里克文"

