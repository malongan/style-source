# 复古插画百科剖面图

id: vintage_encyclopedia_cutaway
name: "复古插画百科剖面图"
category: science

tags:
- 剖面图
- 插画百科
- 复古图鉴
- 剖视结构
- 微缩人物
- 教学注释

triggers:
- 百科剖面图
- 插画剖面图
- 复古解剖图
- 剖视结构图
- 图鉴插画
- 教学注释图版

features:
- title: 剖开外壳的百科图版
  desc: 以一张大幅横版图版呈现建筑、结构或机械的主体，视觉上移除大部分外壁，剖开壳体露出内部层级，同时保留对象完整可辨的外轮廓
- title: 1980—1990 年代图鉴审美
  desc: 精细墨线勾勒配传统水彩，笔触细致写实又有手绘温度，画在略带象牙白的纸张上，配色温暖自然，材质与纹理丰富可信
- title: 微缩人物叙事
  desc: 数十个按比例缩小的微型人物散布在结构各处，各自从事符合该时代的真实活动，让结构有人类尺度与使用痕迹
- title: 点划线教学注释
  desc: 图版四周布置 15 至 25 个解释性注释，用细黑色点划线指向对应部位，注释短句精炼，读者可沿索引逐个探究细节
- title: 丰富而有序的全景构图
  desc: 一屏之内信息量极大却不杂乱，主体结构、内部系统与注释分区明确，读者能花上几分钟逐层探索

scene: "童书与科普图鉴内页、博物馆展板、复古知识海报、课程教具、历史建筑剖面展陈"

ratio: '3:2'
summary: "复古插画百科剖面图——剖开外壳露出内部结构的 1980—1990 年代图鉴版式，精细墨线与传统水彩、温暖自然配色、微缩人物叙事，配 15 至 25 条点划线教学注释。"

prompt: |
  你是一位历史插画家、建筑师和技术绘图员，专注于为儿童创作插图百科全书。

  主题：{主体}，时代：{时代}，国家：{国家}。

  生成一张巨大的横向插图百科全书版面，以建筑、结构或机械的剖面图形式呈现该主题。
  画面以一个主要的侧面视图为核心，保留对象完整可辨的外轮廓。
  视觉上移除大部分外壁，剖开外壳，显露内部结构。
  呈现内部组件、机械装置、层级、通道、楼梯、设备与关键系统：{内部系统}。
  绘制数十个按比例缩小的微型人物，让他们从事符合该时代的真实活动：{人物活动}。
  展示不同的材料，以及建筑或运作系统本身。
  加入大量微小细节，值得看上好几分钟。

  艺术指导：
  再现 1980 至 1990 年代大型历史插图百科全书的审美。
  用精细墨线结合传统水彩，绘制极其细致的画面。
  温暖自然的配色，画在略带象牙白的纸张上。
  建筑线条准确、材料可信、纹理丰富。
  全景式构图信息量极大，但秩序井然。
  避免现代 3D 渲染、卡通风格与摄影写实感。
  教育性插图，优雅而恒久。

  版面元素：
  顶部大号衬线标题：{标题文字}
  标题下方一段简短说明导语：{导语文字}
  图版四周布置 15 至 25 个解释性注释，用细黑色点划线指向对应元素，注释覆盖：{注释要点}
  底部一条人物小像栏，展示{人物谱}等人物形象与身份说明。

  避免：真实品牌 Logo、水印、乱码文字、照片拼贴。

variables:
- kv_var: 主体
  style_var: '{主体}'
  desc: 图版要剖析的对象，如：中世纪城堡、蒸汽机车、跨大西洋邮轮
- kv_var: 时代
  style_var: '{时代}'
  desc: 对象所处的年代，如：14 世纪、19 世纪中叶、20 世纪 30 年代
- kv_var: 国家
  style_var: '{国家}'
  desc: 对象所属国家或地区，如：英格兰、法国、日本
- kv_var: 内部系统
  style_var: '{内部系统}'
  desc: 需要剖开展示的内部结构与设备，如：塔楼与地窖、锅炉与传动系统、客舱与底舱
- kv_var: 人物活动
  style_var: '{人物活动}'
  desc: 微缩人物从事的活动，如：守卫巡逻、厨娘备餐、匠人修缮桥板
- kv_var: 注释要点
  style_var: '{注释要点}'
  desc: 教学注释要覆盖的部位清单，如：城垛、吊桥、井台、地窖、旗杆
- kv_var: 标题文字
  style_var: '{标题文字}'
  desc: 顶部大号衬线标题，如：中世纪城堡、蒸汽机车
- kv_var: 导语文字
  style_var: '{导语文字}'
  desc: 标题下方的简短导语，如：14 世纪的城堡如何保卫领主的家人
- kv_var: 人物谱
  style_var: '{人物谱}'
  desc: 底部人物小像栏的人物清单，如：领主、夫人、骑士、弓手、士兵、厨子

