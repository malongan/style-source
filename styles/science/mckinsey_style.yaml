name: 麦肯锡风格
category: science
ratio: 16:9 / 5:2
source_author: '@AdrianPunk115'
source_url: 'https://x.com/AdrianPunk115'
summary: 顶级咨询公司的专业、克制、理性风格 —— 文字不仅是标题，更是画面结构的一部分。
tags:
- 咨询
- 商业
- PPT
- 封面
- 信息图
- 专业
- 麦肯锡
triggers:
- 麦肯锡风格
- 咨询风
- 商业封面
- PPT封面
- 商业报告
features:
- title: 理性克制的专业气质
  desc: 麦肯锡 / BCG / Bain 那种不带情绪的表达
- title: 巨型主视觉词 + 核心商业隐喻
  desc: 一个大词加一个几何图形，互相咬合
- title: 清晰的商业主题表达
  desc: 一眼看懂在讲什么，不需要辅助说明
- title: 视觉隐喻与文字、图形融合
  desc: 图形与文字穿插，不是并排放置
- title: 高级干净有秩序的画面
  desc: 元素对齐到同一基线或竖轴，精确到像素
variables:
- kv_var: 主题词
  style_var: '{主题词}'
  desc: 如：增长 / 重构 / 效率边界
- kv_var: 核心隐喻
  style_var: '{核心隐喻}'
  desc: 如：一组向上递进的细线阶梯 / 三个嵌套的同心方框 / 一条突破网格的斜线
- kv_var: 副标题
  style_var: '{副标题}'
  desc: 如：2026 中国消费市场白皮书 / 组织效能诊断
- kv_var: 数据标签
  style_var: '{数据标签}'
  desc: 如：样本量 3,200 / 覆盖 24 个行业 / 2026 Q3
- kv_var: 主色
  style_var: '{主色}'
  desc: 如：墨蓝 / 深橄榄绿 / 石墨灰
prompt: |
  16:9 商业报告封面，顶级咨询公司的理性克制气质。画面由一个大词、一个隐喻、少量结构线组成，信息量极少但秩序感极强。

  主视觉：巨大的{主题词}占据画面左侧或上半部，字号大到接近裁切边缘，字重中等、无衬线、字距收紧，颜色是{主色}而非纯黑。

  隐喻：{核心隐喻}。隐喻以极简的几何或线条图形呈现，与巨型文字咬合或穿插——图形线宽统一，转折干净，只用一到两种几何母题，不做插画化处理。

  结构：画面用几条极细的分割线建立网格，分割线不完全贯穿，留出断口，形成编辑式的呼吸。所有元素对齐到同一条基线或同一条竖轴，对齐必须精确。

  数据：底部或角落用小字号排「{数据标签}」，用细体等宽字，与主标题形成巨大的字号反差。

  副标题「{副标题}」用中等字号贴在主视觉词下方，不抢层级。整体干净、专业、有秩序，像一份真实咨询报告的首图，无装饰花纹，无渐变。
id: mckinsey_style
code: ''
