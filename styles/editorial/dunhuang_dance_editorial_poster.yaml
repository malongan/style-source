# 敦煌舞编辑海报

id: dunhuang_dance_editorial_poster
name: "敦煌舞编辑海报"
category: editorial

tags:
  - 敦煌舞
  - 巨型字体
  - 当代编辑排版
  - 矿物高饱和
  - 工笔线描
  - 展陈主视觉

triggers:
  - 敦煌舞海报
  - 敦煌风舞蹈海报
  - 巨型英文标题海报
  - 唐风舞者海报
  - 矿物色国潮海报
  - 敦煌文化展陈海报

features:
  - "**巨型金色 Didone 衬线英文** — 作为画面第一视觉结构直接嵌入画面，舞者、衣袖、飘带与道具在字母前方掠过或隐没于其后，字体与人物互为前后景"
  - "**唐风舞者工笔线描** — 动态姿态、优雅人体、繁复发髻、头面珠翠与飘拂长裙，工笔勾勒的轮廓配流畅曲线与完整色块"
  - "**高饱和矿物色撞深底** — 朱砂红、石青、绿松石、玉石绿、靛蓝、象牙白与古金，落在深暗背景上，饱和而厚重"
  - "**层叠敦煌纹样背景** — 祥云、莲花、花卉、织锦与细金线铺满背景，繁密但对比度低于人物与主标题"
  - "**展览级中文信息层级** — 下方大号白色窄体中文标题，配英文副标题、有意义的微型排版、细分隔线与朱红印章"

scene: "品牌KV、文化展览海报、社媒竖图、国潮活动主视觉、博物馆展陈视觉"
ratio: "9:16"
summary: "敦煌舞者工笔线描与巨型金色 Didone 衬线英文互为前后景，高饱和矿物色撞深底，博物馆级文化展陈海报。"

prompt: |
  Customize
  Theme: {THEME}
  Characters: {CHARACTERS}
  Key Visual: {KEY_VISUAL}
  Giant English Type: {GIANT_TYPE}
  Chinese Headline: {CHINESE_TITLE}
  Subtitle: {SUBTITLE}
  Color Palette: {COLOR_PALETTE}

  Create a premium 9:16 vertical poster on the theme of {THEME}, blending Dunhuang-inspired Chinese dance art with bold contemporary editorial typography.

  Feature elegant Tang-inspired adult dancers with dynamic poses, graceful anatomy, ornate hairstyles, jewelry, flowing garments, and richly decorated traditional costumes. Render {CHARACTERS} with clear silhouette and mutual interaction.

  Use saturated mineral colors such as {COLOR_PALETTE} — cinnabar red, turquoise, jade green, indigo, ivory, and antique gold — against a deep dark background.

  Make one strong visual structure dominate the composition: a giant cultural object, circular formation, oversized serif typography, or a bold interaction between figures and letters. Center it on {KEY_VISUAL}.

  Integrate huge antique-gold Didone serif typography spelling "{GIANT_TYPE}" directly into the artwork. Let dancers, clothing, props, and flowing fabric overlap, pass in front of, and disappear behind the letters so the typography becomes part of the composition rather than a separate title.

  Add a large white condensed Chinese headline "{CHINESE_TITLE}" near the lower section, supported by refined English subtitles "{SUBTITLE}", meaningful microtypography, thin dividers, and subtle red seals.

  Fill the background with layered Dunhuang-inspired clouds, lotus motifs, floral ornaments, brocade patterns, and delicate gold linework. Keep the background rich but lower in contrast than the characters and main typography.

  Use refined decorative illustration, gongbi-inspired outlines, smooth flowing curves, complete color fields, intricate textile patterns, and sophisticated editorial layering.

  The final poster should feel like a complete museum-quality cultural exhibition visual: bold at thumbnail size, highly detailed up close, traditional in spirit but unmistakably contemporary in composition.

  Avoid generic fantasy art, 3D rendering, random text, broken anatomy, excessive ribbons, messy micro-details, cheap gold effects, watermarks, and meaningless placeholder typography.

variables:
  - kv_var: 画面-主题
    style_var: "{THEME}"
    desc: "Dance / Music / Cultural Theme，如：乐舞 / 丝路 / 盛唐宴饮"
  - kv_var: 画面-人物
    style_var: "{CHARACTERS}"
    desc: "1–3 位舞者及其姿态互动，如：双人长绸对舞 / 三人圆阵 / 单人独舞"
  - kv_var: 画面-核心视觉
    style_var: "{KEY_VISUAL}"
    desc: "Drum / Fan / Circular Formation / Giant Letters / Other，即 鼓 / 扇 / 圆形阵型 / 巨型文字 / 其他"
  - kv_var: 文字-巨型英文
    style_var: "{GIANT_TYPE}"
    desc: "单个英文单词，如：BOOM / SWIRL / CELESTIAL"
  - kv_var: 文字-中文标题
    style_var: "{CHINESE_TITLE}"
    desc: "2–4 字中文大标题，如：敦煌 / 飞天 / 舞·敦煌"
  - kv_var: 文字-英文副标题
    style_var: "{SUBTITLE}"
    desc: "一句英文副标，如：SILK AND SILENCE"
  - kv_var: 色彩-主色板
    style_var: "{COLOR_PALETTE}"
    desc: "如：cinnabar red + turquoise + antique gold / jade green + indigo"

source_url: "https://x.com/MrLarus/status/2117275497369669764"
