# 敦煌舞编辑海报

id: dunhuang_dance_editorial_poster
name: "敦煌舞编辑海报"
category: editorial

tags:
  - 敦煌舞
  - 巨型字体
  - 当代编辑排版
  - 矿物高饱和
  - 工笔线描
  - 展陈主视觉

triggers:
  - 敦煌舞海报
  - 敦煌风舞蹈海报
  - 巨型英文标题海报
  - 唐风舞者海报
  - 矿物色国潮海报
  - 敦煌文化展陈海报

features:
  - "**巨型金色 Didone 衬线英文** — 作为画面第一视觉结构直接嵌入画面，舞者、衣袖、飘带与道具在字母前方掠过或隐没于其后，字体与人物互为前后景"
  - "**唐风舞者工笔线描** — 动态姿态、优雅人体、繁复发髻、头面珠翠与飘拂长裙，工笔勾勒的轮廓配流畅曲线与完整色块"
  - "**高饱和矿物色撞深底** — 朱砂红、石青、绿松石、玉石绿、靛蓝、象牙白与古金，落在深暗背景上，饱和而厚重"
  - "**层叠敦煌纹样背景** — 祥云、莲花、花卉、织锦与细金线铺满背景，繁密但对比度低于人物与主标题"
  - "**展览级中文信息层级** — 下方大号白色窄体中文标题，配英文副标题、有意义的微型排版、细分隔线与朱红印章"

scene: "品牌KV、文化展览海报、社媒竖图、国潮活动主视觉、博物馆展陈视觉"
ratio: "9:16"
summary: "敦煌舞者工笔线描与巨型金色 Didone 衬线英文互为前后景，高饱和矿物色撞深底，博物馆级文化展陈海报。"

prompt: |
  定制参数
  主题：{主题}
  人物：{人物}
  核心视觉：{核心视觉}
  巨型英文标题：{巨型英文}
  中文主标题：{中文标题}
  副标题：{副标题}
  色板：{色板}

  创作一张 9:16 竖版高端海报，主题为{主题}，把敦煌启发的中国舞蹈艺术与大胆的当代编辑排版融合。

  以优雅的唐风成年舞者为主角，姿态动感、人体优美、发髻繁复、佩戴首饰、衣袂飘拂、传统服装装饰华丽。让{人物}具备清晰的剪影与彼此的互动。

  使用高饱和的矿物色，如{色板}——朱砂红、绿松石、玉石绿、靛蓝、象牙白与古金——落在深暗的背景上。

  让一个强有力的视觉结构主导构图：一件巨大的文化物件、圆形阵型、超大衬线字体，或人物与字母之间的强烈互动。以{核心视觉}为中心。

  把拼写「{巨型英文}」的巨型古金 Didone 衬线字体直接织入画面。让舞者、衣物、道具与飘拂的布料与字母重叠、从字母前方掠过、又在字母后隐没，使字体成为构图的一部分，而不是一个独立的标题。

  在画面下部加入一行大号白色窄体中文主标题「{中文标题}」，配精致的英文副标题「{副标题}」、有意义的微型排版、细分割线与低调的朱红印章。

  用层叠的敦煌启发祥云、莲花纹样、花卉装饰、织锦图案与纤细金线铺满背景。背景保持丰富，但对比度低于人物与主字体。

  使用精致的装饰性插画、工笔启发的轮廓线、流畅的曲线、完整的色块、繁复的织物纹样与考究的编辑级层次。

  最终海报应像一件完整的博物馆级文化展览视觉：缩略图尺寸下依然醒目，近看细节极多，精神上是传统的，但构图无疑属于当代。

  避免泛泛的奇幻艺术、3D 渲染、随机文字、结构错误的人体、过多飘带、杂乱的微细节、廉价的金色效果、水印，以及无意义的占位排版。

variables:
  - kv_var: 画面-主题
    style_var: "{主题}"
    desc: "Dance / Music / Cultural Theme，如：乐舞 / 丝路 / 盛唐宴饮"
  - kv_var: 画面-人物
    style_var: "{人物}"
    desc: "1–3 位舞者及其姿态互动，如：双人长绸对舞 / 三人圆阵 / 单人独舞"
  - kv_var: 画面-核心视觉
    style_var: "{核心视觉}"
    desc: "Drum / Fan / Circular Formation / Giant Letters / Other，即 鼓 / 扇 / 圆形阵型 / 巨型文字 / 其他"
  - kv_var: 文字-巨型英文
    style_var: "{巨型英文}"
    desc: "单个英文单词，如：BOOM / SWIRL / CELESTIAL"
  - kv_var: 文字-中文标题
    style_var: "{中文标题}"
    desc: "2–4 字中文大标题，如：敦煌 / 飞天 / 舞·敦煌"
  - kv_var: 文字-英文副标题
    style_var: "{副标题}"
    desc: "一句英文副标，如：SILK AND SILENCE"
  - kv_var: 色彩-主色板
    style_var: "{色板}"
    desc: "如：cinnabar red + turquoise + antique gold / jade green + indigo"

