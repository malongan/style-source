features:
  - title: 巨大晶莹半透浆果群占满画面
    desc: 三到五颗被放大到建筑尺度的圆形浆果错落叠压，前景一颗占据画面中下部约六成，后景几颗缩小并轻度虚化形成浅景深层次，正对观者、无透视变形，主体就是画面本身而不是被排版框住的产品图
  - title: 顶部星形花萼凹陷是辨识点
    desc: 每颗果实顶端保留一圈不规则的星形／花萼状凹口，凹处是更深的靛蓝色，边缘勾一道极细的暖橙金线，中心一枚小橙点，是整组抽象球体唯一的具体植物特征
  - title: 极细密银白点绘网点铺满球面
    desc: 球体表面不是平涂色块，而是布满疏密随光变化的细密银白点状颗粒，像丝网印刷半调网点与耀变结晶的反光，高光处点子变亮变稀、暗部变密变蓝，形成梦幻的印刷肌理感
  - title: 冰蓝单色系与透光反射
    desc: 冷白到极浅灰的干净背景几乎无阴影，果实以冰蓝、靛蓝、银白构成单色层次，边缘一圈明亮白色轮廓光，球内有柔和的暖白光斑、冷蓝反射与轻微折射，只有花萼边用极少量暖橙点缀
  - title: 瑞士式编辑排版与极大字号反差
    desc: 顶部左中右三组极小号深蓝无衬线信息栏，底部一行横跨全幅的超大号粗体拉丁字母主标题（字距紧密、几何切角、可轻微出血），主标题上方两端各一小行副字，最底边左右两栏极小说明文字与右下角编号，小字与巨字形成强反差
  - title: 3D 渲染但保持平面招贴感
    desc: 高精度 3D 渲染的透光材质与点绘肌理，但整体构图、留白与排版是现代主义平面招贴逻辑，安静、诗意、克制，不是写实食品摄影、不是卡通插画、不是带 UI 或产品展示台的商业 KV

scene: "先锋艺术展主视觉、实验性平面设计招贴、单色系品牌概念海报、食品/香氛/美妆的抽象质感 KV、设计年鉴与作品集封面"
ratio: "3:4"
summary: "晶莹蓝莓网点抽象招贴——冷白底上三到五颗被放大的半透明冰蓝浆果错落叠压，顶端星形花萼凹陷带暖橙细边，球面铺满随光疏密变化的银白丝网点绘颗粒，边缘亮白轮廓光与内部冷暖反射；顶部三栏极小信息字与底部通栏超大粗体拉丁主标题形成瑞士式字号反差，梦幻诗意又克制高级。"

prompt: |
  创作一张 3:4 竖版的先锋前卫极简抽象招贴海报，高精度 3D 渲染但保持现代主义平面招贴的构图与留白逻辑，安静、诗意、高级，不要写实食品摄影、不要卡通插画、不要产品展示台或 UI 元素。

  画面主体是三到五颗被放大到建筑尺度的「{主体果实}」：它们被简化成近乎完美的圆形球体，晶莹半透如薄冰与果冻，前景一颗占据画面中下部约六成，后景几颗缩小、错落叠压并轻度虚化形成浅景深层次，全部正对观者、不出现透视变形。每颗果实顶端保留一圈不规则的星形／花萼状凹口，凹处是更深的靛蓝，边缘勾一道极细的暖橙金线，中心一枚小橙点，这是整组抽象球体唯一的具体植物特征。

  球体表面不要平涂：铺满极细密的银白点状颗粒，像丝网印刷半调网点与耀变结晶的反光，颗粒疏密随光照变化——高光处变亮变稀、暗部变密变蓝，形成细腻的印刷点绘肌理。冷白到极浅灰的干净背景几乎无阴影，果实以冰蓝、靛蓝、银白构成单色层次，边缘一圈明亮白色轮廓光，球内有柔和的暖白光斑、冷蓝反射与轻微折射；除花萼边缘那一点暖橙外不出现其他彩色，整体晶莹透光、纯净梦幻。

  排版采用瑞士式编辑网格，与主体形成极大字号反差：顶部左、中、右各一组极小号深蓝无衬线大写信息栏，内容为「{展览信息}」，配两三行更小的说明文字；画面底部一行横跨全幅的超大号粗体拉丁字母主标题「{主标题}」，字距紧密、字形带几何切角、可轻微出血裁切，颜色用与主色同系的深蓝；主标题上方左右两端各放一小行副字，最底边左右两栏排极小号说明文字，右下角放「{版本编号}」。所有极小字都只作为装饰性排版纹理，不要求逐字可辨读，不要出现清晰可读的错拼单词、随机中文伪字、品牌水印或二维码。所有文字压在留白区或球体边缘，不遮挡花萼与主要高光。

variables:
  - kv_var: 主体果实
    style_var: "{主体果实}"
    desc: "被放大成半透明球体的圆形浆果原型，如：蓝莓；也可用黑加仑、深紫葡萄等深色小圆果，需保留顶部星形花萼凹陷"
  - kv_var: 主标题
    style_var: "{主标题}"
    desc: "底部通栏的超大号粗体拉丁字母主标题，如：BLUE HOUR / BERRY STUDY，字距紧密、可轻微出血，不用错拼词"
  - kv_var: 展览信息
    style_var: "{展览信息}"
    desc: "顶部左中右三组极小号大写无衬线信息栏，如：展名 / 设计机构 / 展览单元，纯装饰性排版"
  - kv_var: 版本编号
    style_var: "{版本编号}"
    desc: "右下角极小号日期或编号落款，如：2027 / NO.03"

