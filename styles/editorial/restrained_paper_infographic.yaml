- kv_var: 主标题
  style_var: '{主标题}'
  desc: 画面主标题，如：夏日限定
- kv_var: 关键信息
  style_var: '{关键信息}'
  desc: 如：展期 11.02–12.15 / 免费入场
- kv_var: 底部说明
  style_var: '{底部说明}'
