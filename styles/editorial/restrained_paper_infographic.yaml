# 典雅纸艺信息图

id: restrained_paper_infographic
name: "典雅纸艺信息图"
category: editorial

tags:
  - 信息图
  - 纸艺感
  - 线条插画
  - 版画风
  - 编辑设计

triggers:
  - 信息图设计
  - 纸艺线条
  - 知识海报
  - 独立出版风
  - 学术图鉴

features:
  - "**大留白单页排版** — 大量留白建立安静秩序，信息沿单一主轴依次展开"
  - "**拉丁衬线大标题** — 高反差拉丁衬线体横向排列，细线与粗笔画形成强烈对比"
  - "**宋体中文短语组** — 纤细宋体骨架+宽松行距，深色文字块承上启下"
  - "**单色版画线条插画** — 主体图像转化为黑白版画风线条画，由中心向外建构"
  - "**底部大数字视觉锚点** — 超大高对比数字/关键信息，左右分布居中细线连接"
  - "**细腻未涂纸纹肌理** — 近白低饱和纸色背景，文字骨架与局部对比限制在排版元素内"

scene: "品牌KV、文化活动海报、编辑设计、知识档案海报、独立出版封面"
ratio: "3:4"
summary: "典雅纸艺信息图：以大留白建立秩序，拉丁衬线大标题与宋体中文组合，单色版画线条插画为核心视觉，底部超大数字形成仪式感，整体如独立出版物的克制与温度。"

prompt: |
  围绕{主题}，构建一张克制、庄重、带人情味的纸艺信息设计：先用大面积亮白留白建立安静的秩序，再让醒目的主标题、线条绘制的叙事与底部数字依次把阅读往下带。沿单一主阅读轴组织层次分明的模块：靠近顶部，左右各放一组极细小、极细笔画、字距很宽的辅助文字或编号，用远距离的间隔制造轻微不对称；其下设置一个超大、高对比的拉丁衬线主标题横向铺开，细发丝线与粗主干形成强烈反差，字形修长、端点锐利，并使用与核心插画同一支强调墨色；再居中加一组围绕主题的中文短语，建立在纤细的宋体骨架上，行距宽松、字与字之间留出呼吸，让这块深色文字既承接标题，又向插画积蓄动势。把主题对象的核心形象及其与环境的关系提炼成一幅单色版画风线条画，而不是复刻固定物件：以中心为起点向外建构空间动势，外轮廓清晰、弧线连续、路径分层，并施以少量平涂；前景线条更长更开阔，中层形体最重，远景用细短笔触收束；让密集细节与大片空白纸张交替出现，保持轮廓可辨，允许线宽有轻微手绘变化，并保留印痕四角因吸墨形成的柔和钝边，使画面具备纪念碑式的稳定感却不显沉重。在插画下方放置最重要的短告示语，然后用一组超大、高对比的数字或同等尺度的关键信息压住底部视觉重量，把左右信息拉开，中间用极细的水平线与小字连接，让极端的尺度差制造正式公告般的仪式感；最后以一条贯穿底边的发丝细线收尾，细线中央由一枚取自主题的对称小徽记轻轻顶起，其下再置一个字距极宽的小号拉丁字标，留一个安静、精确的结束。配色从主题自适应推导：主题的含义决定强调色的具体色相与冷暖性格，强调色应保持中高饱和、干净、略带颜料感，占据画面约十分之一到十分之二，并集中在主标题、核心线条画与底部细线上；背景给以近白、低饱和的纸色，与强调色和谐、让其主导构图，并保持高明度；正文与数字使用与强调色冷暖倾向一致的近黑色，且只限于排版骨架与局部对比。保持不对称的面积对比，而非均匀的色彩平衡：强调色越鲜明，纸面越克制，深色区域越少越精确。表面呈现为细腻的非涂布纸张纤维，带轻微均匀的颗粒与柔和的扫描感；肌理主要留在空白纸面上，并能透过薄薄的墨层看见，实色区域只允许极细微的色调变化，避免厚重污渍、强烈折痕、光泽、立体阴影或装饰性渐变；整体设计应保持明亮、透气，并被纸张的吸墨感微微吃边，守住留白、线条画、字号跨度与底部收束之间的秩序，同时防止插画扩张挤压信息，也防止文字被平均化而失去节奏。

  主标题：{主标题}
  主题：{主题}
  关键信息：{关键信息}
  底部说明：{底部说明}
  不要水印，不要真实Logo，不要电商广告感。


variables:
- kv_var: 主题
  style_var: '{主题}'
