prompt: |
  {角色名}为{角色描述}，创作一张"日系旅行杂志Editorial角色海报"。

  人物：{角色名}大角度歪头（70-90°向一侧倾斜），脸几乎横置在画面中，
  脸部占画面一半以上；上半身从画面右侧或右下方横向侵入构图，
  肩膀、头发、身体自然延伸到画外，形成非常规"横向闯入画面"姿态。
  双眼清晰直视镜头，表情自然、略带困窘、好奇或冷淡感。
  使用轻微广角近距离透视，五官轻微透视放大，保持自然准确。

  背景：干净、普通、略带生活感的现代空间，
  浅蓝色瓷砖、玻璃、墙面、酒店、车站等横置侵入画面。
  加入少量中、日、英文混排小型说明文字、地点、假名注释和旅行信息。
  底部设置规整商业信息栏。

  排版：超大汉字与微型编辑文字之间的尺度反差，
  粗黑无衬线体、紧体黑体、纵排日文和小型英文辅助信息。
  专业、整洁、克制，信息层级清晰。
  人物姿势刻意荒诞，与正规海报设计形成视觉反差。

  配色：冷白/浅灰/蓝灰大面积留白；
  深紫/黑色作为主文字视觉锚点；
  少量橙色细线、圆弧或信息图形作为辅助强调色。

  整体：正式 Editorial 设计 × 荒诞主体 × 冷面幽默 × 网络 Meme 感。
  像一张正规日本旅行杂志，却被大角度歪头角色打破秩序。

  比例 9:16，不要水印。

