prompt: |
  风格基调：日系ゆるかわ × 新稚拙卡通 × 极简二维扁平插画 × 治愈系励志海报。

  核心是巨大圆头、圆点五官、粗黑手绘描边和低饱和粉彩配色。人物集中在画面底部，用大面积留白、手写文字和可爱动物互动，形成轻松幽默的视觉效果。

  {角色}，保留标志性发型、发色、主色、服饰轮廓与身份配饰，转译为日系ゆるかわ × 新稚拙卡通 × 极简二维扁平插画。

  巨大圆润头部、短小身体、极简圆点五官、对称粉红腮红、粗黑圆头描边、均匀自然的手绘线条、不透明纯色平涂、低饱和粉彩点色。

  根据角色性格自动设计可爱、幽默的表情与动作，可趴着休息、挥手加油、抱着杯子、托腮发呆、举起双拳或与小动物亲密互动。搭配一只与角色气质协调的可爱动物，造型同样极简圆润。

  9:16 竖版社交媒体海报，人物与动物集中在画面底部，占据约 30%–40% 高度。大面积纯白背景、超大负空间，整体构图简洁舒展。

  画面上方根据角色性格与动作自动生成一句简短、可爱、幽默或元气励志的中文手写文案，搭配少量英文短句。采用粗黑手写字体、中英文字体混排，加入少量手绘箭头、漫画放射线、爱心、星星与彩色下划线。

  整体呈现日系治愈文创海报质感，圆润可爱、轻松幽默、色彩柔和、线条干净、角色辨识度高。

