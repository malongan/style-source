summary: "以中央硬轴稳定画面、两侧方向性结构共同制造视觉张力的文化海报风格"

prompt: |
  {主题}文化海报，9:16竖幅，强烈动势与成熟Editorial Design气质。
  
  中央硬轴：{中央硬轴描述，如：竹脊/船身/箭矢/器物结构}
  左右视觉力量：{左侧元素如：桨阵/骨架/弓身} / {右侧元素如：声波/羽翼/杆件}
  重复或放射元素：{重复元素描述}
  运动方式：{放射/斜向/重复节奏/波纹/张力}
  
  构图要求：
  - 画面有非常清楚的第一视觉大形：中央硬轴 + 两侧方向性结构
  - 左右视觉重量保持平衡，但不要机械镜像
  - 允许角度、尺度、材质和节奏存在变化
  - Typography可根据主体方向横跨结构、贴近硬轴或沿大形排布
  - 加入一个很小的结构研究模块（动作阶段/受力/波纹/骨架/路径示意），面积控制在5%-7%
  
  色彩：{主色调}为主色，{辅助色}为辅色，3-5个主要颜色，大色域强主体反差
  
  不要水印，不要真实Logo，不要机械对称，不要多个视觉中心。

