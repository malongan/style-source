features:
- title: 居中的地标线稿插画
  desc: 画面正中用精细矢量线稿描绘一座地标建筑、约占半个画幅、纵向贯穿大半，以黑色轮廓加深中浅三阶灰表现体积与材质、不做复杂光影，底部一条水平地面基线
- title: 背景巨型英文与建筑前后遮挡
  desc: 建筑后方嵌入超大加粗的无衬线英文大字，被居中的建筑实体部分遮挡，形成「建筑在前、文字在后」的空间层次，字色低调不抢主体
- title: 四角与边缘的极小点缀文案
  desc: 画面四角与边缘散布极小的中英点缀文字、疏朗克制地点题，强化杂志封面式的平面设计感
- title: 克制低饱和的米灰配色
  desc: 暖米白底、灰阶建筑、卡其大字、黑色小字，整体低饱和内敛、色调贴合建筑肌理，纯粹高级

scene: "城市与建筑主题海报、艺术展与文化机构封面、品牌视觉与杂志内页、文旅与地产宣传"
ratio: "2:3"
summary: "极简地标线稿艺术海报——居中用黑线加三阶灰的精细矢量线稿描绘一座地标建筑（约占半幅、底部一条地面基线），后方嵌入超大加粗无衬线英文大字并被建筑遮挡形成前后层次，四角与边缘散布极小点缀文案，暖米白底＋灰阶建筑＋卡其大字的克制低饱和配色，杂志封面式的平面设计感。（源以「武康大楼」与右下手签「hhs」为具体示例，已把地标做成变量、示例改通用装饰艺术楔形建筑描述，手签水印按规则剔除并列入负向。）"

prompt: |
  创作一张 2:3 竖版的高端极简建筑艺术海报，平面设计感、杂志封面气质，理性克制、复古又现代。

  主体：
  画面正中是{地标建筑}，用精细的矢量线稿插画表现、约占画面一半、纵向贯穿大半画幅——以{线稿色}勾勒，靠清晰的轮廓线与深浅灰色块表现体积与材质、不做复杂光影渲染；底部一条水平直线作为地面基线。

  背景大字：
  建筑后方嵌入超大加粗的无衬线{背景大字}，与建筑形成「建筑在前、文字在后」的遮挡层次，字色低调、不抢主体。

  点缀文字：
  画面四角与边缘排布极小的{点缀文案}，中英皆可、字号很小、疏朗克制，凝练诠释设计理念。

  配色与气质：
  以{主色调}为主、低饱和内敛，色调贴合建筑肌理，画面干净、无多余装饰元素。

  不要：写实照片、强烈光影、满版塞死、水印或作者签名小字、真实品牌 Logo、伪字乱码、电商广告感。

variables:
- kv_var: 地标建筑
  style_var: '{地标建筑}'
  desc: 居中线稿描绘的主体建筑，如：装饰艺术风楔形大楼 / 弧形转角老公寓
- kv_var: 背景大字
  style_var: '{背景大字}'
  desc: 建筑后方超大加粗无衬线英文，如：ART DECO / MODERN
- kv_var: 点缀文案
  style_var: '{点缀文案}'
  desc: 画面四周的极小点缀文字，如：建筑与时光的对话 / 流动的几何韵律
- kv_var: 线稿色
  style_var: '{线稿色}'
  desc: 建筑轮廓与填充色阶，如：黑色描边加深中浅三阶灰
- kv_var: 主色调
  style_var: '{主色调}'
  desc: 整体克制配色，如：暖米白底加卡其大字加灰阶建筑

