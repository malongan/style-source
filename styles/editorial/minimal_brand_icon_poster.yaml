scene: "品牌主视觉、品牌 KV、社交媒体主图、品牌识别系统、极简海报"
ratio: '9:16'
summary: "极简品牌主视觉图标，IP 转译为白色反白图标 + 纯色满版留白 + 品牌字标。"

prompt: |
  9:16 竖版极简扁平品牌主视觉，整面纯色满版背景，底色取{主体}的标志性主色，调整为中等明度、柔和饱和的色调，确保白色图标清晰醒目，无渐变、无纹理、无阴影。画面视觉中心是一个小巧的白色单色反白图标，主体为{主体}的Q版头像剪影，保留其标志性发型轮廓与配饰，造型圆润几何化，五官与内部结构由挖空露出的底色构成：两颗椭圆小眼睛、一道细弧线微笑、刘海与发丝分界线。重叠部件之间以极细的底色缝隙分隔，不使用描边。图标宽度约占画面四分之一，四周保留大面积纯色负空间。画面底部居中是一行极小的白色品牌字标「{品牌名}」，采用圆胖活泼的定制字体，字母大小错落。整体只有底色与白色两种颜色，平面矢量质感，边缘锐利干净，可爱、轻快、克制。画面右侧约5%边缘极小写 voxcat，末尾一颗青金石蓝小圆点。

variables:
- kv_var: 主体
  style_var: '{主体}'
  desc: 角色名或 IP 形象
- kv_var: 品牌名
  style_var: '{品牌名}'
  desc: 品牌名称

