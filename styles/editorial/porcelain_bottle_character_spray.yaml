prompt: |
  极简时尚封面感 × 高级 editorial illustration × 独立艺术企划主视觉 × luxury fashion campaign。
  [主角色]，成年角色，修长 fashion illustration 比例，人物偏画面右侧偏下，尺寸较小，只占画面高度约 45%–55%，保留大量留白。姿态自然优雅，轻微扭转，冷淡、慵懒、疏离。
  角色服饰不固定，根据角色原本身份、代表色和视觉特征自动设计，可保留原服装或进行高级 editorial fashion 化转译，但保持角色辨识度。
  人物手中拿着一个简洁精致的白瓷瓶。从瓶口自然喷出 3–6 个完整清晰的小型其他角色，沿简洁弧线向画面左侧或左上方展开。角色之间保持明显间距，不堆叠，不拥挤。
  喷出效果保持克制，只加入少量淡烟、简单流线和极少量微光粒子，不使用复杂爆炸、密集星屑、夸张能量丝带或华丽魔法效果。
  主角色最大，喷出的角色明显更小，重点是"角色从瓶中出现"，而不是特效。
  人物身后加入 1–2 个与主角色强相关的巨大图形化元素，例如武器、专属道具、徽记、元素符号、代表性生物或其他核心母题，进行放大、简化、平面化处理。
  低饱和纯色背景，大面积留白。人物偏右，小角色向左展开，后景元素位于人物身后，形成清晰、克制、平衡的 editorial 海报构图。
  semi-flat digital painting，modern anime fashion illustration，大色块平涂，少量柔和明暗，清晰边缘，干净轮廓，高级、冷淡、简约，不花哨。
  右下角小型签名"voxcat"。
  不要水印，不要真实Logo，不要电商广告感。

