features:
  - "**纸纤维质感** — 所有色块具有真实手工纸、水彩纸浆或矿物颜料质感，可见天然长短纤维、纸浆颗粒、自然浓淡变化、轻微压痕和不规则撕纸边缘"
  - "**大色域构图** — 使用 2–4 个面积明显不同的大型纸本色块形成前后遮挡关系，低饱和但浓度完整，远看有明显识别度"
