  - "**现代东方排版** — 精致中文宋体/明朝体主标题，中小尺度不让文字压过大色域；辅助信息形成清楚层级，保留适当留白"

scene: "文化活动海报、展览、品牌视觉、东方文化机构宣传、编辑版式设计"
