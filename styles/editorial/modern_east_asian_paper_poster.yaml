summary: "以纸纤维质感 + 大色域 + 微场景为核心语言的现代东方编辑美学文化活动海报，强调精致、安静、克制的手工纸质感与微型叙事感"

prompt: |
  设计一张具有现代东方编辑美学的文化活动海报。

  【主题 / 活动名称】{填写，例如：灯彩手作 / 制扇雅集 / 香事文化 / 木刻版画}
  【主标题】{填写}
  【核心主形】{填写一个最强的单一大形，例如：巨大纸圆 / 扇形展开 / 沉香色块 / 墨黑版面}
  【主色域】{填写 2–4 个颜色，例如：暖橙 + 杏黄 + 暖白 / 青瓷绿 + 暖白 + 朱砂点色 / 沉香褐 + 米白 / 墨黑 + 暖白 + 朱红}
  【微场景】{填写一个真实的小型文化场景，例如：糊纸灯彩 / 制扇裱贴 / 篆香合香 / 刻版印刷}
  【文化元素】{填写少量必要器物，例如：竹骨、薄纸、香炉、印版、刻刀、扇骨、纸灯等}
  【活动信息】{日期 / 地点 / 类型，可选}

  【画幅比例】9:16 竖版

  画面先确立一个最强的单一主形，由【核心主形】承担第一视觉，例如巨大圆形、扇形、低矮横向平台或厚重黑色版面，让观众远看先被一个清楚的大形吸引。

  使用【主色域】建立 2–4 个面积明显不同的大型纸本色块，色块之间形成前后关系、遮挡关系或轻微结构关系。所有色块必须具有真实手工纸、水彩纸浆或矿物颜料质感，可见天然长短纤维、纸浆颗粒、自然浓淡变化、轻微压痕和不规则撕纸边缘，整体保持哑光、干净、完整，不做脏旧、黄斑、强颗粒或廉价复古滤镜。

  在大色域之间加入一个尺度很小但内容完整的【微场景】。人物与道具整体约占画面 3%–5%，人物必须正在做一件真实的事，例如扎灯、糊纸、制扇、覆纸、调香、点香、雕版、上墨、压印等。通过动作、器具和空间关系讲清楚一个安静而明确的小故事。

  可以加入极少量点睛色，如朱砂红、暖黄灯火或小印记，但面积通常控制在 1%–3%，并且要与内容有真实关系。

  排版采用现代东方文化机构、展览活动或编辑设计语言。主标题使用精致的中文宋体、明朝体或具有出版感的现代字体，字号保持中小尺度，不让文字压过大色域。辅助英文、日期、地点和说明信息使用更小字号，形成清楚层级，并保留适当留白。所有文字都要有真实意义。

  不要水印，不要真实Logo，不要电商广告感，不要书籍封面既视感，不要传统古风插画，不要巨大标题，不要满屏古建筑，不要元素堆砌，不要PPT式排版，不要脏旧纸张，不要3D CGI，不要玻璃材质，不要塑料感，不要霓虹色，不要编号和星芒装饰。

