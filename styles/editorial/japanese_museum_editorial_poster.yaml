prompt: |
  【主题】：{填写，例如传统工艺 / 表演艺术 / 建筑空间}
  【主标题】：{填写中文或日文标题}
  【英文标题】：{填写}
  【主视觉】：{织物 / 器物 / 人物 / 建筑空间等}
  【核心材质】：{织锦 / 金属 / 漆艺 / 木材 / 和纸等}
  【辅助档案】：{局部纹样 / 工艺细节 / 面具 / 平面图 / 材料样本等}
  【主色】：{填写 1–2 种传统色}
  【画幅比例】：9:16
  生成一张高级 Japanese Museum Editorial 风格的日本美术馆展览海报，将传统工艺、人物或空间内容与现代编辑设计结合。
  使用干净温润的暖象牙白艺术纸作为基础，保留轻微高级印刷质感，不要过度泛黄、污渍、裂纹或强烈做旧。
  主视觉必须足够明确，并成为画面的第一视觉锚点。根据【主题】选择织物、器物、传统人物或建筑空间进行原创设计，不复制具体历史作品。主体可以局部放大、裁切、斜向贯穿或与版面边缘相接，使图像本身参与构图。
  Typography 必须是设计结构的一部分。使用超大型汉字、日文标题或高对比 Serif 英文，通过纵排、错位、切边、遮挡、穿插与主视觉发生空间关系。建立清楚层级：主标题最大，主视觉第二，英文标题和副标题居中层，日期、馆名与材料标签最小。
  根据【核心材质】真实表现表面与工艺特征，例如织物纤维、刺绣、金属氧化、漆面、木构、和纸或陶土。材质细节应精致但克制，不要 CGI、高光塑料感或过度商业化。
  加入 2–4 个与主题相关的小型 museum catalogue plates，例如纹样局部、器物结构、服饰细节、面具、刀镡、木构节点、建筑平面图或材料样本。模块大小应有变化，直接排布在纸面，不使用圆角 UI 卡片或现代界面。
  采用明显非对称版式，建立"大主视觉 + 中型 Typography + 小型档案"的尺度关系，并保留约 25%–35% 的有效留白。不要平均填满整张画面。
  色彩以暖象牙白、墨黑为基础，只加入少量传统色，例如靛蓝、朱砂、铁灰、苔绿、木褐、旧金。颜色沉稳、完整，不使用霓虹色、复杂渐变或廉价复古滤镜。
  整体应像真正成熟的日本美术馆展览海报与精品艺术图录：远看有明确大形和 Typography，近看能发现材质、工艺与馆藏细节。题材可以变化，但纸张、字体层级、非对称排版、留白和档案式信息系统保持统一，从而形成完整系列感。
  避免：旅游宣传感、电商广告、电影海报、PPT 排版、现代 UI 卡片、整齐模板网格、随机日文、无意义英文、过度做旧、脏黄纸张、Logo、水印、编号、版权标识、星芒和 sparkle。
  不要水印，不要真实Logo，不要电商广告感。

