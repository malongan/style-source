prompt: |
  Create a whimsical Japanese editorial magazine cover combining naive handdrawn illustrations, delicate embroidery, natural linen textures, and realistic food photography.

  CUSTOMIZE
  - Food: {食物}
  - Subject: {手绘主体}
  - Creative Interaction: {创意融合}
  - Magazine Title: {杂志名}
  - Headline: {标题}
  - Caption: {注释}
  - Color Palette: {主色板}
  - Aspect Ratio: 9:16

  Visual Concept:
  The real food becomes an unexpected but natural part of the illustrated world — a dress, horn, umbrella, light, or another imaginative object. Preserve authentic photographic details in the food while keeping the surrounding illustration simple, imperfect, and expressive.

  Illustration Style:
  Loose black ink outlines, irregular handdrawn strokes, subtle pencil marks, occasional stitched details, and playful asymmetrical proportions. Characters should feel charming, quirky, and full of personality.

  Composition & Typography:
  Use an oversized illustrated subject, one striking food element, generous negative space, and a flexible Japanese editorial layout. Place a bold magazine title at the top, with a short headline and minimal supporting text naturally integrated into the illustration.

  Texture & Color:
  Warm linen paper, subtle fabric fibers, muted earthy colors, soft matte printing, and natural food textures. Let the food provide the strongest color accent.

  Art Direction:
  Playful yet sophisticated, nostalgic, handcrafted, and visually surprising. Every element should feel intentionally connected.
  Create one complete, original 9:16 magazine cover.
  不要水印，不要真实Logo，不要电商广告感。

