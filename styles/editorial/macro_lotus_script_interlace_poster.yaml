# 微距荷花花体穿插极简海报

id: macro_lotus_script_interlace_poster
name: "微距荷花花体穿插极简海报"
category: editorial

tags:
  - 微距花卉
  - 东方极简
  - 超大中文方阵
  - 花体连笔穿插
  - 编辑式小字
  - 暖白留白
  - 展览概念海报

triggers:
  - 微距荷花海报
  - 极简东方字体海报
  - 花体穿插标题
  - 悦目荷花风格
  - 白粉渐变概念海报
  - 四字方阵主标题

features:
  - title: 单朵巨大微距花苞占满上半幅
    desc: 一朵白到粉红渐变的荷花花苞被放大到超出画幅，从中上部一直铺到画面中段，约占六成面积；花瓣层叠半透、脉络与细微绒面颗粒清晰可辨，柔和自然侧光与极浅景深，花茎一角自右下斜出；是超写实微距摄影质感，不是插画、水彩或多朵柔焦铺陈
  - title: 暖白象牙纸面与大留白
    desc: 背景是几乎无纹理的干净暖白／象牙白，花瓣之外的右下与左下留出大片空白承载文字，画面不做色块、不做渐变底、不做纸张做旧，整体明亮清透、克制安静
  - title: 右下角四字 2×2 超粗墨黑方阵
    desc: 主题字是四个超大号墨黑展示体汉字，按上两字、下两字排成方正的 2×2 块面，笔画厚重饱满、带现代宋体／明朝体的尖角收笔与笔锋，字距紧凑、几乎顶到右下画幅边缘；这是全场最重的视觉块，不是纤细优雅的细宋体
  - title: 砖红极细花体连笔横穿字间
    desc: 一行暖砖红／粉红的极细花体拉丁连笔从左向右横穿上下两行汉字之间，带一条细长椭圆弧线从左侧绕出再向右延伸，局部压过汉字笔画形成前后穿插；它是独立的装饰性书写层，与墨黑方阵形成极粗与极细、黑与红的最强反差
  - title: 顶部三栏 + 四组错落极小字 + 左下展期数字
    desc: 顶部左中右三栏极小深色无衬线信息字；花瓣四周留白处错落散布四组更小号英文说明，字号远小于主题字；左下角「TIME——」接一组粗黑大号日期数字，是全场第二层级，配一条细长横线
  - title: 东方诗意的微观自然艺术化表达
    desc: 靠尺度反差（巨花对巨字）、极简留白与编辑式信息层级取得高级感，清雅、静谧、现代而不复古；不是文博书法海报、不是产品广告、不是香水kv

scene: "花卉主题展览主视觉、东方美学品牌概念海报、艺术出版物封面、文化活动预告、香氛／茶／护肤的极简视觉稿"
ratio: "9:16"
summary: "暖白留白底上一朵白到粉红渐变的巨大微距荷花花苞占据上半幅，右下角四字超粗墨黑展示体排成 2×2 方阵，一行砖红极细花体拉丁连笔带长弧线横穿字间形成穿插；顶部三栏极小信息字、四周错落英文说明与左下粗黑展期数字构成编辑式层级，极简清雅又极具字体张力。"

prompt: |
  创作一张 9:16 竖版的东方极简概念海报，高级排版、清雅克制、带微观自然的艺术化诗意，整体明亮通透，不要矢量插画、不要水彩晕染、不要 3D 渲染、不要做旧纸张与脏灰。

  背景是几乎无纹理的干净暖白／象牙白纸面，不加色块、不加渐变底。画面主体是「{花卉主体}」：一朵被放大到超出画幅的单朵花苞超写实微距特写，从中上部铺到画面中段、约占六成面积，花瓣层叠半透、边缘由白自然过渡到粉红、脉络与细微绒面颗粒清晰可辨，柔和自然侧光、极浅景深，花茎一角自右下斜出。只画这一朵，不要多朵柔焦铺陈、不要博物绘式的完整植株。

  右下角大片留白处放主题字「{主标题}」：四个超大号墨黑展示体汉字，按上两字、下两字排成方正的 2×2 块面，笔画厚重饱满，带现代宋体／明朝体的尖角收笔与笔锋，字距紧凑、几乎顶到右侧与底边，形成全场最重的黑色视觉块。不要纤细宋体、不要竖排单列、不要书法飞白。

  在上下两行汉字之间，让一行「{花体连笔词}」以暖砖红／粉红的极细花体拉丁连笔从左向右横穿：配一条细长椭圆弧线从左侧绕出再向右延伸，局部压过汉字笔画，形成真正的前后穿插关系。这一层只作装饰性书写，笔画极细、与墨黑方阵形成最粗与最细、黑与红的反差。

  编辑式信息层级分三处：顶部左、中、右三栏极小号深色无衬线信息字「{顶部信息}」，字距宽松；花瓣四周的留白处错落散布四组更小号的英文短句「{散落小字}」，压在花瓣边缘或空白上，字号远小于主题字、不抢焦点；左下角放一行粗黑「TIME——」接大号日期数字「{展期数字}」，配一条细长横线，是全场第二层级，数字清晰可读。

  所有极小号文字只作为排版纹理，不要求逐字可辨读；花体连笔与散落小字使用合法拉丁短词或不可辨读的连笔装饰，不要清晰可读的错拼单词、随机中文伪字、真实品牌标识、水印或二维码。整体保持巨花、暖白留白、黑色 2×2 方阵、砖红花体穿插、顶部三栏与左下展期数字这六层秩序，色彩只围绕暖白、粉白、墨黑与极少砖红展开，高分辨率，保留花瓣脉络与极细笔画的细节。

  不要水印，不要真实Logo，不要电商广告感，不要文博书法感，不要多朵花。

variables:
  - kv_var: 花卉主体
    style_var: "{花卉主体}"
    desc: "被放大的单朵微距花苞及其质感，如：白到粉红渐变、脉络清晰的荷花花苞；也可换白牡丹／山茶，但需保持浅色渐变、半透花瓣与可见脉络"
  - kv_var: 主标题
    style_var: "{主标题}"
    desc: "右下角 2×2 方阵的四字中文主题字，如：悦目荷花 / 清荷照水，必须是四字且可两两分行"
  - kv_var: 花体连笔词
    style_var: "{花体连笔词}"
    desc: "横穿字间的砖红极细花体拉丁连笔内容，如：Lotus / Bloom，用合法短词，不要写死错拼伪字"
  - kv_var: 顶部信息
    style_var: "{顶部信息}"
    desc: "顶部左中右三栏极小信息字，用 / 分隔，如：2026 / visual concept / 2026"
  - kv_var: 散落小字
    style_var: "{散落小字}"
    desc: "花瓣四周四组极小英文短句，用 / 分隔，如：Elegant lotus flowers / Oriental Visual Concept / Lotus Culture New Expression"
  - kv_var: 展期数字
    style_var: "{展期数字}"
    desc: "左下角 TIME 之后的粗黑大号日期，如：07.21/07.25 / 09.01/09.30"

source_url: "https://jimeng.jianying.com/ai-tool/work-detail/7664857075540839731"
