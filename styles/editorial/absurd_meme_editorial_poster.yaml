  {主题}，将主题中的核心网络隐喻或语言梗实体化为一个荒诞但真实存在的摄影场景，
  创作一张"荒诞 Meme 编辑海报"。

  主视觉：{主题}的荒诞场景，摄影真实、普通、略笨拙，
  不使用电影级布光与浅景深，像一张随手拍摄的怪异纪实照片。

  标题排版：画面顶部放置极端巨大的不规则中文展示标题，
  字形压缩、拉伸、倾斜、错位，具有手工剪贴感。
  周围散布少量吐槽式微文案、箭头、注释和中英混排小字。

  配色：暖白底，高饱和朱红色 × Royal Blue 为主要平面色，
  照片保留自身综合色。

  整体风格：反设计 Editorial × 日本学生展览海报 × 中文互联网 Meme ×
  2000s 消费级数码相机直闪摄影 × DIY Zine。
  整体像一本独立青年杂志、艺术学院学生海报与中文互联网梗图意外融合，
  专业设计结构下保留故意业余、笨拙、廉价、荒诞的视觉表面。

  比例 3:4，不要水印，不要真实Logo。

