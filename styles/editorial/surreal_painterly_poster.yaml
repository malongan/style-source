- title: 超现实视觉转化
  desc: 用有意义的变形/隐喻把怪诞元素融入主体，而非简单拼贴
- title: 象牙白纸 + 丝网手工感
  desc: 干净纸背景 + 丝网印刷纹理 + 不完美手工细节，克制高级配色
- title: 实验性衬线排版
  desc: 高对比衬线标题通过剪纸层/负空间/重叠与肖像互动

scene: "电影海报、专辑封面、书籍封面、美术展览、暗黑品牌视觉"
ratio: '9:16'
summary: "超现实编辑艺术海报，手绘写实肖像 + 怪诞自然主义 + 维多利亚版画，象牙白纸与丝网手工质感。"

prompt: |
  生成一张 9:16 的超现实编辑艺术海报，围绕 {海报标题}，融合手绘写实、怪诞自然主义、维多利亚科学版画与手工拼贴。

  呈现一张大幅、解剖可信的肖像，带有细腻的油画与蛋彩笔触、哑光肌肤、雕塑感发丝，以及夸张的有机服饰，主体为 {主体人物}。

  通过一个有意义的视觉转化，把生物可信却奇异的 {怪诞元素} 融入画面，呼应 {超现实概念}。使用精致的手绘线稿、丰富而克制的色彩，并置于干净的象牙白纸背景。

  设计实验性排版，采用优雅的高对比衬线字体，让标题通过剪纸层、非常规负空间或重叠形态与肖像互动。整体 {配色} 作为主色与强调色，建立克制而高级的色彩关系。

  加入细腻的丝网印刷纹理与不完美手工细节，同时保留真实的景深与精致的构图。

  成品应像一张令人不安、手工感十足的美术海报——美丽、不安、视觉上出人意料。

  避免：光滑 CGI、通用奇幻、随机装饰、过度做旧、水印、编号标签。

