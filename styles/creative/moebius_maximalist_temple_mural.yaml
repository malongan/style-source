features:
- title: 对称神殿立面框景
  desc: 宏伟的南亚神殿正立面居中对称，穹顶与拱券层层向上没入夜色，正面开出一道高大的奶油色拱门形成门洞框景，视线被锁在画面中心
- title: 巨大金色几何图腾
  desc: 拱门之后悬挂一枚巨大的圆形星盘曼陀罗，八芒星居中、青金镶嵌、同心环与放射刻线层层收束，是画面最强的装饰焦点
- title: 装饰性细线与平涂色块
  desc: 建筑构件、器物与人物服饰上布满极细装饰线描，配合大块平涂与有限高光，繁而不乱，接近 Moebius 式的极繁装饰语言
- title: 人物超写实与对舞姿态
  desc: 两位人物在门前对视起舞，肌肉与衣褶真实、面部清晰神态专注，身体线条与金属饰品反光均为真人写实质感
- title: 深青金配色与夜间光点
  desc: 主色为深青绿与蓝灰，奶油白与鎏金为第二层，金色花瓣与细小光点漂浮在夜色中，冷暖对撞、电影级光影

scene: "神话史诗插画、游戏世界观概念图、专辑封面、神殿主题海报、CG 动画宣传图"

ratio: '9:16'
summary: "莫比乌斯式极繁神殿壁画——对称神殿立面与拱门框景、巨大金色星盘曼陀罗、装饰性细线配平涂色块、两位超写实人物对舞，深青鎏金配色与电影级 CG 光影。"

prompt: |
  创作一张 9:16 竖版的极繁主义神殿壁画插画。

  整体风格：
  Moebius（让·吉罗）式的极繁主义绘画语言，装饰性细线结合大块平涂，叠加油画笔触。
  极致细节、炫丽、油画质感，人物超写实，电影级光影与 CG 动画渲染质感。

  画面结构：
  中央是一座宏伟的{建筑场景}，正立面对称，穹顶、拱券与层叠塔身一路向上没入夜色。
  建筑正面开出一道高大的奶油色拱门，形成门洞框景，把视线锁在画面中心。
  拱门之后悬挂一枚巨大的{核心图腾}：圆形几何星盘，八芒星居中，青金石镶嵌，细密同心环与放射刻线层层收束。
  前景是{环境氛围}。

  人物：
  {主体人物}
  {人物造型}
  两位人物在门前对视起舞，动作舒展、肢体结构自然，面部清晰、神情专注。
  人物为超写实真人质感，皮肤保留真实纹理与毛孔，金属饰品有真实反射，衣料褶皱厚重。

  装饰：
  建筑构件、器物与人物服饰上布满{装饰纹样}，繁复而有秩序。
  空中漂浮金色花瓣与细小光点。

  配色：
  {主色调}，整体冷调深色环境搭配鎏金与奶油白高光，冷暖对撞。

  避免：卡通描边、纯 3D 塑料质感、噪点糊面、细节缺失、水印、乱码文字、真实品牌标志。

variables:
- kv_var: 主体人物
  style_var: '{主体人物}'
  desc: 画面中的两位人物设定，如：白发电角冠的男性与持弓的女性神祇
- kv_var: 人物造型
  style_var: '{人物造型}'
  desc: 服装与配饰细节，如：半裸上身配金色臂环、腰间金色飘带、繁复头饰
- kv_var: 建筑场景
  style_var: '{建筑场景}'
  desc: 神殿建筑设定，如：南亚教多层塔身神殿、穹顶礼拜堂、古代水利宫殿
- kv_var: 核心图腾
  style_var: '{核心图腾}'
  desc: 拱门后的巨型几何图腾，如：八芒星曼陀罗、罗盘玫瑰、十二宫星盘
- kv_var: 装饰纹样
  style_var: '{装饰纹样}'
  desc: 遍布建筑与服饰的纹样，如：藤蔓卷草、莲花瓣、几何回纹
- kv_var: 主色调
  style_var: '{主色调}'
  desc: 整体配色，如：深青绿与蓝灰配鎏金、靛蓝与金、青灰与琥珀金
- kv_var: 环境氛围
  style_var: '{环境氛围}'
  desc: 前景与环境氛围，如：夜色台阶与水面、漂浮金色花瓣与光点

