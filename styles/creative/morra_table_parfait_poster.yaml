prompt: |
  Create an ultra-premium breakfast parfait advertising poster for an original lifestyle cafe brand called MORRA TABLE, designed as a Cannes-level editorial food campaign with a warm illustrated home-scene atmosphere, a fully unified monochrome sketch system, and a more luminous jewel-like berry layer that becomes the first unforgettable appetite trigger.

  Preserve the exact core structural logic of a refined vertical food poster: elegant brand typography at the top, one oversized hyper-real parfait glass centered in the lower-middle area, and a soft single-color line-drawn domestic world surrounding it like a playful narrative sketch. The final image must feel warm, intimate, calm, design-forward, gently whimsical, and highly art-directed, while the real product remains the strongest visual anchor.

  hyper-real parfait as the only fully rendered hero, surrounded by monochrome line-art. The glass, yogurt and oat textures are rendered first; the line drawing only handles the breakfast atmosphere without competing for appetite.

  luminous ruby berry layer placed between a quiet cream base and dry oat crown. The middle berry layer should feel like a translucent jelly gem — you are first grabbed by its sheen, then naturally read the layered structure of "milky aroma, fruit acid, baked grains."

  The brand typography at top should be elegant and refined. The oversized hyper-real parfait glass should dominate the lower-middle area. The surrounding domestic world should feel like a soft single-color line-drawn narrative sketch, playful yet restrained.

