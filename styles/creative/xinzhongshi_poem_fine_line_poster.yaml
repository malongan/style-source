# 新中式古诗词细线设色插画海报

id: xinzhongshi_poem_fine_line_poster
name: "新中式古诗词细线设色插画海报"
category: creative

tags:
  - 新中式
  - 古诗词插画
  - 细线设色
  - 园林海报
  - 东方散点透视
  - 工笔线描

triggers:
  - 古诗词海报
  - 新中式插画海报
  - 诗词细线设色
  - 中式园林海报

features:
  - "**东方散点透视 + 高位俯瞰构图** — 树冠呈柔软蓬松的云团状色块，边缘带细腻粉末点染质感，纤细连续墨黑枝条穿插其中；地面与水面以暖米白大面积留白，辅以少量墨色阴影与简洁细线，疏密有序"
  - "**精细工笔线描建筑** — 青绿瓦片、暖白墙面、朱红木结构，线条精准工整，结构清晰"
  - "**统一精细线描 + 平面设色** — 人物、动物、植物同一线描风格，动作自然结构准确，设色饱满均匀、哑光干净，保留轻微纸本质感"
  - "**东方传统色系** — 石青、石绿、黛青、朱砂、赭红、象牙白为主，冷暖对比鲜明，克制不俗艳"
  - "**完整东方海报排版** — 大幅暖白色中文标题、小型纵排原诗句、作者署名与少量朱印，构成完整文化艺术海报"

scene: "古诗词文化海报、东方艺术展览、国风品牌视觉、文创产品、文化传播"
ratio: "9:16（默认，可调 3:4）"
summary: "新中式古诗词细线设色装饰插画海报：高位俯瞰东方散点透视，青绿瓦白墙红杏越墙+工笔线描建筑，石青石绿朱砂传统色系+暖米白大面积留白，大幅中文标题+纵排原诗+作者署名+朱印"

prompt: |
  根据古诗词「{诗词}」创作一张新中式细线设色装饰插画海报，将诗中的景物、动作与情绪转化为具有明确视觉叙事的东方场景。

  核心场景：{核心场景}。关键意象：{关键意象}。视觉关系：{视觉关系}。主色调：{主色调}。

  采用高位俯瞰、东方散点透视与现代平面构成。树冠呈柔软蓬松的云团状色块，边缘带有细腻粉末点染质感，内部穿插纤细连续的墨黑枝条。建筑采用精细工笔线描、青绿瓦片、暖白墙面与朱红木结构。

  人物、动物和植物使用统一的精细线描与平面设色，动作自然，结构准确，主体之间的空间关系清楚。

  地面与水面以暖米白大面积留白表现，辅以少量墨色阴影与简洁细线。构图根据诗词灵活变化，突出核心意象，保持主次清晰、疏密有序。

  色彩采用石青、石绿、黛青、朱砂、赭红、象牙白等东方传统色系，设色饱满均匀、哑光干净，保留轻微纸本质感。

  加入大幅暖白色中文标题「{标题}」、小型纵排原诗句「{诗句}」、作者署名「{作者}」和少量朱印，形成完整的东方文化艺术海报。画幅比例：{画幅比例}。

  避免写实摄影、3D、动漫、浓重水墨、油画厚涂、复杂背景、过度颗粒和人工做旧。不要水印，不要真实Logo，不要电商广告感。

  最终呈现教科书级精细插画质感，兼具东方美学、诗意留白与鲜明的视觉叙事。

variables:
  - kv_var: 诗词
    style_var: "{诗词}"
    desc: "古诗词标题与作者原文，如：游园不值·宋·叶绍翁"
  - kv_var: 核心场景
    style_var: "{核心场景}"
    desc: "诗中景物构成的东方场景，如：春日园林、江南水乡"
  - kv_var: 关键意象
    style_var: "{关键意象}"
    desc: "画面核心主体，如：红杏、蜻蜓、牧童、明月"
  - kv_var: 视觉关系
    style_var: "{视觉关系}"
    desc: "意象之间的动作与位置关系，如：红杏越墙、蜻蜓立荷"
  - kv_var: 主色调
    style_var: "{主色调}"
    desc: "东方传统配色，如：石青石绿黛青+朱砂点缀"
  - kv_var: 标题
    style_var: "{标题}"
    desc: "海报大幅中文标题文字"
  - kv_var: 诗句
    style_var: "{诗句}"
    desc: "小型纵排原诗文字"
  - kv_var: 作者
    style_var: "{作者}"
    desc: "诗人名与朝代，如：宋·叶绍翁"
  - kv_var: 画幅比例
    style_var: "{画幅比例}"
    desc: "9:16（默认）/ 3:4"

source_url: "https://x.com/MrLarus/status/2109280070061994270"
source_author: "Larus Canus"

