features:
  - "**戏剧性对角线聚光灯** — 一道强烈的对角线聚光灯从右上到左下切割画面，一半身体被照亮，另一半融入阴影，形成高对比光影结构"
  - "**复古日式壁画背景** — 多彩复古日式壁画墙，融合复古卡通插画与传统艺术细节，为暗调画面注入鲜艳色彩点缀"
  - "**电影负空间构图** — 前景阴影自然框住画面，像撕裂的黑暗窗口，主体处于画幅中下部，周围大片黑暗营造孤独氛围"
  - "**Kodak Portra 胶片调色** — 深黑背景与鲜艳壁画点缀形成强烈对比，柔和暖调高光，模拟胶片颗粒和模拟质感"
  - "**中近景侧面肖像** — 约70度侧面取景，中近景取景距离，主体自然放松姿态，一只手整理头发，冷静神秘的表情"

scene: "暗调人物肖像、博物馆/展览主题视觉、独立电影海报、文艺品牌KV"
ratio: "9:16"
summary: "以暗调展览室中戏剧性对角线聚光灯为核心的电影感人像风格，复古日式壁画背景提供鲜艳色彩点缀，Kodak Portra胶片调色营造孤独艺术氛围"

prompt: |
  电影感人像：{主体描述} 独自站在一间昏暗的展厅里，{主体} 身着 {服装描述}，妆容极简，正面偏侧的脸部角度、身体正对镜头，姿态放松，一侧肩膀微微下沉，双手拨弄头发，神情冷静神秘，透着知性优雅的气场；人物位于画面下方居中，四周被黑暗环抱，一道戏剧性的对角线聚光灯自右上斜切至左下贯穿画面，她的一半身体被照亮，其余渐渐没入阴影；身后是色彩斑斓的 {壁画背景描述} 壁画墙，带复古卡通插画与传统艺术细节；电影式负空间构图，前景阴影如同撕裂的黑暗自然框住画面；博物馆式的沉郁氛围，孤独的艺术气息，沉思的情绪；写实摄影，细腻胶片颗粒，模拟质感，压暗的黑位中跃出鲜艳的壁画色块。

  机位：平视镜头，中近景人像取景，约 70 度侧面角度拍摄主体，与主体保持少许距离以承载环境叙事，居中电影式构图。

  相机设置：电影级低照度摄影，浅景深，写实的阴影过渡，Kodak Portra 胶片调色。

  布光：右上方一束硬质聚焦聚光灯，打出强烈的对角光束与高反差阴影，环境光极少，深黑位，面部与镜框边缘保留柔暖高光。

  氛围：神秘、艺术、museum-core 美学，聪慧而安静的能量，忧郁的电影气息，独立电影剧照，奢华时尚编辑摄影，独处夜间的情绪，克制的优雅。

  风格：超写实，电影摄影，模拟颗粒，时尚编辑人像，自然皮肤质感，细微瑕疵，写实的色彩科学，杰作级品质。

  不要动漫风，不要微笑，不要过度曝光，不要多余肢体，不要奇怪解剖，不要鲜艳全身服装，不要赛博朋克霓虹，不要模糊面部，不要低画质，不要扭曲手部，不要不真实皮肤，不要HDR过载，不要夸张妆容，不要拥挤构图，不要重复人物。

