- title: 写实物体
  desc: 写实产品照，高细节
- title: 黑色墨水手绘卡通
  desc: 黑色墨水手绘线条画，简洁表达
- title: 完美无缝融合
  desc: 真实物体与卡通无缝结合
- title: 视觉双关 / 巧妙概念
