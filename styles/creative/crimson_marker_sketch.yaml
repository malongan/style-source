# 红色马克笔草图

id: crimson_marker_sketch
name: "红色马克笔草图"
category: creative

tags:
  - 马克笔
  - 手绘草图
  - 红色线条
  - 素描风
  - 照片转插画
  - 编辑风

triggers:
  - 红色马克笔
  - 红色草图
  - 手绘线条风
  - 照片转 sketch
  - 红笔素描
  - Marker 风格

features:
  - "**马克笔线条** — {线条颜色}毡头马克笔线条，纯白背景，线条快速、俏皮、不完美"
  - "**手绘质感** — 中等偏粗线条，轻微抖动，压力变化，微小间隙，马克笔晕染，非矢量"
  - "**人物保持写实** — 人物 100% 写实，无草图效果或轮廓，应用在草图背景前"
  - "**强烈对比** — 写实人物与大胆{线条颜色}草图的强对比，无多余颜色，无渐变，无纸张纹理"
  - "**前后对比角标** — 右下角添加圆角小图，显示原始照片的前后对比"

scene: "头像、照片编辑、社交媒体配图、创意海报"
ratio: "1:1 或原始比例"
summary: "人物保持写真，背景转换为{线条颜色}马克笔手绘草图，形成强烈虚实对比的创意照片风格"

prompt: |
  以上传的图片为唯一参考。人物保持完全一致，保留其面容、姿势、服装、发型、光线、颜色与比例。移除原始背景，用纯白底上仅由{线条颜色}毡头马克笔线条重绘同一环境，作为松放手绘草图。草图应快速、俏皮、不完美，手绘自信，中等偏粗的笔触、轻微抖动、压力变化、细小断口与马克笔晕染——不是矢量图，也不是制图线条。人物保持 100% 照片写实，不施加任何草图效果或轮廓线。把主体自然地放在插画背景之前，确保所有{线条颜色}草图线条都留在人物后方。在右下角添加一个圆角小图，显示变换前同一人物与场景的原始上传照片，形成清晰的前后对比。超干净编辑风，高分辨率，写实主体与大胆{线条颜色}草图之间形成强烈对比，无多余颜色，无渐变，无纸张纹理。

  不要水印，不要多余文字，不要复杂背景，不要渐变，不要纸张纹理。
variables:
  - kv_var: 线条颜色
    style_var: '{线条颜色}'
    desc: 马克笔线条颜色（示例：深红色 deep crimson red、宝蓝色 royal blue、纯黑色 pure black、橙色 vibrant orange）
source_url: "https://x.com/AIwithSynthia/status/2075806836347883940"
source_author: "AIwithSynthia"

