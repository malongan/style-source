# 梦幻水彩旅行插画

id: dreamy_watercolor_travel
name: "梦幻水彩旅行插画"
category: creative

tags:
  - 水彩
  - 旅行
  - 欧洲城市
  - 故事书
  - 吉卜力
  - 复古海报

triggers:
  - 水彩旅行
  - 梦幻水彩
  - 故事书插画
  - 欧洲水彩城市

features:
  - "**梦幻水彩质感** — 柔和的蓝色水彩调，温暖奶油色纸张纹理，墨水轮廓精致勾勒"
  - "**故事书氛围** — 吉卜力工作室风格，碧翠丝·波特魅力，童话般的温馨氛围"
  - "**丰富场景细节** — 河畔长廊、古桥、花店咖啡馆、鹅卵石街道、历史建筑，充满生活气息"

scene: "城市旅行宣传、文化活动海报、故事绘本封面、品牌文旅联名"
ratio: "4:5"
summary: "用高端故事书水彩风格描绘欧洲城市，兼具复古旅行海报的诗意与吉卜力童话的温馨"

prompt: |
  创作一张梦幻水彩旅行插画，风格介于高级故事书与复古旅行海报之间。
  画面描绘宁静的{城市名}，以柔和的蓝色水彩调渲染，
  配精致墨水轮廓、温暖的奶油色纸张纹理与温馨的童话氛围。

  顶部是一行大字手写水彩书法标题：「{城市名}」，
  下方配一行精致的小副标题：「{一句诗意标语}」。

  场景元素：迷人的河畔或运河长廊、背景中的标志性地标、
  鹅卵石街道、古老的桥梁、历史建筑、花店、温馨的咖啡馆、
  温暖的面包店、复古路灯、平静水面上的柔和倒影、
  小船、飞鸟、盛开的花朵与柔软的云。

  前景：可爱的插画角色在享受日常——散步、喝咖啡、
  读书、速写、骑车、遛狗、桥上相拥的情侣、
  喂鸟的孩子、写生的画家，以及拍照的游客。

  风格：水彩插画、吉卜力工作室氛围、碧翠丝·波特的魅力、
  故事书风格、欧洲旅行手账、高细节、8K。
  不要水印，不要真实Logo，不要电商广告感，不要卡通风，不要拼贴感。
variables:
- kv_var: 城市名
  style_var: '{城市名}'
  desc: 如：京都 / 威尼斯 / 布拉格
- kv_var: 一句诗意标语
  style_var: '{一句诗意标语}'
  desc: 副标题短句，如：where the river remembers
source_url: "https://x.com/Taaruk_/status/2072192393932354027"
source_author: "@Taaruk_"

