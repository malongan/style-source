prompt: |
  把上传的照片转化为一幅温馨、奇趣的故事书插画，带温暖的咖啡馆美学。精确保留原主体的姿态、五官、发型、服装与构图。场景设在一间迷人的阳光咖啡馆内：大窗户、茂盛的绿植、鲜花、垂挂的藤蔓、可爱的小鸟、细小的涂鸦爱心、星星、音符，以及散落在环境各处的装饰元素。柔和的粉彩色板、暖橙红的墙面、薄荷绿瓷砖台面、温馨的木家具、盛开的植物、梦幻的阳光、欢快的氛围，kawaii 插画风格，儿童绘本美术，脸颊上可爱的腮红、有表现力的眼睛、温柔的笑容、细致的环境叙事、高细节的数字绘画、奇趣的都市咖啡馆气息、温馨的生活方式插画、鲜明而柔和的色彩、有魔力的日常瞬间、吉卜力工作室启发的暖意、干净的线条、带肌理的笔触、超精细、杰作、8k。

