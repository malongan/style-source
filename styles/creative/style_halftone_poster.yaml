prompt: |
  创作一张 16:9 图像，采用「半色调组合隐喻公益海报风格」的视觉语言。

  主体：{主体}

  动作：{动作}

  道具/产品：{道具}

  地点：{地点}

  背景：{背景元素}

  主文案：{主文案}

  副文案：{副文案}

  点缀符号：{点缀符号}

  服装造型：{造型}

  风格保真锚点：本风格的核心视觉锚点

  需规避的源内容：水印、真实 Logo 与商业广告

  套用以下风格规则：

  - 核心隐喻：必须把某一类可见的源材质组装成另一个可辨识的目标剪影。目标剪影应先从远处读出来；单个源零件则在近处才变得清晰。

  - 构图：一个主导性的组合剪影位于画面中下部或略偏右，左上角紧凑标题，底部中央极小的页脚，以及充裕的暖色纸张空白。

  - 字体：粗重压缩的大写无衬线标题，以藏青字为主、少量高饱和红色强调词；底部居中的极小页脚微文案，配简单的抽象符号。

  - 色彩：泛黄奶油色纸底、低饱和蓝绿色的半色调主体墨色、深调去饱和的藏青文字，只保留营销企划红作为强调。

  - 肌理与光线：粗糙纸张颗粒、可见的半色调网点、褪色胶印套准的柔化感、平铺环境光、柔和的青绿接地阴影，不要光亮的现代质感。

  - 图形元素：仅保留极简符号行与小尺寸企划印记；不要密集的装饰边框、不要贴纸、不要品牌标记。

  规避：不成剪影的随机堆叠、照片级产品摄影、光亮 3D 渲染、现代矢量扁平设计、密集拼贴、电影感阴影、饱和彩虹色盘、塑料瓶动物、宠物故事、回收图标式仿作、品牌 Logo、水印、二维码、社交 UI、长段落、可辨识的照抄源口号。

  重要内容规则：先匹配参考风格，再替换源内容。保留「材质—剪影」的转换逻辑。
