features:
- title: '核心概念是「材质即符号」：必须把某一类可见的源物件组装成另一个可读的目标剪影。'
  desc: ''
- title: 目标剪影必须在远处就清晰可读，之后观者才注意到构成它的单个源物件。
  desc: ''
- title: 源材质必须通过重复的零件、缝线、瓶盖、折痕、线缆、轮圈、标签或肌理，在近处依然可辨识。
  desc: ''
- title: 泛黄暖米色纸张背景，带可见颗粒与轻微的不均匀印刷痕迹。
  desc: ''
- title: 一个主导性的蓝绿色半色调组合物体，作为雕塑式公益隐喻放置，而非写实场景。
  desc: ''
