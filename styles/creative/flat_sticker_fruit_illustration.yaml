# 扁平几何贴纸水果插画

id: flat_sticker_fruit_illustration
name: "扁平几何贴纸水果插画"
category: creative

tags:
- 扁平贴纸风
- 几何多边形
- 白色粗描边
- 撞色点缀
- 弧形标签文字
- 童趣极简

triggers:
- 扁平水果贴纸
- 番茄贴纸插画
- 几何贴纸标志
- 儿童绘本插画
- 文创模切贴纸
- 弧形英文标签插画

features:
- title: 不规则多边形几何造型
  desc: 主体用直线段拼成的不规则多边形塑造轮廓，带棱角、不写实，整体平涂单一颜色、无光影无渐变
- title: 白色粗外描边的模切贴纸感
  desc: 主体外侧有一圈粗壮的白色实线外轮廓，描边外再带一层淡灰色投影，像模切贴纸贴在纸上，与背景形成分离和轻微立体感
- title: 顶部高饱和撞色点缀
  desc: 蒂头或局部结构用高饱和对比色（如亮蓝）做点缀，用极简线条勾出识别性，与主体色形成强撞色
- title: 弧形英文标签嵌在轮廓内
  desc: 顺主体外描边内侧、贴着一侧轮廓排成弧形的英文名（如 TOMATO），颜色与主体一致，作为装饰存在，简洁可读、拼写正确
- title: 纯色背景带细微纸纹
  desc: 背景是一整片柔和的纯色（如淡粉/浅肉色），带非常细微的纸张颗粒磨砂纹理，没有其他道具或场景元素

scene: "品牌标识与图标、文创贴纸、儿童绘本配图、App 图标、社媒头像与装饰插画"
ratio: "1:1"
summary: "扁平几何贴纸水果插画——不规则多边形平涂主体配白色粗外描边与淡灰投影的模切贴纸感，顶部高饱和撞色蒂头，主体一侧嵌顺着轮廓的弧形英文标签，落在带细微纸纹的纯色背景上，童趣极简、辨识度高。"

prompt: |
  创作一张 1:1 正方形的扁平化贴纸插画，极简几何、色彩平涂无光影，带轻微模切贴纸的立体感，清新可爱、辨识度高。

  主体：
  画面正中是{主体对象}，用不规则多边形拼出轮廓，边缘由直线段构成、带棱角、不写实，整体平涂{主体色}，无渐变无阴影。

  外描边与贴纸质感：
  主体外侧有一圈粗壮的{外描边色}实线外轮廓，轮廓外再带一层淡灰色投影，像模切贴纸贴在背景上，与背景形成分离感和轻微立体感。

  局部撞色：
  顶部的蒂头或局部结构用{撞色点缀}做高饱和撞色点缀，用极简线条勾出识别性，与主体色形成强对比。

  标签文字：
  在主体的外描边内侧，用{主体色}把英文标签「{标签文字}」排成顺着轮廓弯曲的弧形字，嵌在主体一侧作为装饰，字体简洁可读、拼写正确，不要伪字、不要多字。

  背景：
  纯色{背景色}背景，带非常细微的纸张颗粒与磨砂纹理，画面里不出现其他道具、场景或多余文字。

  避免：写实光影、复杂渐变、多余装饰元素、伪字乱码、水印、真实品牌 Logo、电商广告感。

variables:
- kv_var: 主体对象
  style_var: '{主体对象}'
  desc: 单个水果或物体，如：一颗番茄 / 一个牛油果 / 一只草莓
- kv_var: 主体色
  style_var: '{主体色}'
  desc: 主体平涂颜色，如：正红 / 草绿 / 明黄
- kv_var: 外描边色
  style_var: '{外描边色}'
  desc: 包裹主体与文字的粗外描边，如：白色
- kv_var: 撞色点缀
  style_var: '{撞色点缀}'
  desc: 蒂头或局部的高饱和对比色，如：亮蓝色 / 荧光绿
- kv_var: 标签文字
  style_var: '{标签文字}'
  desc: 顺主体轮廓弧形排列的英文名，如：TOMATO / AVOCADO
- kv_var: 背景色
  style_var: '{背景色}'
  desc: 纯色背景，如：淡粉 / 米白 / 浅薄荷绿

