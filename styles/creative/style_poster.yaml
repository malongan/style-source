prompt: |
  创作一张图像，采用 folded-diamond-perspective-type-poster-style（折叠菱形透视字体海报风格）。

  画幅：16:9。

  场景：{主体}{动作}，与{道具}互动，地点在{场景}。使用{造型}。以真实照片的低角度主视觉方式拍摄主体，带广角镜头的透视压缩、强烈日光，以及明亮的青蓝天空或干净的户外背景。

  版式：把照片放入一个大型旋转方形菱形开孔中，开孔位于有触感的折叠棕褐色纸张或亚麻画布表面的上半部。加入{背景元素}。从菱形顶点向下延伸一条深折痕或压痕，贯穿海报下半部。

  字体：主标题「{主文案}」用巨大的白色超粗窄体无衬线字横贯下半部。让字体看起来是印在折叠表面上的：被中央折痕分开、因透视而变形、被海报边缘裁切，并带纸张颗粒的轻微质感。只用{点缀符号}配极小的干净编辑式微文案，加入「{副文案}」。

  氛围与完成度：大胆极简、街头时装编辑感、纪念碑式的自信、温暖的棕褐卡纸质感、清脆阳光、青蓝天空的对比、柔和阴影、印刷纸张颗粒、锐利的几何照片裁切。避免水印、用户名、二维码、创作者 ID、平台 Logo 与应用标识。

id: style_poster
