features:
- '**Preserve the 核心 visual identity: 大胆 极简ist 编辑海报 风格 using 低角度 主角 照片y 在 diamond aperture, 折叠 tan paper or canvas 平面s, and 超大 白 perspective 字体排版 印刷ed 横穿 lower 表面.**'
- '**Shoot the 主体 as a real-照片 低角度 主角 图像 with 宽-lens fore短ening, strong sun亮, and a 明亮 青色 sky or 干净 户外 背景幕.**'
- '**Layout: place the 照片 在 大 旋转 方形 diamond aperture in the upper half ，一个 tac色块 折叠 tan paper or linen canvas 表面.**'
- '**Typography: set 主文字 in enormous 白 ultra-粗体 窄体 无衬线 类型 横穿 lower half.**'
- '**Make the 类型 触感 印刷ed onto the 折叠 表面, 分裂 by the 中心 crease, 失真 by perspective, 裁切 by the 海报 边缘s, and 亮ly 质感d by the 纸张纹理.**'
