# 工笔细线东方色场象征动作海报

id: oriental_fine_line_symbol_poster
name: "工笔细线东方色场象征动作海报"
category: creative

tags:
  - 工笔细线
  - 东方色场
  - 象征动作
  - 极简海报
  - 平面化
  - 寓意叙事

triggers:
  - 工笔细线人物
  - 东方极简海报
  - 极细线描
  - 朱砂红人物海报
  - 寓意动作插画
  - gongbi fine line poster

features:
  - "**极细墨线 + 透明淡彩塑形** — 皮肤、手部、毛发、织物以高密度顺向细线描绘，细节精确但整体保持平面化，不建立真实空间透视"
  - "**大面积单一高纯度东方色场** — 背景纯色平涂（朱砂红 / 石青 / 赭石等），无复杂空间层次，呈现现代极简海报底色"
  - "**单一象征性动作承担寓意** — 触碰额头、递物、指引、抚摸、施礼，让动作本身承载精神性与叙事，成为视觉焦点"
  - "**服饰局部细密纹样点睛** — 青绿、金色、卷云、如意纹或古典边饰，与整体色场形成工笔细密与现代极简的对比融合"

scene: "东方气质角色海报、神话/拟人化主体视觉、品牌国风KV、展览主视觉、文创产品、寓意叙事插画"
ratio: "3:4"
summary: "极细墨线工笔插画 × 高纯度东方色场 × 单一象征动作：平面化无透视，细节精确而整体留白，工笔人物画与现代极简海报的视觉融合"

prompt: |
  创作一张工笔细线插画风格海报，主体为{角色或主体}，融合东方寓意叙事与日本画式细密生物描写。

  主体以极细墨线和透明淡彩塑形，皮肤、手部、毛发或织物采用高密度顺向细线描绘，细节精确但整体保持平面化，不建立真实空间透视。

  画面围绕一个高度明确的象征性动作展开：{象征动作}，让动作本身承担精神性或寓意，成为整张图的视觉焦点。

  背景使用大面积单一{东方色场}（如朱砂红、石青、赭石等高纯度东方综合色），纯色平涂，不留复杂空间层次，形成现代极简海报的底色。

  服饰局部加入{服饰局部纹样}（青绿、金色、卷云、如意纹或古典边饰），与大面积色场形成细密与整体的对比，达成工笔人物画与现代极简海报之间的视觉融合。

  画幅比例：{画幅比例}。

  避免写实摄影、3D 渲染、浓重水墨、油画厚涂、动漫卡通风、拼贴感与复杂背景。不要水印，不要真实Logo，不要电商广告感，不要乱码。

variables:
  - kv_var: 画面-主体
    style_var: "{角色或主体}"
    desc: "东方气质人物 / 神话主体 / 拟人化生物 / 寓意性画面"
  - kv_var: 画面-象征动作
    style_var: "{象征动作}"
    desc: "触碰额头 / 递物 / 指引 / 抚摸 / 施礼"
  - kv_var: 画面-色场
    style_var: "{东方色场}"
    desc: "朱砂红 / 石青 / 赭石等高纯度东方综合色"
  - kv_var: 画面-服饰纹样
    style_var: "{服饰局部纹样}"
    desc: "青绿描边 / 金色卷云 / 如意纹 / 古典边饰"
  - kv_var: 画幅比例
    style_var: "{画幅比例}"
    desc: "3:4（默认）/ 9:16"

source_url: "https://x.com/VoxcatAI/status/2109882653076004993"
source_author: "@VoxcatAI"

