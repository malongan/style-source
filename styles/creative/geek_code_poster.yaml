variables:
- kv_var: 主标题
  style_var: '{主标题}'
  desc: 粗体艺术字，如 Z&V DESIGN
- kv_var: 标语
  style_var: '{超大标题}'
  desc: 超大像素字体贯穿画面
- kv_var: 底部文字
  style_var: '{底部文字}'
  desc: 画面最底部的小字，如：愿你被温柔以待
- kv_var: 右侧文字
  style_var: '{右侧文字}'
  desc: 竖排英文小字，如：CODE IS POETRY
- kv_var: 标识
  style_var: '{标识}'
  desc: Logo 或标记文字，如：GEEK LAB
- kv_var: 信息栏1
  style_var: '{信息栏1}'
  desc: 顶栏第 1 栏，如：SESSION 01
- kv_var: 信息栏2
  style_var: '{信息栏2}'
  desc: 第 2 栏，如：BUILD 2024
- kv_var: 信息栏3
  style_var: '{信息栏3}'
  desc: 第 3 栏，如：COMPILED
- kv_var: 中文标注1
  style_var: '{中文标注1}'
  desc: 括号标注，如：（内存偏移）
- kv_var: 中文标注2
  style_var: '{中文标注2}'
  desc: 如：（指针解引用）
prompt: 竖版酸性设计海报，极客代码风 + 像素风 + 瑞士国际主义排版，浅灰色纸张纹理背景。中心主体为亮蓝色塑料垃圾袋剪影，袋底有黄色渐变条，袋身叠加黑色粗体艺术字 "{主标题}"。顶部三栏信息栏：黑色文字 "{信息栏1}"、"{信息栏2}"、"{信息栏3}"，配英文翻译。超大号黑色像素字体 "{超大标题}" 贯穿画面，搭配中文括号标注 "{中文标注1}""{中文标注2}"。画面散落大量
  C 语言代码片段和注释，穿插黑色圆形辅助线和直线网格。底部黑色粗体"{底部文字}"，右侧"{右侧文字}"，右下角"{标识}"。高对比度黑白蓝黄配色，先锋实验性排版，印刷级海报质量，高清 8K
