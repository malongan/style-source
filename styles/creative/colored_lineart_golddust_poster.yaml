features:
- title: 毛边白纸作画芯
  desc: 画面中央贴一张边缘不规则的手撕毛边白纸，纸边微微起翘带极淡投影，白纸之外的底色完全露出来，形成"画芯装裱"的层次
- title: 勾线加平涂的线描画法
  desc: 主体插画用深色细线勾出轮廓后平涂上色，线条松弛随性、色块干净无渐变，屋身用矿物色（米黄、砖红、青蓝），叶脉与花草用更跳的亮色
- title: 底色纸面上有金色笔触
  desc: 白纸之外的底色是饱和度偏低的豆绿等色纸，上面散布粗的金箔笔触与金色划痕，像撒金箔的装饰纸，哑光不反光
- title: 留白区完全无笔触
  desc: 白纸上的大面积空白区保持干净不画任何笔触，只在边缘点缀糖果色的四角星芒、小圆点与十字星，装饰少而轻
- title: 底部小字题字区
  desc: 白纸底部有一小块题字区，一行小标题加一两行说明与右下角小署名，手写感小字号，不与插画争视线

scene: "自然与乡村主题海报、绘本内页、文创包装插画、展览宣传单、节气与物候专题"

ratio: '3:4'
summary: "彩色线描小景撒金海报——中央毛边白纸作画芯，内为勾线平涂的自然小景插画（矿物色屋身 + 亮色花草），纸外是豆绿底色洒着金色箔屑笔触，留白处点缀糖果色星芒，底部一小块手写题字。"

prompt: |
  创作一张 3:4 竖版装饰插画海报。

  底纸与画芯：
  整张画面先铺满{底色纸面}的哑光色纸，纸上散布{金色点缀}——粗笔触的金箔划痕与零散金粉点，像撒了金箔的装饰纸，不要反光。
  画面中央贴一张边缘不规则的手撕毛边白纸，纸边微微起翘、与底纸之间有一层极淡的投影，形成"画芯装裱"层次。

  主体插画：
  在白纸上半部分画一幅{画芯场景}：{建筑元素}与{植被元素}。
  画法是彩色线描 + 平涂：先用深色细线松弛地勾出轮廓，再在轮廓内平涂上色，不要渐变、不要厚涂、不要立体阴影。
  屋身用矿物色（米黄、砖红、青蓝、赭石），叶脉、花草与小装饰用更跳的亮色（亮蓝、粉、鹅黄、橘）。
  树冠是蓬松的团状色块，内部穿插细线枝干与叶脉。

  留白与装饰：
  白纸上的大面积空白保持干净，不画任何笔触。
  只在空白边缘点缀很少的{小装饰}：四角星芒、小圆点、粉色或蓝色小十字，糖果色、轻盈、不压住画面。

  题字区：
  白纸底部留一小块空间，放{底部题字}：一行小标题、一到两行说明文字，右下角一个小署名。
  字号小、手写感，文字必须真实可读，不要伪字。

  整体：
  安静、干净、有手作感，像一本手工拼贴的自然观察册内页。

  避免：渐变与立体阴影、3D 渲染、照片写实、复杂满铺背景、额外文字、乱码伪字、水印。

variables:
- kv_var: 画芯场景
  style_var: '{画芯场景}'
  desc: 白纸上的主体小景，如：山谷里的村落、林间木屋、溪畔农舍
- kv_var: 建筑元素
  style_var: '{建筑元素}'
  desc: 房屋形制与屋顶，如：红瓦坡顶白墙木屋、彩色条纹瓦片农舍
- kv_var: 植被元素
  style_var: '{植被元素}'
  desc: 树木花草种类，如：深绿针叶林、阔叶乔木、灌木与成片野花
- kv_var: 底色纸面
  style_var: '{底色纸面}'
  desc: 白纸之外的底纸颜色，如：豆绿、靛蓝、砖红、芥末黄
- kv_var: 金色点缀
  style_var: '{金色点缀}'
  desc: 底纸上的金色装饰，如：粗笔触金箔划痕、零散金粉点
- kv_var: 小装饰
  style_var: '{小装饰}'
  desc: 留白处的小装饰，如：四角星芒、小圆点、糖果色小十字
- kv_var: 底部题字
  style_var: '{底部题字}'
  desc: 底部小字内容，如：颜色工匠·色彩手记 + 一两行说明 + 署名

