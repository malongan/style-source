features:
  - "**纹理水彩纸肌理** — 真实手工水彩纸纹理，纸张颗粒感与颜料层次可见"
  - "**大留白负空间** — 超大负空间居中构图，小小人物成为视觉焦点"
  - "**柔和水彩色系** — 柔和粉彩色盘，低饱和度、温暖治愈感"
  - "**精细墨线描边** — 细腻墨线勾勒轮廓，与水彩晕染形成对比"
  - "**轻噪水彩飞溅** — 微妙水彩飞溅与颜料颗粒浮于纸面"
  - "**自然光影氛围** — 柔和自然采光，讲述日常生活的诗意瞬间"
  - "**吉卜力式叙事感** — 不直接照搬吉卜力，但有同款温暖日常感与优雅时尚感"

scene: "生活方式品牌KV、杂志插画、社交媒体图文、书籍封面、文创产品设计"
ratio: "4:5"
summary: "吉卜力水彩漫步：纹理水彩纸上手绘的极简水彩插画，大留白居中微小人影，柔和粉彩色系+精细墨线，微妙水彩飞溅与纸张颗粒感，治愈日常感与优雅时尚氛围并存的叙事性插画。"

prompt: |
  在有肌理的手工水彩纸上绘制极简水彩插画，大留白，居中的微小人影（全身），柔和粉彩色盘，精细墨线，微妙的水彩晕染，富有表现力的笔刷肌理，干净构图，温馨生活流美学，吉卜力工作室启发的氛围（不是直接照搬），温柔的叙事感，优雅的时尚插画，柔和的自然光，漂浮的水彩飞溅与颜料颗粒，轻淡的素描细节，极简的地面投影，通透的构图。

  一位穿着宽松休闲装的时髦年轻男子自信地走着，手里拿着外带咖啡杯，另一只手拿着书，脚穿运动鞋，戴棒球帽，穿宽松长裤，背斜挎包。风轻轻拂动他的头发与衣角。平静的都市日常情绪，配以精致的水彩肌理与优雅的比例。

  风格关键词：极简水彩、日系插画、手绘、墨线素描、柔和粉彩色盘、有肌理的纸、优雅构图、现代生活方式艺术、微妙的飞溅效果、高细节、艺术感、高级编辑插画、安静美学、极干净的背景、8K。

  主体：{主体}
  服装/配饰：{服装}
  场景/情绪：{场景情绪}
  不要水印，不要真实Logo，不要电商广告感。


