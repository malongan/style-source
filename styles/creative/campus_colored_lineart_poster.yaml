features:
- title: 精细彩色线稿
  desc: 全画用均匀细黑线勾出所有轮廓，内部填低饱和平涂色块，线密而色淡，窗格、栏杆、树冠与铺装都用细线逐根画出
- title: 正面中轴对称构图
  desc: 主体楼体位于画面正中、完全正面，左右两翼对称展开，中央塔冠高出两翼，形成稳定的纪念性中轴
- title: 大面积透视广场网格
  desc: 画面下半部是整片浅色铺装广场，细线画出向建筑收束的透视网格与同心椭圆弧线，占比极大且几乎全留白
- title: 圆形绿篱与配景
  desc: 建筑前一座扁圆形绿篱岛，两侧团状灌木与针叶树，左右高大乔木框住画面，远处几个极小行人提供尺度参照
- title: 浅蓝天空与留白布局
  desc: 上半部是浅蓝天空与几朵纯白云，色彩克制、无阴影无渐变，整体靠留白与几何秩序撑住典雅的学术气质

scene: "高校宣传与校庆视觉、建筑与机构纪念插画、城市文化读本内页、录取通知书与文创、档案式图鉴"

ratio: '3:4'
summary: "校园建筑彩色线稿海报——细黑线勾出的对称主楼居中，浅蓝天空与大片透视广场网格留白，圆形绿篱与两侧乔木框景，低饱和平涂的典雅学术气质。"

prompt: |
  用精细的彩色线稿创作一张 3:4 竖版建筑插画海报，几何构成与留白布局。

  主体：
  画面正中是{主体建筑}，完全正面、左右对称，中央塔冠高于两翼，横向长条窗格与竖窗用细黑线逐根画出。
  楼体填{楼体色}，玻璃填淡蓝色，边缘与檐口用少量暖色细线提亮；不上阴影、不做渐变。
  楼身上有三处红色题字：塔冠中央横排「{建筑题字}」、入口横额一行小字、右侧竖排楼名；三处文字必须真实可读、不要伪字。

  前景：
  建筑前是{广场景观}：一整片浅色铺装广场以细黑线画出向建筑收束的透视网格与几道同心椭圆弧线，占据画面下半部，几乎全部留白。
  广场中央一座扁圆形绿篱岛，岛上{配景元素}；两侧团状灌木、几株针叶树，左右各一棵高大乔木从画外探入框住主体。
  远处只画几个极小的行人轮廓作尺度参照，不画人群。

  天空：
  {天空背景}，纯白简笔云朵，平坦无渐变。

  线条与配色：
  全画统一使用粗细均匀的细黑线勾轮廓，内部低饱和平涂，线密色淡，主色为{主色调}。
  不画阴影、不画高光、不用厚涂笔触。

  整体：
  典雅、安静、有学术气质，现代设计的几何秩序与传统建筑的稳重感并存。

  避免：写实摄影、3D 渲染、粗黑描边、渐变与立体阴影、杂乱配色、乱码伪字、水印、真实品牌 Logo。

variables:
- kv_var: 主体建筑
  style_var: '{主体建筑}'
  desc: 居中的对称主楼，如：高校图书馆主楼、行政大楼、礼堂
- kv_var: 建筑题字
  style_var: '{建筑题字}'
  desc: 塔冠中央的红色校名或楼名，如：明德大学、青藤书院
- kv_var: 广场景观
  style_var: '{广场景观}'
  desc: 楼前广场的形态，如：透视网格铺装加同心椭圆弧线
- kv_var: 配景元素
  style_var: '{配景元素}'
  desc: 绿篱岛与两侧植物，如：修剪过的灌木、针叶树、高大乔木
- kv_var: 天空背景
  style_var: '{天空背景}'
  desc: 上半部天空，如：浅蓝天空配几朵白云
- kv_var: 主色调
  style_var: '{主色调}'
  desc: 整体配色，如：米白 + 浅蓝 + 嫩绿、暖灰 + 淡青
- kv_var: 楼体色
  style_var: '{楼体色}'
  desc: 主楼墙面的平涂色，如：米白、浅暖灰

source_url: "https://jimeng.jianying.com/ai-tool/work-detail/7674178047926340899"
