# 实物线描角色海报

id: real_object_line_character_poster
name: "实物线描角色海报"
category: creative

tags:
  - 实物摄影
  - 钢笔线描
  - 视觉双关
  - 暖白纸感
  - 创意海报
  - 极简留白

triggers:
  - 实物线描海报
  - 实物变角色
  - 照片手绘结合
  - 实物钢笔线描
  - 极简线描创意海报

features:
  - "**实物是唯一写实元素** — 上传的实拍照片保留真实轮廓、颜色、材质与可辨细节，不被重绘成卡通或改变结构"
  - "**物品直接承担新角色** — 借用物品原生形状撑起新画面的主要结构，附加线条只补足含义、不喧宾夺主"
  - "**二维钢笔线描** — 深墨色、带轻微粗细变化的手绘钢笔线，与物品边缘精准衔接，不填色、不做立体渲染"
  - "**暖白细纹纸俯拍** — 干净暖白纸面，正对纸面的俯视视角与柔和侧光，只给实物保留轻微接触阴影"
  - "**字形参与构图** — 唯一标题按指定字形排布，笔画完整准确、手机可读，不与实物抢占同一区域"

scene: "品牌创意海报、产品概念海报、食品饮品社媒视觉、实物创意传播"
ratio: "3:4"
summary: "让真实实物承担质感与主体，几笔深墨钢笔线把物品补成一个新角色，落在暖白纸面上的极简创意海报"

prompt: |
  生成一张独立3:4竖版创意海报，使用真实静物摄影与极简手绘结合的视觉语言。唯一写实物品为上传拍摄照片的{实物}，保留其真实轮廓、颜色、材质和可辨细节，不把它重绘成卡通或改变结构。借用物品本来的形状，让它成为{新角色}；
  只在物品周围补画{线描内容}，线条与物品边缘准确衔接，物品承担新画面的主要形状，附加线条只补足含义。手绘部分采用深墨色、有轻微粗细变化的二维钢笔线，不填色、不做立体渲染，不再添加其他写实物件。背景为干净的暖白细纹纸，正对纸面的俯拍视角，柔和侧光，只给真实物品保留轻微接触阴影。按{构图}布置整体，至少保留四成负空间。
  唯一文字为"{标题}"，采用{字形}；字形、大小和位置参与构图，笔画完整准确、手机可读，不与物品抢占同一区域。画面应先让人认出实物，再看懂线描带来的新含义。不要分格、前后对比、重复主体、额外说明、英文小字、边框、水印、复杂背景或整幅插画化。输出一张完整海报。
  不要水印，不要真实Logo，不要电商广告感。

variables:
  - kv_var: 画面-实物
    style_var: "{实物}"
    desc: "示例值：切开的红宝石柚子（上传的实拍照片）"
  - kv_var: 画面-新角色
    style_var: "{新角色}"
    desc: "示例值：热气球的吊篮"
  - kv_var: 画面-线描内容
    style_var: "{线描内容}"
    desc: "示例值：热气球吊绳与藤篮、两朵云、几道短促速度线"
  - kv_var: 画面-构图
    style_var: "{构图}"
    desc: "示例值：实物居中偏上，线描向下延伸，保留四成以上负空间"
  - kv_var: 画面-标题
    style_var: "{标题}"
    desc: "示例值：红宝石柚子"
  - kv_var: 画面-字形
    style_var: "{字形}"
    desc: "示例值：手写钢笔字，右上角斜排"

source_url: "https://x.com/768150007/status/2109524740847407586"
source_author: "@768150007"

