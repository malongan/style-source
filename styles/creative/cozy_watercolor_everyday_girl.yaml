triggers:
  - 治愈系水彩日常
  - 水彩女孩生活插画
  - 故事书插画风
  - 日系文具风插画
  - 水彩生活场景
  - minimalist watercolor girl

features:
  - "**纹理象牙手工水彩纸** — 带肌理的象牙色手工水彩纸底"
  - "**柔和粉彩色系** — 柔和粉彩色板 + 细微的水彩晕染"
  - "**精致墨线轮廓** — 以细腻的墨线勾勒主体"
  - "**人物小而留白多** — 主体在画布中占比小，大量干净负空间"
  - "**漂浮水彩点缀** — 细小的漂浮水彩斑点、蝴蝶、花朵、树叶"
  - "**日系文具感排版** — 日系文具插画风格，极简编辑设计氛围"
  - "**场景可定制** — 日常小动作即可成画，不必是宏大场面"

scene: "品牌KV、社交媒体图文、生活方式内容、日系文具风海报、故事绘本插画"
ratio: "4:5"
summary: "象牙手工水彩纸上的柔和粉彩日常女孩——小人物大留白、漂浮水彩点缀、日系文具感编辑插画"

variables:
  - kv_var: 场景
    style_var: "{场景}"
    desc: 如：蹲在蓝玫瑰旁轻触一朵花 / 树下闭眼小憩 / 伸手去够枝头的苹果
  - kv_var: 服装
    style_var: "{服装}"
    desc: 如：宽松风衣叠穿米色针织 / 开衫配长裙 / 宽腿裤加乐福鞋
  - kv_var: 点缀物
    style_var: "{点缀物}"
    desc: 如：蝴蝶与落叶 / 花瓣与水彩斑点 / 几只小鸟

prompt: |
  极简水彩插画，画在带肌理的象牙色手工纸上，柔和的粉彩色板，细腻的墨线轮廓，微妙的水彩晕染，温馨的故事书美学，大量干净的负空间。

  一位穿着现代休闲装的时髦年轻女性是主体，被定格在一个平静、有情绪的日常瞬间。她身穿{服装}，背一只简约的斜挎包。中等长度的自然发丝轻轻框住脸庞。

  场景：{场景}。姿态保持柔和、有表现力，情绪温柔，周围环绕着应季的细小漂浮{点缀物}。

  构图刻意在画布中占得很小，在角色四周留下充裕的空白。

  手绘水彩质感、柔和阴影、优雅的笔触、低饱和的大地色、温暖自然的氛围、宁静的生活方式插画、日系文具艺术风格、极简编辑插画、奇趣却写实的比例、高级水彩画、超精细、8K。

source_url: "https://x.com/Sairah_0/status/2086047521588265370"
source_author: "Sairah_0"

