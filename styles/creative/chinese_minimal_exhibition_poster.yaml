prompt: |
  生成一张高完成度的中式极简艺术展览海报，融合东方山水留白、现代 Editorial Design、抽象色域绘画和纸本艺术。

  以干净暖象牙白艺术纸为背景，用一块占画面约 40%–55% 的不规则【主色域】建立情绪。色块具有细腻矿物颜料、水粉、丝网印刷与纸张渗透质感，边缘自然、内部有轻微水痕和浓淡变化，但保持干净，不做脏旧纹理。

  在色域与留白之间加入一条极薄的墨黑【地景】，可使用海岸、山脊、森林、长堤、建筑等远景轮廓。加入非常小的【微型叙事】，通过"大色域 × 微地景 × 小人物/小建筑"形成尺度反差和故事感。

  中文主标题使用高瘦宋体或现代明朝体，优先纵向排版；搭配小号英文 Serif、日期、FIELD NOTES 等微型编辑信息，并加入【中文题跋】、少量手写笔记和一枚极小朱砂红印。

  保持"大结构简洁、微细节丰富"：远看极简，近看有层次。

  【主题】：{主题描述}
  【主色域】：{主色调描述}
  【地景】：{地景类型}
  【微型叙事】：{微型叙事描述}
  【中文题跋】：{中文题跋内容}

  避免：简陋空白、粗糙平涂、模板换色、巨大黑山、旅游插画、过度古风、脏污做旧、随机裂纹、AI 乱码、UI、Logo、水印、编号、四角星芒和 Sparkle。
  不要水印，不要真实Logo，不要电商广告感。

