features:
- title: 热闹又通透的集市场景
  desc: 单幅欧洲小镇露天集市，前景人物挑拣食物、摊位堆满圆形糕点与成堆蔬果、一篮粉白花朵，脚边跟着一只小狗，街边有花店、条纹遮阳篷与复古路灯，细节丰富却靠大片留白保持轻盈
- title: 水彩加手绘细线勾边
  desc: 物体边缘是略颤抖的手绘黑或深褐细线，彩铅与水彩混合上色、低饱和、湿画法晕染，颜色常轻微溢出线条形成错版的随性感
- title: 莫兰迪低饱和暖调
  desc: 以暖白与浅棕为底，草绿、珊瑚红、淡粉做点缀，色彩清新淡雅不刺眼，岁月静好的怀旧慢生活氛围
- title: 透视留白构图
  desc: 平视带微俯的透视，一侧铺满前景物件、另一侧留大面积纸白作街道与阳光，远处行人与建筑虚化以突出前景

scene: "生活方式与文旅配图、绘本插画、公众号头图、咖啡市集烘焙主题、文创包装、社交配图"
ratio: "9:16"
summary: "水彩绘本小镇集市街景——单幅透视构图的欧洲小镇露天集市，前景老夫妻与小狗、摊位堆满糕点蔬果与一篮粉花、街边花店遮阳篷路灯，手绘黑／深褐细线勾边、彩铅水彩低饱和湿画法、颜色轻微溢线的错版感，暖白浅棕的莫兰迪主调、靠大面积纸白留白保持轻盈，治愈怀旧的慢生活氛围。（源写「极繁主义／丙烯厚涂」，成图实为局部丰富＋大量留白的轻盈水彩绘本，按成图收；成图里招牌英文是 AI 乱码，未纳入风格、负向加「乱码伪字」。）"

prompt: |
  创作一张 9:16 竖版的治愈系水彩绘本插画，清新、温暖、怀旧、岁月静好的慢生活氛围，轻盈通透的绘本质感。

  场景：
  {场景主体}。{角色与宠物}作为前景主体，{摊位元素}琳琅满目地铺陈在摊位与竹篮里；街边可有花店、条纹遮阳篷、复古路灯、百叶窗等小镇细节。

  构图：
  带一点平视俯视的透视构图，前景与一侧铺满丰富的物件、另一侧留出大面积纸白作街道与阳光，引导视线望向远处虚化的行人与建筑。

  线条与介质：
  所有物体边缘用略颤抖的手绘黑色或深褐色细线勾轮廓，再以彩铅与水彩混合媒介上色；颜色低饱和、带湿画法晕染，且常轻微溢出色块、压不住线条形成错版感，整体保留大片纸白、不做厚重涂改。

  配色：
  以{主色调}为主，莫兰迪低饱和、清新淡雅不刺眼；背景做{背景处理}。

  不要：写实摄影、3D 渲染、高饱和浓艳、满版塞死无留白、招牌乱码伪字、水印、真实品牌 Logo、电商广告感。

variables:
- kv_var: 场景主体
  style_var: '{场景主体}'
  desc: 主场景与设定，如：欧洲小镇露天集市 / 老夫妻在菜摊前挑拣
- kv_var: 角色与宠物
  style_var: '{角色与宠物}'
  desc: 画面人物与动物，如：戴帽老爷爷与红衣老奶奶，脚边一只小狗
- kv_var: 摊位元素
  style_var: '{摊位元素}'
  desc: 摊位与道具细节，如：圆形糕点、成堆青菜番茄、装满粉白花的竹篮
- kv_var: 主色调
  style_var: '{主色调}'
  desc: 莫兰迪低饱和主色，如：暖白加浅棕，配草绿、珊瑚红、淡粉
- kv_var: 背景处理
  style_var: '{背景处理}'
  desc: 背景与留白处理，如：右侧大片纸白街道、远处行人建筑虚化

