# 宇宙星云剪影

id: cosmic_nebula_silhouette
name: "宇宙星云剪影"
category: creative

tags:
  - 宇宙
  - 星云
  - 剪影
  - 纯黑背景
  - 天文学
  - 天文摄影

triggers:
  - 宇宙星云剪影
  - 星云剪影
  - nebula silhouette
  - 宇宙星云人像

features:
  - "**超写实天文摄影质感** — 真实望远镜拍摄的天体照片般逼真，厚重的大气与光影细节"
  - "**纯黑背景剪影** — 干净纯粹的黑场，突出星云主体的通透感与边缘光芒"
  - "**深色为主调 + 鲜艳发光点缀** — 深色为主色调，带鲜艳辉光的点缀色形成视觉焦点"
  - "**边缘光晕与轮廓光** — 主体边缘具有强烈的轮廓光，形成高对比剪影"
  - "**有机流动形态** — 星云气态流动感、各层透明度不同，形成自然层次"

scene: "品牌KV、创意海报、天文主题视觉、概念艺术、神秘感人像"
ratio: "3:2"
summary: "以宇宙星云为材质的超写实剪影风格，天文摄影质感搭配戏剧性边缘光"

prompt: |
  一个超现实、空灵的{主体}，完全由流动的宇宙星云云气塑成，孤立在纯黑实底背景上：优雅的剪影拖出长长的气态飘带，以深{主色}为主调，{辅色}的鲜亮辉光作为点缀，边缘发光，层层半透明体积感，宇宙尘埃旋流，有机流动的形态；写实天文摄影质感，戏剧性轮廓光，神秘氛围，剪影锐利、高对比 --ar 3:2 --v 8.2

  不要水印，不要真实天文摄影，不要卡通感，不要文字叠加。

variables:
- kv_var: 主体
  style_var: '{主体}'
  desc: 画面主体是什么
- kv_var: 主色
  style_var: '{主色}'
  desc: 主色名或色值，如：奶油白 / #F5E6D3
- kv_var: 辅色
  style_var: '{辅色}'
  desc: 辅助色，如：薄荷绿
