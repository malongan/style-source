# 水墨手绘浆果图标

id: ink_wash_berry_icon
name: "水墨手绘浆果图标"
category: creative

tags:
- 水墨写意
- 手绘浆果
- 蓝黑双色
- 大留白图标
- 湿画法晕染
- 东方极简

triggers:
- 水墨蓝莓图标
- 手绘浆果插画
- 写意水墨植物
- 蓝黑水墨图案
- 极简东方图标
- 白底水墨水果

features:
- title: 湿润水墨晕染的蓝色果实
  desc: 果实是圆润球体，用靛蓝/灰蓝水墨湿画法铺陈，边缘带深浅不一的水渍与飞白塑造体积和湿润光泽，每颗都有一块深蓝近黑的阴影
- title: 浓黑干枯的墨块枝叶
  desc: 一侧斜出由几笔粗犷浓墨构成的叶子，笔触干枯粗糙带飞白，与润泽的果实形成明显的干湿对比，旁侧还有一小段短促墨线点缀
- title: 星芒状黑色果蒂
  desc: 每颗果实顶部点出黑色星芒或花萼状果蒂，作为识别性的强调
- title: 大留白的图标式居中构图
  desc: 果实错落呈半环形排在画面中央偏下、只占画幅一小块，四周是整片纯白留白，图标化、极简、有呼吸感
- title: 纯水墨双色的写意气质
  desc: 全图只用浓墨黑与水墨蓝落在纯白底上，轮廓随色晕扩散而柔化不锐利，东方写意、先锋又拙朴生动

scene: "品牌图标与标志、文创图案、包装点缀插画、明信片、社媒极简配图"
ratio: "2:3"
summary: "水墨手绘浆果图标——靛蓝湿画法晕染的圆润果实配浓黑干枯墨叶、顶部黑色星芒果蒂，错落半环居中偏下、四周大留白纯白底，只用蓝墨两色、写意拙朴的极简东方图标风（成图为水墨蓝色，非源提示词所写的纯黑白）。"

prompt: |
  创作一张 2:3 竖版的极简水墨手绘浆果图标插画，写意、拙朴、大留白，先锋而雅致。

  主体：
  画面中央偏下是{主体物}，错落呈半环形排列、只占画幅中部一小块，四周大面积留白。果实为圆润球体，用{果实色}的水墨湿画法晕染，带深浅不一的水渍与飞白边缘塑造体积和湿润光泽，每颗顶部点出{果蒂造型}；一侧斜出由{枝叶墨色}构成的干枯浓墨叶片，几笔粗犷墨块带飞白，与润泽的果实形成干湿对比，旁侧再有一小段短促墨线点缀。

  用色：
  以{枝叶墨色}的浓墨与{果实色}的水墨为主，落在整片{背景色}的干净留白上，除主体外不出现其他色彩。

  构图与气质：
  图标化、居中偏下、大留白，写意笔触，极简主义，带东方水墨的先锋艺术感，拙朴而生动。

  画面里不要任何文字：不要标题、不要题款、不要落款、不要版权水印、不要英文字母；不要真实品牌 Logo、不要伪字乱码、不要电商广告感、不要写实光影。

variables:
- kv_var: 主体物
  style_var: '{主体物}'
  desc: 一簇水果或植物，如：一簇蓝莓 / 三颗荔枝 / 一枝梅果
- kv_var: 果实色
  style_var: '{果实色}'
  desc: 果实的水墨晕染色，如：靛蓝 / 赭红 / 墨绿
- kv_var: 果蒂造型
  style_var: '{果蒂造型}'
  desc: 果实顶部的蒂的画法，如：黑色星芒状果蒂
- kv_var: 枝叶墨色
  style_var: '{枝叶墨色}'
  desc: 枝叶的浓墨色，如：浓黑 / 焦墨
- kv_var: 背景色
  style_var: '{背景色}'
  desc: 大面积留白背景，如：纯白 / 米白

source_url: "https://jimeng.jianying.com/ai-tool/work-detail/7672334669832047910"
source_author: "Sarah"

