prompt: |
  Minimalist black and white editorial illustration of a character from an attached photo on a pure white background with plenty of negative space. The character occupies approximately 30-40% of the frame. Stylized proportions with a slightly enlarged head, simplified facial features, small dotted eyes, expressive eyebrows, a tiny nose, and a barely noticeable friendly smile. Casual casual streetwear with voluminous silhouettes, massive sneakers, simple accessories and a casual manner. It is drawn with clear, confident lines in black ink with varying line densities, rounded contours, soft, sketch-like defects and expressive hand-drawn strokes. Use only solid black and white, without shades of gray, without colors or gradients. The clothes use large black shapes contrasting with white fabric, minimal creases, simple contour lines and sparse shading. Add only a soft shadow from the ground under your feet. The composition is placed in the center with wide white margins, which creates a modern editorial look. The background remains completely blank, except for a barely noticeable floor line or shadow. The overall aesthetic is reminiscent of the illustrations of modern indie webcomics, Scandinavian editorial drawings, playful character design style and clear vector ink sketches. High resolution, clear lines, minimalistic, expressive, stylish, charming, hand-drawn, 2D illustration, monochrome, without background elements, aspect ratio 4:5.
  不要水印，不要真实Logo，不要电商广告感。

