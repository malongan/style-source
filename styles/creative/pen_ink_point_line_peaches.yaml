name: 钢笔点线技法·桃子
category: creative
ratio: 2:3（竖版）
source_author: '@GioKing·即梦'
source_url: 'https://jimeng.jianying.com/ai-tool/work-detail/7610315047872515337'
summary: 通过无数细密短促的钢笔线条排列与交叉，用**粉色线条**塑造桃子的形体与质感，用**绿色线条**塑造枝叶，呈现极度精细的植物线描插画风格。
tags:
- 钢笔画
- 点线技法
- 精细描绘
- 植物插画
triggers:
- 钢笔点线桃子
- 精细描绘桃子
- 点线技法插画
features:
- title: ✏️ **纯钢笔点线**：完全通过细密短促的钢笔线条排列与交叉来表现，无任何色块填充
  desc: ''
- title: 🍑 **粉色塑造桃体**：用粉色线条（点线技法）来塑造桃子的形体、质感与光影
  desc: ''
- title: 🌿 **绿色塑造枝叶**：用绿色线条（点线技法）来塑造枝叶的脉络、纹理与层次
  desc: ''
- title: 📐 **线条遵循形态**：线条走向紧紧遵循桃子与枝叶的形态，展现蓬勃的生命力
  desc: ''
- title: ✍️ **手写签名**：画面角落有手写风格签名 GioKing
  desc: ''
- title: 🔬 **极度精细**：完全通过线条密度变化表现光影，而非传统绘画手法
  desc: ''
variables:
- kv_var: 主体数量
  style_var: '{主体数量}'
  desc: 如：3 颗 / 5 颗
- kv_var: 主体
  style_var: '{主体}'
  desc: 如 桃子（绒毛质感，粉色短促线条交叉排线）+ 枝叶（绿色细密线条勾叶脉）
- kv_var: 点缀
  style_var: '{点缀}'
  desc: 画面点缀，如 飘落花瓣 / 光斑 / 细线纹理
prompt: |
  整体：极度精细的钢笔线描插画，2:3竖版构图，{主体数量}颗桃子。
  主体：{主体}
  点缀：{点缀}（可有可无，有就描述具体元素）。
  签名：右下角手写签名"GioKing"。
