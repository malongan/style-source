features:
- title: 巨大唱片半埋雪地
  desc: 一张巨大黑胶唱片竖直微倾地半埋进覆着薄雪的枯草丛，外圈勾一道明亮的暖橘霓虹光边，盘面炭黑细密纹路带冷冽金属高光，左上弧面压着一层薄雪与碎雪粒
- title: 唱臂与霜雾金属
  desc: 唱机唱臂从右上方斜伸到盘面上，所有金属表面都落着细碎雪粒、蒙一层霜雾，冷冽质感与暖橘光晕同框
- title: 立体发光字立在盘前
  desc: 一组立体衬线字母发着暖白偏橘的光，立在唱片正前方的雪草之间，字顶积一道雪，并在前景冰面投下柔和倒影
- title: 五层纵深与低角度仰拍
  desc: 前景绒白积雪与红梅枝、中景结冰湖面、主体唱片与乐器、远景覆雪山峦与凝冰棱的冰瀑、顶部深紫到暖红橙的夜空，层层叠压，机位压低仰拍，主体压在上半区
- title: 冰面柔焦倒影
  desc: 结冰湖面从画面底部向远处延伸，把唱片、发光字与乐器朦胧地倒映出来，冷暖两色在冰面上交融
- title: 暖橘漫射光铺满
  desc: 暖橘霓虹光晕浓度拉满，整场被暖橘漫射光包住；高饱和暖橙金与米白、暖棕为主，糅进玫红、亮银与炭黑，科幻又治愈

scene: "音乐与电台主题节日主视觉、冬季活动海报、演出与歌单封面、品牌冬日情绪 KV、竖版社媒开屏"

ratio: '9:16'
summary: "暖橘霓虹冬日唱片场景——巨大黑胶唱片半埋覆雪枯草、外圈暖橘霓虹光边、唱臂带霜，立体发光字立在盘前，左架子鼓右电子琴吉他，前景红梅灯串篝火、中景冰湖柔焦倒影、远景雪山冰瀑，低角度仰拍五层纵深，暖橘漫射光铺满深紫暖红夜空。"

prompt: |
  创作一张 9:16 竖版的 3D 渲染节日场景图，暖橘霓虹夜景包裹冬日雪原，科幻、梦幻、治愈。

  主体：
  画面上半区的视觉中心是{主体物件}，巨大、竖直微倾、半埋进覆着薄雪的枯草丛。
  唱片外圈勾一道明亮的暖橘霓虹光边，盘面是炭黑细密纹路配冷冽金属高光，左上弧面带一层薄雪与碎雪粒。
  唱机唱臂从右上方斜伸到盘面上，金属表面落着细碎雪粒、蒙一层霜雾质感。
  盘心镂空，透出远处山影与一轮小小的暖橘日轮。

  发光文字：
  {发光文字}以立体衬线字母立在唱片正前方的雪草之间，通体发暖白偏橘的光，字顶积一道雪，字母在前景冰面上形成柔和倒影。

  两侧乐器：
  左侧是{两侧乐器}中的金属架子鼓，镲片与鼓腔为冷冽亮银，表面落雪粒与霜雾；
  右侧依次摆电子琴、电吉他与一只小功放箱，木质与漆面被暖橘光染上一层橙。

  纵深分层（重要）：
  前景是绒白积雪堆与{前景元素}，几枝红梅从画外伸入；
  中景是一片结冰的湖面，从画面底部向远处延伸，冰面柔和倒映出唱片、发光字与乐器的朦胧轮廓；
  远景是{远景元素}：覆雪的深色山峦与凝着冰棱的冰瀑；
  五层前后叠压关系清楚，机位压低仰拍，主体压在上半区，天空留出一条渐变色带。

  暖光点缀：
  {暖光点缀}沿雪堆边缘排开，发出点状暖光，与唱片的霓虹光边呼应。

  天空与配色：
  {天空渐变}的纯深夜空，散落几点星芒与飘雪；
  暖橘霓虹光晕浓度拉满，暖橘漫射光铺满整个场景；
  {主色调}，冷暖对撞但暖光占主导。

  整体：清晰对焦、细节丰富、画面干净，兼具未来感、冬日氛围与浪漫艺术感。

  避免：错别字与乱码、水印、边框、真实品牌 Logo、冷蓝主光、卡通扁平化、人物出镜。

variables:
- kv_var: 主体物件
  style_var: '{主体物件}'
  desc: 画面中心的巨大主体，如：巨大黑胶唱片、老式收音机、巨型音箱
- kv_var: 发光文字
  style_var: '{发光文字}'
  desc: 立在主体前方的立体发光字，如：MUSIC、WINTER、LIVE
- kv_var: 两侧乐器
  style_var: '{两侧乐器}'
  desc: 分列左右的乐器组，如：左金属架子鼓、右电子琴与电吉他
- kv_var: 前景元素
  style_var: '{前景元素}'
  desc: 前景雪地里的细节，如：红梅枝、枯草丛、绒白积雪
- kv_var: 暖光点缀
  style_var: '{暖光点缀}'
  desc: 雪地上的暖光小物，如：发光圣诞灯串、暖光小篝火、迷你圣诞树
- kv_var: 远景元素
  style_var: '{远景元素}'
  desc: 远处背景元素，如：覆雪深色山峦、凝着冰棱的冰瀑
- kv_var: 天空渐变
  style_var: '{天空渐变}'
  desc: 夜空渐变，如：深紫到暖红橙、靛蓝到玫红
- kv_var: 主色调
  style_var: '{主色调}'
  desc: 整体配色，如：高饱和暖橙金 + 米白 + 暖棕，糅玫红、亮银、炭黑

