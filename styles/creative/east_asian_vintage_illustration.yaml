features:
- title: '**韩纸（Hanji）质感背景**：淡墨线描、水彩晕染、手工纹理'
  desc: ''
- title: '**花卉主题**：每次仅选一种花卉（芍药/山茶/玉兰/梅/莲等），围绕人物有机排布'
  desc: ''
- title: '**改良韩服造型**：jeogori/chima/durumagi 等韩服元素 × 现代时尚剪裁'
  desc: ''
- title: '**莫兰迪色系**：象牙白、奶油、淡薄荷、鼠尾草绿、米杏等柔和色调 + 一个鲜明点缀色'
  desc: ''
- title: '**禁止直视镜头**：眼神望向远方，营造诗意、怀旧、静谧的氛围'
  desc: ''
variables: []
prompt: |
  以上传的肖像图作为首要身份参考。保留主体真实的面部身份、面部比例、平静神态、肤色、自然特征与整体印象。
  不要把主体换成另一个人。

  无论参考图中的视线方向如何，主体都不得直视镜头。眼神应柔和地望向远方、略微偏离观者，带梦幻、怅惘、平静的神情。

  创作一幅精致的东亚复古杂志风插画：一位优雅的韩国女性，把韩国传统美学与现代编辑时尚艺术融合。把主体放在诗意、均衡、带优雅负空间的构图里。

  每个元素都随机选择一种自然变化：

  - 发型/发饰：选择适合参考面孔的现代、柔和、时髦发型，微妙借鉴韩国传统美学，例如柔和分缝、松散低发髻、自然的半扎发、简单编发或放松的低丸子头，配以极简点缀，如细长的 binyeo（韩式发簪）、低调的 daenggi 发带、小巧的花卉发夹，或精致的 norigae（韩式佩饰）式细节。保持当代、精致、克制；避免繁复的中式发冠或过大的装饰发簪；

  - 植物主题：每张图只从芍药、山茶、梅花、玉兰、莲、睡莲、木槿、雏菊、金盏花或野花中选一种花。不要反复默认同一种花；每次生成都应像不同的单花变体；

  - 姿态/取景：四分之三侧身、柔和的侧脸、坐姿，或视线偏开的半身特写；

  - 服装：基于真实的韩国廓形，选择现代的韩服灵感造型，例如 jeogori（短上衣）、chima（裙）、durumagi（长外套）、baeja（马甲）、层叠 jeogori 外套、象牙白现代韩服连衣裙、淡薄荷层叠外套、柔和的蜜桃色上衣、鼠尾草绿编辑感连衣裙，或奶油色韩服灵感套装。加入细微的 goreum（衣带）式飘带、柔和领口、克制刺绣、放松的现代造型与优雅的布料动态；避免中式汉服式长袍、宽大半透明外披、仙侠式层叠垂挂、奇幻袖型，或非韩国的历史服饰元素；

  - 点缀色：深绯红、玉绿、宝蓝、朱红、古金，或深紫。

  使用围绕人物有机排布的大尺度植物元素，且只使用该图选定的单一植物主题。使用细腻的墨线、干净流畅的轮廓、微妙的手绘质感、柔和的水彩晕染，以及温暖的做旧韩纸（hanji）背景。

  服装应包含微妙的韩服灵感细节，如飘逸的袖子、层叠的布料、柔和飘带、刺绣、温和的领口、放松的廓形，或优雅的布料动态。

  使用象牙白、奶油、淡薄荷、鼠尾草绿、褪色米色、柔和蜜桃、灰粉珊瑚、暖灰与柔棕墨色的低饱和色板，并以一个鲜明点缀色作为视觉焦点。

  整体情绪优雅、怀旧、清新、诗意、安静、奢华，像高端韩国艺术海报、奢华时尚杂志插画与现代东亚植物肖像。保持面部优雅且可辨认。

  不要直视镜头，不要盯着观者，不要正面证件照式的表情，不要混合花束，不要一张图里出现多种花，不要重复默认花种，不要中式汉服式长袍，不要仙侠式服装，不要宽大半透明外披，不要奇幻垂挂层，不要繁复的中式发冠，不要过大的装饰发簪，不要文字，不要 logo，不要排版文字，不要照片写实，不要 3D，不要油亮数字渲染，不要刺眼霓虹色，不要浓重动漫风，不要塑料皮肤，不要过度改脸，不要偶像式换脸。

