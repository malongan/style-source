features:
  - title: 一整块立体多层镂空纸雕窗景占住中部
    desc: 画面中部约六成被一整块连续的立体多层中式剪纸占满，由三到四层有真实厚度的雅米白／牙白纸层雕出云纹、卷草与浪花状的不规则波浪外框，右上大幅卷曲向外包住画面；每层纸边都带利落的雕刻切口、极浅亮边与真实的层间投影，向内围出一个「窗景」，不是分格拼贴、不是扁平插画加一点浮雕
  - title: 窗内是连贯的非遗花灯作坊与灯会夜游
    desc: 窗景内部是一个有前后纵深的连贯场景：前景花灯铺子里三四位匠人分别扎竹骨、糊纸裱面、手绘花鸟纹样，台面摆着竹条、剪刀、纸样与浆糊；右下两名孩童提灯或抱兔儿灯；中景是格扇窗棂、屋檐与柜台；远景是街巷灯影与巡游人群剪影。人物与器具体量虽小但动作清楚，靠纸层前后叠压而非并列小图来讲故事
  - title: 四五只宫墙红镂空宫灯透出暖鎏金灯光
    desc: 球形宫灯、圆灯笼、方形宫灯等不同形制共四五只，悬垂或立在画面的不同纵深上，红色染纸上是精细利落的花鸟、缠枝与几何镂空纹样，灯内透出暖鎏金光，底部带流苏垂坠；它们是画面唯一的高饱和强调色，也是镂空透光效果的主要载体
  - title: 上下两段留白承载编辑式信息带
    desc: 留白集中在画幅上下两端：最顶端左右各一个四位年份数字、中间一行字距极宽的极小署名，由细横线贯穿；左上留白里依次是细衬线英文主标题、较大的宫墙红中文粗宋主标题与两行更小英文副题；剪纸下方左侧一行中文小句、右侧一枚极简圆形线描小徽记与字标，再下一条细横线、一段三到四行左对齐极小英文长句，最底一行居中版权小字
  - title: 雅米白主导、红金点缀的暖调纸材质
    desc: 整体是雅米白／暖白的高明度纸色打底，宫墙红只用于花灯、建筑线与中文主标题，暖鎏金只作灯内透光与极浅渐变，深墨用于小字；所有元素都呈现为纸——可见细腻纸纤维、染色纸的哑光面与雕刻硬边，柔和侧顶光让层间落下暖灰阴影，通透立体但绝不发亮、不发塑料感

scene: "非遗文化与民俗节庆主题海报、灯会／元宵活动主视觉、文创品牌节日KV、博物馆与传统工艺展陈视觉、东方美学出版物插图"
ratio: "3:4"
summary: "雅米白纸面上，三到四层立体镂空剪纸雕出云纹浪花窗景，窗内是连贯的非遗花灯作坊与灯会夜游：匠人扎骨糊纸、孩童提灯、四五只宫墙红镂空宫灯透出暖鎏金光；上下两段留白用细横线、中英文标题组、底部英文长句与版权行收成精致的编辑式信息带，国潮东方美学、喜庆雅致。"

prompt: |
  创作一张 3:4 竖版的中式非遗主题海报，气质喜庆雅致、精致规整、通透立体，国潮东方美学。主题是【{非遗主题}】。

  整体是雅米白／暖白的高明度纸色底，画面上下两端各留一段安静留白用于信息排版，中部约六成被一整块连续的立体多层中式剪纸占满。这块剪纸必须由三到四层有真实厚度的米白／牙白纸层叠成，最外层雕出云纹、卷草与浪花状的不规则波浪边框，从右上大幅卷曲向外包住画面，每层纸边都要有利落干净的雕刻切口、极浅的亮边和真实的层间暖灰投影，向画面内部围出一个像开窗一样的「窗景」。所有元素都是纸做的：可见细腻纸纤维、染色纸的哑光表面与雕刻硬边，柔和侧顶光制造层叠的体积感，不要扁平矢量插画、不要 3D CGI、不要塑料或玻璃质感、不要照片拼贴、不要分格小图或九宫格。

  窗景内部是一个连贯、有前后纵深的民俗场景，不是把多个动作并列摆成小插画。前景是花灯作坊，三四位穿传统服饰的匠人正在做真实的手作：一人扎竹骨、一人糊纸裱面修整、一人执笔手绘花鸟纹样，台面上有竹条、剪刀、纸样、浆糊与半成品；右下两名孩童提灯或抱兔儿灯。中景用格扇窗棂、屋檐、柜台把空间往后推；远景是街巷灯影与夜间巡游的人群剪影，靠纸层前后叠压形成纵深。人物与器具体量偏小但动作、工具和空间关系清楚可辨。

  画面里悬垂或立着四五只不同形制的宫墙红镂空宫灯：球形宫灯、圆灯笼、方形宫灯分布在不同纵深上，红色染纸上是精细的花鸟、缠枝与几何镂空纹样，灯内透出暖鎏金光，底部带流苏垂坠。宫墙红是画面唯一的高饱和强调色，同时用于建筑线与中文主标题；暖鎏金只作灯内透光和极浅渐变；其余文字用深墨。整体保持高明度、干净、通透，不要满版深色底、不要霓虹色、不要脏旧做旧滤镜。

  排版按上下两段信息带组织，字号层级要拉得很开。最顶端：左右两侧各放一个四位年份数字，正中间一行字距极宽、字号极小的署名，用细横线把三者连起来并收口；信息写成【{页眉信息}】。左上留白里左对齐排一组标题：先是一行较大的深墨细衬线英文【{英文主标题}】，下面是一行明显更大、宫墙红或深赭色的中文粗宋／明朝体【{中文主标题}】，再下面两行更小的英文【{英文副题}】。这组标题是文字区的第一层级，但不要让字号大到压过剪纸主体。剪纸下方的留白里，左侧放一行中文小句【{中文小句}】，右侧放一枚极简圆形线描小徽记与一行虚构字标；再往下用一条细横线分隔，线下左对齐排一段三到四行、字号极小、行距紧凑的衬线体英文说明长句【{底部文案}】；最底端居中一行更小的版权小字。右下徽记、字标与版权写成【{落款信息}】。

  所有文字必须清晰工整、真实可读，使用合法的中英文词句，禁止错拼、伪词、乱码、重影、随机汉字和不可辨读的装饰连笔。不要额外添加任何未指定的大标题、slogan、日期、编号、印章、水印、真实品牌 Logo 或版权行，也不要把留白填满。整体要像一件多层纸雕被平整地装裱在一张精致的编辑式海报上。

variables:
  - kv_var: 非遗主题
    style_var: "{非遗主题}"
    desc: "剪纸窗景里的具体非遗题材与场景，如：花灯扎制与灯会夜游 / 皮影雕刻与戏台演出 / 木版年画印制与年集；会同时驱动匠人动作、道具与宫灯纹样"
  - kv_var: 页眉信息
    style_var: "{页眉信息}"
    desc: "左右两侧四位年份 + 中间字距极宽的细小署名，用 / 分隔，如：2026 / PAPER STUDIO DESIGN / 2026；用虚构工作室名，不要真实设计者署名"
  - kv_var: 英文主标题
    style_var: "{英文主标题}"
    desc: "左上细衬线英文主标题，如：Traditional Lantern Art / The Craft of Paper Cut / Lantern Night"
  - kv_var: 中文主标题
    style_var: "{中文主标题}"
    desc: "左上宫墙红中文粗宋主标题，四到六字，如：非遗·灯火万家 / 一纸千灯 / 纸上灯市"
  - kv_var: 英文副题
    style_var: "{英文副题}"
    desc: "中文主标题下方两行更小英文副题，如：Oriental Festive / Lantern Craft；需合法可读"
  - kv_var: 中文小句
    style_var: "{中文小句}"
    desc: "剪纸下方左侧的一行中文短句，如：一盏花灯亮，一城烟火长 / 纸上有光，人间有节"
  - kv_var: 底部文案
    style_var: "{底部文案}"
    desc: "细横线下三到四行左对齐的英文说明长句，语法正确、拼写合法；禁止沿用源图里的伪词与重影乱码，如：Each lantern is built from bamboo and thin paper, then lit from within. On festival nights their hollowed patterns glow across the old streets, carrying a quiet warmth from one doorway to the next."
  - kv_var: 落款信息
    style_var: "{落款信息}"
    desc: "右下极简圆形线描徽记与虚构拉丁字标 + 最底部居中版权行，用 / 分隔，如：PAPER ATELIER / 2026 Paper Atelier / All Rights Reserved.；不要真实 Logo 或真实人名"

