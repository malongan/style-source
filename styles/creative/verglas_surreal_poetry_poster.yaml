features:
  - "**纯黑背景 + 铬液金属形态** — 黑色背景上，巨大的不定形铬液金属雕塑，充满扭曲、融化、垂落的流动形态"
  - "**虹彩反射表面** — 表面泛起翠绿、紫色、琥珀色虹彩反射，湿漉漉的有机质感，如同汞在运动中被冻结"
  - "**斜体主标题** — 文字置于负空间缝隙中，主标题与诗句层层递进"
  - "**模糊轮廓与暧昧形态** — 雕塑轮廓暧昧，不断在不同角度暗示不同形态，制造神秘感"
  - "**文学感诗句编排** — 多节诗句以短行诗形式排列，文学感强，如同独立诗歌手册内页"

scene: "诗歌海报、文学宣传、画廊展览、品牌KV、编辑出版"
ratio: "3:4"
summary: "纯黑背景神秘诗歌手册海报，铬液金属雕塑 + 斜体排版，文学感诗句编排"

variables:
  - kv_var: 主标题
    style_var: "{主标题}"
    desc: 如：Verglas / 霜面 / NOCTURNE
  - kv_var: 小标题
    style_var: "{小标题}"
    desc: 如：Les Ombres. / 影子的部分 / II.
  - kv_var: 第一节诗
    style_var: "{第一节诗}"
    desc: 如：They arrive without knocking, without asking if you were ready.
  - kv_var: 第二节诗
    style_var: "{第二节诗}"
    desc: 如：It has been so long that the idea trembles and slips between my fingers.
  - kv_var: 点缀色
    style_var: "{点缀色}"
    desc: 如：橙色 / 琥珀金 / 淡青

prompt: |
  3:4 诗歌手册海报，纯黑背景。画面被一团巨大、蔓延的铬液金属形态占据，形状不确定、不断位移——既不是明确的拱门，也不是门户，更不是任何可辨认的物体，只是一团扭动、融化、垂落的液态触须与鼓胀褶皱，向画面边缘溢出。表面泛起翠绿、紫罗兰和琥珀色的虹彩，湿润、有有机感，像被冻结在运动瞬间的汞。轮廓暧昧，在不同角度看会暗示不同形态。蔓延的金属团里留出几处小的负空间缝隙，能透出下方的黑色背景。

  主标题压在某一处缝隙里：{主标题}，用优雅的{点缀色}意大利斜体排布。

  下方用小的衬线字排出短诗节：
  「{第一节诗}」

  再下面一行更小的字「{小标题}」。

  最后一段：
  「{第二节诗}」

  深黑背景，泛光的铬绿雕塑体填满大半个画面，{点缀色}是唯一的强调色，氛围阴郁、超现实。所有诗句左对齐，行距舒展，像独立诗歌手册的内页。

  不要水印，不要真实Logo，不要电商广告感。

