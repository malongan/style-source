features:
- title: 极繁钢笔排线塑造全部光影
  desc: 短促细密、交错排布的钢笔交叉影线铺满画面，靠排线的方向与疏密表现金属体积、阴影与斑驳质感，硬朗利落、繁复密集
- title: 黑白底稿上局部点彩
  desc: 以黑白钢笔画为底，只在蝴蝶、花朵、锈迹等少数元素上填高饱和色，其余保持冷灰蓝与墨线本色，形成克制而醒目的色彩焦点
- title: 巨型机械墓场与生命反差
  desc: 堆积如山的机器人残骸、齿轮、断裂机械臂与球形机械头骨一望无际、纵深辽阔；机械指尖停一只斑斓蝴蝶、缝隙盛放细碎小花，死寂机械与鲜活生命强对比、孤寂诗意
- title: 不对称纵深与偏白留白
  desc: 前景构件巨大精细、背景废墟简化为浅淡线稿消隐于偏白天际，不对称构图带来巨物压迫与无边荒凉感

scene: "科幻概念插画、书籍与专辑封面、艺术海报、废土与机甲主题创作、展览主视觉"
ratio: "9:16"
summary: "极繁主义钢笔线绘废土科幻海报——短促交错的钢笔交叉影线铺满巨型机器人残骸（管线·齿轮·断臂·机械头骨）一望无际、前景巨大背景淡出白色天际，黑白底稿只在蝴蝶·花·锈迹上局部高饱和上色、其余冷灰蓝，机械指尖停斑斓蝴蝶、缝隙盛放小花，死寂与生命强对比、荒凉诗意。（源写「暗黑哥特油画·胶片颗粒·厚重磨砂」，成图实为偏白留白的干净钢笔线绘＋局部淡彩，按成图收；顶部大标题「JOANNA Design」与四角署名是作者水印，已剔除、意境标题做成可空变量，负向排除署名水印与乱码。）"

prompt: |
  创作一张 9:16 竖版的极繁主义钢笔线绘复古未来科幻插画，废土诗意、荒凉壮阔、静谧神秘。

  主体场景：
  {废墟主体}层层堆叠、一望无际，近景构件巨大而精细、背景残骸逐渐简化为浅淡线稿消失于白色天际，营造无边纵深与巨物压迫感；{点睛生灵}落在冰冷金属之上，鲜活生灵与死寂机械形成强烈生命反差。

  线条与介质：
  以{线绘手法}塑造全部光影与材质，线条走向贴合自然明暗结构、硬朗利落；黑白底稿之上只给{上色策略}，其余保持钢笔画本色。

  构图与色调：
  {构图氛围}；整体偏冷灰蓝、背景大量留白偏亮，靠局部高饱和点缀形成冷暖对比与强烈明暗、透视精准。

  文字（可选）：
  画面顶部可排一行手写体{意境标题}作为意境点题、层级简洁。

  不要：厚重油画堆叠、明显胶片颗粒、暗到看不清的黑底、真实品牌 Logo 或作者署名水印、乱码伪字、摄影质感、电商广告感。

variables:
- kv_var: 废墟主体
  style_var: '{废墟主体}'
  desc: 堆积如山的主体残骸，如：巨型机器人墓场（液压管线·齿轮·装甲·断裂机械臂·机械头骨）
- kv_var: 点睛生灵
  style_var: '{点睛生灵}'
  desc: 死寂中反差的鲜活元素，如：机械指尖停一只斑斓蝴蝶、缝隙盛放细碎小花
- kv_var: 线绘手法
  style_var: '{线绘手法}'
  desc: 塑造光影的排线方式，如：短促细密交错的钢笔交叉影线
- kv_var: 上色策略
  style_var: '{上色策略}'
  desc: 黑白线稿上局部上色的部位，如：仅蝴蝶与花高饱和上色、余下冷灰蓝
- kv_var: 构图氛围
  style_var: '{构图氛围}'
  desc: 构图与氛围，如：不对称、前景巨大背景淡出白色天际的荒凉纵深
- kv_var: 意境标题
  style_var: '{意境标题}'
  desc: 顶部手写体意境点题文字，可留空，如：WASTELAND OF STEEL

