features:
- '**Preserve the 核心 visual identity: 复古 skate 杂志 海报风格 ，搭配 失真 中心 skateboarder 剪影, 奶油色 纸面, loose 红 手写边框 字体排版, 粗糙 双色 丝网印刷 质感, and a limited 藏蓝-灰-绿-赭石 palette.**'
- '**Place the 主体 as one 超大 中心 海报化 剪影 ，搭配 压缩 crouching or skating pose.**'
- '**Build the composition ，在 warm 奶油色 纸面 ，搭配 绿 skateboard, rail, board, or long prop sweeping 横穿 lower third.**'
- '**Use 粗糙 双色 丝网印刷 质感, 深 藏蓝 clo薄g, dusty 灰 pants, 芥末黄 赭石 skin, dry 黑 斑点, 半调 dirt, 纸张纹理, 墨迹跳跃, 套准偏差, and handmade indie skate 杂志 气质.**'
- '**禁止水印, 用户名, creator ID, 二维码, plat形态 logo, app UI, exact copied reference phrase, 干净矢量插画, 精致企业 运动 海报, 光泽3D文字, chrome, neon 渐变, 奢侈编辑光, 平滑喷枪渐变, 无菌影棚背景, 完美字体排版, 长段落文字, 照片级写实 clutter, 动漫超级英雄漫画风格, and 滑板品牌logo.**'
