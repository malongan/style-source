features:
- title: '保留核心视觉识别：复古滑板小志海报风格，中央扭曲的滑板手剪贴、米色纸底、松散的红色手写边框字体、粗糙双色丝网印刷质感，以及克制的藏青-灰-绿-赭石配色。'
  desc: ''
- title: 以单个超大号中央色调分离剪贴作为主体，采用压缩的蹲姿或滑板姿势。
  desc: ''
- title: 在暖米色纸底上构建构图，一块绿色滑板、栏杆、板面或长条道具横扫下三分之一。
  desc: ''
- title: 使用粗糙的双色丝网印刷质感：深藏青服装、灰扑扑的裤子、芥末赭石肤色、干墨黑斑点、半色调脏点、纸张颗粒、漏墨、套印不准，以及手工独立滑板小志的活力。
  desc: ''
- title: 避免：水印、用户名、创作者 ID、二维码、平台标识、应用界面、照搬参考文案、干净矢量插画、精致的企业运动海报、亮面 3D 文字、铬质、霓虹渐变、奢华编辑布光、平滑的喷枪阴影、无菌影棚背景、完美的字体排印、长段落文字、照片写实杂物、动漫、漫画超级英雄风格，以及滑板品牌标识。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{主体}'
  desc: 滑板手，如：戴帽子的青少年滑手
- kv_var: 主体动作
  style_var: '{动作}'
  desc: 如：腾空 ollie / 滑行中
- kv_var: 产品/道具
  style_var: '{道具}'
  desc: 如：滑板 / 耳机
- kv_var: 场景地点
  style_var: '{场景}'
  desc: 如：街角台阶 / 滑板场
- kv_var: 背景元素
  style_var: '{背景元素}'
  desc: 补充画面层次，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{主文案}'
  desc: 松散红色手写边框字，如：SK8
- kv_var: 服装造型
  style_var: '{造型}'
  desc: 如：宽松 T 恤 + 工装裤
- kv_var: 副文案
  style_var: '{副文案}'
  desc: 如：issue 04
- kv_var: 点缀符号
  style_var: '{点缀符号}'
  desc: 如：涂鸦线 / 星号
prompt: |
  创作一张图像，采用 Teenage Skate Scribble Screenprint Poster 风格。画幅：16:9。场景：{主体}{动作}，带着{道具}，地点在{场景}。把主体做成一个超大的中央色调分离剪贴，采用压缩的蹲姿或滑板姿势。使用{造型}。在暖米色纸底上构建构图，让一块绿色滑板、栏杆、板面或长条道具横扫下三分之一。沿边缘环绕松散的红色手写边框字「{主文案}」，加入小段手写碎片「{副文案}」，并加入{点缀符号}。加入{背景元素}。使用粗糙的双色丝网印刷质感：深藏青服装、灰扑扑的裤子、芥末赭石肤色、干墨黑斑点、半色调脏点、纸张颗粒、漏墨、套印不准，以及手工独立滑板小志的活力。避免水印、用户名、创作者 ID、二维码、平台标识、应用界面、照搬参考文案、干净矢量插画、精致的企业运动海报、亮面 3D 文字、铬质、霓虹渐变、奢华编辑布光、平滑的喷枪阴影、无菌影棚背景、完美的字体排印、长段落文字、照片写实杂物、动漫、漫画超级英雄风格，以及滑板品牌标识。

