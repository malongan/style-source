prompt: |
  Create an ultra-premium vertical Chinese ink-and-light-color mural-style painting that preserves the exact core structure, ancient fresco atmosphere, and floating musical-divine elegance of the image, while strengthening the first-glance focus on the two celestial musicians and unifying the whole picture into a more rigorous ancient mural color system.

  Core composition: Use a tall vertical composition with the two women arranged along a descending diagonal from upper-left to lower-right. The upper figure floats slightly higher and plays a transverse flute; the lower figure hovers beneath and plays a pipa-like lute. Their bodies curve in elegant S-shaped arcs, with long ribbons and trailing skirts weaving through the composition and linking them into one continuous celestial rhythm. Around them, place clusters of pale auspicious clouds and a few muted lotus-rosette motifs dispersed across the background.

  Figure design: Depict two unmistakably adult eastern celestial women with mature refined classical features, slender necks, soft oval faces, lowered eyes, and serene inward expressions. Their hair in elegant high ancient updos with minimal refined head ornaments. Dress in ancient celestial dance-musician attire: lightly draped upper garments, flowing translucent shawls, long ribbon scarves, and elegant layered skirts in faded mineral teal, dusty blue-green, muted rose-brown, pale earth red, and aged ivory.

  Transit visual system: Unify the entire image into a stricter ancient mural color system — mineral teal, dusty blue-green, softened rose-brown, aged ivory, pale ink-gray — deliberately harmonized with no stray saturation.

  Painting language: Render in traditional Chinese mural-inspired ink-and-light-color technique on aged wall texture: ink as structure, soft mineral washes, faded earth pigments, delicate contour lines, cloud-scroll motifs, low-saturation chroma, gentle weathering. Background resembles an aged mural ground with subtle irregular stains, patina, faint rubbed areas, and soft time-wear.

  Mood: ancient, sacred, musical, floating, mural-like, serene, elegant, faded, poetic, celestial, refined, museum-grade, timeless.
