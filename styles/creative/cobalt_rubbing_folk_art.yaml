features:
- title: 单色钴蓝拓印
  desc: 整幅画面只有一种深钴蓝与纸底两色，强烈的蓝白对比，像从碑石上拓下来的一幅印，不做任何多色套印
- title: 斑驳不匀的墨色
  desc: 墨块内部有细小白点、空隙与颗粒，边缘断裂、飞白、缺角，印面形状不规则，像纸上按压出来的印记而非绘制的色块
- title: 平面装饰的民间造型
  desc: 主体是近乎对称的正面形象，头冠端正、眉眼夸张、鬃毛与胡须用放射排线刻画，衣领肩部用弧线排出层层衣褶，不追求写实
- title: 主体居中只占四分之一
  desc: 主体安置在画面正中、占约四分之一画幅，四周是完整的大面积留白，不做满版构图
- title: 单色刻出的民间纹样
  desc: 主体四周与空白处点缀卷云、回纹一类的民间纹样，同样以单色线条刻出，疏密克制、不喧宾夺主

scene: "民俗艺术展览海报、非遗拓印文创、神话角色海报、博物馆藏品图、东方节日视觉"

ratio: '9:16'
summary: "钴蓝拓印民俗插画——单一深钴蓝拓印在米白纸上的平面民间造型，墨色斑驳带飞白颗粒，主体居中只占四分之一画幅，四周单色刻出卷云回纹，大留白、有古意。"

prompt: |
  创作一张 9:16 竖版的单色拓印民间艺术插画。

  画面：
  {纸面底色} 的纸面，中央是{民俗主体}的正面形象，占据画面正中约四分之一，四周保持完整的大面积留白。
  造型是平面装饰性的民间美术，不是写实描绘：面部近乎对称，头冠端正，眉眼夸张，鬃毛与胡须用密集的放射排线刻画，衣领与肩部用弧线排出层层叠叠的衣褶。

  拓印质感：
  画面只有{主体色}一种颜色，与纸底形成强烈对比，不做多色套印。
  刀法采用{刀法线条}。
  墨色斑驳不匀：{拓印肌理}——边缘有断裂、飞白与缺口，印块内部散着细小白点与空隙。
  拓印块的形状不规则，四边略有缺损，像纸上按压出来的印记，不是绘制出来的干净色块。

  装饰：
  主体四周与空白处点缀{纹样装饰}，同样以单色线条刻出，疏密克制，不压住主体。

  整体：
  平面民间艺术，拓印特色鲜明，留白意境强烈，安静、粗犷、有古意。

  避免：渐变与立体阴影、多色套印、照片写实、3D 渲染、真实品牌 Logo、水印、伪字。

variables:
- kv_var: 民俗主体
  style_var: '{民俗主体}'
  desc: 主体形象，如：钟馗、门神、山神、灶神
- kv_var: 纹样装饰
  style_var: '{纹样装饰}'
  desc: 四周点缀的民间纹样，如：卷云纹、回纹、如意云头
- kv_var: 主体色
  style_var: '{主体色}'
  desc: 唯一的印色，如：深钴蓝、朱砂红、墨黑
- kv_var: 纸面底色
  style_var: '{纸面底色}'
  desc: 纸底颜色，如：米白、宣纸黄、冷白
- kv_var: 拓印肌理
  style_var: '{拓印肌理}'
  desc: 墨色斑驳特征，如：颗粒与飞白、断墨留白、砂点肌理
- kv_var: 刀法线条
  style_var: '{刀法线条}'
  desc: 刻线方式，如：阴刻白线（刻痕留白）、阳刻实线、放射排线

