name: 玻璃花卉春日日记插画
category: creative
ratio: '9:16'
source_author: '@悦（即梦）'
source_url: 'https://jimeng.jianying.com/ai-tool/work-detail/7616607728072461594?workDetailType=Image&itemType=9'
summary: 玻璃质感花卉插画 × 米白色信封 × 浅绿细闪渐变底 = 清新治愈春日日记。
tags:
- 治愈
- 玻璃花卉
- 春日
- 数字插画
- 梦幻
- 日记
triggers:
- 玻璃花卉
- 春日日记
- 治愈插画
- 玻璃质感花朵
- Spring Diary
features:
- title: 浅绿渐变带细闪颗粒的背景
  desc: ''
- title: 主体为米白色玻璃信封，内插透明玻璃花卉
  desc: ''
- title: 玻璃质感花朵（粉色郁金香、透明铃兰、淡蓝雏菊）
  desc: ''
- title: 清晰玻璃纹理与光泽
  desc: ''
- title: 粉色燕子衔着LOVE铭牌
  desc: ''
- title: 柔和梦幻，温柔治愈氛围
  desc: ''
- title: 底部极小装饰文字排版
  desc: ''
variables:
- kv_var: 主标题
  style_var: '{主标题英文}'
  desc: 信封上的英文标题
- kv_var: 信封颜色
  style_var: '{信封颜色}'
  desc: 如：奶油黄 / 雾霾蓝
- kv_var: 信封类型
  style_var: '{信封类型}'
  desc: 如：牛皮纸信封 / 玻璃纸信封
- kv_var: 季节花卉类型
  style_var: '{季节花卉类型}'
  desc: 如：春季野花 / 夏季莲花
- kv_var: 鸟颜色
  style_var: '{鸟颜色}'
  desc: 如：薄荷绿 / 琥珀金
- kv_var: 鸟类型
  style_var: '{鸟类型}'
  desc: 如：蜂鸟 / 山雀
- kv_var: 铭牌文字
  style_var: '{铭牌文字}'
  desc: 如：SPRING / 春日
- kv_var: 底部文字
  style_var: '{底部文字}'
  desc: 画面最底部的小字，如：愿你被温柔以待
- kv_var: 花卉1
  style_var: '{花卉1}'
  desc: 第 1 种花，如：洋甘菊
- kv_var: 花卉2
  style_var: '{花卉2}'
  desc: 第 2 种花，如：满天星
- kv_var: 花卉3
  style_var: '{花卉3}'
  desc: 第 3 种花，如：小苍兰
prompt: 清新治愈的数字插画，浅绿渐变带细闪颗粒的背景，主体是一个特写{信封颜色}的{信封类型}，信封内插满透明玻璃质感的{季节花卉类型}：{花卉1}、{花卉2}与{花卉3}，花朵带有清晰的玻璃纹理与光泽；一只带{鸟颜色}的{鸟类型}衔一个{铭牌文字}铭牌在信封上飞，信封上有"{主标题英文}"，画面底部居中极小字"{底部文字}"，整体风格柔和梦幻，玻璃材质的花朵晶莹剔透，充满春日的温柔与治愈氛围。
id: glass_flower_spring_diary
code: ''
