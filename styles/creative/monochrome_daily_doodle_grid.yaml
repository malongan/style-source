# 黑白简笔日常分格小画

id: monochrome_daily_doodle_grid
name: "黑白简笔日常分格小画"
category: creative

tags:
- 黑白简笔
- 分格小画
- 治愈日常
- 圆头小动物
- 手写英文配文
- 大留白

triggers:
- 黑白简笔小画
- 日常分格简笔画
- 治愈系简笔画组图
- 圆头兔子涂鸦
- 12格日常插画
- 手账简笔素材

features:
- title: 三列四行的独立小画网格
  desc: 整张图由 12 幅互不相连的小画按 3 列 4 行排布，每幅是一个独立的日常片段，格与格之间没有边框和分隔线，全靠留白分开
- title: 圆头小动物的极简造型
  desc: 主角是圆脑袋、两只长耳的简笔小动物，圆点眼、小三角嘴、短手短脚，身体只用一条连续轮廓勾出，没有毛发和五官细节
- title: 粗细不匀的黑色单线
  desc: 全画只有黑线，线条圆头、粗细略有变化、带一点手绘抖动，物体内部不填充不排线，只靠轮廓读形状
- title: 少量手写英文短句
  desc: 部分小画上方或旁边配一句手写体英文短句，字大、笔画圆润、拼写正确可读，其中一句放在圆角对话气泡里
- title: 极简道具与手绘小符号
  desc: 每格只保留能说明动作的两三件道具（锅、碗、杯子、床、伞、书、沙发），配爱心、Zzz、放射短线、小圆点等简笔符号
- title: 大量留白与治愈节奏
  desc: 纯白纸面、画面整体通透，12 格之间留白充足，动作轻缓，形成轻松治愈的生活日记感

scene: "手账与日记素材页、社媒治愈组图、表情包草图集、文创贴纸与印章图稿、儿童绘本内页"

ratio: '3:4'
summary: "黑白简笔日常分格小画——3 列 4 行共 12 幅互不相连的独立小画，圆头长耳小动物用粗细不匀的黑色单线勾出日常片段，少量手写英文短句与爱心 Zzz 小符号点缀，纯白大留白、轻松治愈。"

prompt: |
  创作一张 3:4 竖版的黑白简笔画组图，轻松治愈的生活日记感。

  版式：
  整张图由 12 幅互不相连的小画组成，按 3 列 4 行排布，格与格之间不画边框、不画分隔线，只靠{背景底色}上的大量留白分开。
  每幅小画是一个独立完整的日常片段，不把多幅画连成一个连贯场景。

  主角：
  每格出现{主角动物}：圆圆的大脑袋、两只长耳、圆点眼睛、小三角嘴、短短的手脚，身体用一条连续的轮廓勾出，不画毛发、不画复杂五官。

  画法：
  全画只用黑色单线，线条圆头、粗细略有变化、带一点手绘的轻微抖动；物体内部不填充、不排线，只靠轮廓读形状，最多在腮红与格纹处点极少量浅灰。
  每格只保留能说明动作的两三件道具：{生活道具}。
  用极少的简笔小符号烘托情绪：{点缀符号}。

  场景：
  12 格分别表现{场景清单}，彼此不重复，动作轻缓、姿态可爱。

  配文：
  只在其中几格的上方或旁边写一句{配文清单}，手写体、字较大、笔画圆润，英文拼写必须正确清晰可读；
  其中一句放进圆角对话气泡里。其余格子不配文字。
  不要加标题、编号、页码、版权行，也不要出现伪字。

  整体：
  {背景底色}，通透、干净、留白充足，12 格大小与间距大致均衡，像一页手账简笔素材。

  避免：任何彩色、渐变、阴影与 3D 渲染、写实照片质感、粗黑填色块、边框与网格线、乱码伪字、真实品牌 Logo、水印。

variables:
- kv_var: 主角动物
  style_var: '{主角动物}'
  desc: 每格出现的简笔小动物，如：圆头长耳小兔、小熊、小猫
- kv_var: 场景清单
  style_var: '{场景清单}'
  desc: 12 个日常片段，用顿号分隔，如：厨房做饭、独自吃饭、三两好友碰杯、起床问早、赖床睡觉、泡澡、窗边看风景、雨中撑伞、林间散步、沙发看书、跳跃玩耍
- kv_var: 生活道具
  style_var: '{生活道具}'
  desc: 画面里的极简道具，如：锅与碗、马克杯、床与被子、雨伞、书本、沙发
- kv_var: 点缀符号
  style_var: '{点缀符号}'
  desc: 烘托情绪的简笔小符号，如：爱心、Zzz、放射短线、小圆点、气泡
- kv_var: 配文清单
  style_var: '{配文清单}'
  desc: 几格上的手写英文短句，用顿号分隔，如：Eat with me.、Your friends.、Good morning.、Zzz、jump jump
- kv_var: 背景底色
  style_var: '{背景底色}'
  desc: 纸面底色，如：纯白、米白、极浅暖白

