prompt: |
  Minimalist black-and-white editorial character illustration of {角色描述} on a clean white background with abundant negative space. The character occupies approximately 30–40% of the frame in {姿势描述}, wearing {服装描述} and interacting with {道具描述} (phone, laptop, skateboard, shopping bag, etc.). Stylized proportions with a slightly oversized head, simplified facial features, small dot eyes, expressive eyebrows, tiny nose, and a subtle friendly smile. Loose casual streetwear with oversized silhouettes, chunky sneakers, simple accessories, and relaxed body language.

  Drawn using clean, confident black ink linework with varied line weights, rounded contours, soft sketch-like imperfections, and expressive hand-drawn strokes. Use only solid black and white with no grayscale, no color, and no gradients. Clothing is rendered with large black graphic shapes contrasted against white fabric, minimal folds, simple contour lines, and sparse hatching. Add only a soft ground shadow beneath the feet.

  The composition is centered with generous white margins, creating a modern editorial look. The background remains completely blank except for a subtle floor line or shadow. Overall aesthetic resembles contemporary indie webcomic illustrations, Scandinavian editorial drawings, playful lifestyle character design, and clean vector-inspired ink sketches. High-resolution, crisp line art, minimalistic, expressive, stylish, charming, hand-drawn, 2D illustration, monochrome, no background elements, 4:5 aspect ratio.

  不要水印，不要真实Logo，不要灰度，不要彩色，不要渐变，不要真实照片质感，不要复杂背景，不要厚涂，不要3D渲染。

