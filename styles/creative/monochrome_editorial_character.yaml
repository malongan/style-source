features:
  - "**极简黑白编辑风** — 纯白背景大量留白，角色仅占画面30-40%，呈现现代编辑感版面布局，像当代独立网络漫画和斯堪的纳维亚编辑插画的结合"
  - "**略微夸张大头比例** — 头身比例带有轻微夸张感的角色造型，简化面部特征（小圆点眼睛、挑眉、小鼻子、友好微笑），风格化但保持亲和力"
  - "**干净自信的黑色墨水线条** — 变化丰富的黑色墨水线稿，圆润轮廓线、不同粗细的笔触、柔和的手绘瑕疵感、表现力十足的笔触，无灰度/无彩色/无渐变"
  - "**大块黑色图形对比白色面料** — 服装以大面积黑色几何图形撞白色面料，极简褶皱线、稀疏排线和简单轮廓线，只保留脚底柔和阴影作为画面锚点"
  - "**宽松街头服饰风格** — 宽松休闲的街头穿搭（宽松廓形、厚底运动鞋、简单配饰），放松的肢体语言，搭配日常道具（手机、笔记本电脑、滑板、购物袋等）"

scene: "网络漫画角色、生活方式品牌插画、编辑杂志配图、角色设计展示"
ratio: "4:5"
summary: "极简黑白编辑风角色插画，纯白留白背景配夸张大头比例的街头服饰角色，干净自信的墨水线条，无灰度无彩色"

prompt: |
  极简黑白编辑风角色插画：{角色描述}，落在干净的白色背景上，留白充裕。角色以{姿势描述}占据画面约 30–40%，身穿{服装描述}，与{道具描述}互动（手机、笔记本电脑、滑板、购物袋等）。造型比例风格化，头部略微偏大，面部特征简化：小圆点眼睛、有表现力的眉毛、小小的鼻子、一抹克制的友好微笑。宽松休闲的街头服饰，超大廓形、厚底运动鞋、简单配饰，以及放松的肢体语言。

  使用干净、自信的黑色墨水线稿绘制，线条粗细变化丰富、轮廓圆润、带柔和的手绘瑕疵感、笔触有表现力。只用纯黑与纯白，没有灰度、没有彩色、没有渐变。服装以大块黑色图形撞白色面料来表现，褶皱线极简、轮廓线简单、排线稀疏。只在脚下加一层柔和的地面阴影。

  构图居中，四周留白充裕，形成现代编辑感。除了一条淡淡的地面线或阴影，背景完全空白。整体美学近似当代独立网络漫画插画、斯堪的纳维亚编辑插画、俏皮的生活方式角色设计与干净的矢量感墨水速写。高分辨率、锐利的线稿、极简、有表现力、时髦、可爱、手绘、2D 插画、单色、无背景元素、4:5 画幅。

  不要水印，不要真实Logo，不要灰度，不要彩色，不要渐变，不要真实照片质感，不要复杂背景，不要厚涂，不要3D渲染。

