prompt: |
  Two-dimensional alternative character illustration of {character}, occupying approximately seventy-five percent of the frame in {pose}, with {hair} and {expression}. Oversized rounded cranium, a short flattened lower face, a narrow jaw, a long thin neck, slightly oversized ears, huge pale oval eyes with tiny off-center pupils, extremely thick horizontal black eyebrows, heavy black upper eyelids, muted mauve under-eye rings, a tiny broad triangular nose, and a wide asymmetrical grin showing individually drawn irregular rectangular teeth, one clearly missing upper tooth, one chipped tooth and deep black gaps. Dress the character in {clothing}, simplified into broad graphic shapes with chunky seams, minimal folds and small hand-drawn accessories. Confident black ink contours using thick outer silhouettes, medium-weight facial lines, thin angular hair strands and only a few short scratch marks around the eyes, hair and clothing seams; use flat opaque color fields, one hard-edged cel-shadow shape per form, sparse pencil hatching, subtle ink wobble, slight color misregistration and restrained worn-paper texture. Controlled {colors} palette, keeping every color clearly separated and moderately saturated. Place the character against {background}, reduced to large flat shapes, a few loosely drawn environmental details and oversized rough hand-painted lettering reading \"{text}\"; use an off-center waist-up composition, a slight camera tilt, cropped background typography, loose poster margins and lightly weathered printed edges. 4:5 AR.

  变量说明：
  - {character} — 角色描述，如 "a young street musician with freckles"
  - {pose} — 姿态，如 "sitting cross-legged", "leaning on a wall", "standing proudly"
  - {hair} — 发型发色，如 "spiky neon green mohawk", "long tangled black hair"
  - {expression} — 表情，如 "a wide manic grin", "a deadpan stare", "mischievous smirk"
  - {clothing} — 服装，如 "a studded leather jacket and ripped jeans"
  - {colors} — 色调控制，如 "muted earth tones", "high contrast black and neon pink", "pastel punk"
  - {background} — 背景，如 "a graffiti-covered alley", "an abandoned amusement park"
  - {text} — 手绘背景文字，如 "REBEL", "STAY WEIRD", "NO RULES"

  不要水印，不要真实品牌名。

