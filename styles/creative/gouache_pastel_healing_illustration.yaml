features:
- title: 不透明水彩 × 干色粉混合介质
  desc: 模仿 Gouache 与 Pastel 混合介质，画面有明显的粗糙纸纹颗粒感和纵向干画笔触，摆脱 AI 的干净塑料感
- title: 次表面散射的通透血色
  desc: 高调漫射光，受光面和边缘（脸颊、鼻尖、耳廓）泛着通透的高饱和度橙红色光晕，仿佛内部在发光，充满生命力
- title: 晕涂法柔化轮廓
  desc: 轮廓边缘使用晕涂法（Sfumato），主体边缘与米白色背景柔和融合，界限模糊朦胧
- title: 低饱和但明亮的怀旧色调
  desc: 整体色彩低饱和度却明亮，营造如梦似幻、空气感十足的怀旧氛围
- title: 治愈感日系印象派
  desc: 极具治愈感的日系数字印象派插画，画面毛茸茸暖洋洋，背景干净留白

scene: "治愈系插画、绘本内页、社交媒体配图、文创周边印刷"
ratio: '3:4'
summary: "日系数字印象派治愈插画，水彩×粉彩混合介质 + 次表面散射通透血色 + 晕涂法柔边 + 低饱和明亮怀旧氛围。"

prompt: |
  这是一幅极具治愈感的日系数字印象派插画。

  画面的主角是 {主题}。

  艺术风格模仿了不透明水彩（Gouache）与干色粉（Pastel）的混合介质，画面具有明显的粗糙纸纹颗粒感和纵向的干画笔触。

  光影处理采用高调的漫反射，特别强调了主体的“次表面散射”效果——受光面和边缘（如脸颊、鼻尖或耳廓）泛着通透的高饱和度橙红色光晕，仿佛内部在发光，充满生命力。

  轮廓边缘使用了晕涂法（Sfumato），主体边缘与米白色的背景柔和地融合在一起，界限模糊朦胧。整体色彩低饱和度但明亮，营造出一种如梦似幻、空气感十足的怀旧氛围。

  画幅比例 3:4。

variables:
- kv_var: 主题
  style_var: '{主题}'
  desc: 主体详细描述，如：一只戴着红色围巾的小白猫，正闭着眼睛享受阳光，表情呆萌可爱

