features:
  - "**Art Deco 几何建筑** — 拱形、阶梯塔楼、垂直肋骨、放射纹饰面板、圆形奖章等几何元素构建装饰艺术框架"
  - "**硬调黑白矢量感** — 纯黑、纯白、有限灰的反差，厚实外轮廓线 + 中等内部线条，干净阴影块与优雅负空间"
  - "**城市剪影背景** — 高塔、桥梁、钟面、抽象机械、装饰立面构成的单色未来都市"
  - "**复古电影感** — 1930 年代 noir 城市海报的现代矢量重译，威严、戏剧性、海报级可读"
  - "**可选阵列版式** — 默认单张竖构，也可指定 2×2 四格做多部作品的视觉对比"

scene: "科幻电影海报、电影主题海报、品牌联名KV、2x2 电影阵列"
ratio: "16:9"
summary: "将科幻主体转化为 Art Deco 风格的 1930 年代黑白城市海报，硬边矢量、放射几何、象征性都市背景。"

variables:
  - kv_var: 主体
    style_var: "{主体}"
    desc: 如：戴头盔的宇航员半身像 / 一艘环形空间站 / 巨型机械蜘蛛
  - kv_var: 都市元素
    style_var: "{都市元素}"
    desc: 如：梯级摩天楼与拱门 / 钟面与抽象机械 / 桥梁与装饰立面
  - kv_var: 主标题
    style_var: "{主标题}"
    desc: 如：STELLAR / 星际迷航 / THE LAST ORBIT
  - kv_var: 副标题
    style_var: "{副标题}"
    desc: 如：A FILM BY ... / 2026 重制版 / CHAPTER ONE
  - kv_var: 版式
    style_var: "{版式}"
    desc: 如：单张竖构 / 2×2 四格阵列 / 上下分栏双格

prompt: |
  16:9 复古 Art Deco 科幻电影海报。主体是{主体}：先把主体提炼成清晰的剪影，再转译为硬边黑白矢量图形——粗外轮廓配中等内线，只使用纯黑、纯白和极少量灰，表面用棱角分明的色块与干净的负空间，完全没有照片感和笔触柔化。

  装饰框架用 Art Deco 的建筑语汇包裹主体：拱门、阶梯塔楼、竖向摩天楼肋条、放射状日轮、圆形徽章，半对称排列，外围套一圈厚重的黑色装饰边框，元素密度高但版面可读。

  细节按建筑语言重译：主体上的曲线变成优雅的装饰弧线和流线型轮廓带；小面积重复细节变成窗户、通风口、条纹、网格与几何纹样；有机质感变成干净的黑白图案场；运动或情绪变成对角速度线、扇形射线、阶梯状回声或戏剧化剪影。

  背景是一座由主体气质生成的象征性都市：{都市元素}，黑白单色，扁平海报透视，只保留少量纵深。

  排版：主标题「{主标题}」用装饰艺术风格的无衬线大写压在画面上方，字距拉开；副标题「{副标题}」用极小字号排在标题下方。版式按{版式}处理，四格时每格各自成一张完整海报，共享同一套框架。

  整体像 1930 年代黑色电影都市海报被重制成现代矢量艺术：优雅、戏剧化、海报级可读。不要水印，不要真实Logo，不要电商广告感，不要卡通风。

