features:
  - "**复古吉祥物角色** — 橡皮管动画风格的人物和动物，穿大鞋子、圆滚滚四肢、派切眼、简单笑脸"
  - "**4色印刷感** — 仅使用 {主色}、{辅色}、{点缀色}、{第四色} 四种颜色，奶油色纸张背景"
  - "**丝网印刷质感** — 轻微套印不准、做旧砂粒感、圆形印章图形、下部棋盘格条纹"
  - "**大字标题 + 标语** — 顶部粗圆无衬线大标题 {标题}，底部粗圆标语 {标语}"
  - "**4:5 竖版排版** — 干净的复古 T 恤图案感，平色无渐变，简洁构图"

scene: "复古品牌联名 T 恤图案、怀旧海报设计、吉祥物周边、复古美式风格品牌 KV"
ratio: "4:5"
summary: "橡皮管动画风格的复古吉祥物海报，丝网印刷质感，四色限定，典型 1920-30s 美式复古平面设计"

prompt: |
  复古吉祥物海报，4:5 竖版版式，奶油色纸面背景，只用{主色}、{辅色}、{点缀色}与{第四色}。顶部放置粗圆体大标题「{标题}」。中央画一个橡皮管动画风格的{人物}，身穿{服装}，与{动物}并肩走过{背景}，两者都有派切眼（pie-cut eyes）、简单的笑脸、粗而干净的轮廓、圆滚滚的四肢、超大的鞋子，以及俏皮的迈步中姿态。在轮廓与填色上加入轻微的套印不准，浅浅的做旧丝网印刷颗粒，一个简单的圆形印章图形，以及靠近画面下部的一条横向棋盘格条纹。底部放置粗圆体标语「{标语}」。干净的复古 T 恤图案，平色，无渐变，构图简洁干脆。
  不要水印，不要真实Logo，不要电商广告感。

