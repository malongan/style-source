name: 日光超模名牌编辑风格
category: fashion
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 温暖的模拟胶片时尚编辑海报风格：结合户外超模摄影、繁茂的前景肌理、细小的材质铭牌细节，以及干净白色下三分之一标题/注释排版。
tags:
- VigoCookbook
- Other
triggers:
- Sunlit Supermodel Nameplate Editorial
features:
- title: 低角度或坐姿的户外时尚编辑构图，模特占据中间三分之一。
  desc: ''
- title: 温暖直射日光、柔和的模拟胶片阴影过渡、自然的皮肤高光，以及轻微的胶片对比。
  desc: ''
- title: 密集的植物或环境前景虚化横贯画面下部。
  desc: ''
- title: 浅景深，花园、温室、露台或海岸的肌理融化成散景。
  desc: ''
- title: 沉静的超模姿态：修长的颈部、放松的手、从容的表情。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{主体}'
  desc: 超模，如：一位轮廓分明的女模
- kv_var: 主体动作
  style_var: '{姿态}'
  desc: 如：低头侧望 / 抬手拨发
- kv_var: 产品/道具
  style_var: '{道具}'
  desc: 如：手拿一束野花
- kv_var: 场景地点
  style_var: '{场景}'
  desc: 户外繁茂前景，如：高草丛边
- kv_var: 背景元素
  style_var: '{背景元素}'
  desc: 补充画面层次，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{主文案}'
  desc: 如：LIGHT
- kv_var: 服装造型
  style_var: '{造型}'
  desc: 如：白衬衫 + 金属耳饰
- kv_var: 点缀符号
  style_var: '{点缀符号}'
  desc: 如：材质铭牌 / 细线
- kv_var: 副文案
  style_var: '{副文案}'
  desc: 如：a study in daylight
prompt: |
  创作一张 16:9 的高级模拟胶片时尚编辑海报照片。主体：{主体}。动作与姿态：{姿态}。服装与造型：{造型}。产品/道具：{道具}，其上整合一块小的实体铭牌、铭板、标签或雕刻标牌。地点：{场景}。背景与前景细节：{背景元素}。保留这些风格保真锚点：本风格的核心视觉锚点。避免这些源内容：水印、真实 logo 与商业广告。使用温暖的直射阳光、浅景深、前景的植物或织物虚化、轻微胶片颗粒、柔和的模拟阴影、可触的布料与金属质感、放松的奢华情绪，以及贴近的低角度编辑机位。加入干净的白色下三分之一排版：大号大写主标题「{主文案}」，其后是点缀「{点缀符号}」，再配一块较小的白色说明文字块「{副文案}」。字体应像印在时尚杂志提示卡海报上，而不是水印或 App UI。不要使用真实 logo 或真实品牌标识。

id: editorial
code: ''
