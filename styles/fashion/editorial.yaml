name: Sunlit Supermodel Nameplate Editorial
category: fashion
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: https://x.com/VigoCreativeAI
summary: 温暖 模拟 时尚编辑 海报风格 combining an 户外 supermodel 照片, lush 前景 质感, a 小 material nameplate detail, and 干净 白 下方三分之一 title/说明 字体排版.
tags:
- VigoCookbook
- Other
triggers:
- Sunlit Supermodel Nameplate Editorial
features:
- '**低-angle or seated 户外 时尚编辑 composition ，搭配 model filling the 中间 third.**'
- '**Warm direct sun亮, 柔软 模拟 阴影 rolloff, natural skin 高光s, and s亮 胶片 contrast.**'
- '**Dense 植物 or environmental 前景模糊 crossing the lower 画面.**'
- '**Shallow 景深 with 花园, 绿house, terrace, or coastal 质感 melting into 散景.**'
- '**Calm supermodel posture，搭配elongated neck, relaxed hands,、composed expression.**'
variables:
- kv_var: 变量
  style_var: 说明
  desc: ''
- kv_var: '`SUBJECT`'
  style_var: main supermodel or editorial fashion subject
  desc: ''
- kv_var: '`SUBJECT_ACTION`'
  style_var: poised seated, reclining, leaning, or kneeling action
  desc: ''
- kv_var: '`PRODUCT_OR_PROP`'
  style_var: luxury prop, case, chair, trunk, compact, garment detail, or object carrying a small material nameplate
  desc: ''
- kv_var: '`LOCATION`'
  style_var: outdoor or greenhouse editorial environment
  desc: ''
- kv_var: '`BACKGROUND_ELEMENTS`'
  style_var: botanical or environmental details that create soft foreground and background depth
  desc: ''
- kv_var: '`MAIN_TEXT`'
  style_var: large lower-third editorial headline
  desc: ''
prompt: 'Create a {ASPECT_RATIO} premium analog fashion editorial poster photograph. Subject: {SUBJECT}. Action and pose: {SUBJECT_ACTION}. Wardrobe and styling: {WARDROBE_STYLE}. Product or prop: {PRODUCT_OR_PROP}, with a small physical nameplate, plaque, tag, or engraved label integrated into the object. Location: {LOCATION}. Background and foreground details: {BACKGROUND_ELEMENTS}. Preserve these style fidelity anchors: {STYLE_FIDELITY_ANCHORS}. Avoid this source content: {SOURCE_CONTENT_TO_AVOID}. Use warm direct sunlight, shallow depth of field, foreground botanical or textile blur, slight film grain, soft analog shadows, tactile fabric and metal textures, relaxed luxury mood, and a close low editorial camera angle. Add clean white lower-third typography: large uppercase headline text reading "{MAIN_TEXT}" followed by the accent "{ACCENT_SYMBOL}", with a smaller white caption block reading "{SECONDARY_TEXT}". The typography should feel printed on a fashion magazine prompt-card poster,
  not like a watermark or app UI. Do not use real logos or real brand marks.'
