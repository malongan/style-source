# 街头购物袋视角大片

id: streetwear_shopping_bag
name: "街头购物袋视角大片"
category: fashion

tags:
  - 街头服饰
  - 购物袋视角
  - 奢侈品牌
  - 时尚大片
  - 强制透视

triggers:
  - 街头服饰大片
  - 购物袋视角
  - luxury streetwear
  - forced perspective fashion
  - 时尚广告

features:
  - "**强制透视视角** — 从购物袋内部向上拍摄，颠覆常规视角，极具冲击力"
  - "**奢侈街头风格** — 宽松版型 + 廓形感，当代奢华街头美学"
  - "**戏剧性光影** — 高端时尚大片光效，自然光从上方洒入，柔阴影高对比"
  - "**杂志级排版** — 购物袋内壁环绕大字标语 + 收据、标签、条码等编辑元素"
  - "**色彩鲜明** — 高饱和主色配黑白，高级感配色"

scene: "时尚广告、社交媒体推广、品牌KV、街头服饰宣传"
ratio: "9:16"
summary: "奢侈街头服饰广告大片，强制透视视角（从购物袋内向上拍） + 杂志编辑设计"

variables:
  - kv_var: 模特描述
    style_var: "{模特描述}"
    desc: 如：一位短发女性模特 / 一位卷发的年轻男性
  - kv_var: 服装搭配
    style_var: "{服装搭配}"
    desc: 如：宽松红色卫衣 + 黑色工装裤 + 白色运动鞋
  - kv_var: 主标语
    style_var: "{主标语}"
    desc: 如：TAKE WHAT'S YOURS / 把自己带走 / PICK ME UP
  - kv_var: 配色
    style_var: "{配色}"
    desc: 如：深红 + 黑 + 白 + 暖奶油 / 墨绿 + 米白 + 银灰

prompt: |
  9:16 竖版奢侈街头服饰广告大片。一位{模特描述}俯身探向一只巨大的购物袋，低头直视观众，表情自信、有吸引力。

  视角是全片的关键：摄影机位于购物袋内部，向上极近距离拍摄，形成强烈的强制透视——观众就是那只即将被拿起的东西。购物袋的开口在画面里构成一整圈前景画框，把模特框在中间，透视被拉得很深。

  模特身穿{服装搭配}，当代奢华街头的美学，宽松、有廓形、不刻意精致。一只手伸进袋口，眼睛始终盯着镜头。

  袋子内壁是这个版面的一部分：{主标语}用超大字号绕着纸面排布，字随纸面轻微弯折；纸上还压着真实的收据图形、条码条、物流标签、高级贴纸、折痕、轻微的印刷瑕疵与套准标记，像一本时尚杂志的内页被印在了袋子里。

  光从袋口上方倾泻下来，形成明亮的高光和柔和的阴影，纸面有真实的反光，明暗对比电影感强。

  配色：{配色}。

  质感：超真实、杂志封面级，图形构成大胆，字体锐利。不要水印，不要真实Logo，不要电商广告感，不要卡通风，不要拼贴感，不要复杂背景，不要乱码。

source_url: "https://x.com/AiwithLariab/status/2075071927975293125"
source_author: "Laraib Fatima"

