  - {shoes} — 鞋履描述，如 "vintage leather boots"
  - {flowers} — 花朵描述，如 "cascading white roses"
  - {flying_animals} — 飞行动物，如 "white butterflies and dragonflies"
  - {palette} — 色调，如 "sage and dusty rose" 或 "earthy terracotta"
  - {mood} — 情绪表达，如 "dreamy", "whimsical", "serene"

  不要水印，不要真实Logo，不要真实品牌名。

