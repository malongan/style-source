  - "**可变量模板** — 9 个变量位覆盖人物、装扮、场景、情绪，支持零成本替换生成不同变体"

scene: "时尚编辑摄影、人像海报、品牌 runway 视觉、时尚摄影作品集"
ratio: "4:5"
summary: "超现实剧院花园置景的时尚编辑秀场人像，胶片颗粒感与玩偶姿态"

prompt: |
  四分之三视角、与视线齐平的全身超现实时尚摄影：主体为{人物}，{发型}，静止站立于{场景}，身着{服装}与{鞋履}，四周环绕{花卉}、{飞鸟走兽}和雕塑感花园道具；深蓝天空、低地平线、精心布置的剧院式花园置景，干净的超现实留白间距，玩偶般的静止站姿，柔和复古胶片颗粒，低饱和{配色}色调，干脆的直射日光，柔和阴影，编辑秀场气质，{情绪}的表情，竖版人像构图，画幅 4:5。

  变量说明：
  - {人物} — 人物描述，如「一位三十多岁的高个女性」
  - {发型} — 发型发色，如「长而飘逸的赤褐色头发」
  - {场景} — 场景，如「一片开阔的超现实花园」
  - {服装} — 服装，如「一条飘逸的象牙白真丝长裙」
  - {鞋履} — 鞋履，如「复古皮靴」
  - {花卉} — 花朵，如「倾泻而下的白玫瑰」
  - {飞鸟走兽} — 飞行动物，如「白蝴蝶与蜻蜓」
  - {配色} — 色调，如「鼠尾草绿与灰粉」或「大地陶土色」
  - {情绪} — 表情气质，如「梦幻」「奇想」「宁静」

  不要水印，不要真实Logo，不要真实品牌名。

