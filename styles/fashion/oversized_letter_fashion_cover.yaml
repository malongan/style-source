features:
- title: 横贯顶部的大号刊头
  desc: 黑色高对比衬线体刊头横跨画面顶部，字形厚重锐利、字距紧凑，一眼确立杂志身份
- title: 巨型字母嵌入构图
  desc: 一个超大字母被放大到画面中央并与人物、家具、鞋履产生干净的前后穿插遮挡，字母本身仍完整可辨，人物面部不被遮住
- title: 低机位前景透视
  desc: 相机压低贴近地面，一只鞋刻意逼近镜头形成强烈的前景透视，脸部保持清晰，姿态在物理上成立，双腿连接正确
- title: 影棚硬光与真实质感
  desc: 直射影棚闪光加明确硬阴影，保留细微摄影颗粒、真实皮肤纹理、发丝与织物细节，皮革与金属有真实反射
- title: 封面文案克制成组
  desc: 只保留刊头、副标题与一组极简封面文案（如 FASHION / CULTURE / FORM），刊期信息小字压角，不堆砌文字

scene: "时尚杂志封面、品牌季度视觉、社交媒体竖版封面、时尚campaign主视觉、编辑提案首页"

ratio: '9:16'
summary: "大字刊头时尚杂志封面——顶部黑色高对比衬线刊头 + 嵌进构图的巨型字母 + 低机位前景透视的影棚硬光时尚大片，封面文案克制成组。"

prompt: |
  创作一张 9:16 竖版时尚编辑杂志封面，一次只出一张，不要拼贴。

  刊头：
  画面顶部横贯一条大型黑色高对比衬线体刊头「{刊头名}」，字形厚重锐利、字距紧凑。

  巨型字母：
  一个巨大的字母「{巨型字母}」被放大到画面中央，与模特、家具、鞋履之间形成干净的前后穿插与重叠。
  字母必须依然清晰可辨，模特的脸不能被字母遮挡。

  模特与摄影：
  一位成年的东亚时尚模特，神态自信，表情自然；皮肤保留真实纹理，头发写实，解剖结构可信。
  使用直射影棚闪光，阴影明确有形，带细微摄影颗粒；衣料细节丰富，皮革与金属有真实反射。

  机位与姿态：
  低机位拍摄，刻意制造前景透视：{姿态动作}
  让一只鞋更靠近镜头，同时保持脸部清晰，姿态在物理上成立，两条腿连接正确。
  双手自然垂在身体两侧或搭在家具上，不要伸向镜头。

  视觉方向：
  {视觉方向}
  在此方向下，服装为{服装搭配}，影棚背景为{背景色}。

  文字：
  主标题「{主标题}」与副标题「{封面副标题}」清晰可读。
  辅助文案保持极少，只写「{封面文案}」。
  刊期信息「{刊期信息}」以小字压在一角。

  整体：
  四个方向各自拥有自己的姿态、配色、材质与字体排印，但共享同一套杂志身份。
  保持真实关节、正确的手脚、准确的鞋履，以及与地面或家具的可信接触。

  避免：多余肢体、双腿粘连、鞋子变形、塑料皮肤、字形不可读、虚构条码、虚构刊期日期与期号、无关 Logo。

variables:
- kv_var: 刊头名
  style_var: '{刊头名}'
  desc: 顶部刊头文字，如：FORME、ATELIER、VOGUE 替代名
- kv_var: 巨型字母
  style_var: '{巨型字母}'
  desc: 嵌入构图的超大字母，如：P / O / H / C
- kv_var: 视觉方向
  style_var: '{视觉方向}'
  desc: 方向预设，四选一。PULSE 动感：珊瑚粉背景、覆盆子红运动夹克配奶白针织与粉蓝百褶裙、天蓝巨型 P、黑体封面文案。THROUGH 穿行：蜜桃背景、祖母绿西装配象牙白衬衫短裤、象牙白巨型 O 圆环、黑衬线封面文案。HALO 姿态：烟紫背景、珍珠银束腰迷你大衣配黑高领、淡粉巨型 H、克制的编辑排版。CHIC 主张：暖象牙背景、开心果绿短夹克配象牙丝质衬衫与芥末黄 A 字裙、蜜桃巨型 C、精致黑封面文案
- kv_var: 服装搭配
  style_var: '{服装搭配}'
  desc: 服装与鞋履，如：珊瑚粉运动鞋配奶油色堆堆袜
- kv_var: 姿态动作
  style_var: '{姿态动作}'
  desc: 姿态与前景动作，如：向前迈步并抬起一只鞋靠近镜头
- kv_var: 背景色
  style_var: '{背景色}'
  desc: 影棚背景色，如：珊瑚粉、蜜桃色、烟紫、暖象牙
- kv_var: 主标题
  style_var: '{主标题}'
  desc: 封面主标题，如：PULSE、IN MOTION
- kv_var: 封面副标题
  style_var: '{封面副标题}'
  desc: 主标题下的副标题，如：SUMMER 2024
- kv_var: 封面文案
  style_var: '{封面文案}'
  desc: 极简封面文案，如：FASHION / CULTURE / FORM
- kv_var: 刊期信息
  style_var: '{刊期信息}'
  desc: 角落小字刊期，如：ISSUE 07 / N° 045

