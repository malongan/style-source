features:
- title: 排版成为画面结构，不只是装饰
  desc: 字可以被人挡住一部分，形成前后穿插
- title: 超大字体 + 强视觉层级
  desc: 主标题占大半画面，其余信息极小
- title: 编辑式构图 + 负空间
  desc: 至少留一块完整空白，不填任何内容
- title: 真实时尚摄影 + 精致打光
  desc: 侧光勾轮廓，保留毛孔与织物纹理
- title: 清晰的品牌调性
  desc: 品牌名小字压边，与主标题层级分明
variables:
- kv_var: 品牌名
  style_var: '{品牌名}'
  desc: 如：MAISON LUNE / 谷雨 / ATELIER 07
- kv_var: 主标题
  style_var: '{主标题}'
  desc: 如：新季 / SILENT LUXURY / 冬·第一幕
- kv_var: 副标题
  style_var: '{副标题}'
  desc: 如：2026 秋冬系列 / 一次关于廓形的提案
- kv_var: 人物描述
  style_var: '{人物描述}'
  desc: 如：一位穿宽肩大衣的女性 / 两名背对镜头的模特
- kv_var: 主色
  style_var: '{主色}'
  desc: 如：雾灰 / 深酒红 / 燕麦米
prompt: |
  9:16 竖版高端时尚 campaign 海报。排版本身就是画面结构，不是把字贴在图上：{主标题}用超大字号占据画面大半，字可以被{人物描述}挡住一部分，形成字与人的前后穿插；其余信息用极小字号挤在边缘，字号反差拉到极大。

  人物：{人物描述}，真实时尚摄影质感，姿态放松而克制，服装面料有可见的织物纹理，皮肤保留真实的毛孔与质感，打光精致但不过度磨皮——主光柔和，一侧有明确方向的侧光勾出轮廓。

  结构：编辑式构图加负空间。画面至少留一块完整的空白区域，不填任何内容，让视线有停留的地方。{品牌名}以小字出现在画面顶部或底部边缘，与主标题形成明确的层级差。

  配色：{主色}为主，最多再加一个中性色，不出现第三种颜色。

  副标题「{副标题}」用无衬线小字排在一处，字距拉开。整体调性冷静、昂贵、有秩序，像一本时尚杂志的内页而不是电商广告。
