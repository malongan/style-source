name: 日光建筑时尚编辑摄影
category: fashion
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 精致的户外高级时尚编辑摄影风格：由低角度建筑取景、硬朗的地中海域日光、暖调石材中性色、修长的模特剪影、克制的奢华造型，以及来自电线、栏杆、阴影或立面几何的细线条构成。它重现高端时尚营销企划的气质，但不照搬原模特、服装、广场、道具摆放或姿势。
tags:
- VigoCookbook
- Other
triggers:
- Sunlit Architectural Fashion Editorial
features:
- title: 户外奢华时尚编辑摄影，具可信的高端营销企划写实感。
  desc: ''
- title: 低机位或轻微广角透视，拉长腿部、大衣与建筑体量的比例。
  desc: ''
- title: 暖调石材、混凝土、灰泥或砌体质感的表面，作为大面积的触感前景或侧向平面。
  desc: ''
- title: 硬朗阳光、高亮天空曝光、锐利的投影，以及克制的暖调镜头光晕或反光。
  desc: ''
- title: 优雅的中性色调，以象牙白、沙色、灰褐、石灰灰、黑色、驼色、烟草棕与低饱和金属色为主。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{主体}'
  desc: 模特，如：一位高个女模
- kv_var: 主体动作
  style_var: '{动作}'
  desc: 如：靠墙站定 / 侧身行走
- kv_var: 产品/道具
  style_var: '{道具}'
  desc: 如：藤编包 / 太阳镜
- kv_var: 场景地点
  style_var: '{地点}'
  desc: 地中海建筑前，如：白墙拱廊
- kv_var: 背景元素
  style_var: '{背景元素}'
  desc: 补充画面层次，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{主文案}'
  desc: 如：SUMMER EDIT
- kv_var: 服装造型
  style_var: '{造型}'
  desc: 如：米色亚麻套装
- kv_var: 副文案
  style_var: '{副文案}'
  desc: 如：shot in sicily
- kv_var: 点缀符号
  style_var: '{点缀符号}'
  desc: 如：细线框 / 页码
prompt: |
  创作一张精致的户外高级时尚编辑摄影，采用「日光建筑时尚编辑摄影」风格。主体：{主体}。姿势或动作：{动作}。道具或配饰：{道具}。地点：{地点}。背景元素：{背景元素}。服装与造型：{造型}。内部编辑气质标签（不作为可见文字）：{主文案}；{副文案}。细微的摄影点缀：{点缀符号}。保留这些风格保真锚点：本风格的核心视觉锚点。规避这些源内容：水印、真实 Logo 与商业广告。使用低机位、轻微广角的时尚透视、拉长的剪影、硬朗的地中海域日光、明亮浅色天空、温暖的石材或灰泥质感、锐利的投影、自然的镜头光晕或反光、以黑或烟草棕为锚点的精致中性调色、可见的布料与皮革细节、平静不笑的奢华广告姿态，以及无可见 Logo 的稀疏高级道具。不要叠加文字排版、水印、可读的品牌名、二维码、社交媒体 UI、价格标签、人群、奇幻服装、卡通渲染、拼贴、矢量图形或影棚海报设计。画幅：16:9。
