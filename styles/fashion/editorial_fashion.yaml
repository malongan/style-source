summary: 精致的户外高级时尚编辑摄影风格：由低角度建筑取景、硬朗的地中海域日光、暖调石材中性色、修长的模特剪影、克制的奢华造型，以及来自电线、栏杆、阴影或立面几何的细线条构成。它重现高端时尚营销企划的气质，但不照搬原模特、服装、广场、道具摆放或姿势。
