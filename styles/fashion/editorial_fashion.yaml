name: 日光建筑时尚编辑摄影
category: fashion
ratio: 16:9 / 4:5 / 3:4 / 9:16
source_author: Vigo AI Visual Prompt Cookbook
source_url: 'https://x.com/VigoCreativeAI'
summary: 精致的户外高级时尚编辑摄影风格：由低角度建筑取景、硬朗的地中海域日光、暖调石材中性色、修长的模特剪影、克制的奢华造型，以及来自电线、栏杆、阴影或立面几何的细线条构成。它重现高端时尚营销企划的气质，但不照搬原模特、服装、广场、道具摆放或姿势。
tags:
- VigoCookbook
- Other
triggers:
- Sunlit Architectural Fashion Editorial
features:
- title: 户外奢华时尚编辑摄影，具可信的高端营销企划写实感。
  desc: ''
- title: 低机位或轻微广角透视，拉长腿部、大衣与建筑体量的比例。
  desc: ''
- title: 暖调石材、混凝土、灰泥或砌体质感的表面，作为大面积的触感前景或侧向平面。
  desc: ''
- title: 硬朗阳光、高亮天空曝光、锐利的投影，以及克制的暖调镜头光晕或反光。
  desc: ''
- title: 优雅的中性色调，以象牙白、沙色、灰褐、石灰灰、黑色、驼色、烟草棕与低饱和金属色为主。
  desc: ''
variables:
- kv_var: 画面主体
  style_var: '{SUBJECT}'
  desc: 模特，如：一位高个女模
- kv_var: 主体动作
  style_var: '{SUBJECT_ACTION}'
  desc: 如：靠墙站定 / 侧身行走
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
  desc: 如：藤编包 / 太阳镜
- kv_var: 场景地点
  style_var: '{LOCATION}'
  desc: 地中海建筑前，如：白墙拱廊
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
  desc: 补充画面层次，如：反光玻璃、贴纸、路牌
- kv_var: 主文案
  style_var: '{MAIN_TEXT}'
  desc: 如：SUMMER EDIT
- kv_var: 服装造型
  style_var: '{WARDROBE_STYLE}'
  desc: 如：米色亚麻套装
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
  desc: 如：shot in sicily
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
  desc: 如：细线框 / 页码
prompt: 'Create a polished outdoor high-fashion editorial photograph in the Sunlit Architectural Fashion Editorial style. Subject: {SUBJECT}. Pose or movement: {SUBJECT_ACTION}. Prop or accessory: {PRODUCT_OR_PROP}.
  Location: {LOCATION}. Background elements: {BACKGROUND_ELEMENTS}. Wardrobe and styling: {WARDROBE_STYLE}. Internal editorial mood labels only, not visible text: {MAIN_TEXT}; {SECONDARY_TEXT}. Subtle photographic
  accent: {ACCENT_SYMBOL}. Preserve these style fidelity anchors: the core visual anchors of this style. Avoid this source content: watermarks, real logos, and commercial advertising. Use a low camera position, slight wide-angle fashion perspective,
  elongated silhouettes, hard Mediterranean daylight, bright pale sky, warm stone or plaster texture, crisp cast shadows, natural lens flare or glint, refined neutral color grading with black or tobacco
  anchors, visible fabric and leather detail, calm unsmiling luxury-campaign posture, and sparse premium props with no visible logos. Do not add overlay typography, watermarks, readable brand names, QR
  codes, social media UI, price tags, crowds, fantasy costumes, cartoon rendering, collage, vector graphics, or studio poster design. Aspect ratio: 16:9.'
id: editorial_fashion
