  The oversized CITY_NAME typography should dominate the composition and extend almost across the entire poster width. Integrate grayscale city photography inside selected portions of the letters. Keep the typography bold, geometric, heavy, and editorial. Make the letters large enough to cross directly over the subject's torso and lower body.

  Preserve the EXACT visual language and color code of the reference: warm cream/off-white background, deep black oversized typography, grayscale city photography, red accent blocks, blue accent elements, and yellow/gold accent elements. Do NOT create a new color palette based on CITY_NAME. Keep the same approximate colors, saturation, contrast, and proportions as the reference.

  Preserve the reference's structured editorial grid, thin lines, geometric circles, dots, rectangles, technical markings, small uppercase labels, coordinates, and minimalist information blocks. Adapt only the city-related content to CITY_NAME.

  Maintain the same vertical poster composition, subject placement, typography scale, graphic layering, spacing, photographic treatment, and premium magazine aesthetic. The final result should look like the same poster design system recreated for a different city and subject, with CITY_NAME typography clearly crossing OVER and physically overlapping the character.
  不要水印，不要真实Logo，不要电商广告感。

