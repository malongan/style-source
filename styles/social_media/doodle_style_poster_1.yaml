prompt: |
  创作一张 16:9 图像，采用「山径怪物涂鸦海报」风格。

  主体：{主体}。

  主体动作：{动作}。

  产品/道具：{道具}。

  地点：{地点}。

  背景元素：{背景元素}。

  主文案：{主文案}。

  副文案：{副文案}。

  点缀符号：{点缀符号}。

  服装造型：{造型}。

  以写实的户外徒步抓拍照片为底层，带自然日光、真实的山体或步道细节、树木、天空、岩石，以及穿着实用户外服装的可信人物。人物保持摄影写实，并自然融入风景之中。

  在人物旁边叠加一个扁平手绘的红色卡通怪物伙伴。怪物应有粗黑轮廓线、砖红填充、简单的深红阴影形状、超大的白色眼睛、极小的瞳孔、尖锐的白牙、淡蓝色汗滴与简化的爪形手。让它的一只手臂或爪子与人物、背包、水瓶、地图、路牌或道具产生实际接触。

  在上方天空或山体区域加入超大号的不规则漫画字体。用米白填充、黑色描边、黄/红/钴蓝的错位阴影、轻微的内部涂鸦线、大小不均的比例，营造童趣的西班牙旅行海报感。在标题附近加一条极小的手写注记，以及少量稀疏的曲线、箭头、下划线或动势符号。

  规避：水印、用户名、创作者 ID、平台 Logo、二维码、App UI、写实恶魔、恐怖、血腥、暴力、3D 吉祥物、毛绒玩具、全卡通背景、企业化版式、极简字体、密集文字、影棚人像、低细节的山体。
