  desc: ''
- title: 人物保持摄影写实，并自然融入风景之中。
  desc: ''
- title: 字体用米白填充、黑色描边、黄/红/钴蓝错位阴影、轻微的内部涂鸦线、大小不均的比例，营造童趣的西班牙旅行海报感。
