features:
- title: 角色一致性锁定
  desc: 发型、配色、标志性道具在每一帧完全不变，跨帧不跳脸、不换装、不掉色，保证是同一个角色在动
- title: 一个核心笑点的夸张动作
  desc: 只围绕一个笑点设计动作，幅度夸张、表情外放，首尾帧可无缝衔接成 2～3 秒循环的聊天表情包
- title: 顶部粗圆体白描边短句
  desc: 画面顶部居中压一句 2～8 个字的网感短句，粗圆体字加白色描边，像贴纸一样贴在角色上方
- title: Q 版手绘贴纸质感
  desc: 大头小身的 Q 版比例，干净圆润的黑色线稿，平涂配色加少量柔和阴影，手绘贴纸感而非写实渲染
- title: 1:1 表情包规格
  desc: 正方形构图，透明或纯白底，主体居中留出安全边距，配星芒、放射线、动感线等手绘强调符号

scene: "社交聊天表情包、群聊互动、评论区配图、公众号与小红书动态配图、IP 角色周边表情"

ratio: '1:1'
summary: "Q 版角色动态表情包 GIF：角色发型配色道具全程锁定，一个夸张可循环的 core 笑点动作，顶部粗圆体白描边网感短句，1:1 透明底贴纸质感。"

prompt: |
  以{角色设定}为角色原型，制作一张可下载的动态 GIF 聊天表情包。

  【角色保持一致】
  锁定角色的发型、配色与标志性道具，循环中每一帧都不变脸、不换装、不掉色。
  {服饰细节}

  【自动设计动作】
  围绕一个核心笑点设计动作：{动作笑点}
  动作夸张、有网感，第一帧与最后一帧姿态能自然衔接，形成无缝循环。
  {表情神态}

  【自动配字】
  画面顶部居中加一句{配字文案}，2～8 个字的网感短句。
  粗圆体字，{文字配色}，压在角色上方，像一枚贴纸。

  【画面】
  尺寸固定 1:1，正方形，{背景底色}，2～3 秒循环，聊天表情包规格。
  Q 版大头小身比例，干净圆润的黑色线稿，平涂配色加少量柔和阴影，手绘贴纸质感。
  用{强调色}画星芒、放射线、动感线等手绘强调符号，配合动作节奏出现。

  避免：真实品牌 Logo、水印、多余文案、渐变光效、写实摄影质感、复杂场景背景、多余角色。

variables:
- kv_var: 角色设定
  style_var: '{角色设定}'
  desc: 角色外形与标志道具，如：黑色长发的猫系少女，戴着棕色动物连帽帽
- kv_var: 服饰细节
  style_var: '{服饰细节}'
  desc: 上衣下装与配饰，如：蓝色条纹针织衫、米色百褶裙、棕色斜挎小包
- kv_var: 表情神态
  style_var: '{表情神态}'
  desc: 面部表情与眼神，如：闭眼大笑、星星眼、鼓腮生气
- kv_var: 动作笑点
  style_var: '{动作笑点}'
  desc: 核心笑点动作，如：举拳蹦跳欢呼、摆手赶人、抱头蹲防
- kv_var: 配字文案
  style_var: '{配字文案}'
  desc: 顶部短句文案，2～8 个字，如：下班啦！、周末愉快、救命
- kv_var: 文字配色
  style_var: '{文字配色}'
  desc: 顶部字色与描边色，如：深棕字配白色描边、黑字配白描边
- kv_var: 强调色
  style_var: '{强调色}'
  desc: 星芒与动感线等强调符号的用色，如：明黄、亮橙
- kv_var: 背景底色
  style_var: '{背景底色}'
  desc: 背景底色，如：透明底、纯白底、浅灰底

