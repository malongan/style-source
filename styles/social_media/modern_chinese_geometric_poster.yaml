prompt: |
  Build a modern flat graphic around {subject}, with a huge Chinese theme character, geometric color blocks, and a single-line organic contour interlacing through one another. Keep an overall bright, clean background field, letting approximately two-thirds or more of the space remain empty, and concentrate the main weight in an off-center cluster: a saturated rectangular block in the theme's primary color first establishes a stable plane; a deeper, low-lightness, cool-toned circle overlaps from beneath it and extends beyond the boundary; the core Chinese theme character advances vertically in oversized, heavy, geometric black strokes across the white background, rectangle, and circle, with partial occlusion and cropping creating a strong scale jump; on the left, the date and a bilingual subtitle form a compact numeric column, while on the right, short vertical sentences set in two stroke-weight tiers balance the weight; a few miniature captions, short dashes, and linear symbols scatter along the edges, creating a three-level reading rhythm from main character to side notes to details. Abstract the dynamic relationship derived from the theme into one continuous organic contour, drawn as a broad sweeping loop with a clear, near-black single line that enters from the large empty field, passes through the color blocks, and crosses the edge; the curve intersects itself several times while remaining legible as a single path; keep most of its interior as the underlying background color, adding only localized, transparent, fading fills in the theme's primary color at the tips and extended sections, so the light line creates tension with the heavy giant character. Adapt the color scheme to the theme: let a clean, high-lightness neutral background carry the largest area; keep the theme's primary color vivid and highly saturated, using it for the rectangle and the localized transparent gradient; use a deep cool support color for the circle, separated in hue from the primary color and blending softly into the primary color at its end; use near-black for text and the contour, with a very small amount of light text reversed onto the primary color block; fix unequal areas, lightness hierarchy, and saturation differences, but do not fix specific color names. Render all elements as flat surfaces like matte digital printing, with sharp contour edges and gradients only as two localized, slowly feathered transitions; do not add dimensional shadows, paper grain, or global lighting effects. Keep typography in a low-contrast, broad, thick, near-geometric black sans-serif skeleton; allow the main character's parts to be elongated, offset, cut out, and switched between color-block backgrounds; give numbers a rounded futuristic structure and compress small text with narrow letterforms and loose tracking. Replace brand names, advertising copy, and concrete dates with new theme information. Preserve in the final result the extreme whitespace, the geometric cluster positioned lower-center, the opposing pull between horizontal and vertical text, and the moment an organic line crosses rigid geometric shapes, while avoiding evenly filling every part or reducing the contour to an isolated decoration.
  不要水印，不要真实Logo，不要电商广告感。

