prompt: |
  创作一张「温馨卧室涂鸦伙伴抓拍」风格的图片。

  画幅：16:9。

  场景：{主体}{主体动作}。前景道具或产品：{道具}。地点：{场景}。背景元素：{背景元素}。主手写文案：「{主文案}」。副手写文案：「{副文案}」。点缀符号：{点缀符号}。服装造型：{服装}。涂鸦伙伴：{涂鸦伙伴}。涂鸦伙伴大小：{涂鸦大小}。光源：{光源}。

  以一张真实的随手手机快照作为底层。场景应像真实的深夜居家内景：不完美的手持取景、自然的房间杂物、温暖的实用光源、可见的布料肌理、墙面颗粒、屏幕反光，以及轻微的低光噪点。

  把一个原创的扁平 2D 靠垫玩偶伙伴合成到下方前景，或放在真实主体物件旁边。伙伴应有圆润的枕头身体、浅色布片拼贴的脸、闭合的月牙眼、小小的缝线嘴、简单的连指手套式手、毯子兜帽或围巾、深色手绘轮廓、平涂的低饱和色块，以及略微「贴上去」的贴纸质感。它应像真实照片里一位安静的插画朋友，而不是 3D 吉祥物。

  涂鸦伙伴的尺度是硬性要求：让伙伴成为大尺度的前景主体，而不是角落里的小贴纸。9:16 时它应占画面约 35-45%；16:9 时它应占画面约 28-38%。让伙伴从左边缘或左下角进入，允许被画框边缘部分裁切，同时保持真实物件在它旁边或后方仍可辨认。

  伙伴的身份是硬性要求：把它做成一个全新的靠垫玩偶设计，不是人类小孩，也不是参考玩具。不要给它深色头发、小麦色肤色的脸、藏青毛衣、睡裤、笑脸拖鞋，或与参考相同的坐姿剪影。

  只加少量细小的手绘日记笔触，例如睡眠线、星星、闪光、呼吸痕，或一个小小的微笑。

