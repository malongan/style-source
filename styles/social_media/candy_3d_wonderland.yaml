triggers:
- 糖果派对
- C4D 梦幻
- 3D 童话
- 马卡龙海报
features:
- title: 巨型糖果质感花朵（黄粉相间）作为画面主体
  desc: ''
- title: 马卡龙蓝、粉、紫、黄清新明亮配色
  desc: ''
- title: 超广角 + 大透视 + 仰视角度，夸张视觉表现
  desc: ''
- title: 软糯 Q 弹的糖果质感（C4D 质感）
  desc: ''
- title: 复古唱片 + 卡带播放器作为复古元素点缀
  desc: ''
- title: 手写风格艺术字体排版
  desc: ''
- title: 蓝天光影 + 波光粼粼水面 + 漂浮动态特效
  desc: ''
variables:
- kv_var: 品牌
  style_var: '{品牌}'
  desc: 品牌名，如：奥利奥 / 乐事 / 元气森林
- kv_var: 活动主题
  style_var: '{活动主题}'
  desc: 活动名，如：夏日糖果乐园 / 冰爽一夏
- kv_var: 主体元素
  style_var: '{主体元素}'
  desc: 2 个巨型糖果质感主体，用 / 分隔，如：巨型棒棒糖 / 糖霜蛋糕
- kv_var: 装饰元素
  style_var: '{装饰元素}'
  desc: 3 个装饰物，用 / 分隔，如：拐杖糖 / 棉花糖 / 果冻球
- kv_var: 环绕元素
  style_var: '{环绕元素}'
  desc: 3 个环绕物，用 / 分隔，如：漂浮糖果 / 气球 / 星星
- kv_var: 场景设定
  style_var: '{场景设定}'
  desc: 如：梦幻水边草地 / 糖果森林 / 云朵泳池
- kv_var: 岸边装饰
  style_var: '{岸边装饰}'
  desc: 如：巨型棒棒糖列 / 糖霜贝壳 / 奶油沙滩
- kv_var: 周边元素
  style_var: '{周边元素}'
  desc: 左下方与右下方各一组，用 / 分隔，如：糖果小屋 / 冰淇淋车
- kv_var: 主标题
  style_var: '{主标题}'
  desc: 手写风格艺术字，如：甜夏 / Sweet Summer
- kv_var: 副标题
  style_var: '{副标题}'
  desc: 白色带柔和轮廓，如：糖果乐园限时开启
- kv_var: 主色调
  style_var: '{主色调}'
  desc: 如：马卡龙蓝粉紫黄 / 薄荷绿+奶油白
prompt: |
  3D 电影感，超大广角 + 超大透视 + 仰视角度，夸张视觉表现的梦幻夏日主题场景：主体内容为 {品牌} “{活动主题}” 主题场景，主体元素是巨型糖果质感的{主体元素}（2 个），搭配{装饰元素}；环绕元素包含{环绕元素}；场景设定是{场景设定}，底部有波光粼粼的水面及倒影，岸边覆盖{岸边装饰}；风格设定为 C4D 卡通梦幻风格，风格参考甜美治愈的 3D 童话场景；色调色彩以{主色调}为主，清新明亮；元素位置：巨型花朵位于画面中上部，左上部采用手写风格艺术字体排版（主标题 "{主标题}" + 副标题 "{副标题}"，白色带柔和轮廓），左下方与右下方分别放置{周边元素}，环绕元素错落散布于场景各处；整体布局层次丰富，中心主体突出、四周元素点缀；C4D 质感：所有元素带软糯 Q 弹的糖果质感，表面光滑有光泽与细微反光，复古物件兼具复古形态与可爱化质感；特效包含星芒、光线轨迹、漂浮动态特效；背景带有强烈的蓝天光影，环境光明亮通透、高光点缀增强立体感；细节补充：草地添加细碎小花，水面有轻微波纹与元素倒影，元素边缘带柔和高光。
