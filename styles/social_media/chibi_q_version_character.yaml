prompt: |
  Q 版（chibi）风格，{角色}{动作}，情境为{对手情境}，参考{风格参考}的风格，可爱的背景，2D 游戏美术，高分辨率，焦点清晰，{背景}，动漫风格，动态姿势，史诗般的动感。

