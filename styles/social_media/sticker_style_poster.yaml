features:
- '**Preserve the 核心 visual identity: A 怀旧 模拟 日记-拼贴 肖像 system ，搭配 大 侧面-profile 插画 主体, 奶油色 graph-paper 背景, 贴纸感 personal 物体s, 破损 橙 hand 字体, and 重 scanned 印刷 质感.**'
- '**Use 背景元素 to control 次要 scene details, 质感s, signage, props, and environmental cues.**'
- '**Use a 大 侧面-profile or quiet 四分之三 插画 肖像 作为 anchor.**'
- '**Put the 主体 on 奶油色 graph-paper notebook 背景 with faded 蓝 网格 lines.**'
- '**Sur圆形 the 肖像 with 贴纸感 personal 物体s, 微小 paper scraps, tickets, 美食 packaging, 车站ery, charms, numbers, 涂鸦s, tape marks, and 小 手绘 图标s.**'
