  - golden hour street

features:
  - "**俯拍视角** — 机位在主体下方，仰望构图，形成强烈空间感"
  - "**金色日光氛围** — 暖琥珀色调，自然光充满画面，肤色呈现金蜜色"
  - "**街景质感地面** — 石板路/粗糙质感地面，倒映与环境纹理丰富"
  - "**手持饮品细节** — 大杯饮品+冰块冷凝+水果装饰，还原真实生活感"
  - "**欢快动态氛围** — 趴姿/蹲姿向上看镜头，表情活泼，整体氛围温暖无忧"

scene: "社交媒体生活分享、品牌街拍、日常记录、派对聚会视觉"
ratio: "3:4"
summary: "金色日光俯拍街景生活照，暖琥珀色调+石板地面+手持饮品+仰视欢快氛围"

prompt: |
  以高于主体的俯拍机位捕捉一个鲜活、有动感的街头生活瞬间，场景落在{表面}上，{背景}形成低调的对比。人物摆出活泼的姿态，径直抬头望向镜头；姿态与表情的细节：{姿态}。{发型}柔和地承接自然日光，让肤色透出温暖的金琥珀调与微妙的光泽。

  人物穿着{服装}，并配以{配饰}添一分随性风格。

  人物双手各持一只大杯，杯中盛着{饮品}。杯壁上的冷凝水珠与冰晶极其真实、清爽。

  整体构图充满光影，沐浴在温暖的金色自然光中，营造出温暖、无忧的{时段}氛围。每一处细节——从下方有质感的{表面}到鲜活的饮品——都在强化这个瞬间的节庆气息与活泼能量。照片级写实，俯拍，纹理高度细腻，高品质，8K 分辨率。

  不要水印，不要真实Logo，不要电商广告感，不要卡通风，不要拼贴感，不要复杂背景，不要乱码。

variables:
- kv_var: 表面质感
  style_var: '{表面}'
  desc: 地面材质，如 warm concrete pavement / wet asphalt
- kv_var: 背景场景
  style_var: '{背景}'
  desc: 远景，如 pastel storefronts / blurred city street
- kv_var: 姿态与表情
  style_var: '{姿态}'
  desc: 姿态 + 表情 + 唇部，如 sitting casually, bright smile, glossy lips
- kv_var: 发型描述
  style_var: '{发型}'
  desc: 如 shoulder-length wavy chestnut hair
- kv_var: 服装造型
  style_var: '{服装}'
  desc: 上装 + 下装 + 鞋，如 oversized white tee, denim shorts, white sneakers
- kv_var: 配饰
  style_var: '{配饰}'
  desc: 头部与手部配饰，如 straw hat / silver rings / thin bracelet
- kv_var: 饮品细节
  style_var: '{饮品}'
  desc: 颜色 + 装饰 + 吸管，如 pale pink smoothie, mint leaves, paper straw
- kv_var: 时段
  style_var: '{时段}'
  desc: 如 golden hour afternoon / early summer evening
