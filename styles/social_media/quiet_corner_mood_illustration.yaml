prompt: |
  一幅{风格}插画，场景为{场景}，含{建筑}，整体{氛围}。{光线}照亮空间，凸显{室内细节}。{主体}正在{活动}，营造出安静、有人生活痕迹的气氛。背景展现{周边环境}。色板包含{配色}，并配{媒介细节}，形成一幅{美学}、细节丰富且自然和谐的构图。

  不要水印，不要真实Logo，不要摄影照片感。

