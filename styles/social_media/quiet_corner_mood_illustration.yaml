tags:
  - 情绪插画
  - 安静角落
  - 阅读角落
  - 室内氛围
  - 自然和谐
  - 绿植窗景

triggers:
  - 安静角落情绪插画
  - 阅读角落插画
  - 情绪氛围插画
  - 室内绿植插画
  - 窗景插画风格

features:
  - "**情绪氛围 + 场景构建** — 从情绪出发构建室内/室外场景，以安静角落为核心空间"
  - "**建筑元素 + 室内细节** — 主建筑元素构成空间骨架，家具陈设和装饰细节点缀生活气息"
  - "**光影叙事** — 特定光源照明空间，凸显材质与肌理，营造深度氛围感"
  - "**人物活动融入** — 人物从事阅读、放松等安静活动，强化情绪共鸣"
  - "**自然色调 + 笔触质感** — 以自然和谐为色彩主调，笔触/介质技法创造艺术细节"

scene: "社交媒体情绪图文、朋友圈氛围分享、情绪板配图、安静角落主题内容"
ratio: "3:4"
summary: "以安静角落情绪为核心，通过场景构建与光影叙事，营造自然和谐、情绪共鸣的室内氛围插画"

prompt: |
  A {art_style} illustration of a {setting} featuring {architecture}, in a {mood} mood. {lighting} illuminates the space, highlighting {interior_details}. {subjects} are {activities}, which sets a quiet, lived-in atmosphere. The background showcases {surrounding_view}. The color palette includes {colors}, with {medium_and_details}, resulting in a {aesthetic} composition rich in detail and natural harmony.

  不要水印，不要真实Logo，不要摄影照片感。
variables:
- kv_var: 艺术风格
  style_var: '{art_style}'
  desc: 如 flat illustration / soft gouache
- kv_var: 场景
  style_var: '{setting}'
  desc: 室内或室外，如 sunlit cafe interior
- kv_var: 建筑元素
  style_var: '{architecture}'
  desc: 如 large arched window / wooden beams
- kv_var: 情绪氛围
  style_var: '{mood}'
  desc: 如 calm / nostalgic / cozy
- kv_var: 光线
  style_var: '{lighting}'
  desc: 如 warm afternoon sunlight
- kv_var: 室内细节
  style_var: '{interior_details}'
  desc: 如 bookshelf, potted plants, linen curtain
- kv_var: 人物主体
  style_var: '{subjects}'
  desc: 如 a young woman
- kv_var: 活动
  style_var: '{activities}'
  desc: 如 reading a book, sipping tea
- kv_var: 周边环境
  style_var: '{surrounding_view}'
  desc: 如 greenery outside the window
- kv_var: 配色
  style_var: '{colors}'
  desc: 如 sage green, warm beige, soft cream
- kv_var: 媒介与细节
  style_var: '{medium_and_details}'
  desc: 材质 + 笔触 + 细节，如 textured paper grain, soft brushwork, dappled light
- kv_var: 整体美学
  style_var: '{aesthetic}'
  desc: 如 serene, natural harmony
source_url: "https://x.com/noorwithwifi/status/2081412270350033109"
source_author: "NoorAI"

