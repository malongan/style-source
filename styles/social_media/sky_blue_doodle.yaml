source_url: "https://raw.githubusercontent.com/VigoZhao/AI-Visual-Prompt-Cookbook/main/styles/sky-blue-home-life-doodle-poster-style"
summary: 天蓝底色 + 手绘马克笔 + 扁平卡通家居场景。
tags:
- 涂鸦
- 小红书
- 生活
- 手绘
- 扁平
triggers:
- 涂鸦
- 小红书风
- 生活海报
- 天蓝底
features:
- title: 满屏天蓝底色 + 不规则白色房屋形内嵌
  desc: ''
- title: 粗黑马克笔手写大标题
  desc: ''
- title: 红色胶囊徽章点缀
  desc: ''
- title: 歪歪扭扭的手绘线条感
  desc: ''
variables:
- kv_var: 主标题
  style_var: '{MAIN_TEXT}'
  desc: 手写标题
- kv_var: 标语
  style_var: '{SECONDARY_TEXT}'
  desc: 日期、副标题
- kv_var: 画面-主体
  style_var: '{SUBJECT}'
  desc: 卡通角色
- kv_var: 画面-动作
  style_var: '{SUBJECT_ACTION}'
  desc: 简单家居动作
- kv_var: 画面-场景
  style_var: '{LOCATION}'
  desc: 室内区域
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
- kv_var: 服装造型
  style_var: '{WARDROBE_STYLE}'
prompt: |
  Create an original 9:16 poster illustration in the Sky Blue Home Life Doodle Poster style. Preserve these style anchors: the core visual anchors of this style. Avoid this source content: watermarks, real logos, and commercial advertising. Use a full pastel sky-blue outer field and a large rough off-white house-shaped inset with thick wobbly black marker outlines. Put a huge uneven black hand-lettered headline reading {MAIN_TEXT} across the top, plus {SECONDARY_TEXT} as a small slanted support label and {ACCENT_SYMBOL} as a small graphic accent. Inside the house inset, show {SUBJECT} {SUBJECT_ACTION} with {PRODUCT_OR_PROP} in {LOCATION}. Add {BACKGROUND_ELEMENTS} as simple flat home icons. Dress or style the subject with {WARDROBE_STYLE}. Use chunky rounded cartoon anatomy, oversized hands or props when useful, flat poster colors, no gradients, naive flattened perspective, casual marker wobble, and a youthful handmade home-event mood. All text, characters, props, and scene details must be original and must not copy the reference.
id: sky_blue_doodle
code: ''
