prompt: |
  围绕具体主题内容生成一张具有私密仪式感的影像邀请画面：主体事件被安置在画面中部偏深的真实空间里，像被透明弧形结构、玻璃隔层或局部光罩轻轻包住，形成"被窥见的亲密瞬间"；周围保留大块深色建筑面、阴影或安静留白，让中心发光区域先被看见，再读到人物或主题对象的情绪。画面前景覆盖一行极大、纤细、连笔感强的手写体主标题，笔画横跨主体与背景，既遮挡又连接中心形象，制造柔软、缓慢、带记忆感的图像文字融合；顶部只放极小的署名式信息，底部用细线、微型衬线数字与简短说明形成克制的邀请信息层，排版低声、精确、留出呼吸。色彩从主题自身的场地、材质、时间与情绪中提取，保留低明度大面积结构底、中心清透明亮光域、少量高明度文字信息与微小温暖强调色的角色关系；暗部必须干净有层次，亮部带透明雾感和柔和反光，使整体温暖亲近、安静隆重。质感保持真实摄影的玻璃反射、轻微颗粒、低照度空间和柔焦边缘，文字像印在空气与画面表面之间，最终效果应像一份高级私人邀请：情绪先于信息到达，信息轻而清楚，中心瞬间被大字温柔封存。

