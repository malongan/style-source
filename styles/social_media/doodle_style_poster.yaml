- title: '保留核心视觉识别：写实的乘客座交通照片，被改造成高能量旅行海报，中央后视主体、电光黄剪影光环、超大号黄橙手绘字体、漫画放射线、紫色音乐符号、贴纸图标，以及青白色云朵流线。'
  desc: ''
- title: 用 {背景元素} 作为纪实背景细节与次要语境。
  desc: ''
- title: '以写实的乘客座旅行照片作为底层：广角后座视角、真实车厢内饰、透过车窗的自然日光、可见的材质纹理、仪表台与车窗取景，以及可信的公路旅行或本地通勤瞬间。'
