- title: 顶部大字与几何小装饰
  desc: 顶部是方正有力的大号黑色粗体中文标题，四周散落实心方块、圆点与细线勾勒的置物架瓶罐，右上角一枚胶囊形小字标
- title: 底部横向信息色带
  desc: 画面最下方压一条整幅横向色带，带内一行活动信息用小号黑字，两端各一段短横线收尾
- title: 高饱和明快配色
  desc: 荧光黄绿、深绿、纯白、纯黑加少量肤色，高对比亮色系，整体轻快有春日活力

scene: "品牌活动主视觉、社交平台活动海报、运动与户外主题招募图、节气营销视觉、社群裂变封面"

ratio: '16:9'
summary: "粗描边扁平矢量活动海报——粗细均匀的粗黑描边加纯色块，抽象符号化的前倾人物穿行在放大的花朵叶片间，顶部大黑体中文标题与几何小装饰、底部横向信息色带，高饱和黄绿配色、中心分层构图。"

prompt: |
  创作一张 16:9 横版扁平矢量插画海报。

  整体语言：
  潮流扁平插画美学，粗细均匀的粗黑描边、纯色块填充，无渐变、无阴影、无立体感；
  人物与植物都做抽象符号化处理，形状简洁、边缘干净利落；
  色彩明快高饱和，{主题色}；版式为中心构图 + 顶部 / 中部 / 底部三段分层。

  顶部：
  画面顶部是显著的大号黑色粗体中文标题「{主标题}」，字形方正有力、字距紧凑。
  标题两侧散落{几何装饰}：实心方块、圆形小点，以及一组细黑线勾勒的置物架与瓶罐线稿。
  右上角放一枚圆角胶囊形小字标，写「{品牌字标}」。

  中部：
  画面中央是{主体人物}，身体大幅前倾，四肢用几块几何色面概括，配几道水平速度线强化流动感。
  人物穿行在{环境元素}之间——放大的花朵与叶片呈圆润的抽象符号形，白花配亮色花心，深色与亮色叶片交叠，铺满画面下半部与两侧。

  底部：
  画面最下方压一条整幅横向色带，色带上排一行活动信息「{活动信息}」，黑色中等字号，两端各有一小段短横线收尾。

  整体：
  视觉平衡，元素大小与色彩搭配和谐，轻松愉快、有活力。

  避免：渐变、立体阴影与 3D 渲染、写实照片质感、真实品牌 Logo、水印、乱码文字。

variables:
- kv_var: 主标题
  style_var: '{主标题}'
  desc: 顶部大号粗黑体中文标题，如：春日骑行计划
- kv_var: 活动信息
  style_var: '{活动信息}'
  desc: 底部色带上的一行活动文案，如：一起奔赴花海 | 周末骑行局
- kv_var: 主体人物
  style_var: '{主体人物}'
  desc: 中央的抽象符号化人物，如：身体前倾骑行的骑车人
- kv_var: 环境元素
  style_var: '{环境元素}'
  desc: 主体周围的花草植物，如：放大的白色花朵与深绿叶丛
- kv_var: 主题色
  style_var: '{主题色}'
  desc: 整体配色，如：荧光黄绿 + 深绿 + 纯白 + 纯黑 + 少量肤色
- kv_var: 几何装饰
  style_var: '{几何装饰}'
  desc: 标题周围的几何小元素，如：实心方块、圆点、细线置物架与瓶罐
- kv_var: 品牌字标
  style_var: '{品牌字标}'
  desc: 右上角胶囊形小字标内容，如：虚构工作室名或小活动代号

