name: 奢侈品牌刺绣微距
category: brand_kv
ratio: '4:5'
source_author: '@AmirMushich'
source_url: 'https://x.com/AmirMushich'
summary: 如同品牌委托刺绣艺术家将标识转化为线艺作品，用微距镜头捕捉每一根丝线的光泽与织物质感，呈现顶级纺织品摄影的真实感。
tags:
- 微距摄影
- 品牌视觉
- 刺绣工艺
- 纺织品
- 奢侈品牌
- 3D渲染
triggers:
- 品牌刺绣
- 微距纹理
- 纺织品摄影
- 奢侈品牌细节
- 刺绣Logo
- 面料特写
features:
- title: 极致微距纹理
  desc: 3D几何刺绣线材，每根线是真实几何体投射真实阴影，非贴图模拟
- title: 专业纺织布光
  desc: 120cm巨大柔光箱从正上方平坦照明，无方向性阴影，临床级精准
- title: 品牌色智能识别
  desc: 'AI自动提取品牌代表性色作为主绣线色，默认深海军蓝 #1A2332'
- title: 多针法系统
  desc: 缎纹绣（光泽面）、轮廓绣（曲线）、法式结粒绣（圆点）、尖刺元素（渐尖）
- title: 物理真实感
  desc: 华夫格针织面料位移几何、纤维微绒、刺绣凹凸阴影、衬线边缘光晕
- title: 相机参数精准
  desc: Canon EOS R5 / Nikon Z8 + 100mm微距镜头，f/8-f/11深景深，4:5竖版
variables:
- kv_var: 刺绣主体
  style_var: '{刺绣主体}'
  desc: 如：一只跃起的猎豹 / 字母 M 徽标 / 山茶花与枝叶
- kv_var: 绣线主色
  style_var: '{绣线主色}'
  desc: 如：深海军蓝 #1A2332 / 酒红 / 米白配金线
- kv_var: 底布材质
  style_var: '{底布材质}'
  desc: 如：华夫格针织 / 粗织亚麻 / 厚羊毛呢
- kv_var: 点缀针法
  style_var: '{点缀针法}'
  desc: 如：法式结粒绣 / 尖刺绣 / 轮廓绣勾边
prompt: |
  4:5 竖版极致微距摄影，画面被一块{底布材质}的表面填满，织物的经纬结构在镜头下清晰可数，纤维有细微的绒毛和起伏。

  布面正中绣着{刺绣主体}，完全由立体的线材构成：每一根绣线都是真实的几何体，投射自己的阴影，边缘有细窄的受光面，绝不是贴图模拟。主绣线色为{绣线主色}，大面积采用缎纹绣，靠线的走向形成会呼吸的光泽面；轮廓用轮廓绣勾出平滑曲线；局部以{点缀针法}增加颗粒与尖锐的节奏。

  照明来自正上方一只巨大柔光箱，光线平坦、几乎没有方向性阴影，像临床级的纺织样本拍摄，布面上凸起的刺绣因此投下短而柔的阴影，而不是长长的投影。

  镜头参数感：Canon EOS R5 配 100mm 微距镜头，f/8 到 f/11 的深景深，刺绣最高点带一圈极淡的衬线边缘光晕，背景织物轻微失焦但仍可辨认织法。

  真实纺织品摄影的物理质感，线材有纤维毛羽，刺绣与底布之间有真实的厚度落差，无 3D 塑料感，无 AI 涂抹。
id: luxury_embroidery_macro
