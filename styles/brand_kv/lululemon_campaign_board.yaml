variables:
  - kv_var: 品牌名
    style_var: "{品牌名}"
    desc: 如：LULULEMON / 山野 / ATELIER MOVE
  - kv_var: 产品品类
    style_var: "{产品品类}"
    desc: 如：瑜伽裤与运动背心 / 跑步外套 / 训练紧身衣
  - kv_var: 模特描述
    style_var: "{模特描述}"
    desc: 如：一位健康紧实的女性运动员 / 两名背对镜头的跑者
  - kv_var: 主标语
    style_var: "{主标语}"
    desc: 如：FORM LEADS FORCE / 力量先于形态 / MOVE WITH CLARITY
  - kv_var: 辅标语
    style_var: "{辅标语}"
    desc: 如：MOTION HOLDS SHAPE / STRUCTURE IN FLOW / 静止也是训练
  - kv_var: 配色
    style_var: "{配色}"
    desc: 如：淡粉紫与象牙白 / 雾蓝与炭黑 / 沙色与深橄榄

prompt: |
  9:16 高端运动品牌 campaign 企划板：一张大型横幅主视觉加六张小面板，全部压在极简纯色背景上。

  版式：上方是横贯整幅的大型 hero 横幅，下方六个小面板排成整齐网格，间距一致、边缘对齐，整体像一套完整的季度 campaign 提案，节奏有序、昂贵。

  配色：{配色}。纯色或极浅的扁平面背景，不出现真实场景，不出现杂乱环境。

  Hero 横幅：{模特描述}作为主视觉面孔，解剖结构真实，体型紧实有力，面部现代、表情克制，具备编辑级存在感；身穿{品牌名}的{产品品类}，面料质感、缝线、光泽都按高保真还原。大型现代排版与人物咬合穿插，字可以压在人物身上，但保持清晰可读。

  六个小面板：每格讲一个不同的支撑故事——伸展、蹲起发力、静止平衡、鞋履细节、动态运动、产品标语，各自独立又同属一套视觉家族。

  排版：大字标语用现代无衬线，层级分明，编辑式摆放。主标语「{主标语}」字号最大，与人物形成前后穿插；辅标语「{辅标语}」用较小字号分布在面板边缘，字距收紧。

  手绘叙事图形：笔触下划线、动感曲线、符号标记、书法线条与图形环，与人物和文字互动，像直接画在版面上。

  光线：通篇明亮的高级编辑打光，人物与产品在干净色场上显得锐利、真实、有质感。

  调性：结构化、高端、运动、时尚前卫、当代、图形化、编辑感、年轻、克制、有冲击力。

  负向：杂乱拼贴、版式不统一、层级薄弱、背景拥挤、廉价健身房广告、解剖错误、断肢、坏手、多余手指、关节扭曲、网红感、面料细节糊、颜色浑浊、阴影脏。

  不要水印，不要真实Logo，不要电商广告感。

