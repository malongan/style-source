name: 弥散风视觉海报
category: brand_kv
ratio: 9:16 或 3:4
source_author: '@AdrianPunk115'
source_url: 'https://x.com/AdrianPunk115'
summary: 让颜色会呼吸，让文字有位置，让留白有节奏。
tags:
- 复古
- 海报
- 杂志风
- 艺术展
- 弥散渐变
triggers:
- 弥散风
- 复古海报
- 杂志风
- 弥散渐变
features:
- title: 柔和扩散的色块 + 雾化边缘
  desc: 色团没有明确边界，像被水洇开的墨
- title: 胶片颗粒 + 印刷噪点质感
  desc: 暗部颗粒更明显，模拟复古印刷品
- title: 主标题清晰可读的高级编辑排版
  desc: 无衬线大字压在上三分之一，字距略宽
- title: 有节奏感的设计留白
  desc: 元素不贴边，标题与色团之间留完整气口
variables:
- kv_var: 主标题
  style_var: '{主标题}'
  desc: 如：潮湿的夏天 / 缓慢生长 / 光的残片
- kv_var: 副标题
  style_var: '{副标题}'
  desc: 如：一组关于颜色的练习 / 2026 秋季新作
- kv_var: 色块配色
  style_var: '{色块配色}'
  desc: 如：雾粉与灰绿 / 奶油黄与浅赭 / 淡紫与冷灰
- kv_var: 点缀色
  style_var: '{点缀色}'
  desc: 如：砖红 / 墨蓝 / 芥末黄
- kv_var: 展览信息
  style_var: '{展览信息}'
  desc: 如：10.12—11.30 / 西岸美术馆 B1 / 周三闭馆
prompt: |
  9:16 竖版弥散风海报。背景由几块{色块配色}的柔和色团构成，形状没有明确边界，边缘向外雾化扩散，像被水洇开的墨或者失焦的灯光，色与色在交界处自然混成第三层，整体是低对比的呼吸感。

  {点缀色}只在画面一处出现，面积很小，用来定一个视觉锚点。整张图覆盖一层很细的胶片颗粒和印刷噪点，暗部颗粒更明显，模拟复古印刷品。

  文字排版是编辑级别的：主标题「{主标题}」用清晰可读的无衬线大字压在上三分之一，字距略宽；下方一行小字副标题「{副标题}」；底部边角以极小字号排「{展览信息}」，与画面边缘保持精确的等距。

  留白是有节奏的——标题与色团之间、色团与底边之间都留出完整的气口，任何元素都不贴近边缘。

  整体复古、艺术展调性，印刷质感，无渐变塑料感，无多余装饰。
id: diffuse_poster
