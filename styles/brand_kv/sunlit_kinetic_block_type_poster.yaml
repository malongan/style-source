name: 日光动态块状字体摄影海报
category: brand_kv
ratio: 9:16 / 16:9
source_author: '@VigoCreativeAI'
source_url: "https://raw.githubusercontent.com/VigoZhao/AI-Visual-Prompt-Cookbook/main/styles/sunlit-kinetic-block-type-photo-poster-style"
summary: 全幅日光摄影 + 超大奶色压缩字体 + 对角线裁剪人物 = 让普通人瞬间有「杂志封面主角」的质感。
tags:
- VigoCookbook
- 运动
- 生活方式
- 杂志风
- 文字穿插
- 日光摄影
triggers:
- Sunlit Kinetic Block Type
- 杂志封面感
- 文字穿插
- 人物站字母后
features:
- title: 全幅日光摄影
  desc: 全幅日光摄影，户外明亮场景
- title: 超大号奶白色窄体块状字体
  desc: 超大奶色压缩字体，作为画面主体
- title: 对角线裁切主体
  desc: 对角线裁剪人物，制造动感
- title: 密集的微型文案簇
  desc: 角落密集小字（重复词组）
- title: 鲜明天蓝色块
  desc: 鲜明蓝天色块作为背景
variables:
- kv_var: 主标题文字
  style_var: '{MAIN_TEXT}'
  desc: 单词或短词，如 CUT/MOVE/FRESH
- kv_var: 人物动作
  style_var: '{SUBJECT_ACTION}'
  desc: 如 jumping with energy
- kv_var: 环境场景
  style_var: '{LOCATION}'
  desc: 如 rooftop court、beach
- kv_var: 背景细节
  style_var: '{BACKGROUND_ELEMENTS}'
  desc: 如 city skyline、clouds
- kv_var: 穿搭风格
  style_var: '{WARDROBE_STYLE}'
  desc: 如 athletic streetwear
- kv_var: 主体
  style_var: '{SUBJECT}'
  desc: 主体是什么，如：一只橘猫 / 一名滑板少年
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
  desc: 画面里的辅助物件，如：一罐气泡水 / 一支口红 / 复古相机
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
  desc: 辅助信息，如：秋季新品 / 9.20 上市
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
  desc: 单个符号或小图案，如：✦ / ★ / 涂鸦箭头
prompt: |
  Create a 9:16 full-bleed editorial action poster in the Sunlit Kinetic Block Type Photo Poster style. Style fidelity anchors that must remain visible: the core visual anchors of this style. Source content to avoid: watermarks, real logos, and commercial advertising. Use a realistic bright outdoor photograph as the base: {SUBJECT} {SUBJECT_ACTION} with {PRODUCT_OR_PROP} in {LOCATION}, with {BACKGROUND_ELEMENTS}. Camera and composition: low or close wide-angle perspective, oversized foreground scale, decisive frozen motion, one strong diagonal crossing the frame, the subject cropped by at least one edge. Typography: place immense warm-cream extra-condensed block sans display lettering reading {MAIN_TEXT} behind the subject, filling over half the canvas, cropped by the frame and partially obscured by the action. Add compact white microcopy reading {SECONDARY_TEXT} in tight editorial blocks, plus a small generic {ACCENT_SYMBOL} mark and bottom information clusters in cream. Wardrobe and styling: {WARDROBE_STYLE}. Color system: saturated sky-blue or cyan dominant field, warm cream typography, crisp white microcopy, deep shadows, and one vivid accent color concentrated on the hero prop or wardrobe. Lighting and finish: hard midday sunlight, crisp shadows, high contrast commercial photo realism, slight print-poster grain, no illustration or 3D rendering, no real logos or watermarks. Generate as a 4K ultra-high-resolution raster image.
id: sunlit_kinetic_block_type_poster
code: ''
