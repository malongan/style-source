- title: 全幅日光摄影
  desc: 全幅日光摄影，户外明亮场景
- title: 超大号奶白色窄体块状字体
  desc: 超大奶色压缩字体，作为画面主体
- title: 对角线裁切主体
  desc: 对角线裁剪人物，制造动感
- title: 密集的微型文案簇
  desc: 角落密集小字（重复词组）
