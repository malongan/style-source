prompt: |
  创作一张 9:16 满幅出血的编辑式动作海报，采用「日光动态块状字体摄影海报」风格。必须保持可见的风格保真锚点：本风格的核心视觉锚点。需避免的源内容：水印、真实 logo 与商业广告。以一张写实的明亮户外照片为基础：{主体}{人物动作}，带{道具}，位于{场景}，并含{背景细节}。机位与构图：低角度或近距离广角透视，超大的前景尺度，果断的凝固动势，一条强烈的对角线贯穿画面，主体至少被一条边裁切。字体：把巨大、暖奶油色、超窄的块状无衬线展示字「{主标题}」放在主体背后，占据画面一半以上，被画框裁切并被动作局部遮挡。加入紧凑的白色微型文案「{副文案}」排成紧实的编辑文本块，再加一个小的通用{点缀符号}标记与底部的奶油色信息簇。服装与造型：{穿搭}。配色系统：高饱和天蓝或青色主导场，暖奶油色字体，干脆的白色微型文案，深邃阴影，以及一种鲜明的点缀色集中在主角道具或服装上。灯光与完成度：硬朗的正午阳光、干脆的阴影、高对比的商业照片写实、轻微印刷海报颗粒，无插画或 3D 渲染，无真实 logo 或水印。生成 4K 超高分辨率栅格图像。

id: sunlit_kinetic_block_type_poster
