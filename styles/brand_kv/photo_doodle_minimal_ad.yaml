features:
- title: 写实实物与黑色线稿并置
  desc: 纯白背景上是一件高清写实摄影实物，保留自身原始颜色与纹理质感，同时被松弛随性的黑色手绘墨水线条覆盖与穿插，形成极高反差的虚实对撞
- title: Notion 式极简线稿小人
  desc: 线条为统一粗细的黑色单线勾出的小人，圆头无五官、四肢简化、姿态松弛诙谐，像随手速写在纸上，与写实实物形成大物小人的尺度反差
- title: 动作即隐喻
  desc: 小人不是站着摆拍，而是在真实操作实物：把披萨当高山攀登、把雨伞当工地搭建、把球鞋当滑梯，动词决定了创意的深度
- title: 顶部大标题 + 底部标识
  desc: 版面顶部是粗体全大写黑色标题（可配一行中文副标题），底部居中放清晰的方形品牌标识，中部大面积留白
- title: 印刷级留白排版
  desc: 纯白底、高对比、只让实物保留彩色而线稿纯黑，网格干净、负空间充足，缩略图状态下也能一眼读出主体与标题

scene: "品牌广告主视觉、产品营销海报、社交媒体封面、PPT 配图、创意提案视觉"

ratio: '1:1'
summary: "极简实物涂鸦广告海报——纯白底上写实实物与黑色单线小人并置，松弛手绘线条制造大物小人的视觉隐喻，顶部粗体大写标题、底部品牌标识、留白充足、印刷级高反差。"

prompt: |
  创作一张极简创意广告海报，纯白背景。

  画面主体是一件高清写实的摄影实物：{主体实物}。它保留自身的原始颜色、纹理与摄影级细节，像一件被精心拍摄的产品静物。

  这件实物与一幅简单的手绘黑色墨水涂鸦融为一体：涂鸦用松弛、随性、顽皮的黑色单线绘制，画的是{涂鸦动作}。线条粗细统一、圆头无五官、四肢简化，小人散落在实物各处，有的攀爬、有的搬运、有的围观，姿态诙谐自然，与体量庞大的实物形成"大物小人"的尺度反差。

  涂鸦可以附带一些点缀元素：{涂鸦点缀}

  色彩克制：线稿保持纯黑白，只有实物保留自身颜色，不要给线稿上色。

  版面布局：
  顶部左侧是粗体全大写黑色标题「{主标题}」，下方紧跟一行中文副标题「{副标题}」。
  中部是主体实物与涂鸦，底部居中放清晰的品牌标识「{品牌标识}」。
  干净的网格、大量留白、负空间充足，高对比、聪明的视觉隐喻、可直接印刷的海报设计。

  避免：真实注册商标、水印、乱码文字、彩色线稿、复杂背景、渐变阴影、装饰性元素堆积。

variables:
- kv_var: 主体实物
  style_var: '{主体实物}'
  desc: 写实拍摄的实物，如：一块披萨、一只橙子、一双球鞋、一把雨伞、一把吉他
- kv_var: 涂鸦动作
  style_var: '{涂鸦动作}'
  desc: 小人与实物互动的核心动作，如：小人把披萨当高山攀登、把球鞋当滑梯、把橙子当工厂加工
- kv_var: 涂鸦点缀
  style_var: '{涂鸦点缀}'
  desc: 线稿中额外的点缀元素，如：飘动的音符、飞起的火箭、搭建的塔吊与梯子
- kv_var: 主标题
  style_var: '{主标题}'
  desc: 顶部粗体全大写英文标题，如：SNEAKER CULTURE、PROJECT EMPIRES
- kv_var: 副标题
  style_var: '{副标题}'
  desc: 标题下的中文短句，如：球鞋文化、项目帝国
- kv_var: 品牌标识
  style_var: '{品牌标识}'
  desc: 底部居中的品牌标识，如：方形 N 字母标志加品牌名

