name: 黑白灰先锋海报
category: brand_kv
ratio: 16:9 / 9:16 / 1:1 / 4:5 / 3:2
source_author: '@AdrianPunk115'
source_url: 'https://x.com/AdrianPunk115'
summary: 克制、秩序、先锋 —— 不追求信息密度，用极简几何和字体排版制造视觉张力。
tags:
- 黑白灰
- 先锋海报
- 现代主义
- 字体设计
- 几何构成
triggers:
- 黑白灰先锋海报
- 重塑雕像的权利风
- 先锋视觉
features:
- title: '黑白灰层次丰富：至少 4 种灰度层次'
  desc: 纯黑、暗灰、中灰、浅灰、白交替，靠面积对比而非渐变
- title: '随机字体排版：巨型横排 / 竖排 / 混排'
  desc: 可靠边、居中、压底、分散，允许被边缘裁切
- title: '随机几何母题：选 2-4 种组合'
  desc: 尺寸差异拉大，一种极大其余极小
- title: '6 大几何家族'
  desc: 圆形、线性、块面、空间、网格纹理、结构符号
- title: '极简强调色：只用 1 种'
  desc: 1-2 处，面积不超过画面 2%
- title: '10 种构图骨架'
  desc: 中央、上下错层、斜向、环绕、四角张力、满版字体、极端留白
- title: '克制信息量'
  desc: 不能变成杂志目录，追求秩序和结构
variables:
- kv_var: 主标题
  style_var: '{主标题}'
  desc: 如：重塑 / 无声的秩序 / 边界之外
- kv_var: 副标题
  style_var: '{副标题}'
  desc: 如：2026 冬季展 / 一次关于结构的讨论
- kv_var: 几何母题
  style_var: '{几何母题}'
  desc: 如：大圆 + 细横线 / 黑色块面 + 网格纹理 / 斜向箭头 + 结构符号
- kv_var: 强调色
  style_var: '{强调色}'
  desc: 如：信号红 / 电光蓝 / 荧光黄
- kv_var: 构图骨架
  style_var: '{构图骨架}'
  desc: 如：中央纵深 / 上下错层 / 极端留白 / 满版字体
prompt: |
  先锋黑白灰海报，只使用黑、白与中间灰。画面里至少铺开四到五个灰度层次——纯黑、暗灰、中灰、浅灰、白，层次靠色块面积对比拉出来，不用平滑渐变去过渡。

  几何母题：{几何母题}。元素数量控制在二到四种，尺寸差异拉开，一种极大、其余极小，彼此之间用精确的等距对齐，不叠加成装饰花纹。

  构图骨架：{构图骨架}。文字是构图的一部分而不是说明：主标题「{主标题}」用巨型字号，可以横排、竖排或横竖混排，允许被画面边缘裁切；副标题「{副标题}」用极小字号贴在边角或压在底部，与主标题形成极大的字号反差。

  全场只允许一处强调色{强调色}，出现在几何图形或某一个字上，面积不超过画面的百分之二。

  整体克制、秩序、先锋，信息量少而结构强，绝不能变成杂志目录。文字全部为中文，边缘干净，印刷级锐利。
id: avantgarde_bw_poster
