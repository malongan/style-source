prompt: |
  创作一张 16:9 成品栅格图，采用 Acid Lime 3D Streetwear Type Poster 风格。主体：{主体}。动作：{动作}。道具/产品：{道具}。地点：{地点}。背景元素：{背景元素}。主文案：{主标题}。次级文案：{副文案}。点缀符号：{点缀符号}。服装/造型：{造型}。风格保真锚点：该风格的核心视觉锚点。需要避免的源内容：水印、真实 Logo 与商业广告。应用这些风格规则：浅冷灰或米白的摄影棚地面与墙面，一大块深黑压缩块状标题字体，酸柠绿的马克笔涂划与下划线横穿字形，光亮的 C4D 玩具感 3D 角色或产品渲染，低机位广角正面四分之三透视，靠近镜头处放超大前景道具或鞋类尺度的物件，有触感的时尚道具，堆叠的箱子或包袋，镀铬与黑色橡胶表面，柔软的织物织纹，半透明亚克力细节，受控的贴纸徽章簇，警示三角，条形码条，笑脸圆点，扇贝边封签，极小的黑色吊牌，少量亮粉与黄色点缀，干净的高调商业棚拍布光，柔和阴影，锐利的高光反射，打磨到高分辨率的成品海报质感。若为 9:16，把黑色标题堆叠在中央主体之上或旁侧，并沿下边缘裁切一件前景道具。若为 16:9，把标题排成左重字块，把 3D 主体群布置在右侧，用酸柠色点缀在中间搭桥。重要内容规则：先对齐视觉风格，再用全新的主体、动作、道具、地点、标题、微文案把源内容彻底换掉，不得照搬品牌身份。

