name: 3D街潮实验室海报
category: brand_kv
ratio: '16:9'
source_author: '@VigoCreativeAI'
source_url: "https://raw.githubusercontent.com/VigoZhao/AI-Visual-Prompt-Cookbook/main/styles/acid-lime-3d-streetwear-type-poster-style"
summary: 酸柠绿主调 + 黑色巨字 + 街头实验道具台。
tags:
- 街潮
- 3D
- 潮牌
- 实验
- 潮流
triggers:
- 街潮
- 3D
- 潮牌
- 实验室风
- 街头潮流
features:
- title: 酸柠绿主色调
  desc: ''
- title: 黑色巨字排版
  desc: ''
- title: 3D风格化角色 + 潮流道具
  desc: ''
- title: 贴纸、警告标签、条形码等街头元素
  desc: ''
variables:
- kv_var: 主标题
  style_var: '{MAIN_TEXT}'
  desc: 左侧黑色巨字
- kv_var: 画面-动作
  style_var: '{SUBJECT_ACTION}'
  desc: IP的动作姿态
- kv_var: 主体
  style_var: '{SUBJECT}'
  desc: 主体是什么，如：一只橘猫 / 一名滑板少年
- kv_var: 产品/道具
  style_var: '{PRODUCT_OR_PROP}'
  desc: 画面里的辅助物件，如：一罐气泡水 / 一支口红 / 复古相机
- kv_var: 地点
  style_var: '{LOCATION}'
  desc: 如：上海 / 京都 / 洛杉矶
- kv_var: 背景元素
  style_var: '{BACKGROUND_ELEMENTS}'
  desc: 补充画面层次，如：反光玻璃、贴纸、路牌
- kv_var: 副文案
  style_var: '{SECONDARY_TEXT}'
  desc: 辅助信息，如：秋季新品 / 9.20 上市
- kv_var: 点缀符号
  style_var: '{ACCENT_SYMBOL}'
  desc: 单个符号或小图案，如：✦ / ★ / 涂鸦箭头
- kv_var: 服装造型
  style_var: '{WARDROBE_STYLE}'
  desc: 人物穿搭，如：oversize 卫衣 + 工装裤
prompt: |
  Create a 16:9 finished raster image in the Acid Lime 3D Streetwear Type Poster Style. Subject: {SUBJECT}. Action: {SUBJECT_ACTION}. Prop/Product: {PRODUCT_OR_PROP}. Location: {LOCATION}. Background elements: {BACKGROUND_ELEMENTS}. Main text: {MAIN_TEXT}. Secondary text: {SECONDARY_TEXT}. Accent symbol: {ACCENT_SYMBOL}. Wardrobe/styling: {WARDROBE_STYLE}. Style fidelity anchors: the core visual anchors of this style. Source content to avoid: watermarks, real logos, and commercial advertising. Apply these style rules: pale cool-gray or off-white studio floor and wall, one huge mass of deep black condensed block headline typography, acid-lime marker scribbles and underlines crossing the type, glossy C4D toy-like 3D character or product rendering, low wide-angle front three-quarter perspective, oversized foreground prop or footwear-scale object near the lens, tactile fashion props, stacked boxes or bags, chrome and black rubber surfaces, soft textile weave, semi-translucent acrylic details, controlled sticker-badge clusters, warning triangles, barcode strips, smiley dots, scalloped seals, tiny black tags, small hot pink and yellow accents, clean high-key commercial studio lighting, soft shadows, crisp specular highlights, polished high-resolution poster finish. For 9:16, stack the black headline above or beside the central subject and crop a foreground prop along the lower edge. For 16:9, place the headline as a left-heavy type block and stage the 3D subject cluster on the right with lime accents bridging the center. Important content rule: match the visual style first, then change the source content completely with a new subject, new action, new prop, new location, new headline, new microcopy, and no copied brand identity.
id: streetwear_lab
code: ''
