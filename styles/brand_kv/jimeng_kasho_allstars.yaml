features:
- title: '色彩体系：纯黑底色 + 亮蓝 + 暖橙 + 纯白的高饱和撞色'
  desc: 黑色是大面积底色，三色只做撞击不做渐变
- title: '材质工艺：3D 膨胀充气软胶'
  desc: C4D+Octane 渲染，哑光颗粒肌理，圆润光滑高光
- title: '核心元素：充气软胶孟菲斯几何'
  desc: 弯曲管道、透明圆环、原子支架、星芒、十字块、爆炸星
- title: '版式布局：三段式'
  desc: 顶部品牌热线 → 超大主标题 → 下半活动详情
- title: '文字风格：现代无衬线 + 严格网格'
  desc: 层级清晰，粗体标题几乎顶到两侧
- title: '整体调性：潮酷活泼'
  desc: 年轻化夜店氛围，商业级活动海报质感
variables:
- kv_var: 活动名称
  style_var: '{活动名称}'
  desc: 如：ALL STARS / MIDNIGHT RAVE / NEON NIGHT
- kv_var: 副标题
  style_var: '{副标题}'
  desc: 如：全明星阵容 / 年度收官派对
- kv_var: 日期
  style_var: '{日期}'
  desc: 如：2026.11.15 SAT / 11月15日 22:00
- kv_var: 地点
  style_var: '{地点}'
  desc: 如：上海 · 1933 老场坊 / 三层 MAIN ROOM
- kv_var: 主图形
  style_var: '{主图形}'
  desc: 如：亮蓝弯曲管道 + 透明圆环 + 暖橙十字块 / 爆炸星 + 白色云朵 + 骨头
- kv_var: 强调色
  style_var: '{强调色}'
  desc: 如：荧光青 / 酸性橙 / 纯白
prompt: |
  9:16 竖版夜店潮流活动海报，纯黑底，高饱和撞色。整张图的材质是一整套 3D 膨胀充气软胶：所有图形都像被吹足了气，表面是均匀细腻的哑光颗粒肌理，边缘圆润，转折处有柔和而光滑的高光，C4D + Octane 渲染的质感，不出现任何锐利硬边，也不要有平面插画的扁平感。

  画面由充气软胶的孟菲斯几何元素构成：{主图形}从画面四周向中心聚拢，一部分压在文字下方形成前后层次，元素之间留出黑色底，不铺满。配色锁死在纯黑 + 亮蓝 + 暖橙 + 纯白这四色，{强调色}只作为小面积点睛，不作主色。

  版式自上而下分三段：顶部一行很小的品牌标识与热线信息；中部是超大号粗体主标题「{活动名称}」，字重极粗、字距收紧、几乎顶到两侧边缘；下半部分用现代无衬线小字排出活动详情，包含{副标题}、{日期}、{地点}，严格按网格对齐，层级清楚但不喧哗。

  整体潮酷活泼、年轻化，商业级活动海报质感。黑色区域保持干净，不出现多余渐变和光晕。
