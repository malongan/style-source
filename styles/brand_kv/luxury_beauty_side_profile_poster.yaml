prompt: |
  提示词：

  创作一张 9:16 的单幅竖版高端美妆营销海报。

  品牌：{品牌名}
  副标题：{品牌副标题}
  主标题：[PROFILE / GLOW / VEIL / ECLAT]
  红色手写词：[refine / luminous / softly / timeless]
  标语：{短标语}
  主文案：{主文案}
  肖像角度：[左侧脸 / 右侧脸 / 半侧脸 / 低垂侧脸]
  色板：[奶油米色 / 珍珠白 / 香槟金 / 雾玫瑰 / 柔银]
  关键焦点：[下颌线 / 肌肤光泽 / 颈部 / 香氛 / 珍珠耳饰 / 锁骨]

  使用一张近景侧面女性肖像，具备真实的皮肤纹理、自然妆容、柔和唇形、优雅的颈部与锁骨、自然的发丝，以及温暖的逆光。营造高级编辑美妆广告的观感：极简的模糊背景、超大的半透明衬线字体、一处红色手写体强调、小号品牌标识、标语、正文与页脚细节。

  画面应像一张高端美妆、护肤、香氛或珠宝营销海报：干净、有光泽、精致、电影感、商业级。

  避免出现中文文字、廉价促销风、塑料皮肤、畸形的手、重复的面孔、杂乱的文字、杂乱的背景，以及过度的 AI 美颜修图。

