name: 墨线霓裳·东方高定时装插画
category: brand_kv
ratio: '9:16'
source_author: '@MrLarus'
source_url: 'https://x.com/MrLarus'
summary: 东方高定时装与水墨美学的诗意融合，以毛笔书法线条和低饱和配色呈现优雅空灵的现代中式时装插画。
tags:
- 东方
- 水墨
- 高定时装
- 新中式
- 时装插画
triggers:
- 墨线霓裳
- 水墨时装
- 东方高定
- Inkline Couture
features:
- title: 现代东方高定时装 + 中国水墨美学的融合
  desc: 时装结构用工笔，气韵用水墨，两者不互相将就
- title: 淡彩水彩质感，细腻的书法式线条
  desc: 起笔重、行笔轻、收笔有飞白，线断而气不断
- title: 大面积留白
  desc: 白而不空，用呼吸感撑住画面
- title: 低饱和、东方感配色
  desc: 一层薄水彩顺结构晕开，不铺满
- title: 精工细节与水墨气韵同时具备
  desc: 衣料密而不乱，皮肤与背景只留极少笔触
variables:
- kv_var: 人物
  style_var: '{人物}'
  desc: 如：一位挽着低髻的女子 / 着长衫的年轻男子 / 舞者
- kv_var: 服装
  style_var: '{服装}'
  desc: 如：宽袖立领长袍 / 层叠薄纱与垂坠飘带 / 云纹刺绣外套
- kv_var: 姿态
  style_var: '{姿态}'
  desc: 如：侧身回望 / 抬手理袖 / 缓缓行走
- kv_var: 墨色主调
  style_var: '{墨色主调}'
  desc: 如：墨青与米白 / 灰紫与浅赭 / 焦墨配淡花青
- kv_var: 题字
  style_var: '{题字}'
  desc: 如：春山如笑 / 墨线霓裳 / 一衣带水
prompt: |
  9:16 竖版东方高定时装插画。{人物}身着{服装}，以{姿态}的姿态站在画面偏一侧，身体与衣料的线条由毛笔的书写性笔触勾出——起笔重、行笔轻、收笔带飞白，线条时断时续但气脉不断。

  服装是画面的精工所在：衣料层叠、褶裥转折、刺绣与盘扣都用细笔交代，细节密而不乱；而人物的皮肤和背景只保留极少的笔触，大片区域直接留白，白而不空，让呼吸感撑住整个画面。

  上色只做淡彩：以{墨色主调}为基调，一层薄薄的水彩顺着衣料结构晕开，边缘自然渗化，不铺满、不封边，最深的墨只落在衣褶转折和发丝上。

  画面一侧竖排一行小字题款「{题字}」，字体接近手写楷书，位置低调，不抢主体。

  整体低饱和、东方、高级，像一页时装画册而不是商业广告，无厚涂，无高光塑料感，无 AI 感。
id: inkline_couture
