features:
  - title: 正视图圆角混凝土壁龛
    desc: 平视正投影、无透视变形，浅灰细腻混凝土墙面中央挖出一个大圆角矩形深凹槽，内壁带柔和暖光与顶部两枚嵌入式筒灯
  - title: 壁龛内热带植物造景
    desc: 龛内密植观叶植物，底部铺鲜绿草地与灰白自然石块，橙色秋海棠、深绿龟背竹、红色花烛与细碎蕨类形成前后层次，是冷硬工业空间里唯一的自然生机
  - title: 贯穿画面的橙色激光十字
    desc: 一道竖直、一道水平的极细橙色激光线组成十字，从画面顶端与左右边缘贯穿整张海报、越过壁龛与顶部标题，像测量/扫描基准线，不发光晕染也不遮挡主体
  - title: 右上黑色监控摄像头
    desc: 凹槽内右上壁面装一支带支架的黑色枪型监控摄像头，镜头朝画面左下，体积不大但形态写实，点出被观测的未来实验室气质
  - title: 顶部超大黑体主标题
    desc: 画面顶端通栏压一行极粗现代无衬线黑色大写标题，右侧接一枚椭圆线框内的极简斜线符号，其下紧贴小一号粗体年份编号，构成品牌年度主题
  - title: 底部金属铭牌与工程标注
    desc: 底边中央一块拉丝金属小铭牌、四角带螺丝，两侧与左右边缘散布极小的竖排字母、短刻度线与版权式标注，作为装饰性技术排版纹理

scene: "科技/设计/园艺品牌年度主视觉、展会概念海报、未来生态议题 KV、3D 渲染作品集封面"
ratio: "3:4"
summary: "工业风未来感 3D 品牌海报——浅灰混凝土正视图圆角壁龛里密植热带观叶植物、绿草与石块，橙色激光十字贯穿全画面，右上黑色监控摄像头，顶部超大黑体主题配椭圆符号，底部拉丝金属铭牌与工程标注，冷硬工业与鲜活自然对撞。"

prompt: |
  创作一张 3:4 竖版工业风未来感 3D 品牌海报，正视图、平视取景、无透视变形，Blender 模型质感，OC 渲染、全局光照，干净写实的商业级渲染而非插画或扁平图形。

  背景是一整面浅灰色细腻混凝土墙，表面有极轻微的骨料颗粒与浇筑痕迹。画面正中挖出一个占据大部分高度的大圆角矩形深凹槽（壁龛），槽口边缘厚实圆润、倒角清晰，内壁是稍深的暖灰水泥色，顶部嵌两枚小筒灯向下打出柔和暖光，凹槽自身形成明确的框中框。

  凹槽内部做一处高密度热带植物造景：底部铺满鲜绿短草与几块灰白自然石块，中后景密植 {植物组合}，叶片形态真实、有清晰叶脉与光泽，前后错落遮挡、高低起伏，橙红与深绿形成色彩层次。整体像被精心维护的微型生态舱，植物不溢出凹槽边界。

  凹槽内右上壁面安装一支带短支架的黑色枪型监控摄像头，镜头朝画面左下，体积克制、结构写实，是画面里唯一的工业器械。

  一道极细的亮橙色激光十字贯穿整张海报：一条竖线自画面顶端笔直落到近底边，一条横线自左右画框边缘水平穿过画面中部，两线交于壁龛中央附近。激光越过顶部标题与壁龛内外，保持锐利细线、带轻微发光但不产生大面积光晕，像扫描或测量基准线。

  排版：画面顶端通栏压一行超大号极粗的现代无衬线黑色大写主标题「{主标题}」，字重极高、字距收紧，几乎顶满左右；主标题右侧紧接一枚横向椭圆线框、框内一道斜线的极简几何符号，其下贴一行小一号粗体「{年份编号}」。底边正中放一块拉丝金属小铭牌，四角各一颗小螺丝，牌面为「{铭牌署名}」；铭牌两侧与画面左右边缘散布极小的竖排字母、短刻度线、圆点与版权式标注，作为装饰性工程技术排版纹理，只需形成细密节奏、不要求逐字可辨读，不要出现清晰可读的错拼单词或水印。

  配色以浅灰混凝土为基底，植物绿与橙红为中间色，激光橙为高亮点睛；高对比但不过曝，表面质感细腻，光影柔和真实。除上述元素外不添加人物、产品、额外图形或边框。所有文字与铭牌保持在安全区域内。

variables:
  - kv_var: 主标题
    style_var: "{主标题}"
    desc: "顶部通栏的超大号英文主题词，如：HORIZON"
  - kv_var: 年份编号
    style_var: "{年份编号}"
    desc: "主标题右侧椭圆符号下方的小号年份或项目编号，如：2026"
  - kv_var: 植物组合
    style_var: "{植物组合}"
    desc: "凹槽里的主要观叶植物，如：橙红秋海棠、龟背竹、红色花烛与蕨类"
  - kv_var: 铭牌署名
    style_var: "{铭牌署名}"
    desc: "底部拉丝金属铭牌上的设计方或品牌署名，如：@LJL Design"

