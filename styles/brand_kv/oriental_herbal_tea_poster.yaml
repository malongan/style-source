prompt: |
  生成一张 9:16 东方草本茶饮文化海报。

  整体采用浅米灰纸张背景，带自然纸纤维、轻微旧印刷颗粒和手工纸本质感，画面干净克制，不过度泛黄。

  左侧使用大面积粗黑中文标题【{main_title}】，字体采用方拙、厚重的民艺手刻感手绘美书字：宽扁结构、粗重横竖笔、硬朗转折、局部不规则变形，墨色厚实并带轻微缺墨感。不要优雅书体、行楷、行草或现代印刷字体，让文字本身成为主要构图文素。

  以【{main_herb}】作为画面主体，搭配【{secondary_ingredient}】，使用平面化东方淡彩草本插画表现。植物结构清晰但适度概括，低饱和色彩、简化明暗、轻水彩晕染和旧印刷感，不做写实植物摄影或精密博物绘。

  主体植物背后加入【{background_element}】，使用低饱和、低透明度的平面色块、水墨山影、巨大淡字或不规则纸本图形形成视觉层叠，让背景参与构图，而不是空白衬底。

  画面下部加入【{tea_utensil}】和少量散落茶叶、花瓣、果实或干原料。茶器采用平面淡彩与轻微剪贴纸本质感，轮廓略松、材质简化、阴影很轻，像旧茶包装上的静物插画，而不是写实产品摄影。

  右侧加入少量细密竖排中文说明【{auxiliary_text}】，作为次级信息层。穿插 1-2 枚朱砂红印章【{stamp_text}】，印章边框略歪、残缺、缺墨、印泥浓淡不均，保持真实手工刻印感，不要标准规整的方形图标。

  整体保持"粗黑民艺字 × 草本淡彩 × 茶器静物 × 层叠底形 × 旧纸印刷"的统一视觉语言。构图丰富但不拥堵，每张可以改变植物方向、色块形状、山影层次、茶器位置和文字布局，保持系列一致但避免模板化。
  不要水印，不要真实Logo。

