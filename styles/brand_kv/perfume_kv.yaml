summary: 奢侈香氛营销企划质感：香水瓶居中 + 香调元素可视化 + 高端品牌布光。
tags:
- 香水
- 香氛
- 奢侈
- 高级感
- 品牌KV
- campaign
triggers:
- 香水海报
- 香氛主视觉
- 奢侈品广告
- 高级感海报
features:
- title: 9:16 竖版构图
  desc: 瓶身压在中轴线上，视线自上而下走一遍
- title: 香水瓶居中，作为主视觉主体
  desc: 瓶身是唯一主体，不与任何元素争抢
- title: 香调元素可视化（花瓣、果皮、木片、树脂、烟雾等）
  desc: 原料围绕瓶身形成气味叙事
- title: 高级玻璃质感、真实反光、品牌级打光
  desc: 长条柔光高光 + 冷调轮廓光勾边
- title: 少量中文文字、克制留白
  desc: 上三分之一大字标题，其余留白
- title: 真实摄影质感、电影级光影
  desc: 低饱和冷暖对比，无塑料感
variables:
- kv_var: 瓶身描述
  style_var: '{瓶身描述}'
  desc: 如：磨砂方瓶配金色瓶盖 / 细颈透明圆瓶 / 烟灰色水晶瓶
- kv_var: 香调元素
  style_var: '{香调元素}'
  desc: 如：橙花、佛手柑皮、雪松木片、一缕白烟
- kv_var: 背景色
  style_var: '{背景色}'
  desc: 如：雾面米白 / 浅灰褐渐变 / 冷调灰蓝
- kv_var: 主标题
  style_var: '{主标题}'
  desc: 如：夜之序曲 / 月光花园 / 松间雪
- kv_var: 副文案
  style_var: '{副文案}'
  desc: 如：EAU DE PARFUM 50ML / 木质东方调 · 2026
prompt: |
  9:16 竖版奢侈香氛主视觉。画面中央一只{瓶身描述}立在浅色台面上，压在画面中轴线上，瓶身玻璃通透，边缘有一道细锐的高光反射，瓶内液体在布光下呈现深浅层次，不被任何其他元素遮挡。

  瓶子四周由香调原料构成可视化的气味叙事：{香调元素}悬浮或散落在瓶身两侧，主元素贴近瓶身保持清晰，次元素向后景退去并轻微虚化，一缕烟雾从瓶口斜向上飘散，把视线往上引。{背景色}的雾面背景，自上而下做极轻的明度过渡，背景里不放任何装饰物。

  布光参考品牌级产品摄影：主光从左前上方打来，在瓶身侧面留下长条形柔和高光；右后方一盏冷调轮廓光勾出瓶身剪影；台面上保留一道短而柔的投影。整体电影级冷暖对比，真实摄影质感，没有塑料感，没有 AI 涂抹痕迹。

  版面：画面上三分之一用大字排出「{主标题}」，字距舒展、字重克制；标题下方一行小字「{副文案}」。文字全部使用中文，只占画面一小块，其余保持留白。整体低饱和，像一本香氛杂志的整页广告。
id: perfume_kv
