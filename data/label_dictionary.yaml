# ---------- param：模型参数，转常量 ----------
NEGATIVE PROMPT:
  type: param
  const: watermarks, real logos, low quality, distorted text
  note: Vigo 模板标配的负面词，普通用户不会自己填
LENS STYLE:
  type: param
  const: fisheye lens, ultra-wide, low camera angle
  note: 鱼眼是这批风格的核心锚点，开放给用户调就失去风格了
TEXTURE LEVEL:
  type: param
  const: strong analog grain and color fringing
  note: 同上，属于风格质感锚点
size spec:
  type: param
  note: 输出尺寸由画布工具统一定，prompt 里不留槽位

# ---------- marker：段落/图层标记，删占位符 ----------
Visual Requirements:
  type: marker
  note: prompt 里独立成段，后面紧跟的就是整段要求，槽位本身无内容
Main Design:
  type: marker
Environmental Integration:
  type: marker
Characters and Narrative:
  type: marker
Poster Composition:
  type: marker
White Poster Text:
  type: marker
  note: 同上，brand_miniature_architecture 把 6 个段落标题写成了槽位
back:
  type: marker
  note: 'Depth order: {back} ... {front} 是图层顺序标记，不是用户输入'
front:
  type: marker

