# 变量标签词典 —— 英文 kv_var → 中文标签 + 分类
#
# 为什么需要这张表：插件只拿 kv_var 当标签显示，数据里 136 种英文写法会让用户
# 看到 SUBJECT / ACCENT SYMBOL 这样的英文框名。这张表给出统一中文名，顺便把
# 「模型参数」和「段落标记」从用户视野里清掉。
#
# type:
#   input  —— 真给用户填的，必须有 zh
#   param  —— 决定风格本身的固定参数（镜头/质感/负面词/尺寸），转成 prompt 常量
#   marker —— 段落标记 / 图层标记被误写成变量，删掉占位符
#
# 同义写法（下划线 vs 空格、大写 vs 小写）各自列一条，指向同一个中文名——
# 表是 1:1 查表，不做别名展开，省得脚本里再藏一层规则。
#
# 改完跑： python3 scripts/migrate_variables_spec.py --labels-only --check

# ---------- P1：54 个风格共用的模板族（378 条，占 62%） ----------
SUBJECT:
  zh: 画面主体
  type: input
SUBJECT_ACTION:
  zh: 主体动作
  type: input
PRODUCT_OR_PROP:
  zh: 产品/道具
  type: input
LOCATION:
  zh: 场景地点
  type: input
BACKGROUND_ELEMENTS:
  zh: 背景元素
  type: input
MAIN_TEXT:
  zh: 主文案
  type: input
ACCENT SYMBOL:
  zh: 点缀符号
  type: input
# 与 PRODUCT_OR_PROP 同义（空格写法），归到同一个中文名
PRODUCT OR PROP:
  zh: 产品/道具
  type: input
# 与 SUBJECT_ACTION 同义（空格写法）
SUBJECT ACTION:
  zh: 主体动作
  type: input

