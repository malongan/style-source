# .github/workflows/on-push-styles.yml
name: PR 格式检查

on:
  pull_request:
    paths:
      - 'styles/**'
      # 改校验器/生成器本身也必须过校验：只监听 styles/** 时，一个改坏
      # check_variables_semantics 的 PR 会完全不触发 CI（PR #198 就撞上了）
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 查重步骤要 diff base，浅克隆拿不到 base sha
          fetch-depth: 0

      - name: 格式验证 + 变量语义（R1–R7）
        # --strict：有 error 即失败（此前 validate_all.py 恒 exit 0 → 这个 PR 闸门是空的）
        # --require-desc：R7 全库生效。此前只对 PR 新增文件生效（靠 --diff-filter=A
        #   圈文件），因为存量 188 个风格 desc 不完整、追溯会把所有 PR 打红。
        #   2026-11-02 desc 覆盖率到 100% 后改为恒开，不再依赖 diff 判断 ——
        #   同一套 --diff-filter 逻辑刚在 check_duplicate 上翻过车。
        run: python3 scripts/validate_all.py --strict --require-desc

      - name: 查重检测
        run: python3 scripts/check_duplicate.py --pr-mode
        env:
          GIT_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: 配图 URL 可达性验证
        # 只报可达性，不因遗留的失效 preview 阻断（实错由 --strict 那条把关）
        run: python3 scripts/validate_all.py --check-images --no-strict

      - name: 变量语义体检
        # audit_variables.py 读的是 data/styles.json（生成物），先按 PR 里的 yaml 重算一份再体检。
        # --strict：声明落空 / 值写成描述 / 标签带反引号 都算失败（对应 PROMPT_VARIABLES_SPEC 的 R1/R2）。
        run: |
          python3 scripts/generate_data.py
          python3 scripts/audit_variables.py --strict
