# .github/workflows/on-merge-main.yml
name: 合并后验证

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths: ['styles/**']
  # ⚠️ 直推 main 也必须验证：2026-10-11 的 5791eb3 绕过 PR 直接推到 main，
  # 导致「生成文件一致性」从未运行 —— styles.json 落后于 yaml（4 个文件的
  # variables 修复没进 json），直到 10-12 才被发现。此触发器堵住这个洞。
  push:
    branches: [main]
    paths:
      - 'styles/**'
      - 'scripts/**'
      - 'data/**'
      - 'gallery.html'
      - 'gallery.css'
      - 'gallery-runtime.js'
      - '.github/workflows/**'

jobs:
  validate:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # fetch-depth: 0 —— 必须取全量历史 + tag，否则 git describe 退化成裸 hash，
          # gallery.html 的版本行过滤（v0.5./v0.7.）失配 → 「验证生成文件一致性」必然失败
          fetch-depth: 0

      - name: 验证所有风格文件
        # --strict：有 error 即失败（validate_all.py 曾恒 exit 0，闸门形同虚设）
        run: python3 scripts/validate_all.py --strict

      - name: 验证生成文件一致性
        run: |
          python3 scripts/generate_data.py
          python3 scripts/build_gallery.py
          # 忽略 meta.version 和 meta.generated（每次提交后必然变化）
          diff <(git show HEAD:data/styles.json | python3 -m json.tool --no-ensure-ascii) \
               <(python3 -m json.tool --no-ensure-ascii data/styles.json) \
               -I '"version"' -I '"generated"' \
            && echo "✅ 风格数据一致" \
            || {
              echo '❌ 风格数据有差异！请在 PR 分支运行：'
              echo '   python3 scripts/generate_data.py'
              echo '   git add data/styles.json'
              exit 1
            }
          # gallery.html 跳过三类变化行（每次提交后必然变化）：
          # 1. git describe 版本号：v0.5.x / v0.7.x 格式
          # 2. CSS/JS cache-busting hash：?v=HEX
          # 3. Header 时间戳行：v2026-MM-DD HH:MM
          diff <(git show HEAD:gallery.html | grep -v -E '(v0\.5\.|v0\.7\.|/gallery\.(css|runtime\.js)\?v=|<span class="header-update">v20)') \
               <(grep -v -E '(v0\.5\.|v0\.7\.|/gallery\.(css|runtime\.js)\?v=|<span class="header-update">v20)' gallery.html) \
            && echo "✅ Gallery 页面一致" \
            || {
              echo '❌ gallery.html 过期！请在 PR 分支运行：'
              echo '   python3 scripts/build_gallery.py'
              echo '   git add gallery.html'
              exit 1
            }

      - name: 配图完整性防回归检查（全尺寸 + 缩略图）
        run: |
          pip install pillow
          python3 scripts/generate_data.py
          python3 scripts/check_style_previews.py --strict

      - name: 验证 _index.md 新鲜度（防索引漂移）
        # styles/_index.md 曾长期停在 167 个风格（实际 300）且缺 editorial/typography。
        # 索引一律由 generate_index.py 从磁盘重算，禁止手改；这里同时断言：
        #   1) 已跟踪的索引与重算结果零 diff
        #   2) 工作区没有未跟踪/被删的索引文件
        #      —— 只查 diff 会漏掉"分类 _index.md 被删/漏提交"（git diff 不看未跟踪文件）
        run: |
          pip install pyyaml
          python3 scripts/generate_index.py
          INDEXES="styles/_index.md styles/*/_index.md"
          if git diff --exit-code $INDEXES && [ -z "$(git status --porcelain -- $INDEXES)" ]; then
            echo "✅ 索引与磁盘一致"
          else
            echo '❌ _index.md 过期或有未提交/缺失的索引文件，请在 PR 分支运行：'
            echo '   python3 scripts/generate_index.py'
            echo '   git add styles/_index.md styles/*/_index.md'
            exit 1
          fi

      - name: 校验（有 error 即失败）
        # validate_all.py 曾恒 exit 0，等于没有格式闸门（2026-10-12 修正）。
        # 需要只看报告时用 --no-strict。
        run: python3 scripts/validate_all.py --strict
